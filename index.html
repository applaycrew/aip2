고객 PII를 제거하며, 벡터 저장을 위한 임베딩을 생성해야 합니다. 처리 워크플로는 비용 효율적이어야 하고 4시간 이내에 완료되어야 합니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","AWS Lambda와 Amazon Comprehend로 파일을 병렬 처리해 PII를 제거하고, Amazon Bedrock API를 호출해 벡터를 생성합니다. 처리량을 최적화하도록 Lambda 동시성 한도와 메모리 설정을 구성합니다."],["B","AWS Glue ETL 작업으로 데이터에 PII 감지 스크립트를 실행합니다. Amazon SageMaker Processing에서 HuggingFaceProcessor를 실행해 사전 학습된 모델로 임베딩을 생성하고, 임베딩을 Amazon OpenSearch Service에 저장합니다."],["C","Amazon Comprehend를 호출해 PII를 감지하는 사용자 정의 함수(UDF)가 포함된 Apache Spark를 실행하는 Amazon EMR 클러스터를 배포합니다. Amazon Bedrock API로 벡터를 생성하고, 출력을 pgvector 확장이 있는 Amazon Aurora PostgreSQL에 저장합니다."],["D","AWS Step Functions로 Amazon Comprehend(PII 감지)와 Amazon Bedrock(임베딩 생성)을 사용하는 워크로드를 오케스트레이션하는 데이터 처리 파이프라인을 구현합니다. 워크플로를 Amazon OpenSearch Serverless와 직접 통합해 벡터를 저장하고 유사도 검색 기능을 제공합니다."]]},"en":{"q":"A GenAI developer is building a Retrieval Augmented Generation (RAG)-based customer support application that uses Amazon Bedrock foundation models (FMs). The application needs to process 50 GB of historical customer conversations that are stored in an Amazon S3 bucket as JSON files. The application must use the processed data as its retrieval corpus. The application's data processing workflow must extract relevant data from customer support documents, remove customer personally identifiable information (PII), and generate embeddings for vector storage. The processing workflow must be cost-effective and must finish within 4 hours.\nWhich solution will meet these requirements with the LEAST operational overhead?","o":[["A","Use AWS Lambda and Amazon Comprehend to process files in parallel, remove PII, and call Amazon Bedrock APIs to generate vectors. Configure Lambda concurrency limits and memory settings to optimize throughput."],["B","Create an AWS Glue ETL job to run PII detection scripts on the data. Use Amazon SageMaker Processing to run the HuggingFaceProcessor to generate embeddings by using a pre-trained model. Store the embeddings in Amazon OpenSearch Service ."],["C","Deploy an Amazon EMR cluster that runs Apache Spark with user-defined functions (UDFs) that call Amazon Comprehend to detect PII. Use Amazon Bedrock APIs to generate vectors. Store outputs in Amazon Aurora PostgreSQL with the pgvector extension."],["D","Implement a data processing pipeline that uses AWS Step Functions to orchestrate a workload that uses Amazon Comprehend to detect PII and Amazon Bedrock to generate embeddings. Directly integrate the workflow with Amazon OpenSearch Serverless to store vectors and provide similarity search capabilities."]]},"ex":{"c":"Step Functions로 Comprehend PII 탐지와 Bedrock 임베딩 생성을 오케스트레이션하고, OpenSearch Serverless와 직접 통합해 벡터를 저장하면 서버리스로 병렬 처리되어 4시간 안에 끝납니다. 오류 처리와 재시도도 기본 제공되어 운영 오버헤드가 적습니다.","w":{"A":"Lambda만으로는 50GB 처리의 조율·재시도·오류 처리를 직접 관리해야 합니다.","B":"Glue와 SageMaker Processing을 함께 운영해야 해 복잡하고 비용이 큽니다.","C":"EMR 클러스터 운영은 오버헤드가 큽니다."}}},{"n":105,"a":["B"],"orig":"","ko":{"q":"한 금융 서비스 회사가 콜센터 상담원을 지원하는 실시간 GenAI 어시스턴트를 개발하고 있습니다. GenAI 어시스턴트는 고객의 실시간 음성을 전사하고, 맥락을 분석하며, 고객이 아직 말하는 중에도 상담원에게 점진적으로 제안을 제공해야 합니다. 응답성을 유지하기 위해 음성부터 첫 응답 표시까지 엔드투엔드 지연 시간이 1초 미만이어야 합니다. 아키텍처는 AWS 관리형 서비스만 사용해야 하고, 상담원이 실시간으로 업데이트를 받도록 양방향 스트리밍을 지원해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Transcribe 스트리밍으로 통화를 전사합니다. 텍스트를 Amazon Comprehend로 보내 감정 분석을 하고, 결과를 InvokeModel API로 Amazon Bedrock의 Anthropic Claude에 전달합니다. 결과를 Amazon DynamoDB에 저장하고 WebSocket API로 표시합니다."],["B","부분 결과(partial results)를 활성화한 Amazon Transcribe 스트리밍으로 고객이 말을 마치기 전에 전사 텍스트 조각을 전달합니다. 텍스트 조각을 InvokeModelWithResponseStream API로 Amazon Bedrock에 전달하고, Amazon API Gateway WebSocket API로 응답을 상담원에게 스트리밍합니다."],["C","Amazon Transcribe 배치 처리로 통화를 텍스트로 변환합니다. 전체 녹취록을 ConverseStream API로 Amazon Bedrock의 Anthropic Claude에 전달하고, Amazon Lex 챗봇 인터페이스로 응답을 반환합니다."],["D","Amazon Transcribe 스트리밍 API와 AWS Lambda 함수로 각 오디오 세그먼트를 전사합니다. InvokeModel API로 Amazon Bedrock의 Amazon Titan Embeddings 모델을 호출하고, 결과를 Amazon SNS에 게시합니다."]]},"en":{"q":"A financial services company is developing a real-time generative AI (GenAI) assistant to support human call center agents. The GenAI assistant must transcribe live customer speech, analyze context, and provide incremental suggestions to call center agents while a customer is still speaking. To preserve responsiveness, the GenAI assistant must maintain end-to-end latency under 1 second from speech to initial response display. The architecture must use only managed AWS services and must support bidirectional streaming to ensure that call center agents receive updates in real time.\nWhich solution will meet these requirements?","o":[["A","Use Amazon Transcribe streaming to transcribe calls. Pass the text to Amazon Comprehend for sentiment analysis. Feed the results to Anthropic Claude on Amazon Bedrock by using the InvokeModel API. Store results in Amazon DynamoDB. Use a WebSocket API to display the results."],["B","Use Amazon Transcribe streaming with partial results enabled to deliver fragments of transcribed text before customers finish speaking. Forward text fragments to Amazon Bedrock by using the InvokeModelWithResponseStream API. Stream responses to call center agents through an Amazon API Gateway WebSocket API."],["C","Use Amazon Transcribe batch processing to convert calls to text. Pass complete transcripts to Anthropic Claude on Amazon Bedrock by using the ConverseStream API. Return responses through an Amazon Lex chatbot interface."],["D","Use the Amazon Transcribe streaming API with an AWS Lambda function to transcribe each audio segment. Call the Amazon Titan Embeddings model on Amazon Bedrock by using the InvokeModel API. Publish results to Amazon SNS."]]},"ex":{"c":"Transcribe 스트리밍의 부분 결과(partial results)로 고객이 말하는 도중에 텍스트 조각을 받고, InvokeModelWithResponseStream으로 Bedrock 응답을 스트리밍하며, API Gateway WebSocket API로 상담원에게 실시간 양방향 전달합니다. 모두 관리형 서비스이고 1초 미만 지연을 달성할 수 있습니다.","w":{"A":"InvokeModel은 전체 응답을 기다리고, Comprehend와 DynamoDB 단계가 지연을 늘립니다.","C":"배치 전사는 실시간이 아니고 Lex는 상담원 화면용 인터페이스가 아닙니다.","D":"임베딩 모델은 제안을 생성하지 않고, SNS는 실시간 양방향 스트리밍이 아닙니다."}}},{"n":106,"a":["D"],"orig":"","ko":{"q":"한 보험 회사가 기존 Amazon SageMaker AI 인프라로 고객이 보험료를 예측할 수 있는 웹 애플리케이션을 지원합니다. SageMaker AI 모델 학습에 사용하는 고객 데이터는 Amazon S3 버킷에 저장되며 데이터세트가 빠르게 늘고 있습니다. 회사는 모델을 지속적으로 재학습하는 솔루션을 원합니다. 직원이 S3 버킷에 새 고객 데이터 파일을 업로드하면 솔루션이 자동으로 모델을 재학습하고 애플리케이션에 다시 배포해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AWS Glue로 업로드된 각 파일에 ETL 작업을 실행합니다. ETL 작업이 AWS SDK로 SageMaker AI 모델 엔드포인트를 호출하도록 구성하고, 업데이트된 고객 데이터세트로 재학습된 모델을 엔드포인트의 실시간 추론으로 다시 배포합니다."],["B","직원이 새 파일을 업로드하면 이벤트를 생성하는 AWS Lambda 함수와 웹훅 핸들러를 만듭니다. 업데이트된 데이터세트로 재학습된 모델을 SageMaker Pipelines가 다시 배포하도록 구성합니다. Amazon EventBridge로 이벤트 버스를 만들고, Lambda 함수 이벤트를 소스로, SageMaker Pipelines를 대상으로 설정합니다."],["C","직원이 S3 버킷에 새 파일을 업로드하면 AWS SDK 통합으로 고객 데이터를 가져오는 AWS Step Functions Express 워크플로를 만듭니다. SageMaker Data Wrangler 흐름으로 S3 버킷의 데이터를 SageMaker Autopilot으로 내보내고, 업데이트된 데이터세트로 재학습된 모델을 SageMaker Autopilot으로 다시 배포합니다."],["D","AWS Step Functions Standard 워크플로를 만듭니다. 첫 번째 상태가 AWS Lambda 함수를 호출해 직원의 S3 업로드에 응답하도록 구성합니다. SageMaker Pipelines의 파이프라인으로 업데이트된 데이터세트로 재학습된 모델을 다시 배포하고, 첫 번째 상태가 응답을 받으면 다음 상태에서 파이프라인을 실행합니다."]]},"en":{"q":"An insurance company uses existing Amazon SageMaker AI infrastructure to support a webbased application that allows customers to predict what their insurance premiums will be. The company stores customer data that is used to train the SageMaker AI model in an Amazon S3 bucket. The dataset is growing rapidly. The company wants a solution to continuously re-train the model. The solution must automatically re-train and re- deploy the model to the application when an employee uploads a new customer data file to the S3 bucket.\nWhich solution will meet these requirements?","o":[["A","Use AWS Glue to run an ETL job on each uploaded file. Configure the ETL job to use the AWS SDK to invoke the SageMaker AI model endpoint. Use real-time inference with the endpoint to re-deploy the model after it is re-trained on the updated customer dataset."],["B","Create an AWS Lambda function and webhook handlers to generate an event when an employee uploads a new file. Configure SageMaker Pipelines to re-deploy the model after it is re-trained on the updated customer dataset. Use Amazon EventBridge to create an event bus. Set the Lambda function event as the source and SageMaker Pipelines as the target."],["C","Create an AWS Step Functions Express workflow with AWS SDK integrations to retrieve the customer data from the S3 bucket when an employee uploads a new file to the S3 bucket. Use a SageMaker Data Wrangler flow to export the data from the S3 bucket to SageMaker Autopilot. Use the SageMaker Autopilot to re-deploy the model after it has been re-trained on the updated customer dataset."],["D","Create an AWS Step Functions Standard workflow. Configure the first state to call an AWS Lambda function to respond when an employee uploads a new file to the S3 bucket. Use a pipeline in SageMaker Pipelines to re-deploy the model after it has been re-trained on the updated customer dataset. Use the next state in the workflow to run the pipeline when the first state receives a response."]]},"ex":{"c":"Step Functions Standard 워크플로의 첫 상태에서 Lambda가 S3 업로드 이벤트에 응답하고, 다음 상태에서 SageMaker Pipelines를 실행해 재학습과 재배포를 자동화합니다. Standard 워크플로는 장시간 실행되는 학습 작업에 적합합니다.","w":{"A":"엔드포인트 호출은 추론일 뿐 재학습이나 재배포가 아닙니다.","B":"S3 업로드에는 웹후크가 필요 없고, 이벤트 구성이 불필요하게 복잡합니다.","C":"Express 워크플로는 최대 5분이라 학습 작업에 부적합하고, 기존 인프라 대신 Autopilot을 쓰는 것은 맞지 않습니다."}}},{"n":107,"a":["B"],"orig":"","ko":{"q":"한 회사가 AI 어시스턴트에 사용할 새 FM을 선택하려고 합니다. GenAI 개발자는 데이터 과학자가 여러 FM의 품질과 안전성을 평가할 수 있도록 평가 보고서를 생성해야 합니다. 데이터 과학자는 평가용 샘플 프롬프트를 GenAI 개발자에게 제공합니다. GenAI 개발자는 Amazon Bedrock으로 보고서 생성과 평가를 자동화하려고 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","샘플 프롬프트를 하나의 JSON 문서로 합치고, 이 문서로 Amazon Bedrock 지식 기반을 만듭니다. FM에 각 샘플 프롬프트에 대한 응답을 생성하도록 요청하는 프롬프트를 작성하고, RetrieveAndGenerate API로 모델별 보고서를 생성합니다."],["B","샘플 프롬프트를 하나의 JSONL 문서로 합쳐 Amazon S3 버킷에 저장합니다. 심사(judge) 모델을 사용하는 Amazon Bedrock 평가 작업을 만들고, S3 위치를 입력으로, 다른 S3 위치를 출력으로 지정합니다. FM마다 평가 작업을 실행하고 해당 FM을 생성기(generator)로 선택합니다."],["C","샘플 프롬프트를 하나의 JSONL 문서로 합쳐 Amazon S3 버킷에 저장합니다. 심사 모델을 사용하는 Amazon Bedrock 평가 작업을 만들고, S3 위치를 입력으로, Amazon QuickSight를 출력으로 지정합니다. FM마다 평가 작업을 실행하고 해당 FM을 평가자(evaluator)로 선택합니다."],["D","샘플 프롬프트를 하나의 JSON 문서로 합치고, 이 문서로 Amazon Bedrock 지식 기반을 만듭니다. 검색 및 응답 생성 평가 유형을 사용하는 Amazon Bedrock 평가 작업을 만들고, Amazon S3 버킷을 출력으로 지정합니다. FM마다 평가 작업을 실행합니다."]]},"en":{"q":"A company wants to select a new FM for its AI assistant. A GenAI developer needs to generate evaluation reports to help a data scientist assess the quality and safety of various foundation models FMs. The data scientist provides the GenAI developer with sample prompts for evaluation. The GenAI developer wants to use Amazon Bedrock to automate report generation and evaluation.\nWhich solution will meet this requirement?","o":[["A","Combine the sample prompts into a single JSON document. Create an Amazon Bedrock knowledge base with the document. Write a prompt that asks the FM to generate a response to each sample prompt. Use the RetrieveAndGenerate API to generate a report for each model."],["B","Combine the sample prompts into a single JSONL document. Store the document in an Amazon S3 bucket. Create an Amazon Bedrock evaluation job that uses a judge model. Specify the S3 location as input and a different S3 location as output. Run an evaluation job for each FM and select the FM as the generator."],["C","Combine the sample prompts into a single JSONL document. Store the document in an Amazon S3 bucket. Create an Amazon Bedrock evaluation job that uses a judge model. Specify the S3 location as input and Amazon QuickSight as output. Run an evaluation job for each FM and select the FM as the evaluator."],["D","Combine the sample prompts into a single JSON document. Create an Amazon Bedrock knowledge base from the document. Create an Amazon Bedrock evaluation job that uses the retrieval and response generation evaluation type. Specify an Amazon S3 bucket as the output. Run an evaluation job for each FM."]]},"ex":{"c":"Bedrock 평가 작업은 S3에 저장된 JSONL 프롬프트 데이터셋을 입력으로 받아 판정 모델(LLM-as-a-judge)로 품질과 안전성을 평가하고, 결과 보고서를 S3 출력 위치에 저장합니다. FM마다 평가 작업을 실행하고 해당 FM을 생성기(generator)로 선택합니다.","w":{"A":"지식 기반과 RetrieveAndGenerate는 평가 도구가 아닙니다.","C":"출력은 S3여야 하며, 평가 대상 FM은 평가자가 아니라 생성기로 선택해야 합니다.","D":"평가 데이터셋은 JSONL이어야 하고, RAG 평가 유형은 FM 자체 비교 목적과 맞지 않습니다."}}},{"n":108,"a":["A"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock FM을 사용하는 AI 기반 고객 지원 애플리케이션을 구축하고 있습니다. 애플리케이션은 내부 Amazon Bedrock 지식 기반을 바탕으로 사용자에게 추천을 제공해야 합니다. 사용자는 Amazon S3에 저장된 문서와 Amazon RDS의 정형 데이터를 조회합니다. 애플리케이션은 추천 생성에 사용한 출처를 인용해야 하고, 민감한 데이터에 대한 안전한 액세스를 제공해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock AgentCore 에이전트 하나에 지식 기반 두 개를 연결합니다. 하나는 Amazon S3의 문서에, 다른 하나는 Amazon RDS의 정형 데이터에 접근하도록 구성합니다. 에이전트가 응답에 출처 메타데이터를 유지하도록 구성하고, IAM 역할로 민감한 데이터에 대한 액세스를 제어합니다."],["B","AWS Lambda 함수로 Amazon S3의 문서와 Amazon RDS의 정형 데이터를 직접 조회하는 Amazon Bedrock AgentCore 에이전트 하나를 만듭니다. 응답을 처리해 하나의 응답으로 병합합니다."],["C","Amazon S3 문서를 포함하는 지식 기반을 사용하도록 Amazon Bedrock AgentCore 에이전트 하나를 구성합니다. AWS Lambda 함수가 Amazon RDS를 직접 조회해 정형 데이터를 가져오고, 응답을 반환하기 전에 결과를 결합하도록 구성합니다."],["D","Amazon Bedrock AgentCore 에이전트 두 개를 만듭니다. 하나는 Amazon S3 문서에 연결된 지식 기반과, 다른 하나는 Amazon RDS에 연결된 지식 기반과 연결합니다. 두 에이전트를 동시에 조회하고 결과를 결합하는 사용자 지정 AWS Lambda 함수를 개발합니다."]]},"en":{"q":"A company is building an AI-powered customer support application that uses Amazon Bedrock FMs. The application must provide users with recommendations based on an internal Amazon Bedrock knowledge base. Users will query documents that the company stores in Amazon S3 and structured data that is in Amazon RDS. The application must provide citations for the sources it uses to generate recommendations. The application must also provide secure access to sensitive data.\nWhich solution will meet these requirements?","o":[["A","Associate one Amazon Bedrock AgentCore agent with two knowledge bases. Configure one knowledge base to access documents from Amazon S3 and the other to access structured data from Amazon RDS. Configure the agent to preserve attribution metadata in responses. Use IAM roles to control access to sensitive data."],["B","Create one Amazon Bedrock AgentCore agent that uses AWS Lambda functions to directly query Amazon S3 for documents and Amazon RDS for structured data. Process the responses and merge the results into a single response."],["C","Configure one Amazon Bedrock AgentCore agent to use a knowledge base that contains the documents from Amazon S3. Configure AWS Lambda functions to query Amazon RDS directly for structured data and to combine the results before returning responses."],["D","Create two Amazon Bedrock AgentCore agents. Associate one agent with a knowledge base that is connected to the documents in Amazon S3 and the other agent with a knowledge base that is connected to Amazon RDS. Develop a custom AWS Lambda function to query both agents simultaneously and combine the results."]]},"ex":{"c":"38번과 같은 문제입니다. 하나의 에이전트에 S3 문서용, RDS 구조화 데이터용 지식 기반 두 개를 연결하고 출처 메타데이터를 보존해 인용을 제공하며, IAM 역할로 민감 데이터 접근을 제어합니다.","w":{"B":"Lambda로 직접 조회하면 관리형 RAG와 인용 기능을 잃습니다.","C":"RDS 결과를 Lambda로 합치면 인용이 일관되지 않습니다.","D":"에이전트 두 개와 병합 Lambda는 불필요하게 복잡합니다."}}},{"n":109,"a":["A"],"orig":"","ko":{"q":"한 스페셜티 커피 회사가 Amazon Bedrock과 3단계 프롬프트 체인으로 개인화된 커피 로스팅 프로필을 생성하는 모바일 앱을 운영합니다. 프롬프트 체인은 사용자 입력을 구조화된 메타데이터로 변환하고, 관련 로스팅 로그를 검색한 뒤, 고객별 맞춤 로스팅 추천을 생성합니다. 여러 AWS 리전의 사용자들이 동일한 입력에 대해 추천이 일관되지 않고, 검색 단계에서 추론이 느리며, 지나치게 높은 온도로 추출하라는 등 안전하지 않은 추천이 나온다고 보고합니다. 회사는 반복 입력에 대한 출력 안정성을 높이고, 앱 성능과 출력 안전성을 개선해야 합니다. 업데이트된 솔루션은 동일 입력에 대해 99.5%의 출력 일관성과 1초 미만의 추론 지연 시간을 달성해야 하며, 검증된 안전 통제로 안전하지 않거나 환각된 추천을 차단해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","추론 지연 시간을 안정화하기 위해 프로비저닝된 처리량으로 Amazon Bedrock을 배포합니다. 의미 기반 거부 규칙이 있는 Amazon Bedrock 가드레일로 안전하지 않은 출력을 차단하고, Amazon Bedrock Prompt Management의 승인 워크플로로 프롬프트를 관리합니다."],["B","Amazon Bedrock Agents로 체이닝을 관리합니다. 모델 입출력을 Amazon CloudWatch Logs에 기록하고, CloudWatch 로그로 프롬프트 버전의 A/B 테스트를 수행합니다."],["C","프롬프트 결과를 Amazon ElastiCache에 캐싱합니다. AWS Lambda 함수로 메타데이터를 전처리하고 엔드투엔드 지연 시간을 추적하며, AWS X-Ray로 성능 병목을 식별·해결합니다."],["D","Amazon Kendra로 로스팅 로그 검색 정확도를 높입니다. 정규화된 프롬프트 메타데이터를 Amazon DynamoDB에 저장하고, AWS Step Functions로 다단계 프롬프트를 오케스트레이션합니다."]]},"en":{"q":"A specialty coffee company has a mobile app that generates personalized coffee roast profiles by using Amazon Bedrock with a three-stage prompt chain. The prompt chain converts user inputs into structured metadata, retrieves relevant logs for coffee roasts, and generates a personalized roast recommendation for each customer. Users in multiple AWS Regions report inconsistent roast recommendations for identical inputs, slow inference during the retrieval step, and unsafe recommendations such as brewing at excessively high temperatures. The company must improve the stability of outputs for repeated inputs. The company must also improve app performance and the safety of the app's outputs. The updated solution must ensure 99.5% output consistency for identical inputs and achieve inference latency of less than 1 second. The solution must also block unsafe or hallucinated recommendations by using validated safety controls.\nWhich solution will meet these requirements?","o":[["A","Deploy Amazon Bedrock with provisioned throughput to stabilize inference latency. Apply Amazon Bedrock guardrails with semantic denial rules to block unsafe outputs. Use Amazon Bedrock Prompt Management to manage prompts by using approval workflows."],["B","Use Amazon Bedrock Agents to manage chaining. Log model inputs and outputs to Amazon CloudWatch Logs . Use logs from CloudWatch to perform A/B testing for prompt versions."],["C","Cache prompt results in Amazon ElastiCache . Use AWS Lambda functions to pre-process metadata and to trace end-to-end latency. Use AWS X-Ray to identify and remediate performance bottlenecks."],["D","Use Amazon Kendra to improve roast log retrieval accuracy. Store normalized prompt metadata within Amazon DynamoDB. Use AWS Step Functions to orchestrate multi-step prompts."]]},"ex":{"c":"82번과 같은 문제입니다. 프로비저닝 처리량으로 지연을 안정화하고, Guardrails 거부 규칙으로 위험한 권고를 차단하며, Prompt Management 승인 워크플로로 승인된 프롬프트 버전을 일관되게 사용해 출력 안정성을 높입니다.","w":{"B":"로깅과 A/B 테스트는 일관성과 안전성을 보장하지 않습니다.","C":"캐시와 X-Ray는 안전성 통제를 제공하지 않습니다.","D":"Kendra와 Step Functions는 안전성과 일관성 문제를 해결하지 못합니다."}}},{"n":110,"a":["A","C"],"orig":"B, C","ko":{"q":"한 전자상거래 회사가 Amazon Bedrock FM으로 GenAI 애플리케이션을 개발하기 위한 내부 플랫폼을 구축하고 있습니다. 개발자는 전자상거래 사용 사례에 맞춘 평가를 바탕으로 모델을 선택해야 합니다. 플랫폼은 텍스트 생성과 요약에 대한 정확도 지표를 대시보드에 표시해야 합니다. 회사는 표준화된 평가 입력으로 사용할 사용자 지정 전자상거래 데이터세트를 보유하고 있습니다.\n운영 오버헤드가 가장 적은 단계 조합은 무엇입니까? (2개 선택)","o":[["A","데이터세트를 Amazon S3 버킷으로 가져옵니다. 평가 작업이 데이터세트에 접근할 수 있도록 적절한 IAM 권한과 CORS(교차 출처 리소스 공유) 권한을 제공합니다."],["B","데이터세트를 Amazon S3 버킷으로 가져옵니다. 평가 작업이 데이터세트에 접근할 수 있도록 적절한 IAM 권한과 VPC 엔드포인트 구성을 제공합니다."],["C","Amazon Bedrock 콘솔에서 일정에 따라 모델 평가 작업을 생성하는 AWS Lambda 함수를 구성합니다. 데이터세트가 있는 S3 버킷의 URI를 입력으로 제공하고, 텍스트 생성에는 RWK(real world knowledge) 점수를, 요약에는 BERTScore를 측정하도록 평가 작업을 구성합니다. 두 번째 Lambda 함수로 작업 상태를 확인하고 사용자 지정 로그를 Amazon CloudWatch에 게시합니다. 사용자 지정 Amazon CloudWatch Logs Insights 대시보드를 만듭니다."],["D","Amazon SageMaker Clarify를 일정에 따라 실행해 모델 평가 작업을 생성합니다. 오픈 소스 프레임워크로 표준화된 평가를 만들고 실행하며, 결과를 Amazon CloudWatch 네임스페이스에 게시합니다. AWS Lambda 함수로 작업 상태를 확인하고 사용자 지정 로그를 Amazon CloudWatch에 게시하며, 사용자 지정 CloudWatch Logs Insights 대시보드를 만듭니다."],["E","fmeval 또는 ragas 프레임워크를 사용해 S3 버킷의 데이터세트로 평가를 실행하는 Amazon SageMaker AI 노트북 작업을 일정에 따라 실행합니다. 노트북에 FM에 InvokeModel API를 직접 호출하고 응답을 평가용으로 처리하는 Python 코드를 작성합니다. 작업 상태와 결과를 Amazon CloudWatch Logs에 게시해 텍스트 생성의 RWK 점수와 요약의 독성(toxicity)을 정확도 지표로 측정하고, 사용자 지정 CloudWatch Logs Insights 대시보드를 만듭니다."]]},"en":{"q":"An ecommerce company is building an internal platform to develop generative AI applications by using Amazon Bedrock foundation models (FMs). Developers need to select models based on evaluations that are aligned to ecommerce use cases. The platform must display accuracy metrics for text generation and summarization in dashboards. The company has custom ecommerce datasets to use as standardized evaluation inputs.\nWhich combination of steps will meet these requirements with the LEAST operational overhead? (Select TWO.)","o":[["A","Import the datasets to an Amazon S3 bucket. Provide appropriate IAM permissions and crossorigin resource sharing (CORS) permissions to give the evaluation jobs access to the datasets."],["B","Import the datasets to an Amazon S3 bucket. Provide appropriate IAM permissions and a VPC endpoint configuration to give the evaluation jobs access to the datasets."],["C","Configure an AWS Lambda function to create model evaluation jobs on a schedule in the Amazon Bedrock console. Provide the URI of the S3 bucket that contains the datasets as an input. Configure the evaluation jobs to measure the real world knowledge (RWK) score for text generation and BERTScore for summarization. Configure a second Lambda function to check the status of the jobs and publish custom logs to Amazon CloudWatch. Create a custom Amazon CloudWatch Logs Insights dashboard."],["D","Use Amazon SageMaker Clarify on a schedule to create model evaluation jobs. Use open source frameworks to create and run standardized evaluations. Publish results to Amazon CloudWatch namespaces. Use an AWS Lambda function to check the status of the jobs and publish custom logs to Amazon CloudWatch. Create a custom Amazon CloudWatch Logs Insights dashboard."],["E","Run an Amazon SageMaker AI notebook job on a schedule by using the fmvelos or ragas framework to run evaluations that use the datasets in the S3 bucket. Write Python code in the notebook that makes direct InvokeModel API calls to the FMs and processes their responses for evaluation. Publish job status and results to Amazon CloudWatch Logs to measure the real world knowledge (RWK) score for text generation and toxicity for summarization as metrics for accuracy. Create a custom CloudWatch Logs Insights dashboard."]]},"ex":{"c":"Bedrock 모델 평가 작업에서 사용자 지정 데이터셋을 쓰려면 S3 버킷에 IAM 권한과 CORS 구성이 필요합니다(A). Lambda로 평가 작업을 일정에 따라 생성하고, 텍스트 생성에는 실제 지식(RWK) 점수, 요약에는 BERTScore를 정확도 지표로 측정해 상태와 결과를 CloudWatch 대시보드에 표시합니다(C). (원본 덤프 답 B의 VPC 엔드포인트는 평가 작업의 데이터 접근 요건이 아닙니다.)","w":{"B":"평가 작업이 S3 데이터에 접근하는 데 필요한 것은 VPC 엔드포인트가 아니라 CORS 구성입니다.","D":"Clarify와 오픈 소스 프레임워크는 Bedrock 평가 작업보다 운영 부담이 큽니다.","E":"노트북 코드로 직접 평가를 구현해야 하고, 독성은 요약 정확도 지표가 아닙니다."}}},{"n":111,"a":["C"],"orig":"","ko":{"q":"한 전자상거래 회사가 규제, 비용 최적화, 성능 요구 사항에 따라 Amazon Bedrock의 여러 FM을 전환해야 하는 글로벌 상품 추천 시스템을 운영합니다. 회사는 동적 비용 임계값, AWS 리전별 규정 준수 규칙, 여러 FM에 걸친 실시간 A/B 테스트 등 자체 비즈니스 로직에 기반한 사용자 지정 통제를 적용해야 합니다. 시스템은 새 코드를 배포하지 않고 FM을 전환할 수 있어야 합니다. 또한 사용자 등급, 거래 금액, 규제 구역, 그리고 매시간 바뀌며 수천 건의 동시 요청에 즉시 반영되어야 하는 실시간 비용 지표 등 복잡한 규칙에 따라 사용자 요청을 라우팅해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","라우팅 규칙과 Amazon Bedrock FM ID를 환경 변수에 저장하는 AWS Lambda 함수를 배포합니다. 비즈니스 요구 사항이 바뀌면 Lambda 콘솔에서 환경 변수를 업데이트합니다. Amazon API Gateway REST API가 요청 파라미터를 읽어 라우팅을 결정하도록 구성합니다."],["B","Amazon API Gateway REST API 요청 변환 템플릿으로 요청 속성 기반 라우팅 로직을 구현합니다. Amazon Bedrock FM 엔드포인트를 REST API 스테이지 변수로 저장하고, 모델을 전환할 때 변수를 업데이트합니다."],["C","각 사용자 요청마다 AWS AppConfig Agent에서 라우팅 구성을 가져오도록 AWS Lambda 함수를 구성합니다. Lambda 함수에서 비즈니스 로직을 실행해 요청별로 적절한 FM을 선택합니다. 단일 Amazon API Gateway REST API 엔드포인트로 FM을 노출합니다."],["D","AWS AppConfig에 저장된 라우팅 규칙을 평가하는 Amazon API Gateway REST API용 AWS Lambda 권한 부여자를 사용합니다. 비즈니스 로직에 따라 권한 부여 컨텍스트를 반환하고, 각 Amazon Bedrock FM 전용 Lambda 함수로 요청을 라우팅합니다."]]},"en":{"q":"An ecommerce company operates a global product recommendation system that needs to switch between multiple foundation models (FMs) in Amazon Bedrock based on regulations, cost optimization, and performance requirements. The company must apply custom controls based on proprietary business logic, including dynamic cost thresholds, AWS Region-specific compliance rules, and real-time A/B testing across multiple FMs. The system must be able to switch between FMs without deploying new code. The system must route user requests based on complex rules including user tier, transaction value, regulatory zone, and real-time cost metrics that change hourly and require immediate propagation across thousands of concurrent requests.\nWhich solution will meet these requirements?","o":[["A","Deploy an AWS Lambda function that uses environment variables to store routing rules and Amazon Bedrock FM IDs. Use the Lambda console to update the environment variables when business requirements change. Configure an Amazon API Gateway REST API to read request parameters to make routing decisions."],["B","Deploy Amazon API Gateway REST API request transformation templates to implement routing logic based on request attributes. Store Amazon Bedrock FM endpoints as REST API stage variables. Update the variables when the system switches between models."],["C","Configure an AWS Lambda function to fetch routing configuration from the AWS AppConfig Agent for each user request. Run business logic in the Lambda function to select the appropriate FM for each request. Expose the FM through a single Amazon API Gateway REST API endpoint."],["D","Use AWS Lambda authorizers for an Amazon API Gateway REST API to evaluate routing rules that are stored in AWS AppConfig. Return authorization contexts based on business logic. Route requests to model-specific Lambda functions for each Amazon Bedrock FM."]]},"ex":{"c":"9번과 같은 문제입니다. Lambda가 요청마다 AWS AppConfig Agent에서 라우팅 구성을 가져와 비즈니스 로직으로 FM을 선택하면, 코드 배포 없이 매시간 바뀌는 규칙이 즉시 반영됩니다.","w":{"A":"환경 변수 변경은 함수 업데이트가 필요하고 복잡한 규칙을 표현하기 어렵습니다.","B":"매핑 템플릿과 스테이지 변수로는 복잡한 동적 로직을 구현할 수 없습니다.","D":"권한 부여자는 라우팅용이 아니며 모델별 Lambda로 복잡해집니다."}}},{"n":112,"a":["A"],"orig":"","ko":{"q":"한 회사가 고객에게 Amazon Bedrock을 사용하는 GenAI 애플리케이션을 제공합니다. 애플리케이션은 신뢰할 수 없는 사용자 입력을 받습니다. 일부 사용자가 프롬프트 인젝션과 탈옥(jailbreak) 기법으로 시스템 지침을 우회하려는 시도가 관찰되었습니다. 회사는 악의적 행위자로부터 애플리케이션을 보호하는 솔루션이 필요하며, 솔루션은 다음 요구 사항을 충족해야 합니다.\n* 애플리케이션이 모델을 호출하기 전에 적대적 사용자 입력을 감지하고 완화합니다.\n* 모델 추론 중 일관된 안전 통제를 적용합니다.\n* 안전하지 않거나 조작된 출력이 사용자에게 반환되지 않도록 합니다.\n* 가능한 한 AWS 관리형 서비스를 사용해 사용자 지정 보안 로직을 최소화합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AWS Lambda 함수로 사용자 입력을 정제(sanitize)합니다. 모델 추론 중 Amazon Bedrock Guardrails를 적용하고, 응답을 반환하기 전에 출력을 검증합니다."],["B","정교하게 설계한 시스템 프롬프트로 모델 상호 작용 중 프롬프트 인젝션과 탈옥 시도를 억제합니다."],["C","IAM 인증으로 애플리케이션 액세스를 제한하고, 인증된 사용자는 적대적 입력을 제출하지 않을 것이라고 가정합니다."],["D","모든 프롬프트와 응답을 Amazon S3에 기록하고, 주기적으로 조회해 적대적 행위를 식별합니다."]]},"en":{"q":"A company provides a GenAI application that uses Amazon Bedrock to customers. The application accepts untrusted user inputs. The company observes that some users attempt to bypass system instructions by using prompt injection and jailbreak techniques. The company needs a solution to protect the application from malicious actors. The solution must meet the following requirements:\n* Detect and mitigate adversarial user inputs before the application invokes the model.\n* Enforce consistent safety controls during model inference.\n* Prevent the application from returning unsafe or manipulated outputs to users.\n* Use managed AWS services where possible to minimize the need for custom security logic.\nWhich solution will meet these requirements?","o":[["A","Use AWS Lambda functions to sanitize user inputs. Apply Amazon Bedrock Guardrails during model inference. Validate outputs before returning responses."],["B","Use carefully engineered system prompts to discourage prompt injection and jailbreak attempts during model interactions."],["C","Restrict access to the application by using IAM authentication. Assume authenticated users will not submit adversarial inputs."],["D","Log all prompts and responses to Amazon S3. Query the prompts and responses periodically to identify adversarial behavior."]]},"ex":{"c":"Lambda로 모델 호출 전에 입력을 정제하고, 추론 중에는 Bedrock Guardrails(프롬프트 공격 필터 등)로 일관된 안전 통제를 적용하며, 응답 전에 출력을 검증합니다. 입력·추론·출력 세 단계 모두를 관리형 기능 위주로 방어합니다.","w":{"B":"시스템 프롬프트만으로는 탈옥을 신뢰성 있게 막을 수 없습니다.","C":"인증된 사용자도 악의적 입력을 보낼 수 있습니다.","D":"주기적 로그 조회는 사후 탐지일 뿐 실시간 방어가 아닙니다."}}},{"n":113,"a":["C"],"orig":"","ko":{"q":"한 엔터프라이즈 애플리케이션이 Amazon Bedrock FM으로 50~200페이지 분량의 기술 문서를 처리·분석합니다. FM의 컨텍스트 윈도우 한도를 초과하는 문서를 처리할 때 사용자들이 일관되지 않은 응답과 잘린 출력을 받고 있습니다.\n이 문제를 해결하는 솔루션은 무엇입니까?","o":[["A","청크당 4,000토큰, 20% 중첩의 고정 크기 청킹을 구성합니다. 추론 호출 전에 FM의 최대 컨텍스트 윈도우인 200,000토큰에 도달할 때까지 애플리케이션 로직으로 여러 청크를 순차 연결합니다."],["B","부모 청크 8,000토큰, 자식 청크 2,000토큰의 계층적 청킹을 사용합니다. Amazon Bedrock Knowledge Bases 기본 검색으로 쿼리 컨텍스트에 따라 관련 부모 청크를 자동 선택하고, 의미 연속성을 유지하도록 중첩 토큰을 구성합니다."],["C","중단점 백분위 임계값 95%, 버퍼 크기 3문장의 의미 기반 청킹을 사용합니다. RetrieveAndGenerate API로 임베딩 유사도 점수에 따라 가장 관련 있는 청크를 동적으로 선택합니다."],["D","FM의 토크나이저로 문서 토큰 수를 분석하는 전처리 AWS Lambda 함수를 만듭니다. 이 함수가 컨텍스트 윈도우의 80% 안에 들어가는 동일 크기 세그먼트로 문서를 나누고, 각 세그먼트를 독립 처리한 뒤 결과를 집계하도록 구성합니다."]]},"en":{"q":"An enterprise application uses an Amazon Bedrock foundation model (FM) to process and analyze 50 to 200 pages of technical documents. Users are experiencing inconsistent responses and receiving truncated outputs when processing documents that exceed the FM ' s context window limits.\nWhich solution will resolve this problem?","o":[["A","Configure fixed-size chunking at 4,000 tokens for each chunk with 20% overlap. Use applicationlevel logic to link multiple chunks sequentially until the FM ' s maximum context window of 200,000 tokens is reached before making inference calls."],["B","Use hierarchical chunking with parent chunks of 8,000 tokens and child chunks of 2,000 tokens. Use Amazon Bedrock Knowledge Bases built-in retrieval to automatically select relevant parent chunks based on query context. Configure overlap tokens to maintain semantic continuity."],["C","Use semantic chunking with a breakpoint percentile threshold of 95% and a buffer size of 3 sentences. Use the RetrieveAndGenerate API to dynamically select the most relevant chunks based on embedding similarity scores."],["D","Create a pre-processing AWS Lambda function that analyzes document token count by using the FM ' s tokenizer. Configure the Lambda function to split documents into equal segments that fit within 80% of the context window. Configure the Lambda function to process each segment independently before aggregating the results."]]},"ex":{"c":"시맨틱 청킹은 의미 경계에서 문서를 나누고, RetrieveAndGenerate API는 임베딩 유사도로 관련 청크만 골라 모델에 전달하므로 컨텍스트 창을 넘지 않으면서 일관된 응답을 얻습니다.","w":{"A":"청크를 컨텍스트 최대치까지 이어 붙이면 여전히 한계 근처에서 절단 문제가 생깁니다.","B":"8,000토큰 상위 청크를 여러 개 반환하면 컨텍스트 부담이 커집니다.","D":"세그먼트를 독립 처리하면 섹션 간 맥락이 끊겨 응답이 일관되지 않습니다."}}},{"n":114,"a":["C"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock으로 회사 데이터의 패턴과 관계를 분석하는 GenAI 애플리케이션을 개발하고 있습니다. 애플리케이션은 유럽, 북미, 아시아의 AWS 리전에서 매일 수백만 건의 새 데이터 포인트를 처리한 뒤 Amazon S3에 저장합니다. 애플리케이션은 현지 데이터 보호 및 저장 규정을 준수해야 하며, 데이터 상주와 처리는 같은 대륙 내에서 이루어져야 합니다. 또한 애플리케이션의 의사 결정 과정에 대한 감사 추적을 유지하고 데이터 분류 기능을 제공해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","로컬 IAM 정책과 함께 각 리전에 애플리케이션을 배포합니다. Amazon Bedrock 교차 리전 추론으로 워크로드를 분산하고, Amazon CloudWatch로 AI 의사 결정 과정과 데이터 처리 활동을 기록합니다. 리전별 규정 준수 인증은 수동으로 추적합니다."],["B","AWS Organizations의 SCP로 위치별 권한을 관리합니다. AWS CloudTrail의 변경 불가능한 로그로 의사 결정 과정을 감사합니다. 사용자 지정 모델을 Amazon Bedrock으로 가져와 각 리전에 배포합니다."],["C","리전별 S3 버킷 정책과 함께 Amazon S3 Object Lock을 사용합니다. 데이터 포인트를 Amazon Bedrock으로 보내기 전에 지리적 출처에 따라 해당 리전 내에서 전처리합니다. Amazon Macie로 데이터를 분류하고, AWS CloudTrail의 변경 불가능한 로그로 의사 결정 과정을 감사합니다."],["D","리전마다 개별 규정 준수 프레임워크를 가진 별도의 AWS 계정을 만듭니다. 사용자 지정 모니터링이 있는 Amazon SageMaker AI로 모델 성능과 데이터 상주 요구 사항 준수를 추적하고, 규제 관할권별로 보고서를 수동 작성합니다."]]},"en":{"q":"A company is developing a generative AI (GenAI) application by using Amazon Bedrock. The application will analyze patterns and relationships in the company's data. The application will process millions of new data points daily across AWS Regions in Europe, North America, and Asia before storing the data in Amazon S3. The application must comply with local data protection and storage regulations. Data residency and processing must occur within the same continent. The application must also maintain audit trails of the application's decision-making processes and provide data classification capabilities.\nWhich solution will meet these requirements?","o":[["A","Deploy the application in each Region with local IAM policies. Use Amazon Bedrock cross-Region inference to distribute the workload. Use Amazon CloudWatch to log AI decision-making processes. Manually track compliance certifications across Regions."],["B","Use SCPs with AWS Organizations to manage location-specific permissions. Use AWS CloudTrail immutable logs to audit decision-making processes. Import a custom model into Amazon Bedrock and deploy the model to each Region."],["C","Use Amazon S3 Object Lock with Region-specific S3 bucket policies. Pre-process the data points within the Region based on geographic origin before sending the data points to Amazon Bedrock. Use Amazon Macie to classify the data. Use AWS CloudTrail immutable logs to audit the decision-making processes."],["D","Create separate AWS accounts for each Region with individual compliance frameworks. Use Amazon SageMaker AI with custom monitoring. Create manual compliance reports for each regulatory jurisdiction."]]},"ex":{"c":"60번과 같은 문제입니다. 출처 지역 안에서 데이터를 전처리한 뒤 Bedrock으로 보내고, 리전별 버킷 정책과 Object Lock으로 저장을 통제하며, Macie로 분류하고 CloudTrail 불변 로그로 감사합니다.","w":{"A":"교차 리전 추론은 대륙 간 이동 위험이 있고 규정 준수를 수동으로 추적합니다.","B":"데이터 분류 기능이 없습니다.","D":"수동 보고서와 사용자 지정 모니터링은 오버헤드가 크고 데이터 분류가 없습니다."}}},{"n":115,"a":["B"],"orig":"","ko":{"q":"한 회사가 AWS Lambda로 서버리스 추론 API를 구현하고 있습니다. 이 API는 Amazon Bedrock에 호스팅된 여러 AI 모델을 동적으로 호출합니다. 회사는 Lambda 코드를 수정하거나 재배포하지 않고 실시간으로 모델 공급자를 전환할 수 있는 솔루션을 설계해야 합니다. 설계에는 구성 변경의 안전한 롤아웃과 검증 및 롤백 기능이 포함되어야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","활성 모델 공급자를 AWS Systems Manager Parameter Store에 저장합니다. Lambda 함수가 런타임에 파라미터를 읽어 호출할 모델을 결정하도록 구성합니다."],["B","활성 모델 공급자를 AWS AppConfig에 저장합니다. Lambda 함수가 런타임에 구성을 읽어 호출할 모델을 결정하도록 구성합니다."],["C","Amazon API Gateway REST API가 요청을 별도의 Lambda 함수로 라우팅하도록 구성합니다. 각 Lambda 함수에 특정 모델 공급자를 하드코딩하고, 통합 대상을 수동으로 전환합니다."],["D","활성 모델 공급자를 Amazon S3에 호스팅한 JSON 파일에 저장합니다. AWS AppConfig가 S3 파일을 호스팅 구성 소스로 참조하도록 하고, Lambda 함수가 런타임에 AppConfig를 통해 파일을 읽어 호출할 모델을 결정하도록 구성합니다."]]},"en":{"q":"A company is implementing a serverless inference API by using AWS Lambda. The API will dynamically invoke multiple AI models hosted on Amazon Bedrock. The company needs to design a solution that can switch between model providers without modifying or redeploying Lambda code in real time. The design must include safe rollout of configuration changes and validation and rollback capabilities.\nWhich solution will meet these requirements?","o":[["A","Store the active model provider in AWS Systems Manager Parameter Store. Configure a Lambda function to read the parameter at runtime to determine which model to invoke."],["B","Store the active model provider in AWS AppConfig. Configure a Lambda function to read the configuration at runtime to determine which model to invoke."],["C","Configure an Amazon API Gateway REST API to route requests to separate Lambda functions. Hardcode each Lambda function to a specific model provider. Switch the integration target manually."],["D","Store the active model provider in a JSON file hosted on Amazon S3. Use AWS AppConfig to reference the S3 file as a hosted configuration source. Configure a Lambda function to read the file through AppConfig at runtime to determine which model to invoke."]]},"ex":{"c":"AWS AppConfig는 구성 변경을 배포 전략(점진적 롤아웃)으로 안전하게 배포하고, 검증기(JSON 스키마·Lambda)로 사전 검증하며, CloudWatch 경보에 연결된 자동 롤백을 제공합니다. Lambda가 런타임에 구성을 읽으므로 코드 변경이나 재배포 없이 모델 공급자를 바꿀 수 있습니다.","w":{"A":"Parameter Store에는 안전한 롤아웃, 검증, 자동 롤백 기능이 없습니다.","C":"수동 전환과 하드코딩은 요구 사항에 어긋납니다.","D":"S3를 구성 소스로 쓰면 버킷 관리가 추가될 뿐이며, AppConfig 호스팅 구성(B)보다 이점이 없습니다."}}},{"n":116,"a":["A"],"orig":"","ko":{"q":"한 의료 회사가 의학 연구 논문을 Amazon S3 버킷에 저장하는 문서 관리 시스템을 개발하고 있습니다. 회사는 GenAI 애플리케이션의 검색 정밀도를 높이기 위한 포괄적인 메타데이터 프레임워크가 필요합니다. 메타데이터에는 문서 타임스탬프, 작성자 정보, 연구 분야 분류가 포함되어야 합니다. 솔루션은 업로드된 모든 문서에 걸쳐 일관된 메타데이터 구조를 유지하고, FM이 전체 내용에 접근하지 않고도 문서 맥락을 이해할 수 있게 해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","문서 타임스탬프는 Amazon S3 시스템 메타데이터에 저장합니다. 분야 분류에는 S3 객체 태그를 사용하고, 작성자 정보는 사용자 정의 메타데이터로 저장합니다."],["B","법적 보존(legal hold)이 있는 S3 Object Lock으로 문서 타임스탬프를 추적합니다. 작성자 정보에는 S3 객체 태그를 사용하고, 분야 분류에는 S3 액세스 포인트를 구현합니다."],["C","S3 Inventory 보고서로 타임스탬프를 추적합니다. 분야 분류용 S3 액세스 포인트를 만들고, 작성자 정보는 S3 Storage Lens 대시보드에 저장합니다."],["D","작성자 정보는 사용자 정의 메타데이터로 저장합니다. 타임스탬프에는 S3 Object Lock 보존 기간을, 분야 분류에는 S3 이벤트 알림을 사용합니다."]]},"en":{"q":"A healthcare company is developing a document management system that stores medical research papers in an Amazon S3 bucket. The company needs a comprehensive metadata framework to improve search precision for a GenAI application. The metadata must include document timestamps, author information, and research domain classifications. The solution must maintain a consistent metadata structure across all uploaded documents and allow foundation models (FMs) to understand document context without accessing full content.\nWhich solution will meet these requirements?","o":[["A","Store document timestamps in Amazon S3 system metadata. Use S3 object tags for domain classification. Implement custom user-defined metadata to store author information."],["B","Set up S3 Object Lock with legal holds to track document timestamps. Use S3 object tags for author information. Implement S3 access points for domain classification."],["C","Use S3 Inventory reports to track timestamps. Create S3 access points for domain classification. Store author information in S3 Storage Lens dashboards."],["D","Use custom user-defined metadata to store author information. Use S3 Object Lock retention periods for timestamps. Use S3 Event Notifications for domain classification."]]},"ex":{"c":"S3 시스템 메타데이터(Last-Modified)로 타임스탬프를, 객체 태그로 연구 도메인 분류를, 사용자 정의 메타데이터(x-amz-meta-*)로 작성자 정보를 저장하면 모든 문서에 일관된 메타데이터 구조가 생깁니다. FM은 전체 본문 없이도 이 메타데이터로 문서 맥락을 파악할 수 있습니다.","w":{"B":"Object Lock 법적 보존은 타임스탬프 추적용이 아니고, 액세스 포인트는 분류 수단이 아닙니다.","C":"Inventory 보고서와 Storage Lens는 객체별 메타데이터 저장 수단이 아닙니다.","D":"Object Lock 보존 기간은 타임스탬프가 아니며, 이벤트 알림은 분류 수단이 아닙니다."}}},{"n":117,"a":["A","D","E"],"orig":"","ko":{"q":"한 향신료 회사가 고객이 회사 향신료로 요리하는 동영상을 회사가 운영하는 플랫폼에 업로드하도록 초대하는 마케팅 캠페인을 시작합니다. 회사는 동영상 공유 플랫폼용 솔루션을 설계하고 있습니다. 솔루션은 동영상 녹취록을 추출하고 임베딩을 생성해, 사용자가 향신료, 기타 재료, 조리법을 기준으로 동영상을 검색할 수 있게 해야 합니다. 사용자가 실시간으로 동영상과 상호 작용할 수 있도록 회사의 기존 오픈 소스 채팅 시스템과 통합되어야 하며, 사용자 채팅 텍스트의 감정을 분석해 가장 호응이 좋은 동영상을 파악해야 합니다. 매달 긍정적 피드백과 조회 수가 가장 높은 레시피 동영상을 플랫폼에 표시합니다.\n운영 오버헤드가 가장 적은 단계 조합은 무엇입니까? (3개 선택)","o":[["A","Amazon Transcribe의 자동 음성 인식(ASR)으로 동영상 녹취록을 추출합니다. Amazon Comprehend로 채팅 피드백의 감정을 분석하고, Amazon Bedrock 임베딩 모델로 임베딩을 생성합니다. 의미 검색을 위해 임베딩을 Amazon Bedrock 지식 기반에 저장합니다."],["B","AWS Step Functions로 전체 애플리케이션 파이프라인을 오케스트레이션합니다. 워크플로의 한 단계에서 AWS Lambda 함수로 채팅 시스템 API를 호출하도록 구성합니다."],["C","모든 애플리케이션 구성 요소를 직접 호출하고, 오류를 관리하며, 채팅 시스템 API 호출에 사용자 지정 코드를 포함하는 사용자 지정 오케스트레이션 AWS Lambda 함수를 구성합니다."],["D","긍정 피드백 수와 조회 수 같은 동영상 지표를 Amazon DynamoDB에 저장합니다."],["E","기본 HTTP 도구가 있는 Strands Agents SDK로 오픈 소스 채팅 시스템 API를 호출합니다. Strands Agents SDK의 기본 오케스트레이션 기능으로 Amazon Bedrock Knowledge Bases(동영상 검색)와 Amazon Comprehend(감정 분석) 호출을 조정합니다."],["F","긍정 피드백 수와 조회 수 같은 동영상 지표를 pgvector 확장을 사용하는 Amazon Aurora PostgreSQL 데이터베이스에 저장합니다."]]},"en":{"q":"A cooking spice company is launching a marketing campaign that will invite customers to upload videos of themselves cooking with the company ' s spices to a platform that the company operates. The company is designing a solution for the video-sharing platform. The solution must extract video transcripts and generate embeddings to help users search for videos based on spices, other ingredients, and cooking methods. The solution must integrate with the company ' s existing open-source chat system so users can interact with videos in real time. The solution must analyze user chat text for sentiment to determine the most positively received videos. Each month, the recipe videos that received the most positive feedback and the highest number of views will be displayed on the platform.\nWhich combination of steps will meet these requirements with the LEAST operational overhead? (Select THREE.)","o":[["A","Use Amazon Transcribe to perform automatic speech recognition (ASR) to extract video transcripts. Use Amazon Comprehend to perform sentiment analysis on chat feedback. Use an Amazon Bedrock embeddings model to generate embeddings. Store the embeddings in an Amazon Bedrock knowledge base to enable semantic retrieval."],["B","Use AWS Step Functions to orchestrate the entire application pipeline. Configure a step in the workflow to use an AWS Lambda function to call the chat system API."],["C","Configure a custom orchestration AWS Lambda function to call all application components directly, manage errors, and embed custom code in calls to the chat system API."],["D","Store video metrics such as positive feedback counts and view counts in Amazon DynamoDB."],["E","Use the Strands Agents SDK with built-in HTTP tools to call the open-source chat system API. Use the Strands Agents SDK built-in orchestration capabilities to coordinate calls to Amazon Bedrock Knowledge Bases to enable video search and to Amazon Comprehend to perform sentiment analysis."],["F","Store video metrics such as positive feedback counts and view counts in an Amazon Aurora PostgreSQL database that uses the pgvector extension."]]},"ex":{"c":"Transcribe로 전사, Comprehend로 감정 분석, Bedrock 임베딩 모델과 지식 기반으로 시맨틱 검색을 구현합니다(A). 피드백 수와 조회 수 같은 지표는 DynamoDB에 저장해 월간 순위를 매깁니다(D). Strands Agents SDK의 기본 HTTP 도구와 오케스트레이션으로 기존 오픈 소스 채팅 시스템, 지식 기반, Comprehend 호출을 조율하면 사용자 지정 코드가 최소화됩니다(E).","w":{"B":"Step Functions 파이프라인에 Lambda를 더하는 것은 Strands의 기본 기능보다 운영 부담이 큽니다.","C":"사용자 지정 오케스트레이션 Lambda는 오류 처리와 통합을 직접 구현해야 합니다.","F":"단순 카운터 지표에 pgvector가 있는 Aurora는 과도하고 운영 부담이 큽니다."}}},{"n":118,"a":["D"],"orig":"","ko":{"q":"한 대학이 최근 고문서, 학술지, 원고 컬렉션을 디지털화해 AWS Lake Formation 데이터 레이크에 저장했습니다. 대학은 사용자가 텍스트 쿼리로 디지털 파일을 검색할 수 있는 솔루션을 구축하기 위해 GenAI 개발자를 고용했습니다. 솔루션은 사용자 쿼리와 의미가 비슷한 학술지 초록을 반환해야 하며, 사용자는 초록과 관련된 텍스트와 메타데이터로 컬렉션을 검색할 수 있어야 합니다. 디지털 파일의 메타데이터에는 키워드가 없습니다. 솔루션은 텍스트 유사도로 비슷한 초록끼리 매칭해야 하며, 데이터 레이크의 파일 수는 100만 개 미만입니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock의 Amazon Titan Embeddings로 디지털 파일의 벡터 표현을 만들고, Amazon OpenSearch Service의 OpenSearch Neural 플러그인에 임베딩을 저장합니다."],["B","Amazon Comprehend로 디지털 파일에서 주제를 추출합니다. 주제와 파일 메타데이터를 Amazon Aurora PostgreSQL 데이터베이스에 저장하고, 초록 메타데이터를 Aurora 데이터와 대조해 조회합니다."],["C","Amazon SageMaker AI로 sentence-transformer 모델을 배포해 디지털 파일의 벡터 표현을 만들고, pgvector 확장이 있는 Amazon Aurora PostgreSQL 데이터베이스에 임베딩을 저장합니다."],["D","Amazon Bedrock의 Amazon Titan Embeddings로 디지털 파일의 벡터 표현을 만들고, pgvector 확장이 있는 Amazon Aurora PostgreSQL Serverless 데이터베이스에 임베딩을 저장합니다."]]},"en":{"q":"A university recently digitized a collection of archival documents, academic journals, and manuscripts. The university stores the digital files in an AWS Lake Formation data lake. The university hires a GenAI developer to build a solution to allow users to search the digital files by using text queries. The solution must return journal abstracts that are semantically similar to a user ' s query. Users must be able to search the digitized collection based on text and metadata that is associated with the journal abstracts. The metadata of the digitized files does not contain keywords. The solution must match similar abstracts to one another based on the similarity of their text. The data lake contains fewer than 1 million files.\nWhich solution will meet these requirements with the LEAST operational overhead?","o":[["A","Use Amazon Titan Embeddings in Amazon Bedrock to create vector representations of the digitized files. Store embeddings in the OpenSearch Neural plugin for Amazon OpenSearch Service."],["B","Use Amazon Comprehend to extract topics from the digitized files. Store the topics and file metadata in an Amazon Aurora PostgreSQL database. Query the abstract metadata against the data in the Aurora database."],["C","Use Amazon SageMaker AI to deploy a sentence-transformer model. Use the model to create vector representations of the digitized files. Store embeddings in an Amazon Aurora PostgreSQL database that has the pgvector extension."],["D","Use Amazon Titan Embeddings in Amazon Bedrock to create vector representations of the digitized files. Store embeddings in an Amazon Aurora PostgreSQL Serverless database that has the pgvector extension."]]},"ex":{"c":"Titan Embeddings로 초록을 벡터화하고 Aurora PostgreSQL Serverless의 pgvector에 저장하면, 100만 건 미만 규모에서 텍스트 유사도 검색과 메타데이터 SQL 필터링을 함께 할 수 있습니다. 서버리스라 용량 관리가 필요 없어 운영 오버헤드가 가장 적습니다.","w":{"A":"OpenSearch Service 클러스터는 이 규모에서 운영 부담이 더 큽니다.","B":"토픽 추출은 시맨틱 유사도 검색이 아니고, 메타데이터에 키워드가 없다는 조건과도 맞지 않습니다.","C":"SageMaker 엔드포인트를 직접 운영해야 해 오버헤드가 큽니다."}}},{"n":119,"a":["B"],"orig":"","ko":{"q":"GenAI 개발자가 Amazon Bedrock으로 애플리케이션을 구축하고 있습니다. 애플리케이션은 복잡한 자연어 요청을 해석하고, 같은 사용자와의 여러 상호 작용에 걸쳐 의미 맥락을 유지하며, 사전 정의된 워크플로가 아닌 추론에 따라 50개 이상의 엔터프라이즈 API를 동적으로 호출해야 합니다. 백엔드 도구를 자율적으로 조정하고, 규정 준수 검토를 위해 설명 가능한 결과를 제공해야 합니다. GenAI 개발자는 Amazon Bedrock AgentCore로 동적 오케스트레이션을 구현하려고 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AgentCore와 AWS Step Functions로 API를 호출하는 정적 워크플로를 정의합니다. 규정 준수 검토용 로그를 수집하도록 Amazon CloudWatch Logs를 구성합니다."],["B","AgentCore로 추론 모듈과 동적 도구 호출 API를 통합합니다. AgentCore 에이전트가 의미 맥락에 따라 엔터프라이즈 API를 오케스트레이션하고, 규정 준수 검토를 위해 추론 기록을 로깅하도록 구성합니다."],["C","엔터프라이즈 API 대신 Amazon Bedrock Knowledge Bases로 의미 검색을 구현합니다. AWS Lambda 함수를 AgentCore 에이전트와 통합해 API를 호출하고 런타임을 오케스트레이션합니다."],["D","외부 LLM 체인과 함께 Amazon Bedrock Guardrails를 사용해 의미 맥락을 관리하고 규정 준수 검토용 로그를 수집합니다. 애플리케이션에서 API를 직접 호출합니다."]]},"en":{"q":"A GenAI developer is using Amazon Bedrock to build an application. The application needs to interpret complex user requests in natural language, maintain semantic context across multiple interactions with the same user, and dynamically invoke more than 50 enterprise APIs based on reasoning rather than predefined workflows. The application must autonomously coordinate backend tools and provide explainable results for compliance reviews. The GenAI developer wants to use Amazon Bedrock AgentCore to implement dynamic orchestration.\nWhich solution will meet these requirements?","o":[["A","Use AgentCore with AWS Step Functions to define static workflows that call APIs. Configure Amazon CloudWatch Logs to collect logs for compliance reviews."],["B","Use AgentCore to integrate reasoning modules with dynamic tool invocation APIs. Configure AgentCore agents to orchestrate enterprise APIs based on semantic context and to log reasoning traces for compliance reviews."],["C","Use Amazon Bedrock Knowledge Bases to implement semantic search instead of enterprise APIs. Integrate AWS Lambda functions with an AgentCore agent to call APIs to orchestrate runtimes."],["D","Use Amazon Bedrock Guardrails with an external LLM chain to manage semantic context and to collect logs for compliance reviews. Invoke APIs directly from the application."]]},"ex":{"c":"AgentCore 에이전트가 추론을 기반으로 50개가 넘는 엔터프라이즈 API를 동적으로 선택·호출하고, 메모리로 다중 상호 작용의 의미 맥락을 유지하며, 추론 추적을 기록해 규정 준수 검토에 활용합니다. 사전 정의 워크플로가 아닌 동적 오케스트레이션 요구에 맞습니다.","w":{"A":"Step Functions 정적 워크플로는 추론 기반 동적 호출 요구에 어긋납니다.","C":"엔터프라이즈 API를 시맨틱 검색으로 대체할 수 없습니다.","D":"외부 LLM 체인과 직접 API 호출은 AgentCore 사용 요구에 어긋나고 설명 가능성이 없습니다."}}},{"n":120,"a":["B"],"orig":"","ko":{"q":"한 연구 회사가 기술 문서 요약을 생성하는 GenAI 시스템을 개발하고 있습니다. 회사는 모든 데이터 소스를 중앙 위치에 카탈로그화해야 하며, 데이터 소스를 자동으로 검색하고 업데이트하는 솔루션이 필요합니다. 솔루션은 생성된 각 요약에 사용자가 조회할 수 있는 메타데이터로 인용 정보를 태그해야 합니다. 또한 모든 모델 호출에 대해 변조 증거가 남는(tamper-evident) 변경 불가능한 감사 로그를 보관하고 입출력 기록을 저장해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Comprehend로 문서의 데이터 소스를 식별합니다. 생성된 요약을 Amazon S3에 저장하고 S3 Object Lock을 활성화합니다. Amazon CloudWatch 지표로 애플리케이션 처리량 보고서를 생성하고, 호출별 로그는 포함하지 않습니다."],["B","크롤러가 있는 AWS Glue Data Catalog로 데이터 소스를 관리합니다. 생성된 요약을 Amazon S3에 저장하고 소스 ID를 포함한 객체 태그를 기록합니다. Amazon Bedrock 모델 호출 로그를 Amazon S3에 저장하고, 호출 로그를 저장하는 S3 버킷에 S3 Object Lock을 활성화합니다. AWS CloudTrail 로그 파일 무결성 검증으로 변조 증거가 남는 불변성을 제공합니다."],["C","애플리케이션 출력을 Amazon DynamoDB에 저장하고, 출처 정보를 포함한 항목 수준 태그를 적용합니다. 애플리케이션 이벤트를 Amazon CloudWatch Logs에 기록하고, IAM 역할로 감사 추적성을 제공합니다."],["D","AWS AppConfig 기능 플래그로 데이터 버전 관리를 구현합니다. IAM 조건 키로 모델 액세스를 제한하고, 소스와 출력 간 관계를 담은 버전 관리 매핑 파일을 Amazon S3에 유지합니다."]]},"en":{"q":"A research company is developing a GenAI system to produce summaries of technical documents. The company must catalog all data sources in a central location. The company needs a solution that can automatically discover and update data sources. The solution must tag each generated summary with citations as metadata that users can query. The solution must retain tamper-evident, immutable audit logs for every model invocation and store input/output records.\nWhich solution will meet these requirements?","o":[["A","Use Amazon Comprehend to identify data sources in the documents. Store generated summaries in Amazon S3 and enable S3 Object Lock. Use Amazon CloudWatch metrics to generate reports about application throughput. Do not include logs for each invocation."],["B","Use AWS Glue Data Catalog with crawlers to maintain data sources. Store generated summaries in Amazon S3. Write object tags that include a source ID. Store Amazon Bedrock model invocation logs in Amazon S3. Enable S3 Object Lock on the S3 bucket that stores invocation logs. Use AWS CloudTrail log file integrity validation to provide tamper-evident immutability."],["C","Store application outputs in Amazon DynamoDB. Apply item-level tags that include source attribution. Write application events to Amazon CloudWatch Logs. Use IAM roles to provide audit traceability."],["D","Use AWS AppConfig feature flags to implement data versioning. Restrict access to the model by using IAM condition keys. Maintain a versioned mapping file of source-to-output relationships in Amazon S3."]]},"ex":{"c":"64번과 같은 문제입니다. Glue Data Catalog와 크롤러로 데이터 소스를 자동 발견·관리하고, 요약에 출처 ID 태그를 붙이며, 호출 로그를 Object Lock S3에 불변으로 저장하고 CloudTrail 로그 파일 무결성 검증으로 변조를 탐지합니다.","w":{"A":"호출별 로그를 남기지 않습니다.","C":"DynamoDB와 CloudWatch Logs는 불변 감사 저장소가 아닙니다.","D":"중앙 카탈로그와 불변 감사 로그가 없습니다."}}},{"n":121,"a":["B","C"],"orig":"","ko":{"q":"한 회사가 FM으로 여러 AI 워크로드를 지원하는 솔루션을 설계하고 있습니다. 일부 FM은 온디맨드로 실시간 호출되어야 하고, 다른 FM은 배치 처리를 위해 일관된 고처리량 접근이 필요합니다. 솔루션은 데이터 상주 및 규정 준수 요구 사항에 따라 클라우드와 온프레미스 인프라 전반에서 워크로드를 실행하는 하이브리드 배포 패턴을 지원해야 합니다.\n이 요구 사항을 충족하는 단계 조합은 무엇입니까? (2개 선택)","o":[["A","AWS Lambda로 Amazon SageMaker AI 비동기 엔드포인트에 호스팅된 FM을 호출해 저지연 FM 추론을 오케스트레이션합니다."],["B","대용량 워크로드의 일관된 성능을 보장하도록 Amazon Bedrock에서 프로비저닝된 처리량을 구성합니다."],["C","Amazon SageMaker Neo로 엣지 배포를 지원하는 Amazon SageMaker AI 엔드포인트에 FM을 배포합니다. 하이브리드 배포를 지원하도록 AWS Lambda로 FM을 오케스트레이션합니다."],["D","예측할 수 없는 트래픽 급증을 처리하기 위해 자동 확장과 함께 Amazon Bedrock을 사용합니다."],["E","Amazon SageMaker JumpStart로 FM을 호스팅하고 호출합니다."]]},"en":{"q":"A company is designing a solution that uses foundation models (FMs) to support multiple AI workloads. Some FMs must be invoked on demand and in real time. Other FMs require consistent highthroughput access for batch processing. The solution must support hybrid deployment patterns and run workloads across cloud infrastructure and on- premises infrastructure to comply with data residency and compliance requirements.\nWhich combination of steps will meet these requirements? (Select TWO.)","o":[["A","Use AWS Lambda to orchestrate low-latency FM inference by invoking FMs hosted on Amazon SageMaker AI asynchronous endpoints."],["B","Configure provisioned throughput in Amazon Bedrock to ensure consistent performance for highvolume workloads."],["C","Deploy FMs to Amazon SageMaker AI endpoints with support for edge deployment by using Amazon SageMaker Neo. Orchestrate the FMs by using AWS Lambda to support hybrid deployment."],["D","Use Amazon Bedrock with auto-scaling to handle unpredictable traffic surges."],["E","Use Amazon SageMaker JumpStart to host and invoke the FMs."]]},"ex":{"c":"Bedrock 프로비저닝 처리량은 대용량 배치 워크로드에 일관된 고처리량을 보장합니다(B). SageMaker 엔드포인트와 SageMaker Neo의 엣지 배포 지원으로 클라우드와 온프레미스에 FM을 배포하고 Lambda로 조율하면 데이터 상주를 위한 하이브리드 패턴을 지원합니다(C).","w":{"A":"비동기 엔드포인트는 저지연 실시간 추론에 맞지 않습니다.","D":"Bedrock은 클라우드 전용이라 온프레미스 하이브리드 요구를 충족하지 못합니다.","E":"JumpStart는 모델 시작 도구이며 하이브리드 배포를 제공하지 않습니다."}}},{"n":122,"a":["B"],"orig":"","ko":{"q":"한 회사가 사용자 지정 에이전트형 애플리케이션을 구축하고 있습니다. 회사는 에이전트 오케스트레이션 루프를 세밀하게 제어해야 합니다. 애플리케이션은 도구 선택을 위한 사용자 지정 로직을 구현하고, 복잡한 상태 관리가 필요한 다중 턴 대화를 처리하며, 독자적인 로깅 시스템과 통합하고, 도구 실패에 대한 사용자 지정 재시도 전략을 구현해야 합니다. 회사는 Amazon Bedrock FM을 사용하되 오케스트레이션 로직은 완전히 직접 제어해야 합니다. 회사는 오케스트레이션 로직 구축 역량이 있지만, 모델 추론과 도구 실행 관리는 AWS 인프라를 활용하려고 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock AgentCore Runtime으로 애플리케이션 에이전트를 배포합니다. AgentCore Gateway로 애플리케이션을 도구와 통합하고, AgentCore Memory로 대화 상태를 관리하며, AgentCore Policy로 도구 선택과 재시도 로직을 처리합니다."],["B","Amazon Bedrock AgentCore로 에이전트 오케스트레이션 루프, 도구 호출, 상태 관리를 제어하는 사용자 지정 오케스트레이션 계층을 구축합니다. 모델 추론은 Amazon Bedrock으로 관리합니다."],["C","Amazon Bedrock AgentCore의 기본 메모리 및 세션 관리 기능으로 대화 상태를 유지합니다. 관리형 도구 실행 런타임이 도구 실패와 재시도를 자동 처리하도록 구성합니다."],["D","AWS Step Functions로 Amazon Bedrock AgentCore Runtime 엔드포인트에 대한 여러 호출을 오케스트레이션합니다. 개별 에이전트 호출 사이에 사용자 지정 상태 관리와 재시도 로직을 구현합니다."]]},"en":{"q":"A company is building a custom agentic application. The company must have fine-grained control over the agent orchestration loop. The application must implement custom logic to select tools, handle multi-turn conversations that involve complex state management, integrate with proprietary logging systems, and implement custom retry strategies for tool failures. The company wants to use Amazon Bedrock FMs but must have full control over the orchestration logic. The company has expertise in building orchestration logic but wants to use AWS infrastructure to manage model inference and tool execution.\nWhich solution will meet these requirements?","o":[["A","Use Amazon Bedrock AgentCore Runtime to deploy the application agents. Use AgentCore Gateway to integrate the application with tools. Use AgentCore Memory to manage conversation states. Use AgentCore Policy to handle tool selection and retry logic."],["B","Use Amazon Bedrock AgentCore to build a custom orchestration layer that controls the agent orchestration loop, tool invocation, and state management. Use Amazon Bedrock to manage model inference."],["C","Use Amazon Bedrock AgentCore built-in memory and session management capabilities to persist conversation state. Configure the managed tool execution runtime to automatically handle tool failures and retries."],["D","Use AWS Step Functions to orchestrate multiple calls to Amazon Bedrock AgentCore Runtime endpoints. Implement custom state management and retry logic between individual agent invocations."]]},"ex":{"c":"오케스트레이션 루프를 완전히 직접 통제해야 하므로, 도구 선택·상태 관리·재시도 로직을 담은 사용자 지정 오케스트레이션 계층을 직접 만들고 AgentCore 인프라 위에서 실행하며 모델 추론은 Bedrock에 맡깁니다. 회사의 오케스트레이션 전문성을 살리면서 인프라 관리는 AWS가 담당합니다.","w":{"A":"AgentCore Policy는 도구 접근 정책용이며 도구 선택과 재시도 로직을 사용자 지정 방식으로 통제하지 못합니다.","C":"관리형 도구 실행이 재시도를 자동 처리하면 사용자 지정 재시도 전략 요구에 어긋납니다.","D":"Step Functions로 개별 호출 사이만 조율하면 에이전트 내부 루프를 통제할 수 없습니다."}}},{"n":123,"a":["B"],"orig":"","ko":{"q":"한 글로벌 의료 회사가 치료 권장 사항을 생성하는 GenAI 애플리케이션을 Amazon Bedrock에 배포하고 있습니다. 회사가 운영하는 국가마다 규제가 다릅니다. 일부 국가는 모든 모델 입력과 출력을 2년간 보관하도록 요구하고, 다른 국가는 현지 감사를 위한 데이터 제출만 요구합니다. 의료 제공자는 모든 지역에서 일관된 의학 용어를 요구하지만, 모델의 치료 권장 사항은 현지 환자 인구통계에 맞춰야 합니다. 솔루션은 기존 전자 건강 기록(EHR) 시스템과도 통합되어야 합니다. 애플리케이션은 하루 최대 10,000건의 의료 제공자 질의를 1초 미만으로 처리해야 합니다. 회사는 배포 전에 애플리케이션을 검토하고 프롬프트 변경을 승인할 수 있어야 하며, 애플리케이션은 프롬프트, 응답, 사용자 컨텍스트에 대한 포괄적인 로그를 생성해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AWS CloudTrail로 API 호출을 기록합니다. 환자 인구통계 변수를 포함한 표준 프롬프트를 Amazon Bedrock Prompt Management에 만들고, IAM 정책으로 승인된 사용자만 프롬프트에 접근할 수 있게 합니다."],["B","Amazon CloudWatch Logs로 상세한 모델 호출 로그를 수집해 Amazon S3에 저장합니다. 치료 옵션 변수를 포함한 파라미터화된 프롬프트를 Amazon Bedrock Prompt Management에 만들고, 프롬프트 버전 관리를 활성화하고 승인 워크플로를 설정합니다."],["C","임상 언어 요구 사항을 강제하는 프롬프트를 동적으로 생성하는 AWS Lambda 함수를 만듭니다. Amazon CloudWatch Logs로 모델 호출을 추적하고, Amazon SQS 대기열로 프롬프트 승인 워크플로를 구현합니다."],["D","프롬프트 템플릿을 Amazon S3에 저장하고 S3 Object Lock으로 버전 관리를 구현합니다. Amazon EventBridge로 모델 호출을 추적하고, AWS Config로 프롬프트 템플릿 변경을 모니터링합니다."]]},"en":{"q":"A global healthcare company is deploying a GenAI application on Amazon Bedrock to produce treatment recommendations. Regulations vary for each country where the company operates. Some countries require the company to retain all model inputs and outputs for 2 years. Other countries require the company to submit data for local audits only. Medical providers require consistent medical terminology across all locations. However, the treatment recommendations that the model produces must adapt to local patient demographics. The solution must also integrate with existing electronic health record (EHR) systems. The application must support up to 10,000 healthcare provider queries every day with sub-second response times. The company must be able to review the application before deployments and approve of prompt changes. The application must produce comprehensive logs for prompts, responses, and user context.\nWhich solution will meet these requirements?","o":[["A","Use AWS CloudTrail to log API calls. Create standard prompts in Amazon Bedrock Prompt Management that include variables for patient demographics. Implement IAM policies to ensure that only approves users can access prompts."],["B","Use Amazon CloudWatch Logs to collect detailed model invocation logs. Store the logs in Amazon S3. Create parameterized prompts in Amazon Bedrock Prompt Management that include variables for treatment options. Enable prompt versioning and set up an approval workflow."],["C","Create AWS Lambda functions to dynamically generate prompts that enforce clinical language requirements. Use Amazon CloudWatch Logs to track model invocations. Use Amazon SQS queues to implement a prompt approval workflow."],["D","Store prompt templates in Amazon S3. Use S3 Object Lock to implement version control. Use Amazon EventBridge to track model invocations. Use AWS Config to monitor changes to prompt templates."]]},"ex":{"c":"모델 호출 로깅을 CloudWatch Logs로 수집하고 S3에 저장해 국가별 보존 요건(2년)과 감사 제출에 대응합니다. Prompt Management의 파라미터화 프롬프트로 의료 용어를 표준화하면서 변수로 현지 상황에 맞추고, 버전 관리와 승인 워크플로로 배포 전 검토를 보장합니다.","w":{"A":"CloudTrail에는 프롬프트·응답 내용이 기록되지 않고 버전 관리와 승인 워크플로가 없습니다.","C":"Lambda로 프롬프트를 동적으로 생성하면 일관성이 떨어지고 SQS는 승인 워크플로 도구가 아닙니다.","D":"Object Lock은 버전 관리가 아니고 EventBridge는 호출 내용을 기록하지 않습니다."}}},{"n":124,"a":["A","B","C"],"orig":"","ko":{"q":"한 물류 회사가 Amazon Bedrock으로 창고, 배송, 국제 통관 업무를 지원하는 API와 연동하는 자율 경로 설정 에이전트를 구축하고 있습니다. 에이전트는 다음 요구 사항을 충족해야 합니다.\n* 요청을 추론 단계로 나눕니다.\n* 실패한 도구 호출을 백오프와 함께 재시도합니다.\n* 연속 3회 실패하면 재시도를 중단합니다.\n* 가액이 100,000달러를 넘는 배송은 사람의 승인을 요구합니다.\n* MCP로 도구와 새 통합에 대한 접근을 코드 변경 없이 제공합니다.\n이 요구 사항을 충족하는 솔루션 조합은 무엇입니까? (3개 선택)","o":[["A","Amazon Bedrock AgentCore Gateway로 창고, 배송, 통관 API를 MCP 호환 도구로 변환합니다."],["B","AWS Step Functions의 Task 상태로 각 추론 단계를 오케스트레이션합니다. 지수 백오프가 있는 재시도 구성으로 도구 실패를 처리합니다."],["C","Choice 상태로 고가 배송을 사람 승인 워크플로로 라우팅합니다."],["D","API마다 액션 그룹이 있는 Amazon Bedrock AgentCore를 사용합니다. 에이전트의 오케스트레이션 프롬프트에 재시도 로직과 사람 승인 조건을 구현하도록 구성합니다."],["E","MCP 클라이언트 라이브러리로 도구를 호출하는 AWS Lambda 함수를 사용합니다. Lambda 함수 코드에 사용자 지정 재시도 로직과 서킷 브레이커 패턴을 구현합니다."],["F","Amazon Bedrock Guardrails로 100,000달러 임계값을 넘는 배송의 도구 호출을, 별도 워크플로에서 사람이 승인할 때까지 차단합니다."],["G","AWS Lambda 권한 부여자가 있는 Amazon API Gateway로 도구 요청을 검증하고 속도 제한을 구현합니다. 지수 백오프가 있는 사용자 지정 재시도 로직과 연속 3회 실패 후 재시도를 중단하는 서킷 브레이커를 구현합니다."]]},"en":{"q":"A logistics company is using Amazon Bedrock to build an autonomous routing agent that coordinates with APIs that support warehouse, shipping, and international customs operations. The agent must meet the following requirements:\n* Break requests into reasoning steps.\n* Retry failed tool calls with backoff.\n* Stop retrying after three consecutive failures.\n* Require human approval for shipments that are valued over $100,000.\n* Use MCP to provide access to tools and new integrations without requiring code changes.\nWhich combination of solutions will meet these requirements? (Select THREE.)","o":[["A","Use Amazon Bedrock AgentCore Gateway to convert the warehouse, shipping, and customs APIs into MCP-compatible tools."],["B","Use Task states in AWS Step Functions to orchestrate each reasoning step. Use retry configurations with exponential backoff to handle tool failures."],["C","Use a Choice state to route high-value shipments to a human approval workflow."],["D","Use Amazon Bedrock AgentCore with action groups for each API. Configure the agent ' s orchestration prompt to implement retry logic and human approval conditions."],["E","Use AWS Lambda functions that use MCP client libraries to invoke tools. Implement custom retry logic and circuit breaker patterns in Lambda function code."],["F","Use Amazon Bedrock Guardrails to block tool invocations for shipments that exceed the $100,000 threshold until a human approves the shipment through a separate workflow."],["G","Use Amazon API Gateway with AWS Lambda authorizers to validate tool requests and implement rate limiting. Implement custom retry logic with exponential backoff and a circuit breaker that halts retries after three consecutive failures."]]},"ex":{"c":"AgentCore Gateway는 기존 API를 MCP 호환 도구로 변환해 코드 변경 없이 새 통합을 추가할 수 있게 합니다(A). Step Functions Task 상태로 각 추론 단계를 오케스트레이션하고, Retry 구성의 지수 백오프와 MaxAttempts 3으로 재시도를 결정론적으로 제한합니다(B). Choice 상태로 10만 달러가 넘는 배송을 사람 승인 워크플로로 분기합니다(C).","w":{"D":"프롬프트로 구현한 재시도와 승인 조건은 결정론적으로 강제되지 않습니다.","E":"MCP 클라이언트와 재시도 로직을 직접 구현해야 합니다.","F":"Guardrails는 금액 기준으로 도구 호출을 차단하는 기능이 아닙니다.","G":"API Gateway와 권한 부여자는 재시도 정책 구현 수단으로 적절하지 않습니다."}}},{"n":125,"a":["B"],"orig":"","ko":{"q":"한 회사가 경영진을 위한 회의 분석 솔루션을 구축하고 있으며, 이 솔루션은 AWS 생성형 AI 서비스를 사용합니다. 솔루션은 녹화된 회의에서 화자별 발언을 추출하고, 발표 슬라이드의 시각 요소를 분석하며, 화자 발언을 관련 시각 맥락과 연결한 검색 가능한 요약을 만들어야 합니다. 매주 200시간의 회의 녹화를 처리해야 하며, 모든 회의 데이터를 AWS 클라우드 내에서 처리해 데이터 프라이버시를 유지해야 합니다. 또한 향후 조회를 위해 원본 데이터를 저장하고 전문(full-text) 검색을 수행할 수 있어야 합니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","Amazon Transcribe 화자 분리(speaker diarization)로 회의 녹화 오디오를 처리해 화자별 녹취록을 만듭니다. 동영상 프레임을 Amazon Rekognition으로 보내 이미지를 분석합니다. AWS Lambda 함수로 Amazon Transcribe와 Amazon Rekognition의 출력을 처리해 검색 가능한 요약을 생성하고 Amazon OpenSearch Service에 저장합니다."],["B","Amazon Bedrock의 Anthropic Claude Sonnet 멀티모달 기능으로 오디오 녹취록과 동영상 프레임을 모두 분석해 회의 녹화를 처리합니다. Amazon Transcribe로 회의 녹화의 화자를 식별하고, 연결된 데이터를 Amazon OpenSearch Service에 저장합니다."],["C","Amazon Bedrock으로 회의 녹화를 처리합니다. Bedrock Data Automation(BDA) 기능으로 오디오 스트림을 추출하고 오디오 스트림에 대한 사용자 지정 출력을 정의합니다. Amazon Transcribe 화자 분리로 녹화를 전사하고 화자를 식별하며, Amazon Rekognition으로 동영상 프레임을 분석합니다. 출력을 Amazon DynamoDB에 저장하고, Amazon Bedrock으로 화자와 시각 요소를 연결한 요약을 생성합니다."],["D","Amazon Transcribe로 회의 녹화에서 화자별 발언을 추출합니다. Amazon Bedrock의 Anthropic Claude Sonnet으로 녹취록과 동영상 프레임을 처리합니다. 동기화된 결과를 Amazon DynamoDB에 저장하고, 빠른 조회를 위한 사용자 지정 인덱싱 체계를 사용합니다."]]},"en":{"q":"A company is building a meeting analysis solution for its executive team. The solution uses AWS generative AI services. The solution must extract speaker-attributed content from recorded meetings, analyze visual elements from presentation slides, and create searchable summaries that link speaker comments to relevant visual context. The solution must process 200 hours of meeting recordings each week. The solution must maintain data privacy by processing all meeting data within the AWS Cloud. The solution must store the source data for future retrieval and must be able to perform full-text searches.\nWhich solution will meet these requirements with the LEAST operational overhead?","o":[["A","Use Amazon Transcribe speaker diarization to process audio from the meeting recordings and to create speaker-attributed transcripts. Send video frames to Amazon Rekognition to perform image analysis. Use an AWS Lambda function to process outputs from Amazon Transcribe and Amazon Rekognition to generate searchable summaries that are stored in Amazon OpenSearch Service."],["B","Use Anthropic Claude Sonnet in Amazon Bedrock to process the meeting recordings by using multimodal capabilities to analyze both audio transcripts and video frames. Use Amazon Transcribe to identify speakers in meeting recordings. Store the linked data in Amazon OpenSearch Service."],["C","Use Amazon Bedrock to process meeting recordings. Use the Bedrock Data Automation (BDA) feature to extract audio streams. Define a custom output for the audio stream. Use Amazon Transcribe speaker diarization to transcribe recordings and identify speakers. Use Amazon Rekognition to analyze video frames. Store the output in Amazon DynamoDB. Use Amazon Bedrock to generate summaries that link speakers to visual elements."],["D","Use Amazon Transcribe to extract speaker-attributed content from meeting recordings. Use Anthropic Claude Sonnet in Amazon Bedrock to process the transcripts and video frames. Store the synchronized results in Amazon DynamoDB. Use a custom indexing scheme to enable rapid retrieval."]]},"ex":{"c":"Claude Sonnet의 멀티모달 기능으로 전사 내용과 동영상 프레임(슬라이드)을 함께 분석해 발언과 시각 맥락을 연결하고, Transcribe로 화자를 식별합니다. 결과를 OpenSearch Service에 저장하면 전문 검색이 가능합니다. 관리형 서비스 위주라 오버헤드가 가장 적습니다.","w":{"A":"Rekognition은 슬라이드 내용을 이해하지 못하고, Lambda로 결과를 연결하는 로직을 직접 구현해야 합니다.","C":"서비스를 과도하게 조합해 복잡하고, DynamoDB는 전문 검색을 지원하지 않습니다.","D":"DynamoDB와 사용자 지정 인덱싱으로는 전문 검색이 어렵습니다."}}},{"n":126,"a":["B"],"orig":"","ko":{"q":"한 회사가 교차 리전 추론과 프로비저닝된 처리량을 지원하는 FM을 사용하는 AI 애플리케이션을 Amazon Bedrock으로 개발하고 있습니다. 애플리케이션은 유럽과 북미 사용자에게 일관되게 짧은 지연 시간으로 서비스해야 하며, 유럽 사용자 데이터가 유럽 AWS 리전 내에 머물러야 한다는 데이터 상주 규정을 준수해야 합니다. 테스트 중 리전 트래픽이 급증해 서비스 할당량에 도달하면 서비스 성능이 저하됩니다. 회사는 애플리케이션 복원력을 유지하고 운영 복잡성을 최소화하는 솔루션이 필요합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","북미와 유럽 리전에 별도의 Amazon Bedrock 인스턴스를 배포합니다. 사용자 위치에 따라 트래픽을 보내는 사용자 지정 라우팅 계층을 사용합니다. Amazon CloudWatch 경보로 리전별 서비스 사용량을 모니터링하고, 사용량이 지정 임계값에 근접하면 Amazon SNS로 이메일 알림을 보냅니다."],["B","애플리케이션이 InvokeModel API를 호출할 때 프로필 ID에 지역(geographic) 코드를 지정해 Amazon Bedrock 교차 리전 추론 프로필을 사용합니다. 유럽과 북미 사용자를 적절한 리전 엔드포인트로 보내는 별도의 Amazon API Gateway HTTP API를 구성합니다."],["C","스로틀링을 처리하는 재시도 로직을 구현한 다중 리전 Amazon API Gateway HTTP API와 AWS Lambda 함수를 배포합니다. 기본 리전에서 서비스 할당량에 도달하면 Lambda 함수가 가장 가까운 보조 리전의 FM을 호출하도록 구성하고, 지능형 라우팅으로 데이터 상주 요구 사항 준수를 보장합니다."],["D","여러 리전에 Amazon Bedrock 프로비저닝된 처리량을 구성합니다. 스로틀링이 발생하면 리전을 전환하는 장애 조치 로직을 애플리케이션 코드에 구현하고, AWS Global Accelerator로 사용자 위치에 따라 적절한 엔드포인트로 트래픽을 라우팅합니다."]]},"en":{"q":"A company is using Amazon Bedrock to develop an AI-powered application that uses a foundation model (FM) that supports cross-Region inference and provisioned throughput. The application must serve users in Europe and North America with consistently low latency. The application must comply with data residency regulations that require European user data to remain within Europe-based AWS Regions. During testing, the application experiences service degradation when Regional traffic spikes reach service quotas. The company needs a solution that maintains application resilience and minimizes operational complexity.\nWhich solution will meet these requirements?","o":[["A","Deploy separate Amazon Bedrock instances in North American and European Regions. Use a custom routing layer that directs traffic based on user location. Configure Amazon CloudWatch alarms to monitor Regional service usage. Use Amazon SNS to send email alerts when usage approaches thresholds."],["B","Use Amazon Bedrock cross-Region inference profiles by specifying geographical codes in profile IDs when calling the InvokeModel API. Configure separate Amazon API Gateway HTTP APIs to direct European and North American users to the appropriate Regional endpoints."],["C","Deploy a multi-Region Amazon API Gateway HTTP API and AWS Lambda functions that implement retry logic to handle throttling. Configure the Lambda functions to call the FM in the nearest secondary Region when quotas are reached."],["D","Configure provisioned throughput for Amazon Bedrock in multiple Regions. Implement failover logic in application code to switch Regions when throttling occurs. Use AWS Global Accelerator to route traffic based on user location."]]},"ex":{"c":"54번과 같은 문제입니다. 지리적 접두사가 있는 교차 리전 추론 프로필로 지역 안에서 트래픽을 자동 분산해 할당량 문제를 완화하고 데이터 상주를 지키며, 지역별 API로 사용자를 나눕니다.","w":{"A":"사용자 지정 라우팅과 알림으로는 복원력이 생기지 않습니다.","C":"재시도·장애 조치 로직을 직접 구현해야 하고 데이터 상주 위반 위험이 있습니다.","D":"다중 리전 프로비저닝은 비용과 장애 조치 관리 부담이 큽니다."}}},{"n":127,"a":["B"],"orig":"","ko":{"q":"한 야생동물 보호 기관이 전 세계에서 동물원을 운영합니다. 이 기관은 다양한 센서, 추적기, 시청각 녹화 장비로 동물 행동을 모니터링합니다. 기관은 동물 행동 연구를 위해 멀티모달 데이터를 수집할 수 있는 GenAI 어시스턴트를 출시하려고 합니다. GenAI 어시스턴트는 자연어 쿼리를 지원하고, 추측성 행동 해석을 피하며, 연구 윤리 감사를 위한 감사 로그를 유지해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","원본 동영상을 Amazon Rekognition에 수집해 동물의 자세와 표정을 감지합니다. Amazon Data Firehose로 센서와 GPS 데이터를 Amazon S3로 스트리밍합니다. AWS Systems Manager Parameter Store에 저장한 기본 템플릿으로 Amazon Bedrock FM에 프롬프트를 보냅니다. IAM으로 액세스를 제어하고, AWS CloudTrail로 감사 로그를 남깁니다."],["B","Amazon SageMaker Processing과 Amazon Transcribe로 멀티모달 데이터를 전처리합니다. 정제된 요약을 Amazon Bedrock Knowledge Bases에 수집하고, Amazon Bedrock 가드레일로 추측성 출력을 제한합니다. AWS AppConfig로 프롬프트 템플릿을 관리하고, AWS CloudTrail로 감사를 위한 연구 활동을 기록합니다."],["C","Amazon OpenSearch Serverless로 행동 로그와 원격 측정 데이터를 인덱싱합니다. Amazon Comprehend로 엔터티를 추출하고, Amazon Bedrock으로 인덱싱된 데이터에 대한 질문에 답합니다. 액세스 제어에는 IAM을, 감사 로그에는 CloudTrail을 사용합니다."],["D","Amazon Q Business가 Amazon S3, Amazon Kinesis, Amazon SageMaker Feature Store 전반의 데이터를 연합하도록 구성합니다. EventBridge로 수집 오케스트레이션을 하고, 사용자 지정 AWS Lambda 함수로 LLM 출력의 윤리 준수 여부를 필터링합니다."]]},"en":{"q":"A wildlife conservation agency operates zoos globally. The agency uses various sensors, trackers, and audiovisual recorders to monitor animal behavior. The agency wants to launch a generative AI (GenAI) assistant that can ingest multimodal data to study animal behavior. The GenAI assistant must support natural language queries, avoid speculative behavioral interpretations, and maintain audit logs for ethical research audits.\nWhich solution will meet these requirements?","o":[["A","Ingest raw videos into Amazon Rekognition to detect animal postures and expressions. Use Amazon Data Firehose to stream sensor and GPS data into Amazon S3. Prompt an Amazon Bedrock FM using basic templates stored in AWS Systems Manager Parameter Store. Use IAM for access control. Use AWS CloudTrail for audit logging."],["B","Use Amazon SageMaker Processing and Amazon Transcribe to pre-process multimodal data. Ingest curated summaries into an Amazon Bedrock Knowledge Bases. Apply Amazon Bedrock guardrails to restrict speculative outputs. Use AWS AppConfig to manage prompt templates. Use AWS CloudTrail to log research activity for audits."],["C","Use Amazon OpenSearch Serverless to index behavioral logs and telemetry. Use Amazon Comprehend to extract entities. Use Amazon Bedrock to answer questions over indexed data. Use IAM for access control and CloudTrail for audit logging."],["D","Configure Amazon O Business to federate data across Amazon S3, Amazon Kinesis, and Amazon SageMaker Feature Store. Use EventBridge for ingestion orchestration. Use custom AWS Lambda functions to filter LLM outputs for ethical compliance."]]},"ex":{"c":"SageMaker Processing과 Transcribe로 센서·영상·음성 데이터를 전처리해 정제된 요약을 만들고 지식 기반에 넣어 자연어 질의에 답합니다. Guardrails로 추측성 해석을 제한하고(근거성 검사·거부 주제), AppConfig로 프롬프트 템플릿을 관리하며, CloudTrail로 연구 활동을 감사합니다.","w":{"A":"추측성 출력을 막는 통제가 없습니다.","C":"추측성 해석을 제한하는 통제가 없고 멀티모달 전처리도 부족합니다.","D":"사용자 지정 Lambda 필터는 관리형 통제보다 신뢰성과 유지 관리 면에서 불리합니다."}}},{"n":128,"a":["A","C"],"orig":"","ko":{"q":"한 금융 서비스 회사가 Amazon Bedrock으로 여러 사업부에 GenAI 애플리케이션을 배포하고 있습니다. 회사는 애플리케이션의 FM에 사용하는 모든 프롬프트가 규제 준수 기준을 따르고 일관된 형식을 유지하도록 해야 합니다. 프롬프트 템플릿의 버전 관리를 제공하고, 새 프롬프트에 대한 승인 워크플로를 요구하며, 모든 프롬프트 사용과 수정에 대한 상세 감사 추적을 유지하는 솔루션을 구현해야 합니다.\n이 요구 사항을 충족하는 솔루션 조합은 무엇입니까? (2개 선택)","o":[["A","Amazon Bedrock Prompt Management로 파라미터화된 프롬프트 템플릿을 만들고 버전 관리를 활성화합니다. 새 프롬프트를 프로덕션 환경에 배포하기 전에 회사의 규제 준수 팀 승인을 요구하는 승인 워크플로를 구성합니다."],["B","모든 프롬프트 템플릿을 Amazon S3 버킷에 저장하고 버킷 버전 관리를 활성화합니다. AWS Lambda 함수와 Amazon SNS로 규제 준수 검토자에게 이메일 승인 요청을 보냅니다."],["C","AWS CloudTrail로 모든 Amazon Bedrock API 호출과 프롬프트 상호 작용을 기록하도록 구성합니다. Amazon CloudWatch Logs로 상세한 액세스 패턴과 프롬프트 사용 지표를 수집해 규정 준수 보고서를 생성합니다."],["D","AWS Systems Manager Parameter Store에서 프롬프트 템플릿을 보안 문자열로 관리합니다. AWS Step Functions로 자동 롤백 기능이 있는 다단계 승인 워크플로를 오케스트레이션합니다."],["E","Amazon API Gateway와 AWS WAF 규칙으로 프롬프트 요청을 필터링합니다. Amazon DynamoDB에 모든 프롬프트 템플릿 수정에 대한 승인 상태와 감사 정보를 저장합니다."]]},"en":{"q":"A financial services company is using Amazon Bedrock to deploy a GenAI application across multiple business units. The company must ensure that all prompts that are used with the application ' s FMs follow regulatory compliance standards and maintain consistent formatting. The company must implement a solution that provides version control for prompt templates, requires approval workflows for new prompts, and maintains detailed audit trails of all prompt usage and modifications.\nWhich combination of solutions will meet these requirements? (Select TWO.)","o":[["A","Use Amazon Bedrock Prompt Management to create parameterized prompt templates and enable version control. Configure approval workflows that require approvals from the company ' s regulatory compliance team before deploying new prompts to production environments."],["B","Store all prompt templates in Amazon S3 buckets. Enable versioning on the buckets. Use AWS Lambda functions and Amazon SNS to send approval requests to regulatory compliance reviewers through email notifications."],["C","Configure AWS CloudTrail to log all Amazon Bedrock API calls and prompt interactions. Use Amazon CloudWatch Logs to capture detailed access patterns and prompt usage metrics to generate compliance reports."],["D","Use AWS Systems Manager Parameter Store to manage prompt templates as secure strings. Use AWS Step Functions to orchestrate a multi-stage approval workflow that has automatic rollback capabilities."],["E","Use Amazon API Gateway and AWS WAF rules to filter prompt requests. Use Amazon DynamoDB to store approval status and audit information for all prompt template modifications."]]},"ex":{"c":"Prompt Management로 파라미터화 템플릿과 버전 관리를 제공하고, 규정 준수 팀 승인 후 운영에 배포하는 승인 워크플로를 구성합니다(A). CloudTrail로 Bedrock API 호출과 프롬프트 변경을, CloudWatch Logs로 프롬프트 사용 패턴을 기록해 감사와 규정 준수 보고에 활용합니다(C).","w":{"B":"S3와 이메일 승인은 프롬프트 형식 일관성을 보장하지 않고 직접 구현해야 합니다.","D":"Parameter Store는 프롬프트 템플릿 관리 도구가 아닙니다.","E":"WAF는 프롬프트 규정 준수를 판단하지 못하고, DynamoDB 감사 기록은 직접 구현해야 합니다."}}},{"n":129,"a":["D"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock Knowledge Bases로 규제 준수 질의를 수행하는 RAG 애플리케이션을 운영합니다. 애플리케이션은 RetrieveAndGenerateStream API를 사용하며, 50,000건 이상의 규제 문서, 판례, 정책 업데이트가 담긴 지식 기반에서 관련 문서를 검색합니다. 초기 검색이 의미적으로는 비슷하지만 맥락상 관련 없는 문서를 자주 반환해 응답 품질이 낮고, 이로 인해 모델 환각과 잘못된 규제 안내가 발생하고 있습니다. 회사는 더 관련성 높은 문서를 반환하도록 RAG 애플리케이션의 성능을 개선해야 합니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","미세 조정된 순위 모델을 실행하는 Amazon SageMaker 엔드포인트를 배포합니다. Amazon API Gateway REST API로 요청을 라우팅하고, 애플리케이션이 REST API를 통해 결과를 리랭킹하도록 구성합니다."],["B","Amazon Comprehend로 문서를 분류하고 관련성 점수를 적용합니다. RAG 애플리케이션의 리랭킹 프로세스를 Amazon Textract와 통합해 문서 분석을 수행하고, Amazon Neptune으로 그래프 기반 관련성을 계산합니다."],["C","Amazon Bedrock Knowledge Bases Retrieve API로 초기 문서 검색을 수행하는 검색 파이프라인을 구현합니다. Amazon Bedrock Rerank API로 결과를 리랭킹하고, InvokeModelWithResponseStream 작업으로 응답을 생성합니다."],["D","Amazon Bedrock Knowledge Bases의 리랭킹 구성으로 최신 Amazon 리랭커 모델을 사용합니다. 이 모델로 문서 관련성 점수를 개선하고, 맥락 평가에 따라 결과를 재정렬합니다."]]},"en":{"q":"A company runs a Retrieval Augmented Generation (RAG) application that uses Amazon Bedrock Knowledge Bases to perform regulatory compliance queries. The application uses the RetrieveAndGenerateStream API. The application retrieves relevant documents from a knowledge base that contains more than 50,000 regulatory documents, legal precedents, and policy updates. The RAG application is producing suboptimal responses because the initial retrieval often returns semantically similar but contextually irrelevant documents. The poor responses are causing model hallucinations and incorrect regulatory guidance. The company needs to improve the performance of the RAG application so it returns more relevant documents.\nWhich solution will meet this requirement with the LEAST operational overhead?","o":[["A","Deploy an Amazon SageMaker endpoint to run a fine-tuned ranking model. Use an Amazon API Gateway REST API to route requests. Configure the application to make requests through the REST API to rerank the results."],["B","Use Amazon Comprehend to classify documents and apply relevance scores. Integrate the RAG application's reranking process with Amazon Textract to run document analysis. Use Amazon Neptune to perform graph-based relevance calculations."],["C","Implement a retrieval pipeline that uses the Amazon Bedrock Knowledge Bases Retrieve API to perform initial document retrieval. Call the Amazon Bedrock Rerank API to rerank the results. Invoke the InvokeModelWithResponseStream operation to generate responses."],["D","Use the latest Amazon reranker model through the reranking configuration within Amazon Bedrock Knowledge Bases. Use the model to improve document relevance scoring and to reorder results based on contextual assessments."]]},"ex":{"c":"Bedrock Knowledge Bases는 검색 구성에 재순위화(reranking) 모델 설정을 기본 제공합니다. 재순위화 모델이 초기 검색 결과를 맥락 관련성으로 다시 평가해 순서를 바꾸므로, 기존 RetrieveAndGenerateStream 흐름을 유지하면서 관련 문서 품질이 높아집니다.","w":{"A":"SageMaker 순위 모델과 API를 직접 운영해야 해 오버헤드가 큽니다.","B":"Comprehend·Textract·Neptune 조합은 재순위화 도구가 아니며 매우 복잡합니다.","C":"동작은 하지만 검색·재순위화·생성 파이프라인을 직접 구성해야 해 D보다 오버헤드가 큽니다."}}},{"n":130,"a":["B"],"orig":"","ko":{"q":"한 회사가 고객 서비스 애플리케이션을 지원하는 3개의 전문 NLP 모델을 개발하고 있습니다. 하나는 고객의 구체적인 문제를 분류하고, 하나는 고객 상호 작용에서 핵심 정보를 추출하며, 나머지 하나는 응답을 생성합니다. 애플리케이션은 모든 작업에서 최소 95% 정확도를 달성해야 하고, 매일 2시간의 피크 시간 동안 최대 500건의 동시 요청을 500ms 미만으로 처리해야 합니다. 또한 사용량 급증 사이의 저수요 기간에는 리소스 사용을 최적화해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","세 모델을 모두 하나의 Amazon SageMaker AI 다중 모델 엔드포인트에 배포합니다. 엔드포인트에서 동적 확장을 활성화하고 컴퓨팅 최적화 인스턴스 유형을 사용하며, 호출 지표 기반 자동 확장 정책으로 피크 부하를 처리합니다."],["B","각 모델을 별도의 Amazon SageMaker Serverless Inference 엔드포인트에 배포합니다. 피크 부하를 처리하도록 프로비저닝된 동시성을 설정하고, 각 모델의 요구 사항에 맞게 최대 동시성 한도와 메모리 크기를 구성합니다."],["C","피크 부하를 처리하기 위해 프로비저닝된 처리량과 함께 Amazon Bedrock으로 모델을 배포합니다. 예상 토큰 처리량에 따라 모델 유닛(MU) 수를 구성하고, 모델별로 요청 배칭을 구현합니다."],["D","각 모델을 별도의 Amazon SageMaker AI 엔드포인트에 배포하고 비동기 추론 구성을 사용합니다. 모델 요청과 응답을 Amazon S3에 저장하고, 처리가 끝나면 Amazon SNS로 사용자에게 알림을 보냅니다."]]},"en":{"q":"A company is developing three specialized NLP models that support a customer service application. One model categorizes each customer's specific issue. Another model extracts key information from the customer interactions. The third model generates responses. The company must ensure that the application achieves at least 95% accuracy for all tasks. The application must handle up to 500 concurrent requests and respond in less than 500 ms during daily 2-hour peak usage periods. The company must ensure that the application optimizes resource usage during periods of low demand between usage spikes.\nWhich solution will meet these requirements?","o":[["A","Deploy all three models to a single Amazon SageMaker AI multi-model endpoint. Enable dynamic scaling on the endpoint. Use a compute optimized instance type. Configure auto scaling policies that are based on invocation metrics to handle peak loads."],["B","Deploy each model to a separate Amazon SageMaker Serverless Inference endpoint. Set provisioned concurrency to handle peak loads. Configure maximum concurrency limits and memory sizing based on each model ' s specific requirements."],["C","Deploy the models by using Amazon Bedrock with provisioned throughput to handle peak loads. Configure the number of model units (MUs) based on expected token throughput needs. Implement request batching for each model."],["D","Deploy each model to a separate Amazon SageMaker AI endpoint. Use an asynchronous inference configuration. Store model requests and responses in Amazon S3. Use Amazon SNS to send alerts to users when the application finishes processing
