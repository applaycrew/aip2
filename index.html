requests."]]},"ex":{"c":"98번과 같은 문제입니다. 모델별 SageMaker 서버리스 추론 엔드포인트로 저수요 시 비용을 최소화하고, 프로비저닝된 동시성으로 피크 시 콜드 스타트 없이 500ms 미만 응답을 보장합니다.","w":{"A":"다중 모델 엔드포인트는 로딩 지연이 있고 유휴 비용이 듭니다.","C":"자체 NLP 모델에 Bedrock 프로비저닝 처리량은 적합하지 않습니다.","D":"비동기 추론은 실시간 요구에 맞지 않습니다."}}},{"n":131,"a":["C"],"orig":"","ko":{"q":"한 금융 서비스 회사가 프리미엄 고객과 일반 고객을 모두 지원하는 GenAI 애플리케이션을 개발하고 있습니다. 애플리케이션은 Amazon API Gateway REST API 뒤의 AWS Lambda 함수로 요청을 처리합니다. 회사는 사용자가 속한 고객 등급에 따라 AI 모델을 동적으로 전환해야 하며, 코드를 재배포하지 않고 새 기능의 A/B 테스트를 수행하려고 합니다. 또한 변경 사항을 적용하기 전에 temperature, 최대 토큰 한도 같은 모델 파라미터를 검증해야 합니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","구성마다 AWS Systems Manager Parameter Store 파라미터를 만듭니다. Lambda 함수가 파라미터 업데이트를 폴링하도록 하고, 구성이 바뀌면 Amazon EventBridge 이벤트로 재배포를 트리거합니다."],["B","모델 구성을 Amazon DynamoDB 테이블에 저장합니다. 고객 등급에 따라 구성을 가져오도록 액세스 패턴을 최적화하고, Lambda 함수가 각 요청 시작 시 DynamoDB를 조회해 사용할 모델을 결정하도록 구성합니다."],["C","AWS AppConfig로 모델 구성을 관리합니다. 기능 플래그로 A/B 테스트를 수행하고, 모델 파라미터에 대한 JSON 스키마 검증 규칙을 정의합니다. Lambda 함수가 AWS AppConfig Agent로 구성을 가져오도록 구성합니다."],["D","모델 구성을 저장하는 Amazon ElastiCache(Redis OSS) 클러스터를 만들고 짧은 TTL 값을 설정합니다. Lambda 함수에서 사용자 지정 검증 로직을 실행하고, Amazon CloudWatch 지표로 구성 사용을 모니터링합니다."]]},"en":{"q":"A financial services company is developing a generative AI (GenAI) application that serves both premium customers and standard customers. The application uses AWS Lambda functions behind an Amazon API Gateway REST API to process requests. The company needs to dynamically switch between AI models based on which customer tier each user belongs to. The company also wants to perform A/B testing for new features without redeploying code. The company needs to validate model parameters like temperature and maximum token limits before applying changes.\nWhich solution will meet these requirements with the LEAST operational overhead?","o":[["A","Create AWS Systems Manager Parameter Store parameters for each configuration. Use Lambda functions to poll for parameter updates. Use Amazon EventBridge events to trigger redeployments when configurations change."],["B","Store model configurations in Amazon DynamoDB tables. Optimize access patterns to retrieve configurations according to customer tier. Configure Lambda functions to query DynamoDB at the beginning of each request to determine which model to use."],["C","Use AWS AppConfig to manage model configurations. Use feature flags to perform A/B testing. Define JSON schema validation rules for model parameters. Configure Lambda functions to retrieve configurations by using the AWS AppConfig Agent."],["D","Create an Amazon ElastiCache (Redis OSS) cluster to store model configurations. Set short TTL values. Run custom validation logic in Lambda functions. Use Amazon CloudWatch metrics to monitor configuration usage."]]},"ex":{"c":"AppConfig로 고객 등급별 모델 구성을 관리하고, 기능 플래그로 재배포 없이 A/B 테스트를 하며, JSON 스키마 검증기로 temperature·최대 토큰 같은 파라미터를 적용 전에 검증합니다. Lambda는 AppConfig Agent로 구성을 캐시해 가져와 오버헤드가 적습니다.","w":{"A":"폴링과 재배포 트리거는 '재배포 없이' 요구에 어긋나고 검증 기능이 없습니다.","B":"DynamoDB에는 구성 검증, 기능 플래그, 안전한 배포 기능이 없습니다.","D":"ElastiCache와 사용자 지정 검증 로직은 직접 구축·운영해야 합니다."}}},{"n":132,"a":["C"],"orig":"","ko":{"q":"한 전자상거래 회사가 Anthropic Claude와 Amazon Bedrock을 사용해 고객에게 상품을 추천하는 GenAI 솔루션을 개발하고 있습니다. 고객들은 일부 추천 상품이 판매되지 않거나 관련이 없다고 보고하며, 일부 추천은 응답 시간이 길다고 보고합니다. 회사는 대부분의 고객 상호 작용이 고유하며, 솔루션이 상품 카탈로그에 없는 상품을 추천한다는 것을 확인했습니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock Guardrails에서 근거성(grounding)을 높이고 자동 추론(automated reasoning) 검사를 활성화합니다. 프로비저닝된 처리량을 설정합니다."],["B","프롬프트 엔지니어링으로 모델 응답을 관련 상품으로 제한합니다. 스트리밍 추론으로 체감 지연 시간을 줄입니다."],["C","Amazon Bedrock Knowledge Bases를 만들고 RAG를 구현합니다. PerformanceConfigLatency 파라미터를 optimized로 설정합니다."],["D","상품 카탈로그 데이터를 Amazon OpenSearch Service에 저장합니다. 모델의 추천을 카탈로그와 대조해 검증하고, Amazon DynamoDB로 응답을 캐싱합니다."]]},"en":{"q":"An ecommerce company is developing a generative AI (GenAI) solution that uses Amazon Bedrock with Anthropic Claude to recommend products to customers. Customers report that some recommended products are not available for sale or are not relevant. Customers also report long response times for some recommendations. The company confirms that most customer interactions are unique and that the solution recommends products not present in the product catalog.\nWhich solution will meet this requirement?","o":[["A","Increase grounding within Amazon Bedrock Guardrails. Enable automated reasoning checks. Set up provisioned throughput."],["B","Use prompt engineering to restrict model responses to relevant products. Use streaming inference to reduce perceived latency."],["C","Create an Amazon Bedrock Knowledge Bases and implement Retrieval Augmented Generation (RAG). Set the PerformanceConfigLatency parameter to optimized."],["D","Store product catalog data in Amazon OpenSearch Service. Validate model recommendations against the catalog. Use Amazon DynamoDB for response caching."]]},"ex":{"c":"카탈로그에 없는 상품을 추천하는 것은 모델이 근거 없이 생성하기 때문입니다. 상품 카탈로그로 지식 기반을 만들어 RAG로 응답을 실제 상품에 근거하게 하고, 지연 시간 최적화 추론(performanceConfig latency=optimized)으로 응답 시간을 줄입니다. 상호 작용이 대부분 고유해 캐싱은 효과가 적습니다.","w":{"A":"근거성 검사는 참조 소스가 있어야 하며, 카탈로그 데이터를 제공하지 않으면 해결되지 않습니다.","B":"프롬프트만으로는 모델이 카탈로그를 알 수 없고, 스트리밍은 체감 지연만 줄입니다.","D":"사후 검증은 잘못된 추천을 걸러낼 뿐이고, 고유한 상호 작용이 많아 캐싱 효과가 없습니다."}}},{"n":133,"a":["A"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock FM을 사용하는 GenAI 애플리케이션을 만들고 있습니다. 애플리케이션은 Microsoft Entra ID로 인증해야 하며, 모든 FM API 호출은 프라이빗 네트워크 경로를 유지해야 합니다. 애플리케이션 액세스는 부서별로 특정 모델 계열로 제한되어야 하고, 회사는 모델 상호 작용에 대한 포괄적인 감사 추적이 필요합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Microsoft Entra ID와 AWS IAM 간 SAML 페더레이션을 구성합니다. 필요한 ModelId 값만 허용하는 부서별 IAM 역할을 만듭니다. Amazon Bedrock 런타임 서비스용 AWS PrivateLink 인터페이스 VPC 엔드포인트를 만듭니다. AWS CloudTrail로 Amazon Bedrock API 호출을 수집하고, Amazon Bedrock 모델 호출 로깅으로 상세한 모델 상호 작용을 기록합니다."],["B","IAM에서 Microsoft Entra ID로 인증하는 자격 증명 공급자(IdP) 연결을 만듭니다. 부서별 권한 세트를 할당해 특정 모델 계열에 대한 액세스를 제어합니다. Amazon Bedrock 퍼블릭 엔드포인트로 나가는 NAT 게이트웨이가 있는 프라이빗 서브넷에 AWS Lambda 함수를 배포합니다. 감사를 위해 CloudWatch Logs로 모델 상호 작용을 수집합니다."],["C","IAM에서 Microsoft Entra ID로 인증하는 SAML IdP를 만듭니다. IAM 권한 경계로 부서 역할의 액세스를 특정 모델 계열로 제한합니다. 프라이빗 네트워크 연결을 유지하도록 VPC 라우팅으로 퍼블릭 Amazon Bedrock API 엔드포인트를 구성합니다. Amazon S3 수명 주기 규칙이 있는 CloudTrail로 모델 상호 작용 감사 로그를 관리합니다."],["D","Microsoft Entra ID와 IAM 간 OIDC(OpenID Connect) 페더레이션을 구성합니다. 속성 기반 액세스 제어로 부서 속성을 특정 모델 액세스 권한에 매핑합니다. SCP로 부서별 Amazon Bedrock FM 계열 액세스를 제한하고, Microsoft Entra ID의 기본 로깅 기능으로 모델 상호 작용의 감사 추적을 유지합니다."]]},"en":{"q":"A company is creating a generative AI (GenAI) application that uses Amazon Bedrock foundation models (FMs). The application must use Microsoft Entra ID to authenticate. All FM API calls must stay on private network paths. Access to the application must be limited by department to specific model families. The company also needs a comprehensive audit trail of model interactions.\nWhich solution will meet these requirements?","o":[["A","Configure SAML federation between Microsoft Entra ID and AWS Identity and Access Management. Create department-specific IAM roles that allow only the required ModelId values. Create AWS PrivateLink interface VPC endpoints for Amazon Bedrock runtime services. Enable AWS CloudTrail to capture Amazon Bedrock API calls. Configure Amazon Bedrock model invocation logging to record detailed model interactions."],["B","Create an identity provider (IdP) connection in IAM to authenticate by using Microsoft Entra ID. Assign department permission sets to control access to specific model families. Deploy AWS Lambda functions in private subnets with a NAT gateway for egress to Amazon Bedrock public endpoints. Enable CloudWatch Logs to capture model interactions for auditing purposes."],["C","Create a SAML identity provider (IdP) in IAM to authenticate by using Microsoft Entra ID. Use IAM permissions boundaries to limit department roles ' access to specific model families. Configure public Amazon Bedrock API endpoints with VPC routing to maintain private network connectivity. Set up CloudTrail with Amazon S3 Lifecycle rules to manage audit logs of model interactions."],["D","Configure OpenID Connect (OIDC) federation between Microsoft Entra ID and IAM. Use attributebased access control to map department attributes to specific model access permissions. Apply SCP policies to restrict access to Amazon Bedrock FM families based on department. Use Microsoft Entra ID ' s built-in logging capabilities to maintain an audit trail of model interactions."]]},"ex":{"c":"Entra ID와 IAM 간 SAML 연동으로 인증하고, 부서별 IAM 역할에서 허용된 ModelId만 호출하도록 제한합니다. PrivateLink 인터페이스 VPC 엔드포인트로 Bedrock 런타임 호출을 비공개 경로에 두고, CloudTrail과 모델 호출 로깅으로 포괄적 감사 추적을 남깁니다.","w":{"B":"NAT 게이트웨이로 공용 엔드포인트에 접근하면 비공개 경로 요구에 어긋납니다.","C":"'공용 엔드포인트와 VPC 라우팅'으로는 비공개 연결이 되지 않고, CloudTrail에는 모델 상호 작용 내용이 없습니다.","D":"SCP는 부서별(주체별) 세밀한 제어용이 아니고, Entra ID 로그에는 모델 상호 작용 기록이 없습니다."}}},{"n":134,"a":["C"],"orig":"","ko":{"q":"한 금융 서비스 회사가 Amazon Bedrock으로 고객 서비스 AI 어시스턴트를 개발하고 있습니다. AI 어시스턴트는 사용자와 투자 조언을 논의해서는 안 되며, 유해 콘텐츠를 차단하고, PII를 마스킹하며, 규정 준수 보고를 위한 감사 추적을 유지해야 합니다. 콘텐츠 민감도에 따라 사용자 입력과 모델 응답 모두에 콘텐츠 필터링을 적용해야 합니다. 회사는 오탐을 최소화하면서 정책을 효과적으로 적용하는 Amazon Bedrock 가드레일 구성이 필요하며, 여러 유형의 민감한 콘텐츠에 대해 다양한 처리 전략을 제공해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","가드레일 하나를 구성하고 모든 범주의 콘텐츠 필터를 높음으로 설정합니다. 투자 조언에 대한 거부 주제를 설정하고 차단할 예시 문구를 포함합니다. 모든 PII 엔터티에 차단 작업을 적용하는 민감 정보 필터를 설정하고, 모든 모델 추론 호출에 가드레일을 적용합니다."],["B","계층형 정책으로 여러 가드레일을 구성합니다. 첫 번째 가드레일은 콘텐츠 필터를 높음으로 하고 공개 상호 작용에서 PII를 차단합니다. 두 번째 가드레일은 콘텐츠 필터를 중간으로 하고 내부 사용 시 PII를 마스킹합니다. 투자 조언을 차단하는 여러 주제별 가드레일을 구성하고 컨텍스트 근거성 검사를 설정합니다."],["C","유해 콘텐츠에 대한 콘텐츠 필터를 중간(medium)으로 설정한 가드레일을 구성합니다. 명확한 정의와 차단할 예시 문구를 포함해 투자 조언에 대한 거부 주제를 설정합니다. 민감 정보 필터로 응답에서는 PII를 마스킹하고 입력에서는 금융 정보를 차단하도록 구성합니다. 감사를 위해 사용자 지정 차단 메시지를 사용하는 입력 및 출력 평가를 모두 활성화합니다."],["D","사용 사례마다 별도의 가드레일을 만듭니다. 유해 콘텐츠 필터, 투자 조언 주제 필터, PII 차단 민감 정보 필터를 각각 다른 가드레일로 만들고, AWS Step Functions로 가드레일을 순차적으로 연결합니다."]]},"en":{"q":"A financial services company is developing a customer service AI assistant by using Amazon Bedrock. The AI assistant must not discuss investment advice with users. The AI assistant must block harmful content, mask personally identifiable information (PII), and maintain audit trails for compliance reporting. The AI assistant must apply content filtering to both user inputs and model responses based on content sensitivity. The company requires an Amazon Bedrock guardrail configuration that will effectively enforce policies with minimal false positives. The solution must provide multiple handling strategies for multiple types of sensitive content.\nWhich solution will meet these requirements?","o":[["A","Configure a single guardrail and set content filters to high for all categories. Set up denied topics for investment advice and include sample phrases to block. Set up sensitive information filters that apply the block action for all PII entities. Apply the guardrail to all model inference calls."],["B","Configure multiple guardrails by using tiered policies. Create one guardrail and set content filters to high. Configure the guardrail to block PII for public interactions. Configure a second guardrail and set content filters to medium. Configure the second guardrail to mask PII for internal use. Configure multiple topic-specific guardrails to block investment advice and set up contextual grounding checks."],["C","Configure a guardrail and set content filters to medium for harmful content. Set up denied topics for investment advice and include clear definitions and sample phrases to block. Configure sensitive information filters to mask PII in responses and to block financial information in inputs. Enable both input and output evaluations that use custom blocked messages for audits."],["D","Create a separate guardrail for each use case. Create one guardrail that applies a harmful content filter.Create a guardrail to apply topic filters for investment advice. Create a guardrail to apply sensitive information filters to block PII. Use AWS Step Functions to chain the guardrails sequentially."]]},"ex":{"c":"콘텐츠 필터를 중간(medium)으로 두면 오탐을 줄이면서 유해 콘텐츠를 차단합니다. 거부 주제에 명확한 정의와 예시 문구를 넣으면 투자 조언을 정확히 걸러내고, 민감 정보 필터는 응답의 PII는 마스킹하고 입력의 금융 정보는 차단하는 식으로 유형별 처리 전략을 다르게 적용합니다. 입력·출력 평가를 모두 켜고 사용자 지정 차단 메시지로 감사에 활용합니다.","w":{"A":"모든 범주를 높음으로 하면 오탐이 많아지고, 모든 PII를 차단만 하면 처리 전략이 하나뿐입니다.","B":"여러 가드레일을 계층화하면 관리가 복잡하고, 입력·출력 평가와 감사 구성이 불명확합니다.","D":"Step Functions로 가드레일을 체인하면 지연과 복잡성이 커지고, 하나의 가드레일에 모든 정책을 둘 수 있습니다."}}},{"n":135,"a":["B"],"orig":"","ko":{"q":"한 회사가 Anthropic Claude FM과 Amazon Bedrock을 사용하는 법률 연구 AI 어시스턴트를 구축하고 있습니다. AI 어시스턴트는 FM 응답을 보강하기 위해 관련성 높은 판례 문서를 검색해야 합니다. 법률 개념 간 의미 관계, 특정 법률 용어, 인용을 식별해야 하며, 빠르게 동작하고 정확한 결과를 반환해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock 지식 기반이 기본 벡터 검색 구성을 사용하도록 구성합니다. Amazon Bedrock으로 쿼리를 확장해 특정 용어와 인용 기반 법률 문서 검색을 개선합니다."],["B","Amazon OpenSearch Service로 벡터 검색과 키워드 검색을 결합한 하이브리드 검색 아키텍처를 배포합니다. Amazon Bedrock 리랭커 모델로 결과 관련성을 최적화합니다."],["C","최종 사용자를 위해 Amazon Kendra 쿼리 제안 기능을 활성화합니다. Amazon Bedrock으로 검색 결과를 후처리해 문서의 의미 유사도를 식별하고 정확한 결과를 생성합니다."],["D","벡터 검색이 있는 Amazon OpenSearch Service와 Amazon Bedrock Titan Embeddings로 법률 문서를 인덱싱·검색합니다. 사용자 지정 AWS Lambda 함수로 Amazon RDS 데이터베이스에 저장된 키워드 기반 필터와 결과를 병합합니다."]]},"en":{"q":"A company is building a legal research AI assistant that uses Amazon Bedrock with an Anthropic Claude foundation model (FM). The AI assistant must retrieve highly relevant case law documents to augment the FM's responses. The AI assistant must identify semantic relationships between legal concepts, specific legal terminology, and citations. The AI assistant must perform quickly and return precise results.\nWhich solution will meet these requirements?","o":[["A","Configure an Amazon Bedrock knowledge base to use a default vector search configuration. Use Amazon Bedrock to expand queries to improve retrieval for legal documents based on specific terminology and citations."],["B","Use Amazon OpenSearch Service to deploy a hybrid search architecture that combines vector search with keyword search. Apply an Amazon Bedrock reranker model to optimize result relevance."],["C","Enable the Amazon Kendra query suggestion feature for end users. Use Amazon Bedrock to perform post-processing of search results to identify semantic similarity in the documents and to produce precise results."],["D","Use Amazon OpenSearch Service with vector search and Amazon Bedrock Titan Embeddings to index and search legal documents. Use custom AWS Lambda functions to merge results with keyword-based filters that are stored in an Amazon RDS database."]]},"ex":{"c":"OpenSearch 하이브리드 검색은 벡터 검색으로 법률 개념 간 의미 관계를, 키워드 검색으로 특정 법률 용어와 인용을 정확히 찾습니다. Bedrock 재순위화 모델로 결과 관련성을 최적화하면 빠르고 정밀한 결과를 얻습니다.","w":{"A":"기본 벡터 검색만으로는 정확한 용어와 인용 매칭이 약합니다.","C":"쿼리 제안 기능과 사후 처리로는 정밀 검색이 되지 않습니다.","D":"Lambda와 RDS로 결과를 직접 병합하면 복잡하고 느립니다."}}},{"n":136,"a":["B"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock으로 사용자에게 의료 정보를 제공하는 RAG 기반 시스템을 구현합니다. 회사는 여러 청킹 전략을 비교하고, 두 FM의 생성 품질을 평가하며, 배포를 위한 품질 임계값을 적용해야 합니다.\n이 요구 사항을 충족하는 Amazon Bedrock 평가 구성은 무엇입니까?","o":[["A","지원되는 버전의 Anthropic Claude Sonnet을 평가자 모델로 사용하는 검색 전용(retrieve-only) 평가 작업을 만듭니다. 컨텍스트 관련성과 컨텍스트 커버리지 지표를 구성하고, 배포 임계값은 별도의 CI/CD 파이프라인에서 정의합니다."],["B","사용자 지정 precision-at-k 지표와 1~5점 척도의 LLM-as-a-judge 지표를 사용하는 검색 및 생성(retrieve-and-generate) 평가 작업을 만듭니다. 각 청킹 전략을 평가 데이터세트에 포함하고, 지원되는 버전의 Anthropic Claude Sonnet으로 두 FM의 응답을 평가합니다."],["C","청킹 전략과 FM 조합마다 별도의 평가 작업을 만듭니다. Amazon Bedrock 기본 제공 정확성(correctness) 및 완전성(completeness) 지표를 사용하고, 배포 승인 전에 점수를 수동 검토합니다."],["D","여러 검색 전용 평가 작업으로 검색 품질을 평가하는 파이프라인을 설정합니다. Amazon Nova Pro를 LLM-as-a-judge 모델로 사용하는 별도의 평가 작업을 두 FM 각각에 대해 만들고, 충실도(faithfulness)와 인용 정밀도 지표로 평가합니다."]]},"en":{"q":"A company uses Amazon Bedrock to implement a Retrieval Augmented Generation (RAG)based system to serve medical information to users. The company needs to compare multiple chunking strategies, evaluate the generation quality of two foundation models (FMs), and enforce quality thresholds for deployment.\nWhich Amazon Bedrock evaluation configuration will meet these requirements?","o":[["A","Create a retrieve-only evaluation job that uses a supported version of Anthropic Claude Sonnet as the evaluator model. Configure metrics for context relevance and context coverage. Define deployment thresholds in a separate CI/CD pipeline."],["B","Create a retrieve-and-generate evaluation job that uses custom precision-at-k metrics and an LLMas-a- judge metric with a scale of 1-5. Include each chunking strategy in the evaluation dataset. Use a supported version of Anthropic Claude Sonnet to evaluate responses from both FMs."],["C","Create a separate evaluation job for each chunking strategy and FM combination. Use Amazon Bedrock built-in metrics for correctness and completeness. Manually review scores before deployment approval."],["D","Set up a pipeline that uses multiple retrieve-only evaluation jobs to assess retrieval quality. Create separate evaluation jobs for both FMs that use Amazon Nova Pro as the LLM-as-a-judge model.Evaluate based on faithfulness and citation precision metrics."]]},"ex":{"c":"검색과 생성을 함께 평가하는 retrieve-and-generate 평가 작업은 청크 전략에 따른 검색 품질(precision@k 등)과 두 FM의 생성 품질(LLM-as-a-judge 1~5점)을 하나의 구성으로 비교할 수 있습니다. Claude Sonnet을 판정 모델로 두 FM의 응답을 평가하고, 점수를 배포 임계값과 비교합니다.","w":{"A":"retrieve-only 평가는 FM의 생성 품질을 평가하지 않습니다.","C":"조합마다 작업을 따로 만들고 수동 검토하면 임계값을 자동으로 강제하지 못합니다.","D":"검색과 생성 평가를 나누면 파이프라인이 불필요하게 복잡해집니다."}}},{"n":137,"a":["C"],"orig":"","ko":{"q":"한 전자상거래 회사가 Anthropic Claude와 Amazon Bedrock으로 고객에게 상품을 추천하는 생성형 AI 애플리케이션을 개발하고 있습니다. 고객들은 일부 추천 상품이 웹사이트에서 판매되지 않거나 고객과 관련이 없다고 보고하며, 일부 추천은 생성에 시간이 오래 걸린다고 보고합니다. 조사 결과 고객과 추천 솔루션 간 상호 작용 대부분이 고유하며, 솔루션이 회사 상품 카탈로그에 없는 상품을 추천한다는 것이 확인되었습니다. 회사는 이 문제를 해결해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock Guardrails에서 근거성을 높이고 Automated Reasoning 검사를 활성화합니다. 프로비저닝된 처리량을 설정합니다."],["B","프롬프트 엔지니어링으로 모델 응답을 관련 상품으로 제한합니다. InvokeModelWithResponseStream 작업 같은 스트리밍 기법으로 고객의 체감 지연 시간을 줄입니다."],["C","Amazon Bedrock 지식 기반을 만들고 RAG를 구현합니다. PerformanceConfigLatency 파라미터를 optimized로 설정합니다."],["D","상품 카탈로그 데이터를 Amazon OpenSearch Service에 저장합니다. 모델의 상품 추천을 카탈로그와 대조해 검증하고, Amazon DynamoDB로 응답 캐싱을 구현합니다."]]},"en":{"q":"An ecommerce company is developing a generative AI application that uses Amazon Bedrock with Anthropic Claude to recommend products to customers. Customers report that some recom mended products are not available for sale on the website or are not relevant to the customer. Customers also report that the solution takes a long time to generate some recommendations. The company investigates the issues and finds that most interactions between customers and the product recommendation solution are unique. The company confirms that the solution recommends products that are not in the company's product catalog. The company must resolve these issues.\nWhich solution will meet this requirement?","o":[["A","Increase grounding within Amazon Bedrock Guardrails. Enable Automated Reasoning checks. Set up provisioned throughput."],["B","Use prompt engineering to restrict the model responses to relevant products. Use streaming techniques such as the InvokeModelWithResponseStream action to reduce perceived latency for the customers."],["C","Create an Amazon Bedrock knowledge base. Implement Retrieval Augmented Generation RAG. Set the PerformanceConfigLatency parameter to optimized."],["D","Store product catalog data in Amazon OpenSearch Service. Validate the model's product recommendations against the product catalog. Use Amazon DynamoDB to implement response caching."]]},"ex":{"c":"132번과 같은 문제입니다. 상품 카탈로그로 지식 기반을 만들어 RAG로 추천을 실제 상품에 근거하게 하고, 지연 시간 최적화 추론(latency optimized)으로 응답 시간을 줄입니다.","w":{"A":"참조 데이터 없이 근거성 검사만 높여서는 카탈로그 밖 추천 문제가 해결되지 않습니다.","B":"프롬프트만으로는 모델이 카탈로그를 알 수 없습니다.","D":"고유한 상호 작용이 많아 캐싱 효과가 없고, 사후 검증은 근본 해결이 아닙니다."}}},{"n":138,"a":["A","C"],"orig":"","ko":{"q":"한 대학이 AI 어시스턴트, 과제 채점기, 내부 분석 애플리케이션 등 여러 하위 애플리케이션을 포함하는 AI 기반 애플리케이션을 구축하고 있습니다. 대학은 다양한 FM으로 여러 프롬프트를 정의·테스트하고 있으며, 각 프롬프트의 변형을 비교해 지정된 사용 사례에 가장 적합한 출력을 내는 변형을 선택하려고 합니다. 대학은 프롬프트 버전 관리 솔루션이 필요하며, 프롬프트 변형을 테스트하고 프롬프트 변경 및 사용에 대한 감사 추적을 수집할 수 있어야 합니다. 또한 프롬프트를 메인 애플리케이션에 통합하면서 일관성을 유지해야 합니다.\n운영 오버헤드가 가장 적은 솔루션 조합은 무엇입니까? (2개 선택)","o":[["A","Amazon Bedrock Prompt Management로 버전 관리되는 프롬프트를 만들고, 사용 사례별 파라미터화된 변수를 포함합니다."],["B","프롬프트를 Amazon S3에 저장하고, AWS Step Functions로 모델 상호 작용과 서비스 통합을 오케스트레이션합니다."],["C","Amazon Bedrock Flows로 FM과 AWS 서비스를 결합한 워크플로를 만듭니다."],["D","AWS Config로 프롬프트 변경을 기록하고, AWS CloudTrail로 프롬프트 사용을 추적합니다."],["E","Amazon Bedrock 지능형 프롬프트 라우팅을 구성합니다."]]},"en":{"q":"A university is building an AI-powered application that includes several sub-applications. The sub- applications include AI assistants, assignment graders, and internal analytics applications. The university is defining and testing multiple prompts by using various foundation models (FMs). The university wants to compare variants of each prompt and choose the variant that yield outputs that are best-suited for specified use cases. The university requires a version control solution for the prompts. The university must be able to test prompt variations and collect audit trails for prompt changes and usage. The solution must also maintain consistency while allowing the prompts to integrate into the main application.\nWhich combination of solutions will meet these requirements with the LEAST operational overhead? (Select TWO.)","o":[["A","Use Amazon Bedrock Prompt Management to create versioned prompts. Include parameterized variables for each use case."],["B","Store prompts in Amazon S3. Use AWS Step Functions to orchestrate the model interactions and service integrations."],["C","Use Amazon Bedrock Flows to create workflows that combine FMs and AWS services."],["D","Configure AWS Config to record prompt changes. Use AWS CloudTrail to track prompt usage."],["E","Configure Amazon Bedrock intelligent prompt routing."]]},"ex":{"c":"Prompt Management로 버전 관리되는 파라미터화 프롬프트를 만들어 사용 사례별 변형을 테스트하고 일관성을 유지합니다(A). Bedrock Flows로 FM과 AWS 서비스를 결합한 워크플로를 만들어 프롬프트를 메인 애플리케이션에 통합합니다(C). 프롬프트 변경과 사용은 CloudTrail에 기록됩니다.","w":{"B":"S3와 Step Functions로는 프롬프트 버전 관리와 변형 테스트를 직접 구현해야 합니다.","D":"AWS Config는 Bedrock 프롬프트 변경을 기록하는 도구가 아닙니다.","E":"지능형 프롬프트 라우팅은 모델 간 라우팅 기능으로 버전 관리나 변형 비교와 무관합니다."}}},{"n":139,"a":["B","D"],"orig":"C, D","ko":{"q":"한 회사가 모든 기능이 활성화된 AWS Organizations 조직으로 여러 AWS 계정을 관리합니다. 직원들은 여러 계정에서 Amazon Bedrock을 사용합니다. 회사는 특정 주제와 독점 정보가 Amazon Bedrock 모델에 대한 프롬프트에 포함되지 않도록 해야 하며, 직원이 승인된 Amazon Bedrock 모델만 사용하도록 해야 합니다. 회사는 이러한 통제를 중앙에서 관리하려고 합니다.\n이 요구 사항을 충족하는 솔루션 조합은 무엇입니까? (2개 선택)","o":[["A","각 직원의 IAM 역할에 IAM 권한 경계를 만듭니다. 권한 경계에서 Amazon Bedrock 모델 호출 시 승인된 Amazon Bedrock 가드레일 식별자를 요구하도록 구성합니다. 직원이 승인된 모델만 사용하도록 허용하는 SCP를 만듭니다."],["B","직원이 승인된 모델만 사용하도록 허용하는 SCP를 만듭니다. 승인된 모델을 호출할 때 가드레일 식별자를 지정하도록 SCP에서 요구합니다."],["C","중앙에서 배포한 가드레일 식별자가 모델 호출에 지정되지 않으면 직원의 모델 호출을 막는 SCP를 만듭니다. 각 직원의 IAM 역할에 승인된 모델만 호출할 수 있도록 허용하는 권한 경계를 만듭니다."],["D","AWS CloudFormation으로 차단(block) 필터링 정책이 있는 사용자 지정 Amazon Bedrock 가드레일을 만들고, 스택 세트로 조직의 각 계정에 가드레일을 배포합니다."],["E","AWS CloudFormation으로 마스킹(mask) 필터링 정책이 있는 사용자 지정 Amazon Bedrock 가드레일을 만들고, 스택 세트로 조직의 각 계정에 가드레일을 배포합니다."]]},"en":{"q":"A company uses an organization in AWS Organizations with all features enabled to manage multiple AWS accounts. Employees use Amazon Bedrock across multiple accounts. The company must prevent specific topics and proprietary information from being included in prompts to Amazon Bedrock models. The company must ensure that employees can use only approved Amazon Bedrock models. The company wants to manage these controls centrally.\nWhich combination of solutions will meet these requirements? (Select TWO.)","o":[["A","Create an IAM permissions boundary for each employee ' s IAM role. Configure the permissions boundary to require an approved Amazon Bedrock guardrail identifier to invoke Amazon Bedrock models. Create an SCP that allows employees to use only approved models."],["B","Create an SCP that allows employees to use only approved models. Configure the SCP to require employees to specify a guardrail identifier in calls to invoke an approved model."],["C","Create an SCP that prevents an employee from invoking a model if a centrally deployed guardrail identifier is not specified in a call to the model. Create a permissions boundary on each employee ' s IAM role that allows each employee to invoke only approved models."],["D","Use AWS CloudFormation to create a custom Amazon Bedrock guardrail that has a block filtering policy. Use stack sets to deploy the guardrail to each account in the organization."],["E","Use AWS CloudFormation to create a custom Amazon Bedrock guardrail that has a mask filtering policy. Use stack sets to deploy the guardrail to each account in the organization."]]},"ex":{"c":"SCP로 승인된 모델만 허용하고, bedrock:GuardrailIdentifier 조건 키로 호출 시 가드레일 지정을 강제하면 조직 전체에 중앙에서 적용됩니다(B). CloudFormation StackSets로 차단 정책을 가진 가드레일을 모든 계정에 배포하면 특정 주제와 독점 정보가 프롬프트에 포함되지 않도록 막습니다(D). (원본 덤프 답 C의 권한 경계는 역할마다 따로 설정해야 해 중앙 관리가 아닙니다.)","w":{"A":"직원 역할마다 권한 경계를 두면 중앙 관리가 아닙니다.","C":"권한 경계를 역할마다 설정해야 해 중앙 관리 요구에 어긋납니다.","E":"마스크 정책은 정보를 가릴 뿐 프롬프트에 포함되는 것을 막지 못합니다(입력 차단에는 block이 필요)."}}},{"n":140,"a":["C"],"orig":"","ko":{"q":"한 회사가 추천 시스템을 운영하며, 시스템 애플리케이션은 Amazon EC2 인스턴스에서 실행됩니다. 애플리케이션은 Amazon Bedrock FM에 API를 호출해 고객 행동을 분석하고 개인화 상품 추천을 생성합니다. 시스템에 간헐적 문제가 있어 일부 추천이 고객 선호와 맞지 않습니다. 회사는 운영 지표를 모니터링하고 기준선 대비 운영 성능 저하 패턴을 감지하는 관측성 솔루션이 필요합니다. 또한 FM 동작이 예상 패턴에서 벗어나면 10분 이내에 상관관계 데이터와 함께 알림을 생성해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","애플리케이션 인프라에 Amazon CloudWatch Container Insights를 구성합니다. 지연 시간 임계값에 CloudWatch 경보를 설정하고, CloudWatch 임베디드 지표 형식(EMF)으로 토큰 수 사용자 지정 지표를 추가합니다. CloudWatch 대시보드로 데이터를 시각화합니다."],["B","AWS X-Ray로 애플리케이션 구성 요소 간 요청을 추적합니다. 오류 패턴 감지를 위해 CloudWatch Logs Insights를 활성화하고, AWS CloudTrail로 Amazon Bedrock에 대한 모든 API 호출을 모니터링합니다. Amazon QuickSight에 사용자 지정 대시보드를 만듭니다."],["C","애플리케이션 리소스에 Amazon CloudWatch Application Insights를 활성화합니다. 요청 유형과 사용자 세그먼트 차원이 있는 CloudWatch EMF로 추천 품질, 토큰 사용량, 응답 지연 시간에 대한 사용자 지정 지표를 만듭니다. 모델 지표에 CloudWatch 이상 탐지를 구성하고, CloudWatch Logs Insights로 로그 패턴 분석을 수립합니다."],["D","Observability 플러그인이 있는 Amazon OpenSearch Service를 사용합니다. Amazon Kinesis로 모델 지표와 로그를 수집하고, 사용자 지정 PPL(Piped Processing Language) 쿼리로 모델 동작 패턴을 분석합니다. 실시간으로 이상을 시각화하는 운영 대시보드를 구축합니다."]]},"en":{"q":"A company has a recommendation system. The system ' s applications run on Amazon EC2 instances. The applications make API calls to Amazon Bedrock foundation models (FMs) to analyze customer behavior and generate personalized product recommendations. The system is experiencing intermittent issues. Some recommendations do not match customer preferences. The company needs an observability solution to monitor operational metrics and detect patterns of operational performance degradation compared to established baselines. The solution must also generate alerts with correlation data within 10 minutes when FM behavior deviates from expected patterns.\nWhich solution will meet these requirements?","o":[["A","Configure Amazon CloudWatch Container Insights for the application infrastructure. Set up CloudWatch alarms for latency thresholds. Add custom metrics for token counts by using the CloudWatch embedded metric format. Create CloudWatch dashboards to visualize the data."],["B","Implement AWS X-Ray to trace requests through the application components. Enable CloudWatch Logs Insights for error pattern detection. Set up AWS CloudTrail to monitor all API calls to Amazon Bedrock. Create custom dashboards in Amazon QuickSight."],["C","Enable Amazon CloudWatch Application Insights for the application resources. Create custom metrics for recommendation quality, token usage, and response latency by using the CloudWatch embedded metric format with dimensions for request types and user segments. Configure CloudWatch anomaly detection on the model metrics. Establish log pattern analysis by using CloudWatch Logs Insights."],["D","Use Amazon OpenSearch Service with the Observability plugin. Ingest model metrics and logs by using Amazon Kinesis. Create custom Piped Processing Language (PPL) queries to analyze model behavior patterns. Establish operational dashboards to visualize anomalies in real time."]]},"ex":{"c":"CloudWatch Application Insights로 애플리케이션 리소스를 자동 모니터링하고, 임베디드 메트릭 형식(EMF)으로 추천 품질·토큰 사용량·지연 시간을 요청 유형과 사용자 세그먼트 차원으로 게시합니다. 모델 지표에 이상 탐지를 적용해 기준선 대비 이탈을 감지하고, Logs Insights 패턴 분석으로 상관 데이터를 제공해 10분 안에 경보를 보냅니다.","w":{"A":"Container Insights는 EC2 애플리케이션에 맞지 않고 고정 임계값은 기준선 비교가 아닙니다.","B":"X-Ray와 QuickSight는 기준선 대비 이상 탐지와 빠른 경보를 제공하지 않습니다.","D":"OpenSearch와 Kinesis 파이프라인을 직접 구축·운영해야 합니다."}}},{"n":141,"a":["D"],"orig":"A","ko":{"q":"한 회사가 관리형 모델 서비스에 호스팅된 FM을 사용하는 GenAI 애플리케이션용 API를 설계하고 있습니다. API는 지연 시간을 줄이기 위해 응답을 스트리밍하고, 컴퓨팅 리소스 사용을 관리하기 위해 토큰 한도를 적용하며, 모델 타임아웃과 부분 응답을 처리하는 재시도 로직을 구현해야 합니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","Amazon API Gateway HTTP API를 Amazon Bedrock을 호출하는 AWS Lambda 함수와 통합합니다. Lambda 응답 스트리밍으로 응답을 스트리밍하고, Lambda 함수 안에서 토큰 한도를 적용합니다. Lambda와 API Gateway 타임아웃 구성으로 모델 타임아웃에 대한 재시도 로직을 구현합니다."],["B","Amazon API Gateway HTTP API를 Amazon Bedrock에 직접 연결합니다. 클라이언트 측 폴링으로 스트리밍을 흉내 내고, 프런트엔드에서 토큰 한도를 적용하며, API Gateway 통합 설정으로 재시도 동작을 구성합니다."],["C","Amazon API Gateway WebSocket API를 컨테이너형 추론 서버를 호스팅하는 Amazon ECS 서비스에 연결합니다. WebSocket 프로토콜로 응답을 스트리밍하고, Amazon ECS 안에서 토큰 한도를 적용합니다. ECS 작업 수명 주기 후크와 재시작 정책으로 모델 타임아웃을 처리합니다."],["D","Amazon API Gateway REST API를 Amazon Bedrock을 호출하는 AWS Lambda 함수와 통합합니다. Lambda 응답 스트리밍으로 응답을 스트리밍하고, Lambda 함수 안에서 토큰 한도를 적용합니다. Lambda와 API Gateway 타임아웃 구성으로 재시도 로직을 구현합니다."]]},"en":{"q":"A company is designing an API for a generative AI (GenAI) application that uses a foundation model (FM) that is hosted on a managed model service. The API must stream responses to reduce latency, enforce token limits to manage compute resource usage, and implement retry logic to handle model timeouts and partial responses.\nWhich solution will meet these requirements with the LEAST operational overhead?","o":[["A","Integrate an Amazon API Gateway HTTP API with an AWS Lambda function to invoke Amazon Bedrock. Use Lambda response streaming to stream responses. Enforce token limits within the Lambda function. Implement retry logic for model timeouts by using Lambda and API Gateway timeout configurations."],["B","Connect an Amazon API Gateway HTTP API directly to Amazon Bedrock. Simulate streaming by using client-side polling. Enforce token limits on the frontend. Configure retry behavior by using API Gateway integration settings."],["C","Connect an Amazon API Gateway WebSocket API to an Amazon ECS service that hosts a containerized inference server. Stream responses by using the WebSocket protocol. Enforce token limits within Amazon ECS. Handle model timeouts by using ECS task lifecycle hooks and restart policies."],["D","Integrate an Amazon API Gateway REST API with an AWS Lambda function that invokes Amazon Bedrock. Use Lambda response streaming to stream responses. Enforce token limits within the Lambda function. Implement retry logic by using Lambda and API Gateway timeout configurations."]]},"ex":{"c":"API Gateway REST API는 Lambda 응답 스트리밍을 지원하므로 Bedrock 응답을 스트리밍해 지연을 줄일 수 있습니다. Lambda 함수 안에서 토큰 한도를 강제하고, Lambda와 API Gateway의 타임아웃 구성으로 재시도를 처리합니다. 서버리스 관리형 구성이라 운영 오버헤드가 가장 적습니다. (원본 덤프 답 A의 HTTP API는 응답 스트리밍을 지원하지 않습니다.)","w":{"A":"HTTP API는 Lambda 응답 스트리밍을 지원하지 않습니다.","B":"HTTP API는 Bedrock과 직접 통합되지 않고, 프론트엔드 토큰 한도는 우회될 수 있습니다.","C":"ECS에 추론 서버를 직접 호스팅하면 관리형 모델 서비스 사용 조건에 맞지 않고 운영 부담이 큽니다."}}},{"n":142,"a":["D"],"orig":"","ko":{"q":"한 대형 전자상거래 회사가 상품 설명을 생성하는 FM을 배포했습니다. 엔지니어링 팀은 Amazon CloudWatch로 토큰 사용량, 지연 시간, 오류율 같은 기술 지표를 모니터링하고, 마케팅 팀은 자체 시스템에서 전환율과 매출 영향 같은 비즈니스 지표를 추적합니다. 회사는 기술 성능과 비즈니스 성과를 연관 짓는 통합 관측성 솔루션이 필요합니다. 솔루션은 운영 지표가 성능 저하를 나타내면 이해관계자에게 자동으로 알림을 보내야 하고, 기술 지표와 비즈니스 지표 전반에 대한 포괄적인 가시성을 제공해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","기술 지표와 가져온 비즈니스 지표를 포함하는 CloudWatch 대시보드를 만듭니다. 기술 데이터와 비즈니스 데이터를 결합한 CloudWatch 복합 경보를 구성하고, Amazon SNS로 이해관계자 알림을 설정합니다."],["B","Amazon Managed Grafana로 CloudWatch의 기술 지표와 외부 소스의 비즈니스 지표를 시각화합니다. Amazon Managed Grafana 알림이 AWS Lambda 함수를 호출하도록 구성하고, 지표가 사전 정의된 임계값을 넘으면 Lambda 함수가 문제를 자동으로 해결하도록 구성합니다."],["C","CloudWatch 지표 스트림으로 CloudWatch 지표를 Amazon S3에 스트리밍합니다. Amazon QuickSight 대시보드로 기술 지표와 비즈니스 지표를 함께 시각화하고, 지표가 사전 정의된 임계값을 넘으면 Amazon EventBridge 규칙으로 이해관계자에게 알림을 보냅니다."],["D","운영 지표와 가져온 비즈니스 지표를 통합하는 CloudWatch 사용자 지정 대시보드를 구성합니다. 이상 탐지가 있는 CloudWatch 복합 경보를 설정하고, 상관된 지표가 성능 문제를 나타내면 Amazon SNS 경보 작업으로 이해관계자에게 알립니다."]]},"en":{"q":"A large ecommerce company has deployed a foundation model (FM) to generate product descriptions. The company ' s engineering team monitors technical metrics such as token usage, latency, and error rates by using Amazon CloudWatch. The company ' s marketing team tracks business metrics such as conversion rates and revenue impact in its own systems. The company needs a unified observability solution that correlates technical performance with business outcomes. The solution must provide automatic alerts to stakeholders when operational metrics indicate degradation. The solution must provide comprehensive visibility across both technical and business metrics.\nWhich solution will meet these requirements?","o":[["A","Create CloudWatch dashboards that include technical metrics and imported business metrics. Configure CloudWatch composite alarms that combine technical data and business data. Use Amazon SNS to set up notifications to stakeholders."],["B","Use Amazon Managed Grafana to visualize technical metrics from CloudWatch with business metrics from external sources. Configure Amazon Managed Grafana alerts to invoke AWS Lambda functions. Configure the Lambda functions to remediate issues automatically when metrics exceed predefined thresholds."],["C","Stream CloudWatch metrics to Amazon S3 by using CloudWatch metric streams. Create Amazon QuickSight dashboards to visualize the combined technical metrics and business metrics. Set up Amazon EventBridge rules to send notifications to stakeholders when metrics exceed predefined thresholds."],["D","Configure CloudWatch custom dashboards that integrate operational metrics with imported business metrics. Set up CloudWatch composite alarms with anomaly detection. Use Amazon SNS to create alarm actions to notify stakeholders when correlated metrics indicate performance issues."]]},"ex":{"c":"CloudWatch 사용자 지정 대시보드에 운영 지표와 가져온 비즈니스 지표를 함께 표시하고, 이상 탐지를 결합한 복합 경보로 기술 지표와 비즈니스 지표의 상관 관계를 바탕으로 성능 저하를 감지합니다. SNS 경보 작업으로 이해관계자에게 자동 알림을 보냅니다.","w":{"A":"고정 임계값 복합 경보는 이상 탐지보다 저하 감지 능력이 떨어집니다.","B":"요구 사항은 이해관계자 알림이지 자동 복구가 아닙니다.","C":"QuickSight는 실시간 경보 도구가 아니며, 지표 스트림과 EventBridge 구성은 오버헤드가 큽니다."}}},{"n":143,"a":["B"],"orig":"","ko":{"q":"한 소매 회사가 Amazon Bedrock으로 고객 서비스 AI 어시스턴트를 개발하고 있습니다. 분석 결과 고객 문의의 70%는 작은 모델로도 충분히 처리할 수 있는 단순 상품 질문이고, 30%는 고급 추론이 필요한 복잡한 반품 정책 질문입니다. 회사는 문의 복잡도에 따라 적절한 모델로 자동 라우팅하는 비용 효율적인 모델 선택 프레임워크를 구현하려고 합니다. 프레임워크는 높은 고객 만족도를 유지하고 응답 지연 시간을 최소화해야 합니다.\n구현 노력이 가장 적은 솔루션은 무엇입니까?","o":[["A","작은 FM으로 각 문의의 복잡도를 분류하는 다단계 아키텍처를 만듭니다. 단순 문의는 더 작고 비용 효율적인 모델로, 복잡한 문의는 더 크고 강력한 모델로 라우팅합니다. AWS Lambda 함수로 라우팅 로직을 처리합니다."],["B","Amazon Bedrock 지능형 프롬프트 라우팅으로 문의를 자동 분석합니다. 단순 상품 문의는 작은 모델로, 복잡한 반품 정책 문의는 더 강력한 큰 모델로 라우팅합니다."],["C","온디맨드 요금의 Amazon Bedrock 중간 크기 FM을 사용하는 단일 모델 솔루션을 구현합니다. 모델 프롬프트에 단순 문의와 복잡한 문의를 모두 처리하는 특별 지침을 포함해 같은 모델로 처리합니다."],["D","단순 문의와 복잡한 문의용으로 별도의 Amazon Bedrock 엔드포인트를 만듭니다. 키워드 감지 기반 규칙 라우팅 시스템을 구현하고, 작은 모델에는 온디맨드 요금을, 큰 모델에는 프로비저닝된 처리량을 사용합니다."]]},"en":{"q":"A retail company is using Amazon Bedrock to develop a customer service AI assistant. Analysis shows that 70% of customer inquiries are simple product questions that a smaller model can effectively handle. However, 30% of inquiries are complex return policy questions that require advanced reasoning. The company wants to implement a cost-effective model selection framework to automatically route customer inquiries to appropriate models based on inquiry complexity. The framework must maintain high customer satisfaction and minimize response latency.\nWhich solution will meet these requirements with the LEAST implementation effort?","o":[["A","Create a multi-stage architecture that uses a small foundation model (FM) to classify the complexity of each inquiry. Route simple inquiries to a smaller, more cost-effective model. Route complex inquiries to a larger, more capable model. Use AWS Lambda functions to handle routing logic."],["B","Use Amazon Bedrock intelligent prompt routing to automatically analyze inquiries. Route simple product inquiries to smaller models and route complex return policy inquiries to more capable larger models."],["C","Implement a single-model solution that uses an Amazon Bedrock mid-sized foundation model (FM) with on-demand pricing. Include special instructions in model prompts to handle both simple and complex inquiries by using the same model."],["D","Create separate Amazon Bedrock endpoints for simple and complex inquiries. Implement a rulebased routing system based on keyword detection. Use on-demand pricing for the smaller model and provisioned throughput for the larger model."]]},"ex":{"c":"Bedrock 지능형 프롬프트 라우팅(intelligent prompt routing)은 같은 모델 계열 안에서 요청의 복잡도를 자동 분석해 단순한 질문은 작은 모델로, 복잡한 질문은 큰 모델로 보내 비용과 품질을 최적화합니다. 별도의 분류기나 라우팅 로직을 만들 필요가 없어 구현 노력이 가장 적습니다.","w":{"A":"분류 모델과 Lambda 라우팅을 직접 구현해야 하고 단계가 늘어 지연도 커집니다.","C":"단일 중형 모델은 비용 최적화와 품질 요구를 모두 만족시키기 어렵습니다.","D":"키워드 기반 규칙은 복잡도를 정확히 판단하지 못하고 구현 부담이 큽니다."}}},{"n":144,"a":["C"],"orig":"","ko":{"q":"한 회사가 Amazon EC2 인스턴스에서 실행되는 추천 시스템을 운영합니다. 애플리케이션은 Amazon Bedrock FM에 API를 호출해 고객 행동을 분석하고 개인화 상품 추천을 생성합니다. 일부 추천이 고객 선호와 맞지 않는 간헐적 문제가 있습니다. 회사는 운영 지표를 모니터링하고 기준선 대비 성능 저하 패턴을 감지하는 관측성 솔루션이 필요하며, FM 동작이 예상 패턴에서 벗어나면 10분 이내에 상관관계 데이터와 함께 알림을 생성해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon CloudWatch Container Insights를 구성합니다. 지연 시간 임계값 경보를 설정하고, CloudWatch 임베디드 지표 형식으로 사용자 지정 토큰 지표를 추가합니다."],["B","AWS X-Ray를 구현하고 CloudWatch Logs Insights를 활성화합니다. AWS CloudTrail을 설정하고 Amazon QuickSight에 대시보드를 만듭니다."],["C","Amazon CloudWatch Application Insights를 활성화합니다. 요청 유형과 사용자 세그먼트 차원이 있는 CloudWatch 임베디드 지표 형식으로 추천 품질, 토큰 사용량, 응답 지연 시간 사용자 지정 지표를 만듭니다. 모델 지표에 CloudWatch 이상 탐지를 구성하고, CloudWatch Logs Insights로 패턴을 분석합니다."],["D","Observability 플러그인이 있는 Amazon OpenSearch Service를 사용합니다. Amazon Kinesis로 지표와 로그를 수집하고 사용자 지정 쿼리로 동작을 분석합니다."]]},"en":{"q":"A company has a recommendation system running on Amazon EC2 instances. The applications make API calls to Amazon Bedrock foundation models (FMs) to analyze customer behavior and generate personalized product recommendations. The system experiences intermittent issues where some recommendations do not match customer preferences. The company needs an observability solution to monitor operational metrics and detect patterns of performance degradation compared to established baselines. The solution must generate alerts with correlation data within 10 minutes when FM behavior deviates from expected patterns.\nWhich solution will meet these requirements?","o":[["A","Configure Amazon CloudWatch Container Insights. Set up alarms for latency thresholds. Add custom token metrics using the CloudWatch embedded metric format."],["B","Implement AWS X-Ray. Enable CloudWatch Logs Insights. Set up AWS CloudTrail and create dashboards in Amazon QuickSight."],["C","Enable Amazon CloudWatch Application Insights. Create custom metrics for recommendation quality, token usage, and response latency using the CloudWatch embedded metric format with dimensions for request types and user segments. Configure CloudWatch anomaly detection on model metrics. Use CloudWatch Logs Insights for pattern analysis."],["D","Use Amazon OpenSearch Service with the Observability plugin. Ingest metrics and logs through Amazon Kinesis and analyze behavior with custom queries."]]},"ex":{"c":"140번과 같은 문제입니다. Application Insights, EMF 사용자 지정 지표(차원 포함), 모델 지표 이상 탐지, Logs Insights 패턴 분석으로 기준선 대비 이탈을 감지하고 상관 데이터와 함께 빠르게 경보합니다.","w":{"A":"고정 임계값 경보로는 기준선 대비 이상을 감지하지 못합니다.","B":"기준선 기반 이상 탐지와 빠른 경보가 없습니다.","D":"사용자 지정 파이프라인 구축 부담이 큽니다."}}},{"n":145,"a":["B"],"orig":"","ko":{"q":"한 제약 회사가 Amazon Bedrock 지식 기반을 사용하는 RAG 애플리케이션을 개발하고 있습니다. 지식 기반은 2,500만 편 이상의 과학 논문에 대해 Amazon OpenSearch Service를 데이터 소스로 사용합니다. 사용자들은 쿼리가 논문의 방법론, 결과, 논의 섹션에 걸쳐 있을 때 애플리케이션이 일관되지 않은 답변을 내고 논문의 관련 없는 부분을 인용한다고 보고합니다. 회사는 전체 데이터 말뭉치 규모에서 관련 문단 간 의미 맥락을 보존하도록 지식 기반을 개선해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","지식 기반이 고정 크기 청킹을 사용하도록 구성합니다. 최대 청크 크기를 300토큰, 청크 간 중첩을 10%로 설정하고 적절한 Amazon Bedrock 임베딩 모델을 사용합니다."],["B","지식 기반이 계층적(hierarchical) 청킹을 사용하도록 구성합니다. 부모 청크는 1,000토큰, 자식 청크는 200토큰으로 하고, 청크 간 중첩을 50토큰으로 설정합니다."],["C","지식 기반이 의미 기반 청킹을 사용하도록 구성합니다. 버퍼 크기 1과 중단점 백분위 임계값 85%를 사용해 내용의 의미에 따라 청크 경계를 정합니다."],["D","지식 기반이 청킹을 사용하지 않도록 구성합니다. 수집 전에 각 문서를 수동으로 별도 파일로 분할하고, 검색 시 후처리 리랭킹을 적용합니다."]]},"en":{"q":"A pharmaceutical company is developing a Retrieval Augmented Generation (RAG) application that uses an Amazon Bedrock knowledge base. The knowledge base uses Amazon OpenSearch Service as a data source for more than 25 million scientific papers. Users report that the application produces inconsistent answers that cite irrelevant sections of papers when queries span methodology, results, and discussion sections of the papers. The company needs to improve the knowledge base to preserve semantic context across related paragraphs on the scale of the entire corpus of data.\nWhich solution will meet these requirements?","o":[["A","Configure the knowledge base to use fixed-size chunking. Set a 300-token maximum chunk size and a 10% overlap between chunks. Use an appropriate Amazon Bedrock embedding model."],["B","Configure the knowledge base to use hierarchical chunking. Use parent chunks that contain 1,000 tokens and child chunks that contain 200 tokens. Set a 50-token overlap between chunks."],["C","Configure the knowledge base to use semantic chunking. Use a buffer size of 1 and a breakpoint percentile threshold of 85% to determine chunk boundaries based on content meaning."],["D","Configure the knowledge base not to use chunking. Manually split each document into separate files before ingestion. Apply post-processing reranking during retrieval."]]},"ex":{"c":"48번과 같은 문제입니다. 계층적 청킹은 작은 하위 청크로 정밀 검색하고 큰 상위 청크로 맥락을 제공해 여러 단락에 걸친 의미 맥락을 보존합니다.","w":{"A":"작은 고정 청크는 단락 간 맥락을 잃습니다.","C":"시맨틱 청킹은 상위 맥락을 제공하지 않고 대규모 수집 비용이 큽니다.","D":"수동 분할은 비현실적입니다."}}},{"n":146,"a":["B"],"orig":"","ko":{"q":"한 회사가 고객 통화 중 상담원을 돕는 실시간 음성 어시스턴트 시스템을 구축하고 있습니다. 시스템은 엔드투엔드 지연 시간 500ms 미만으로 통화 음성을 텍스트로 변환해야 하고, 생성형 AI로 응답 제안을 생성해야 합니다. 사람 감독자는 실시간 통화 중에 시스템의 제안을 평가할 수 있어야 합니다. 회사는 감사 정책을 준수하기 위해 모든 고객 상호 작용을 저장해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","표준 설정의 Amazon Transcribe 스트리밍 API로 음성을 텍스트로 변환합니다. Amazon Bedrock 배치 처리로 추론을 수행하고, 통화 녹음과 메타데이터를 Amazon S3에 저장해 S3 수명 주기 정책으로 관리합니다."],["B","음성 어시스턴트의 지연 시간을 최적화하도록 100ms 오디오 청크로 Amazon Transcribe 스트리밍 API를 사용합니다. Amazon Bedrock InvokeModelWithResponseStream 작업으로 고객 문의를 실시간 처리하고, 감독자 평가는 Amazon DynamoDB 테이블에 저장합니다."],["C","Amazon Transcribe 배치 처리로 통화 후 분석을 수행합니다. AWS Lambda 함수가 Amazon Bedrock InvokeModel 작업으로 응답을 생성하도록 구성하고, Amazon CloudWatch로 감독자 피드백을 기록합니다."],["D","Amazon Transcribe로 음성을 텍스트로 변환하고 실시간 분석을 수행합니다. Amazon Comprehend로 감정 분석을 하고, Amazon SQS로 처리 작업을 대기열에 넣은 뒤 Amazon Bedrock InvokeModel 작업으로 응답을 생성합니다."]]},"en":{"q":"A company is building a real-time voice assistant system to assist customer service representatives during customer calls. The system must convert audio calls to text with end-to-end latency of less than 500 ms. The system must use generative AI (GenAI) to produce response suggestions. Human supervisors must be able to rate the system ' s suggestions during a live customer call. The company must store all customer interactions to comply with auditing policies.\nWhich solution will meet these requirements?","o":[["A","Use the Amazon Transcribe streaming API with standard settings to convert speech to text. Use Amazon Bedrock batch processing to perform inference. Store call recordings and metadata in Amazon S3. Use S3 Lifecycle policies to manage the storage."],["B","Use the Amazon Transcribe streaming API with 100-ms audio chunks to optimize latency for the voice assistant. Call the Amazon Bedrock InvokeModelWithResponseStream operation to process client inquiries in real time. Store supervisor ratings in an Amazon DynamoDB table."],["C","Use Amazon Transcribe batch processing to perform post-call analysis. Configure AWS Lambda functions to generate responses by using the Amazon Bedrock InvokeModel operation. Use Amazon CloudWatch to log supervisor feedback."],["D","Use Amazon Transcribe to convert speech to text and to perform real-time analytics. Use Amazon Comprehend to perform sentiment analysis. Use Amazon SQS to queue processing tasks. Run the Amazon Bedrock InvokeModel operation to generate responses."]]},"ex":{"c":"Transcribe 스트리밍에 100ms 오디오 청크를 보내면 500ms 미만 지연으로 전사할 수 있고, InvokeModelWithResponseStream으로 실시간 제안을 스트리밍합니다. 감독자 평가는 DynamoDB에 저장해 통화 중에도 기록하고 감사에 활용합니다.","w":{"A":"Bedrock 배치 추론은 실시간이 아닙니다.","C":"통화 후 배치 전사는 실시간 지원이 아닙니다.","D":"SQS 대기열과 동기 InvokeModel은 지연을 늘립니다."}}},{"n":147,"a":["B"],"orig":"","ko":{"q":"한 의료 회사가 Amazon Bedrock으로 의료진의 임상 의사 결정을 돕는 시스템을 구축하고 있습니다. 시스템은 승인된 의료 문서만을 바탕으로 의사에게 치료 권장 사항을 제공하고 구체적인 출처를 인용해야 합니다. 시스템은 환각이나 사실과 다른 정보를 생성해서는 안 됩니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock을 Amazon Kendra와 통합해 승인된 문서를 검색합니다. 생성된 응답을 원본 문서와 비교하고 인용을 포함하는 사용자 지정 후처리를 구현합니다."],["B","Amazon Bedrock 지식 기반을 배포해 승인된 임상 원본 문서에 연결합니다. Amazon Bedrock RetrieveAndGenerate API로 지식 기반의 인용을 반환합니다."],["C","Amazon Bedrock과 Amazon Comprehend Medical로 의료 엔터티를 추출합니다. 의학 용어 데이터베이스와 대조하는 검증 로직을 구현합니다."],["D","Retrieve API 호출과 InvokeModel API 호출이 있는 Amazon Bedrock 지식 기반으로 승인된 임상 원본 문서를 검색합니다. 검색된 출처와 비교하고 출처를 인용하는 검증 로직을 구현합니다."]]},"en":{"q":"A healthcare company is using Amazon Bedrock to build a system to help practitioners make clinical decisions. The system must provide treatment recommendations to physicians based only on approved medical documentation and must cite specific sources. The system must not hallucinate or produce factually incorrect information.\nWhich solution will meet these requirements with the LEAST operational overhead?","o":[["A","Integrate Amazon Bedrock with Amazon Kendra to retrieve approved documents. Implement custom post-processing to compare generated responses against source documents and to include citations."],["B","Deploy an Amazon Bedrock Knowledge Base and connect it to approved clinical source documents. Use the Amazon Bedrock RetrieveAndGenerate API to return citations from the knowledge base."],["C","Use Amazon Bedrock and Amazon Comprehend Medical to extract medical entities. Implement verification logic against a medical terminology database."],["D","Use an Amazon Bedrock knowledge base with Retrieve API calls and InvokeModel API calls to retrieve approved clinical source documents. Implement verification logic to compare against retrieved sources and to cite sources."]]},"ex":{"c":"승인된 임상 문서로 지식 기반을 만들고 RetrieveAndGenerate API를 쓰면, 검색된 문서에만 근거해 응답을 생성하고 출처 인용을 자동으로 반환합니다. 사용자 지정 검증 로직이 필요 없어 운영 오버헤드가 가장 적습니다.","w":{"A":"Kendra 통합과 사용자 지정 후처리를 직접 구현해야 합니다.","C":"엔터티 추출과 용어 검증으로는 근거 기반 응답과 인용을 보장하지 못합니다.","D":"Retrieve와 InvokeModel을 따로 호출하고 검증·인용 로직을 직접 구현해야 합니다."}}},{"n":148,"a":["A"],"orig":"","ko":{"q":"한 금융 서비스 회사가 고객 서비스 담당자가 고객에게 개인화 투자 조언을 제공하도록 돕는 Amazon Bedrock 기반 GenAI 애플리케이션을 배포하고 있습니다. 회사는 책임 있는 AI 관행을 따르고 규제 요구 사항을 충족하는 포괄적인 거버넌스 솔루션을 구현해야 합니다. 솔루션은 추천의 환각을 감지·방지하고, 고객 상호 작용에 대한 안전 통제를 갖춰야 합니다. 또한 모델 동작 드리프트를 실시간으로 모니터링하고, 규제 검토를 위해 모든 프롬프트-응답 쌍의 감사 추적을 유지해야 합니다. 회사는 60일 이내에 솔루션을 배포해야 하며, 솔루션은 기존 규정 준수 대시보드와 통합되고 고객에게 200ms 이내로 응답해야 합니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","사용자 지정 콘텐츠 필터와 독성 감지를 적용하도록 Amazon Bedrock 가드레일을 구성합니다. Amazon Bedrock Model Evaluation으로 환각을 감지합니다. 감사 추적을 위해 프롬프트-응답 쌍을 Amazon DynamoDB에 저장하고 TTL을 설정합니다. Amazon CloudWatch 사용자 지정 지표를 기존 규정 준수 대시보드와 통합합니다."],["B","Amazon Bedrock을 배포하고 AWS PrivateLink로 애플리케이션에 안전하게 접근합니다. AWS Lambda 함수로 사용자 지정 프롬프트 검증을 구현합니다. 프롬프트-응답 쌍을 Amazon S3 버킷에 저장하고 S3 수명 주기 정책을 구성하며, 사용자 지정 Amazon CloudWatch 대시보드로 모델 성능 지표를 모니터링합니다."],["C","Amazon Bedrock Agents와 Amazon Bedrock Knowledge Bases로 응답을 근거에 기반하게 합니다. Amazon Bedrock Guardrails로 콘텐츠 안전을 적용합니다. Amazon OpenSearch Service로 프롬프트-응답 쌍을 저장·인덱싱하고, OpenSearch Service를 Amazon QuickSight와 통합해 규정 준수 보고서를 만들고 모델 동작 드리프트를 감지합니다."],["D","Amazon SageMaker Model Monitor로 모델 동작 드리프트를 감지합니다. AWS WAF로 콘텐츠를 필터링하고, 고객 상호 작용은 암호화된 Amazon RDS 데이터베이스에 저장합니다. Amazon API Gateway로 규정 준수 대시보드와 통합하는 사용자 지정 HTTP API를 만듭니다."]]},"en":{"q":"A financial services company is deploying a generative AI (GenAI) application that uses Amazon Bedrock to assist customer service representatives to provide personalized investment advice to customers. The company must implement a comprehensive governance solution that follows responsible AI practices and meets regulatory requirements. The solution must detect and prevent hallucinations in recommendations. The solution must have safety controls for customer interactions. The solution must also monitor model behavior drift in real time and maintain audit trails of all prompt-response pairs for regulatory review. The company must deploy the solution within 60 days. The solution must integrate with the company ' s existing compliance dashboard and respond to customers within 200 ms.\nWhich solution will meet these requirements with the LEAST operational overhead?","o":[["A","Configure Amazon Bedrock guardrails to apply custom content filters and toxicity detection. Use Amazon Bedrock Model Evaluation to detect hallucinations. Store prompt-response pairs in Amazon DynamoDB to capture audit trails and set a TTL. Integrate Amazon CloudWatch custom metrics with the existing compliance dashboard."],["B","Deploy Amazon Bedrock and use AWS PrivateLink to access the application securely. Use AWS Lambda functions to implement custom prompt validation. Store prompt-response pairs in an Amazon S3 bucket and configure S3 Lifecycle policies. Create custom Amazon CloudWatch dashboards to monitor model performance metrics."],["C","Use Amazon Bedrock Agents and Amazon Bedrock Knowledge Bases to ground responses. Use Amazon Bedrock Guardrails to enforce content safety. Use Amazon OpenSearch Service to store and index prompt-response pairs. Integrate OpenSearch Service with Amazon QuickSight to create compliance reports and to detect model behavior drift."],["D","Use Amazon SageMaker Model Monitor to detect model behavior drift. Use AWS WAF to filter content. Store customer interactions in an encrypted Amazon RDS database. Use Amazon API Gateway to create custom HTTP APIs to integrate with the compliance dashboard."]]},"ex":{"c":"Guardrails의 콘텐츠 필터와 독성 탐지로 고객 상호 작용 안전을 통제하고, Bedrock 모델 평가로 환각을 탐지합니다. 프롬프트-응답 쌍은 DynamoDB에 저장해 감사 추적을 남기며, CloudWatch 사용자 지정 지표를 기존 규정 준수 대시보드와 통합합니다. 모두 관리형 기능이라 60일 안에 배포할 수 있고 오버헤드가 가장 적습니다.","w":{"B":"사용자 지정 프롬프트 검증 Lambda는 개발 부담이 크고 환각 탐지가 없습니다.","C":"Agents, 지식 기반, OpenSearch, QuickSight를 모두 구성하면 오버헤드가 크고 200ms 응답이 어렵습니다.","D":"Model Monitor는 Bedrock 모델용이 아니며 WAF는 콘텐츠 안전 통제가 아닙니다."}}},{"n":149,"a":["C"],"orig":"","ko":{"q":"한 회사가 AWS Lambda 함수로 전 세계 학생의 노트 요약을 돕는 서버리스 애플리케이션을 구축하고 있습니다. 애플리케이션은 Amazon Bedrock의 Anthropic Claude를 사용합니다. 트래픽 대부분이 각 시간대의 저녁에 발생하며, 사용자들은 자기 시간대의 피크 시간에 스로틀링 오류를 겪는다고 보고합니다. 회사는 애플리케이션의 지속적인 운영을 보장해 스로틀링 문제를 해결해야 합니다. 솔루션은 애플리케이션 성능 품질을 유지해야 하며, 트래픽이 적은 기간에 고정 시간당 비용이 발생해서는 안 됩니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","모델 오류를 모니터링하는 Amazon CloudWatch 사용자 지정 지표를 만듭니다. 관찰된 피크 트래픽보다 충분히 높은 값으로 프로비저닝된 처리량을 설정합니다."],["B","모델 오류를 모니터링하는 Amazon CloudWatch 사용자 지정 지표를 만듭니다. 오류가 지정 임계값을 넘으면 호출을 백업 AWS 리전으로 리디렉션하는 장애 조치 메커니즘을 설정합니다."],["C","Amazon Bedrock에서 호출 로깅을 활성화합니다. Invocations, InputTokenCount, OutputTokenCount, InvocationThrottles 같은 핵심 지표를 모니터링하고, 교차 리전 추론 엔드포인트로 트래픽을 분산합니다."],["D","Amazon Bedrock에서 호출 로깅을 활성화합니다. InvocationLatency, InvocationClientErrors, InvocationServerErrors 지표를 모니터링하고, 같은 모델의 여러 버전으로 트래픽을 분산합니다."]]},"en":{"q":"A company is building a serverless application that uses AWS Lambda functions to help students around the world summarize notes. The application uses Anthropic Claude through Amazon Bedrock. The company observes that most of the traffic occurs during evenings in each time zone. Users report experiencing throttling errors during peak usage times in their time zones. The company needs to resolve the throttling issues by ensuring continuous operation of the application. The solution must maintain application performance quality and must not require a fixed hourly cost during low traffic periods.\nWhich solution will meet these requirements?","o":[["A","Create custom Amazon CloudWatch metrics to monitor model errors. Set provisioned throughput to a value that is safely higher than the peak traffic observed."],["B","Create custom Amazon CloudWatch metrics to monitor model errors. Set up a failover mechanism to redirect invocations to a backup AWS Region when the errors exceed a specified threshold."],["C","Enable invocation logging in Amazon Bedrock. Monitor key metrics such as Invocations, InputTokenCount, OutputTokenCount, and InvocationThrottles. Distribute traffic across cross-Region inference endpoints."],["D","Enable invocation logging in Amazon Bedrock. Monitor InvocationLatency, InvocationClientErrors, and InvocationServerErrors metrics. Distribute traffic across multiple versions of the same model."]]},"ex":{"c":"교차 리전 추론으로 여러 리전에 트래픽을 분산하면 시간대별 피크에도 스로틀링이 줄고, 온디맨드 요금이라 저트래픽 시간에 고정 비용이 없습니다. 호출 로깅과 Invocations·토큰·InvocationThrottles 지표로 상태를 모니터링합니다.","w":{"A":"프로비저닝 처리량은 저트래픽 시간에도 고정 시간당 비용이 듭니다.","B":"사용자 지정 장애 조치 메커니즘을 직접 구현해야 하고 오류가 발생한 뒤에야 전환됩니다.","D":"같은 모델의 여러 버전으로 분산해도 동일 리전 할당량 문제는 해결되지 않습니다."}}},{"n":150,"a":["A"],"orig":"","ko":{"q":"한 금융 서비스 회사가 사용자 쿼리와의 의미 유사도를 기준으로 데이터베이스에서 관련 금융 규제 문서를 검색하는 고객 지원 애플리케이션을 구축하고 있습니다. 애플리케이션은 Amazon Bedrock과 통합해 응답을 생성해야 하고, 영어, 스페인어, 포르투갈어 문서를 검색해야 하며, 발행일, 규제 기관, 문서 유형 같은 메타데이터로 문서를 필터링해야 합니다. 데이터베이스에는 약 1,000만 개의 문서 임베딩이 저장되어 있습니다. 회사는 운영 오버헤드를 최소화하기 위해, 관리와 유지보수 노력을 최소화하면서 실시간 고객 상호 작용을 위한 짧은 지연 시간을 제공하는 솔루션을 원합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon OpenSearch Serverless로 벡터 검색과 메타데이터 필터링 기능을 제공합니다. Amazon Bedrock Knowledge Bases와 통합해 Anthropic Claude FM을 사용하는 RAG를 구현합니다."],["B","pgvector 확장이 있는 Amazon Aurora PostgreSQL 데이터베이스를 배포합니다. 임베딩과 메타데이터를 테이블에 저장하고, SQL 쿼리로 유사도 검색을 수행해 결과를 Amazon Bedrock으로 보내 응답을 생성합니다."],["C","Amazon S3 Vectors로 벡터 인덱스와 필터링 불가능한 메타데이터 필드를 구성합니다. S3 Vectors를 Amazon Bedrock과 통합해 RAG를 구현합니다."],["D","벡터 인덱스가 있는 Amazon Neptune Analytics 데이터베이스를 설정합니다. 그래프 기반 검색과 Amazon Bedrock으로 응답을 생성합니다."]]},"en":{"q":"A financial services company is building a customer support application that retrieves relevant financial regulation documents from a database based on semantic similarity to user queries. The application must integrate with Amazon Bedrock to generate responses. The application must search documents in English, Spanish, and Portuguese. The application must filter documents by metadata such as publication date, regulatory agency, and document type. The database stores approximately 10 million document embeddings. To minimize operational overhead, the company wants a solution that minimizes management and maintenance effort while providing low-latency responses for real-time customer interactions.\nWhich solution will meet these requirements?","o":[["A","Use Amazon OpenSearch Serverless to provide vector search capabilities and metadata filtering. Integrate with Amazon Bedrock Knowledge Bases to enable Retrieval Augmented Generation (RAG) using an Anthropic Claude foundation model."],["B","Deploy an Amazon Aurora PostgreSQL database with the pgvector extension. Store embeddings and metadata in tables. Use SQL queries for similarity search and send results to Amazon Bedrock for response generation."],["C","Use Amazon S3 Vectors to configure a vector index and non-filterable metadata fields. Integrate S3 Vectors with Amazon Bedrock for RAG."],["D","Set up an Amazon Neptune Analytics database with a vector index. Use graph-based retrieval and Amazon Bedrock for response generation."]]},"ex":{"c":"OpenSearch Serverless는 벡터 검색과 메타데이터 필터링을 지원하고 용량 관리가 필요 없는 서버리스 서비스입니다. Bedrock Knowledge Bases와 통합해 다국어 임베딩 모델과 Claude로 RAG를 구성하면, 1천만 건 규모에서도 낮은 지연과 최소 운영으로 실시간 응답을 제공합니다.","w":{"B":"Aurora 클러스터 관리와 SQL 기반 검색 구현이 필요합니다.","C":"필터링이 불가능한(non-filterable) 메타데이터로는 메타데이터 필터 요구를 충족하지 못하고, S3 Vectors는 저지연 실시간 용도에 덜 적합합니다.","D":"그래프 검색은 요구 사항에 없으며 운영이 더 복잡합니다."}}},{"n":151,"a":["C"],"orig":"","ko":{"q":"GenAI 개발자가 Amazon Bedrock Knowledge Bases를 사용하는 RAG 시스템을 구축하고 있습니다. 시스템은 Amazon S3 버킷에 저장된 평균 500페이지 분량의 교과서 50권을 처리해 도메인 특화 고객 질문에 답하는 지식 기반을 생성해야 합니다. 일부 문서로 초기 테스트를 해보니 쿼리 응답에 관련 없는 정보가 포함되고 원본 자료의 핵심 맥락이 누락되는 경우가 있었습니다. GenAI 개발자는 솔루션이 짧은 지연 시간으로 환각 없이 정확한 응답을 제공하도록 해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","256토큰 청크 크기의 고정 크기 청킹을 구성합니다. 문서 섹션 기반 메타데이터 필터링을 구현하고, 의미 검색에 최적화된 벡터 표현을 만드는 Amazon Titan Embeddings 모델을 사용합니다."],["B","Amazon ElastiCache로 자주 묻는 쿼리에 대한 의미 캐싱을 구현합니다. Anthropic Claude Sonnet으로 사용자 쿼리를 재구성하고, 사용자 상호 작용을 바탕으로 응답 품질을 지속 개선하는 실시간 모델 피드백 루프를 구성합니다."],["C","200토큰 청크와 1,000토큰 청크를 모두 사용하는 계층적 청킹을 적용합니다. 벡터 검색과 키워드 검색을 결합한 하이브리드 검색을 구현하고, 관련성 점수 임계값을 조정해 신뢰도가 낮은 검색 결과를 걸러냅니다."],["D","의미 기반 청킹으로 주제 경계에 따라 문서를 자동 분할합니다. 모든 콘텐츠 유형에 단일 임베딩 모델을 사용하도록 지식 기반을 구성하고, 검색 전에 사용자 질문을 재구성하는 쿼리 확장을 구현합니다."]]},"en":{"q":"A GenAI developer is building a RAG system that uses Amazon Bedrock Knowledge Bases. The system needs to process 50 textbooks that are stored in an Amazon S3 bucket. The textbooks are all an average of 500 pages long. The system needs to generate a knowledge base to answer domain-specific customer questions. During initial testing on a subset of documents, the GenAI developer notices that query responses contain irrelevant information and sometimes miss critical context from the source materials. The GenAI developer must ensure that the solution provides accurate responses with low latency and no hallucinations.\nWhich solution will meet these requirements?","o":[["A","Configure fixed-size chunking with a 256-token chunk size. Implement metadata filtering based on document sections. Use an Amazon Titan Embeddings model to create vector representations that are optimized for semantic search."],["B","Use Amazon ElastiCache to implement semantic caching for common queries. Use Anthropic Claude Sonnet to reformulate user queries. Configure real-time model feedback loops to continuously improve response quality based on user interactions."],["C","Apply hierarchical chunking with both 200-token chunks and 1,000-token chunks. Implement hybrid search that combines vector and keyword search. Adjust the relevance score threshold to filter out low- confidence retrieval results."],["D","Use semantic chunking to automatically segment documents based on topic boundaries. Configure the knowledge base to use a single embedding model for all content types. Implement query expansion to reformulate user questions before retrieval."]]},"ex":{"c":"200토큰 하위 청크와 1,000토큰 상위 청크의 계층적 청킹은 정밀 검색과 충분한 맥락을 함께 제공합니다. 하이브리드 검색으로 키워드와 의미를 모두 반영하고, 관련성 점수 임계값으로 신뢰도가 낮은 결과를 걸러내 무관한 정보와 환각을 줄입니다.","w":{"A":"256토큰 고정 청크는 중요한 맥락을 놓칩니다.","B":"캐싱과 쿼리 재작성은 검색 품질 문제를 해결하지 못하고 실시간 피드백 루프는 구현 부담이 큽니다.","D":"쿼리 확장은 지연을 늘리고 저신뢰 결과 필터링이 없습니다."}}},{"n":152,"a":["C"],"orig":"","ko":{"q":"한 의료 회사가 Amazon Bedrock FM으로 임상의의 환자 임상 의사 결정을 돕는 다단계 워크플로를 운영합니다. 최근 데이터에 따르면 의사 결정 프로세스의 25%가 완료되지 않지만, 어느 워크플로 단계에서 실패가 발생하는지 파악하지 못하고 있습니다. 회사는 워크플로의 정확한 실패 지점을 식별하는 모니터링 솔루션을 구현해야 하며, 각 워크플로 단계의 완료율에 대한 상세 분석을 제공해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","워크플로의 InvocationServerErrors와 InvocationClientErrors 오류율을 모니터링하는 Amazon CloudWatch 경보를 구성합니다. 오류가 25%를 넘으면 알림을 보내고, 워크플로 단계별로 사용자 지정 지표를 구성합니다."],["B","Amazon Bedrock FM 워크플로에 AWS CloudTrail 로깅을 활성화합니다. 로그 패턴을 분석해 가장 자주 실패하는 워크플로 단계를 식별하는 예약된 Amazon Athena 쿼리를 만듭니다."],["C","InvokeAgent API 요청에 추적을 활성화해 OrchestrationTrace와 FailureTrace 객체를 수집합니다. 구조화된 추적 데이터로 각 워크플로 단계의 완료율을 계산하는 분석을 개발합니다."],["D","Amazon EventBridge로 상태 전환에 대한 워크플로 이벤트를 수집합니다. 이벤트 데이터를 Amazon S3에 저장하고, Amazon QuickSight로 각 워크플로 단계의 완료율을 보여주는 대시보드를 만듭니다."]]},"en":{"q":"A healthcare company runs a multi-step workflow that uses Amazon Bedrock foundation models (FMs) to assist clinicians with making patient clinical decisions. Recent data shows that 25% of decision processes fail to finish. However, the company cannot identify which specific workflow step is causing the failures. The company needs to implement a monitoring solution to identify the exact failure points in the workflow. The solution must provide detailed analytics for the completion rates of each workflow step.\nWhich solution will meet these requirements?","o":[["A","Configure Amazon CloudWatch alarms to monitor the workflow ' s InvocationServerErrors API and InvocationClientErrors API error rates. Set up notifications for when errors exceed 25%. Configure custom metrics to track each workflow step separately."],["B","Enable AWS CloudTrail logging for the Amazon Bedrock FM workflow. Create scheduled Amazon Athena queries that analyze log patterns to identify which steps of the workflow fail most frequently."],["C","Enable tracing for InvokeAgent API requests to capture OrchestrationTrace and FailureTrace objects. Develop analytics on the structured trace data to calculate completion rates for each workflow step."],["D","Use Amazon EventBridge to capture workflow events for state transitions. Store the event data in Amazon S3. Use Amazon QuickSight to create dashboards that display completion rates for each workflow step."]]},"ex":{"c":"InvokeAgent 요청에 추적을 켜면 OrchestrationTrace(단계별 추론·호출)와 FailureTrace(실패 원인과 지점) 같은 구조화된 추적 데이터를 얻습니다. 이를 분석하면 정확한 실패 지점과 단계별 완료율을 계산할 수 있습니다.","w":{"A":"API 오류율만으로는 어느 워크플로 단계에서 실패했는지 알 수 없습니다.","B":"CloudTrail에는 워크플로 단계별 실행 정보가 없습니다.","D":"상태 전환 이벤트를 직접 수집해야 하고 실패 원인이 포함되지 않습니다."}}},{"n":153,"a":["D"],"orig":"","ko":{"q":"한 미디어 회사가 매시간 수천 명의 사용자가 이미지와 텍스트 콘텐츠를 업로드하는 플랫폼을 출시합니다. 플랫폼은 Amazon Bedrock으로 업로드된 콘텐츠를 처리해 창작물을 생성합니다. 회사는 플랫폼이 부적절한 콘텐츠를 처리하거나 생성하지 않도록 하는 솔루션이 필요합니다. 창작물에 PII가 노출되어서는 안 되며, 솔루션은 회사의 기존 Amazon S3 스토리지 워크플로와 통합되어야 합니다.\n인프라 관리 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","Enhanced Monitoring 도구를 활성화합니다. Amazon CloudWatch 경보로 플랫폼 트래픽을 필터링하고, Amazon Comprehend PII 감지로 데이터를 전처리합니다. Amazon Comprehend PII 감지 이벤트를 모니터링하는 CloudWatch 경보를 만들고, Amazon Rekognition 이미지 검수 단계가 포함된 AWS Step Functions 워크플로를 만듭니다."],["B","요청 검증 템플릿이 있는 Amazon API Gateway HTTP API로 콘텐츠를 Amazon S3에 저장하기 전에 선별합니다. Amazon SageMaker AI로 사용자 지정 콘텐츠 검수 모델을 구축해, 처리된 콘텐츠를 Amazon Bedrock에 보내기 전에 콘텐츠를 처리합니다."],["C","사전 인증 AWS Lambda 함수로 콘텐츠 검수를 수행하는 Amazon Cognito 사용자 풀을 만듭니다. 사용자가 플랫폼에 콘텐츠를 업로드하기 전에 Amazon Textract로 텍스트 콘텐츠를, Amazon Rekognition으로 이미지 콘텐츠를 필터링합니다."],["D","기본 제공 Amazon Bedrock 가드레일로 콘텐츠를 필터링하는 AWS Step Functions 워크플로를 만듭니다. Amazon Comprehend PII 감지로 콘텐츠를 전처리하고, Amazon Rekognition 이미지 검수를 사용합니다."]]},"en":{"q":"A media company is launching a platform that allows thousands of users every hour to upload images and text content. The platform uses Amazon Bedrock to process the uploaded content to generate creative compositions. The company needs a solution to ensure that the platform does not process or produce inappropriate content. The platform must not expose personally identifiable information (PII) in the compositions. The solution must integrate with the company ' s existing Amazon S3 storage workflow.\nWhich solution will meet these requirements with the LEAST infrastructure management overhead?","o":[["A","Enable the Enhanced Monitoring tool. Use an Amazon CloudWatch alarm to filter traffic to the platform. Use Amazon Comprehend PII detection to pre-process the data. Create a CloudWatch alarm to monitor for Amazon Comprehend PII detection events. Create an AWS Step Functions workflow that includes an Amazon Rekognition image moderation step."],["B","Use an Amazon API Gateway HTTP API with request validation templates to screen content before storing the uploaded content in Amazon S3. Use Amazon SageMaker AI to build custom content moderation models that process content before sending the processed content to Amazon Bedrock."],["C","Create an Amazon Cognito user pool that uses pre-authentication AWS Lambda functions to run content moderation checks. Use Amazon Textract to filter text content and Amazon Rekognition to filter image content before allowing users to upload content to the platform."],["D","Create an AWS Step Functions workflow that uses built-in Amazon Bedrock guardrails to filter content. Use Amazon Comprehend PII detection to pre-process the content. Use Amazon Rekognition image moderation."]]},"ex":{"c":"Step Functions 워크플로에서 Bedrock Guardrails로 부적절한 콘텐츠를 필터링하고, Comprehend PII 탐지로 전처리하며, Rekognition 이미지 조정(moderation)으로 이미지를 검사합니다. 모두 서버리스 관리형 서비스라 기존 S3 워크플로에 쉽게 통합되고 인프라 관리가 거의 없습니다.","w":{"A":"'Enhanced Monitoring'과 CloudWatch 경보는 트래픽 필터링 수단이 아니며, 생성 결과에 대한 통제가 없습니다.","B":"요청 검증 템플릿은 콘텐츠를 검사하지 못하고, SageMaker 사용자 지정 모델은 관리 부담이 큽니다.","C":"Cognito 인증 전 Lambda는 업로드 콘텐츠를 검사하는 위치가 아니고, Textract는 콘텐츠 조정 도구가 아닙니다."}}},{"n":154,"a":["D"],"orig":"","ko":{"q":"한 금융 서비스 회사가 Amazon Bedrock으로 사기 탐지 시스템을 구축하고 있습니다. 이 시스템은 미국과 유럽에서 운영되는 여러 주식 거래 애플리케이션의 활동을 모니터링합니다. 시스템은 초당 1,000건의 거래를 500ms 미만의 응답 시간으로 처리해야 하고, 연결 장애 중에도 높은 가용성을 유지해야 합니다. 회사는 유럽 고객의 데이터가 유럽 기반 AWS 리전에서만 처리되도록 해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AWS Lambda 함수와 Amazon EKS 애플리케이션이 글로벌 추론 프로필과 함께 InvokeModel API를 사용하도록 구성합니다. Amazon Route 53 상태 확인을 사용하는 자동 장애 조치 시스템을 배포합니다. 전용 유럽 추론 프로필을 만들고 유럽 애플리케이션에 지역 교차 리전 추론을 활성화합니다. Amazon CloudWatch 경보로 사용률 지표를 모니터링합니다."],["B","모든 애플리케이션이 리전마다 별도로 Anthropic Claude 모델의 프로비저닝된 처리량과 함께 InvokeModel API를 사용하도록 구성합니다. 리전 용량과 응답 시간에 따라 트래픽을 분산하는 사용자 지정 Application Load Balancer를 설정하고, Amazon EventBridge 규칙으로 연결 장애를 처리하는 리전 장애 조치 메커니즘을 구현합니다."],["C","모든 애플리케이션이 온디맨드 처리량과 함께 InvokeModelWithResponseStream API를 사용하도록 구성합니다. 회사가 운영하는 각 위치에 리전 엔드포인트가 있는 Amazon API Gateway REST API를 배포해 가장 가까운 Amazon Bedrock 엔드포인트로 요청을 라우팅합니다. 미국과 유럽 애플리케이션용으로 별도의 IAM 역할을 만들고 리전별 권한을 부여합니다."],["D","미국 애플리케이션은 InvokeModel API와 프로비저닝된 처리량을 사용하도록 구성합니다. 유럽 애플리케이션은 데이터 주권을 보장하기 위해 유럽 전용 지역 추론 프로필을 사용하도록 구성합니다. 사용률 지표에 따라 프로비저닝된 용량의 자동 확장을 구성하고, Amazon EventBridge와 AWS Lambda 함수로 교차 리전 장애 조치 메커니즘을 구현합니다."]]},"en":{"q":"A financial services company is building a fraud detection system by using Amazon Bedrock. The system will monitor activity in multiple stock trading applications that run in the United States and Europe. The system must process 1,000 transactions every second with sub-500 ms response times. The system must also maintain high availability during connectivity disruptions. The company must ensure that data for European customers is processed only in AWS Regions that are based in Europe.\nWhich solution will meet these requirements?","o":[["A","Configure AWS Lambda functions and Amazon EKS applications to use the InvokeModel API with a global inference profile. Deploy an automated failover system that uses Amazon Route 53 health checks. Create a dedicated European inference profile and enable geographic cross-Region inference for European applications. Use Amazon CloudWatch alarms to monitor utilization metrics."],["B","Configure all applications to use the InvokeModel API with provisioned throughput for an Anthropic Claude model in each Region separately. Set up a custom Application Load Balancer to distribute traffic based on Regional capacity and response times. Implement a Regional failover mechanism that uses Amazon EventBridge rules to handle connectivity disruptions."],["C","Configure all applications to use the InvokeModelWithResponseStream API with on-demand throughput. Deploy an Amazon API Gateway REST API with Regional endpoints in each location where the company operates to route requests to the closest Amazon Bedrock endpoint. Create separate IAM roles for applications that run in the United States and Europe. Grant the IAM roles Region- specific permissions."],["D","Configure applications that run in the United States to use provisioned throughput with the InvokeModel API. Configure European applications to use a Europe-specific geographic inference profile to ensure data sovereignty. Configure automatic scaling for provisioned capacity based on utilization metrics. Use Amazon EventBridge and AWS Lambda functions to implement cross-Region failover mechanisms."]]},"ex":{"c":"미국 애플리케이션은 프로비저닝 처리량으로 초당 1,000건과 500ms 미만 응답을 보장하고, 유럽 애플리케이션은 유럽 전용 지리적 추론 프로필로 데이터를 유럽 리전 안에서만 처리합니다. 사용률 기반 자동 확장과 EventBridge·Lambda 장애 조치로 연결 장애 중에도 고가용성을 유지합니다.","w":{"A":"글로벌 추론 프로필은 유럽 데이터를 유럽 밖에서 처리할 수 있어 데이터 주권 요구에 어긋납니다.","B":"사용자 지정 ALB로 Bedrock 트래픽을 분산하는 것은 맞지 않고 운영이 복잡합니다.","C":"온디맨드만으로는 처리량을 보장하기 어렵고, 장애 조치 메커니즘이 없습니다."}}},{"n":155,"a":["B"],"orig":"","ko":{"q":"한 물류 회사가 화물 최적화를 자동화하는 에이전트형 GenAI 솔루션을 구축하고 있습니다. 솔루션은 여러 내부 및 외부 시스템에서 실시간으로 데이터를 가져와야 하고, 최적화 프로세스가 끝나기 전에 사람의 승인(human-in-the-loop) 단계를 포함해야 합니다. 통합 수와 로직이 늘어남에 따라 모듈식으로 확장할 수 있어야 합니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","모든 내부 데이터베이스와 외부 API를 직접 호출하는 LLM을 호스팅하는 Amazon SageMaker AI 엔드포인트를 사용합니다. 사람 검토 단계를 구현하는 UI를 사용자 지정 웹 애플리케이션으로 제공합니다."],["B","Strands Agents SDK와 Amazon Bedrock AgentCore로 계층형 시스템을 구축합니다. 조정 에이전트가 여러 전문 에이전트에 작업을 위임하도록 구성하고, MCP로 에이전트 간 메시징을 지원합니다. AWS Step Functions로 사람 승인 단계를 구현합니다."],["C","AWS Glue로 운영 데이터를 Amazon S3에 집계하고 Amazon Athena로 조회합니다. AWS Lambda 함수를 호출해 경로 배정을 생성하고, Amazon SNS로 감독 에이전트에 알림을 보냅니다."],["D","모든 내부 및 외부 시스템과 통합하는 AWS Lambda 기반 도구가 있는 단일 Amazon Bedrock AgentCore 에이전트를 사용합니다. AWS Step Functions로 승인 워크플로를 오케스트레이션합니다."]]},"en":{"q":"A logistics company is building an agentic GenAI-powered solution to automate freight optimization. The solution must retrieve data in real time from multiple internal and external systems. The solution must include a human-in-the-loop approval step before the optimization process is finished. The solution must support modular growth as the number of integrations and amount of logic increases.\nWhich solution will meet these requirements with the LEAST operational overhead?","o":[["A","Use an Amazon SageMaker AI endpoint that hosts a large language model (LLM) that directly calls all internal databases and external APIs. Use a custom web application that provides a UI to implement the human-in-the-loop review step."],["B","Build a hierarchical system by using the Strands Agents SDK and Amazon Bedrock AgentCore. Configure a coordinating agent to delegate tasks to multiple specialized agents. Use MCP to facilitate inter-agent messaging. Use AWS Step Functions to implement a human-in-the-loop approval step."],["C","Use AWS Glue to aggregate operational data into Amazon S3. Use Amazon Athena to query the data. Invoke an AWS Lambda function to generate route assignments. Use Amazon SNS to send notifications to supervisor agents."],["D","Use a single Amazon Bedrock AgentCore agent with AWS Lambda-based tools to integrate with all internal and external systems. Use AWS Step Functions to orchestrate the approval workflow."]]},"ex":{"c":"Strands Agents SDK와 AgentCore로 조정 에이전트가 전문 에이전트에게 작업을 위임하는 계층형 구조를 만들면 통합과 로직이 늘어도 모듈식으로 확장됩니다. MCP로 실시간 데이터·도구 접근과 에이전트 간 통신을 표준화하고, Step Functions로 사람 승인 단계를 구현합니다.","w":{"A":"LLM이 모든 시스템을 직접 호출하는 구조는 확장성과 보안 면에서 부적절하고, 사용자 지정 UI 부담이 큽니다.","C":"Glue·Athena 배치 처리는 실시간 데이터 검색이 아니고 에이전트형 솔루션도 아닙니다.","D":"단일 에이전트에 모든 통합을 몰아넣으면 모듈식 확장이 어렵습니다."}}},{"n":156,"a":["B"],"orig":"D","ko":{"q":"한 회사가 전 세계 사용자가 새 레스토랑을 찾도록 돕는 서비스를 제공하며 월간 활성 사용자는 5,000만 명입니다. 회사는 2,000만 개의 레스토랑과 2억 건의 리뷰가 있는 데이터베이스 전반에 의미 검색 솔루션을 구현하려고 합니다. 데이터는 현재 PostgreSQL에 저장되어 있습니다. 솔루션은 복잡한 자연어 쿼리를 지원하고 쿼리의 95% 이상에 대해 500ms 이내에 결과를 반환해야 합니다. 매시간 업데이트되는 레스토랑 정보의 최신성을 유지해야 하고, 피크 시간에도 비용 효율적으로 확장되어야 합니다.\n개발 노력이 가장 적은 솔루션은 무엇입니까?","o":[["A","레스토랑 데이터를 Amazon OpenSearch Service로 마이그레이션합니다. 사용자 지정 분석기와 관련성 튜닝을 사용하는 키워드 기반 검색 규칙을 구현해 요리 유형, 특징, 위치 같은 속성으로 레스토랑을 찾습니다. 사용자 쿼리를 구조화된 검색 파라미터로 변환하는 Amazon API Gateway HTTP API 엔드포인트를 만듭니다."],["B","레스토랑 데이터를 Amazon OpenSearch Service로 마이그레이션합니다. Amazon Bedrock의 FM으로 레스토랑 설명, 리뷰, 메뉴 항목의 벡터 임베딩을 생성합니다. 사용자가 자연어 쿼리를 제출하면 같은 FM으로 쿼리를 임베딩으로 변환하고, k-NN(k-최근접 이웃) 검색으로 의미가 유사한 결과를 찾습니다."],["C","레스토랑 데이터를 PostgreSQL에 그대로 두고 pgvector 확장을 구현합니다. Amazon Bedrock의 FM으로 레스토랑 데이터의 벡터 임베딩을 생성해 PostgreSQL에 직접 저장합니다. 같은 FM으로 자연어 쿼리를 벡터로 변환하는 AWS Lambda 함수를 만들고, 이 함수가 데이터베이스 내에서 유사도 검색을 수행하도록 구성합니다."],["D","사용자 지정 수집 파이프라인으로 레스토랑 데이터를 Amazon Bedrock 지식 기반으로 마이그레이션합니다. 지식 기반이 레스토랑 정보에서 임베딩을 자동 생성하도록 구성하고, 기본 벡터 검색 기능이 있는 Amazon Bedrock Retrieve API로 자연어 입력을 사용해 지식 기반을 직접 조회합니다."]]},"en":{"q":"A company provides a service that helps users from around the world discover new restaurants. The service has 50 million monthly active users. The company wants to implement a semantic search solution across a database that contains 20 million restaurants and 200 million reviews. The company currently stores the data in a PostgreSQL database. The solution must support complex natural language queries and return results for at least 95% of queries within 500 ms. The solution must maintain data freshness for restaurant details that update hourly. The solution must also scale cost-effectively during peak usage periods.\nWhich solution will meet these requirements with the LEAST development effort?","o":[["A","Migrate the restaurant data to Amazon OpenSearch Service. Implement keyword-based search rules that use custom analyzers and relevance tuning to find restaurants based on attributes such as cuisine type, feature, and location. Create Amazon API Gateway HTTP API endpoints to transform user queries into structured search parameters."],["B","Migrate the restaurant data to Amazon OpenSearch Service. Use a foundation model (FM) in Amazon Bedrock to generate vector embeddings from restaurant descriptions, reviews, and menu items. When users submit natural language queries, convert the queries to embeddings by using the same FM. Perform k-nearest neighbors (k-NN) searches to find semantically similar results."],["C","Keep the restaurant data in PostgreSQL and implement a pgvector extension. Use a foundation model (FM) in Amazon Bedrock to generate vector embeddings from restaurant data. Store the vector embeddings directly in PostgreSQL. Create an AWS Lambda function to convert natu ral language queries to vector representations by using the same FM. Configure the Lambda function to perform similarity searches within the database."],["D","Migrate the restaurant data to an Amazon Bedrock knowledge base by using a custom ingestion pipeline. Configure the knowledge base to automatically generate embeddings from restaurant information. Use the Amazon Bedrock Retrieve API with built-in vector search capabilities to query the knowledge base directly by using natural language input."]]},"ex":{"c":"56번과 같은 문제입니다. OpenSearch Service의 k-NN 벡터 검색과 Bedrock 임베딩으로 대규모 시맨틱 검색을 저지연으로 제공하고, 시간별 업데이트도 인덱스에 반영할 수 있습니다.","w":{"A":"키워드 기반 검색은 복잡한 자연어 질의를 처리하지 못합니다.","C":"이 규모에서 pgvector는 500ms 성능과 비용 효율적 확장을 맞추기 어렵습니다.","D":"사용자 지정 수집 파이프라인이 필요하고 대규모 저지연 검색에 덜 적합합니다."}}},{"n":157,"a":["D"],"orig":"","ko":{"q":"한 소매 회사가 웹사이트에서 고객에게 상품을 추천하는 애플리케이션을 운영합니다. 이 애플리케이션은 프롬프트를 동적으로 구성해 FM에 보내는 방식으로 Amazon Bedrock에서 추천을 생성합니다. GenAI 개발자가 FM이 응답을 생성할 때 특정 프로모션 메시지를 포함하도록 지시하는 업데이트를 배포했습니다. 테스트해 보니 프로모션 메시지가 응답에 항상 나타나지는 않고, 나타나더라도 나머지 텍스트와 자연스럽게 이어지지 않는 경우가 있습니다. GenAI 개발자는 프로모션 메시지가 FM 응답에 항상 나타나도록 해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","프롬프트에 Amazon Bedrock Guardrails 필터를 사용하고 입력 필터 강도를 HIGH로 설정합니다."],["B","프로모션 메시지를 다양한 방식으로 포함한 여러 응답 변형을 생성합니다. 리랭커 모델로 원래 프롬프트와의 관련성을 기준으로 가장 일관된 버전을 선택합니다."],["C","프롬프트를 Amazon Bedrock에서 실행합니다. Amazon Bedrock AgentCore로 응답을 처리해 프로모션 메시지를 추가합니다. 원래 프롬프트와 원하는 메시지를 컨텍스트로 사용해 결과를 리랭킹합니다."],["D","FM에 보내는 프롬프트에 출력 지시자(output indicator)를 사용해, 상품 추천 안에 새 프로모션 메시지를 포함하라는 요구 사항을 강화합니다."]]},"en":{"q":"A retail company runs an application that makes product recommendations to customers on the company's website. The application uses Amazon Bedrock to generate recommendations by dynamically constructing prompts and sending them to foundation models (FMs). A GenAI developer has deployed an update to the application that instructs the FM to include a specific promotional message when the FM generates a response to prompts. When the developer tests the application, the promotional message does not always appear in the responses. When the promotional message does appear, it does not always flow with the rest of the text. The GenAI developer must ensure that the promotional message always appears in the FM responses.\nWhich solution will meet this requirement?","o":[["A","Use an Amazon Bedrock Guardrails filter on the prompt. Set the input filter strength to HIGH."],["B","Generate multiple response variants that include the promotional message in different ways. Use a reranker model to select the most coherent version based on relevance to the original prompt."],["C","Run the prompt through Amazon Bedrock. Process the response through Amazon Bedrock AgentCore to add the promotional message. Rerank the results by using the original prompt and the desired message as context."],["D","Reinforce the requirement to include the new promotional message within product recommendations by using an output indicator in prompts to the FM."]]},"ex":{"c":"27번과 같은 문제입니다. 프롬프트에 출력 지시자(output indicator)를 넣어 홍보 메시지를 추천 내용 안에 포함하도록 출력 형식을 명시하면 메시지가 일관되게, 자연스러운 흐름으로 나타납니다.","w":{"A":"Guardrails 입력 필터는 문구를 포함시키지 않습니다.","B":"여러 변형 생성과 재순위화는 비용이 크고 포함을 보장하지 않습니다.","C":"AgentCore는 응답 후처리용이 아니며 사후 추가는 흐름이 부자연스럽습니다."}}},{"n":158,"a":["B"],"orig":"","ko":{"q":"한 금융 서비스 회사가 Amazon Bedrock으로 분기 보고서를 처리하는 문서 분석 시스템을 구축해야 합니다. 시스템은 보고서 배치 전반에 걸쳐 재무 데이터를 분석하고, 감정 분석을 수행하며, 규정 준수를 검증해야 합니다. 배치 하나에는 보고서 5개가 있고, 각 보고서는 여러 번의 FM 호출이 필요합니다. 솔루션은 배치마다 10초 이내에 분석을 완료해야 하지만, 현재 순차 처리로는 배치당 45초가 걸립니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","프로비저닝된 동시성이 있는 AWS Lambda 함수로 분석 유형별로 순차 처리합니다. Lambda 함수 타임아웃을 10초로 구성하고, 지수 백오프가 있는 자동 재시도를 구성합니다."],["B","Parallel 상태가 있는 AWS Step Functions로 분석 유형별 AWS Lambda 함수를 동시에 호출합니다. Amazon Bedrock 클라이언트 타임아웃을 구성하고, Amazon CloudWatch 지표로 실행 시간과 모델 추론 지연 시간을 추적합니다."],["C","분석 요청을 버퍼링하는 Amazon SQS 대기열을 만듭니다. 예약된 동시성이 있는 여러 AWS Lambda 함수를 배포하고, 각 함수가 보고서의 서로 다른 측면을 순차 처리한 뒤 결과를 결합하도록 구성합니다."],["D","각 보고서를 순차 처리하는 컨테이너를 실행하는 Amazon ECS 클러스터를 배포합니다. 로드 밸런서로 배치 워크로드를 분산하고, CPU 사용률 기반 자동 확장 정책을 구성합니다."]]},"en":{"q":"A financial services company needs to build a document analysis system that uses Amazon Bedrock to process quarterly reports. The system must analyze financial data, perform sentiment analysis, and validate compliance across batches of reports. Each batch contains 5 reports. Each report requires multiple foundation model (FM) calls. The solution must finish the analysis within 10 seconds for each batch. Current sequential processing takes 45 seconds for each batch.\nWhich solution will meet these requirements?","o":[["A","Use AWS Lambda functions with provisioned concurrency to process each analysis type sequentially. Configure the Lambda function timeouts to 10 seconds. Configure automatic retries with exponential backoff."],["B","Use AWS Step Functions with a Parallel state to invoke separate AWS Lambda functions for each analysis type simultaneously. Configure Amazon Bedrock client timeouts. Use Amazon CloudWatch metrics to track execution time and model inference latency."],["C","Create an Amazon SQS queue to buffer analysis requests. Deploy multiple AWS Lambda functions with reserved concurrency. Configure each Lambda function to process different aspects of each report sequentially and then combine the results."],["D","Deploy an Amazon ECS cluster that runs containers that process each report sequentially. Use a load balancer to distribute batch workloads. Configure an auto-scaling policy based on CPU utilization."]]},"ex":{"c":"Step Functions Parallel 상태로 분석 유형별 Lambda를 동시에 실행하면 순차 처리 45초를 10초 안으로 줄일 수 있습니다. Bedrock 클라이언트 타임아웃으로 지연 호출을 통제하고, CloudWatch로 실행 시간과 추론 지연을 추적합니다.","w":{"A":
