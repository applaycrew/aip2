olds."],["B","Use AWS Lambda functions to invoke various Amazon Bedrock model versions. Use an Amazon API Gateway HTTP API with stage variables and weighted routing to shift traffic gradually. Use Amazon CloudWatch to monitor performance. Use external logic to adjust traffic and roll back if performance falls below thresholds."],["C","Use Amazon SageMaker AI endpoint variants to represent multiple Amazon Bedrock model versions. Use variant weights to shift traffic. Use Amazon CloudWatch and SageMaker Model Monitor to trigger rollbacks. Use EventBridge to roll back deployments if an anomaly is detected."],["D","Use Amazon OpenSearch Service to track inference logs. Configure OpenSearch Service to invoke an AWS Systems Manager Automation runbook to update Amazon Bedrock model endpoints to shift traffic based on inference logs."]]},"ex":{"c":"Step Functions 워크플로가 단계별로 트래픽을 옮기고, 대기 후 Lambda로 CloudWatch 지표를 확인해 임계값을 충족하면 트래픽을 늘리고 미달하면 자동 롤백합니다. EventBridge로 새 모델 버전 출시 시 자동 시작되므로 수동 개입 없이 점진적 카나리 배포와 자동 중단·복구가 가능합니다.","w":{"B":"'외부 로직'으로 조정·롤백하므로 자동화 범위가 불명확하고, HTTP API에는 가중치 라우팅 기능도 없습니다.","C":"SageMaker 엔드포인트 변형은 Bedrock 모델 버전을 표현할 수 없습니다.","D":"Bedrock에는 트래픽을 가중 분할하는 '모델 엔드포인트' 개념이 없고, 로그 기반으로는 상태 판단이 어렵습니다."}}},{"n":21,"a":["C"],"orig":"","ko":{"q":"한 법률 연구 회사가 Amazon Bedrock과 Amazon OpenSearch Service를 사용하는 RAG 애플리케이션을 운영합니다. 이 애플리케이션은 법령, 판결문, 사건 요약 등 1,500만 건의 법률 문서에 대한 768차원 벡터 임베딩을 저장합니다. 현재 청킹 전략은 텍스트를 500토큰의 고정 길이 블록으로 나누는데, 이로 인해 법적 논증, 법원 의견, 법령 참조처럼 맥락상 연결된 정보가 서로 다른 청크로 쪼개지는 경우가 많습니다. 연구자들은 생성된 출력이 핵심 맥락을 빠뜨리거나 오래된 법률 정보를 인용한다고 보고합니다. 최근 로그에서는 응답 시간이 40% 증가했고 p95 지연 시간이 2초를 넘습니다. 회사는 1년 안에 스토리지가 90GB에서 360GB로 늘어날 것으로 예상합니다. 회사는 대규모 환경에서 검색 관련성과 시스템 성능을 개선할 솔루션이 필요합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","기존 청킹이나 전처리 전략은 바꾸지 않고 임베딩 벡터 차원을 768에서 4,096으로 늘립니다."],["B","동적 검색을 Amazon S3에 저장한 정적인 사전 작성 요약으로 대체합니다. Amazon CloudFront로 요약을 제공해 컴퓨팅 수요를 줄이고 예측 가능성을 높입니다."],["C","고정 토큰 한도 대신 완결된 법적 논증, 조항, 섹션 같은 의미 경계를 사용하도록 청킹 전략을 변경합니다. 새 청크 구조에 맞게 벡터 임베딩을 다시 생성합니다."],["D","OpenSearch Service에서 Amazon DynamoDB로 마이그레이션합니다. 법률 개념을 빠르게 조회하도록 키워드 기반 인덱스를 구현합니다."]]},"en":{"q":"A legal research company has a Retrieval Augmented Generation (RAG) application that uses Amazon Bedrock and Amazon OpenSearch Service. The application stores 768-dimensional vector embeddings for 15 million legal documents, including statutes, court rulings, and case summaries. The company ' s current chunking strategy segments text into fixed-length blocks of 500 tokens. The current chunking strategy often splits contextually linked information such as legal arguments, court opinions, or statute references across separate chunks. Researchers report that generated outputs frequently omit key context or cite outdated legal information. Recent application logs show a 40% increase in response times. The p95 latency metric exceeds 2 seconds. The company expects storage needs for the application to grow from 90 GB to 360 GB within a year. The company needs a solution to improve retrieval relevance and system performance at scale.\nWhich solution will meet these requirements?","o":[["A","Increase the embedding vector dimensionality from 768 to 4,096 without changing the existing chunking or pre-processing strategy."],["B","Replace dynamic retrieval with static, pre-written summaries that are stored in Amazon S3. Use Amazon CloudFront to serve the summaries to reduce compute demand and improve predictability."],["C","Update the chunking strategy to use semantic boundaries such as complete legal arguments, clauses, or sections rather than fixed token limits. Regenerate vector embeddings to align with the new chunk structure."],["D","Migrate from OpenSearch Service to Amazon DynamoDB. Implement keyword-based indexes to enable faster lookups for legal concepts."]]},"ex":{"c":"고정 길이 청크가 법률 논증·조항을 쪼개 맥락이 끊기는 것이 핵심 문제입니다. 논증·조항·절 같은 의미 단위로 청크를 나누고 임베딩을 다시 생성하면 검색 관련성이 높아지고, 불필요한 조각 검색이 줄어 성능도 개선됩니다.","w":{"A":"차원을 4,096으로 늘리면 저장 공간과 지연 시간만 커지고 청크 분할 문제는 그대로입니다.","B":"정적 요약은 최신 법률 정보를 반영하지 못하고 RAG의 목적에 어긋납니다.","D":"DynamoDB 키워드 인덱스로는 의미 기반 검색이 불가능합니다."}}},{"n":22,"a":["B"],"orig":"","ko":{"q":"한 의료 회사가 민감한 환자 기록과 대화를 요약하고 이에 관한 질문에 답하는, 자체 아키텍처의 사용자 지정 FM을 만들었습니다. 규제를 준수하기 위해 광범위한 모니터링과 통제로 기밀성을 보장해야 합니다. 또한 프롬프트와 응답에서 환각(hallucination)을 확인해 FM의 정확성을 검증해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock의 Custom Model Import 기능으로 FM을 가져옵니다. 근거성(grounding)과 관련성에 높은 임계값을 둔 콘텐츠 필터를 적용하는 Amazon Bedrock 가드레일을 구성합니다."],["B","Amazon SageMaker Serverless Inference로 모델을 호스팅합니다. 근거성과 관련성에 높은 임계값을 둔 컨텍스트 근거성 검사(contextual grounding check)를 적용하는 Amazon Bedrock 가드레일을 구성합니다. 사용자 지정 애플리케이션 코드로 프롬프트와 응답이 가드레일을 거치도록 라우팅합니다."],["C","Amazon SageMaker JumpStart로 FM을 Amazon Bedrock에 가져옵니다. 근거성과 관련성에 높은 임계값을 둔 콘텐츠 필터를 적용하는 Amazon Bedrock 가드레일을 구성합니다."],["D","Amazon Bedrock의 Custom Model Import 기능으로 FM을 가져옵니다. 규제 요구 사항을 준수하도록 AWS HealthScribe에서 컨텍스트 근거성 검사 규칙을 적용합니다."]]},"en":{"q":"A healthcare company creates a custom foundation model (FM) that uses a proprietary architecture to summarize and answer questions about sensitive patient records and conversations. To comply with regulations, the company must ensure confidentiality by implementing extensive monitoring and controls. The company must verify the accuracy of the FM by checking prompts and responses for hallucinations.\nWhich solution will meet these requirements?","o":[["A","Use the Custom Model Import feature in Amazon Bedrock to import the FM. Configure Amazon Bedrock guardrails that apply content filters with high thresholds for grounding and relevance."],["B","Use Amazon SageMaker Serverless Inference to host the model. Configure Amazon Bedrock guardrails that apply contextual grounding checks with high thresholds for grounding and relevance. Use custom application code that routes prompts and responses through the guardrails."],["C","Use Amazon SageMaker JumpStart to import the FM to Amazon Bedrock. Configure Amazon Bedrock guardrails that apply content filters with high thresholds for grounding and relevance."],["D","Use the Custom Model Import feature in Amazon Bedrock to import the FM. Configure AWS HealthScribe to apply contextual grounding check rules to comply with regulatory requirements."]]},"ex":{"c":"독자 아키텍처 모델은 Custom Model Import가 지원하는 아키텍처(Llama, Mistral 등)에 해당하지 않으므로 SageMaker에 호스팅해야 합니다. Bedrock Guardrails의 ApplyGuardrail API는 Bedrock 외부 모델에도 쓸 수 있어, 애플리케이션 코드에서 프롬프트와 응답을 가드레일에 통과시키고 컨텍스트 근거성(grounding) 검사로 환각을 확인합니다.","w":{"A":"Custom Model Import는 독자 아키텍처를 지원하지 않으며, 환각 검사는 콘텐츠 필터가 아니라 컨텍스트 근거성 검사입니다.","C":"JumpStart는 모델을 Bedrock으로 가져오는 기능이 아니며 콘텐츠 필터는 환각을 검사하지 않습니다.","D":"HealthScribe는 임상 대화 기록 서비스로 근거성 검사 기능이 없습니다."}}},{"n":23,"a":["C"],"orig":"","ko":{"q":"한 의료 회사가 Amazon Bedrock 기반 AI 임상 어시스턴트를 개발하고 있습니다. 오프라인 품질 평가와 회귀 분석을 위해 모델 입력과 출력을 추적하는 솔루션이 필요합니다. 솔루션은 모든 모델 추론 및 의사 결정 이벤트에 대해 중앙 집중식의 변경 불가능한 감사 기록을 제공해야 합니다. 또한 평가와 감사 중에도 대화형 지연 시간이 안정적으로 유지되도록 런타임 오버헤드가 최소여야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon SageMaker Model Registry로 모델 버전을 추적합니다. Amazon Macie로 아티팩트를 분류하고, 추론 출력을 Amazon CloudWatch Logs에 기록합니다. 매월 수동으로 품질 검토를 수행합니다."],["B","AWS CloudTrail로 API 호출을 기록하고, 버전 관리가 활성화된 Amazon S3 버킷에 API 호출 로그를 저장합니다. 오프라인 평가 없이 AWS AppConfig 기능 플래그로 간단한 온라인 분할 테스트를 수행합니다."],["C","Amazon Bedrock 모델 호출 로그를 Amazon CloudWatch Logs와 Amazon S3로 보냅니다. Amazon Bedrock 및 Amazon S3 데이터 이벤트에 대해 AWS CloudTrail을 활성화합니다. 로그를 S3 Object Lock이 활성화된 버킷에 저장하고, Amazon Bedrock 모델 평가를 오프라인으로 실행합니다."],["D","AWS Glue Data Catalog에 데이터세트 계보를 기록합니다. 추론 페이로드는 일반 Amazon S3 버킷에 저장합니다. 프로덕션에서 요청마다 심사(judge) LLM으로 응답을 채점합니다."]]},"en":{"q":"A healthcare company is developing an Amazon Bedrock-based AI clinical assistant. The company needs a solution to track model inputs and outputs so the company can perform offline quality evaluation and regression analysis. The solution must provide centralized, immutable audit records of all model inference and decision events. The company needs a solution that requires minimal runtime overhead so interactive latency remains stable during evaluation and auditing.\nWhich solution will meet these requirements?","o":[["A","Use Amazon SageMaker Model Registry to track model versions. Use Amazon Macie to classify artifacts. Write inference outputs to Amazon CloudWatch Logs. Manually perform monthly quality reviews."],["B","Use AWS CloudTrail to record API calls. Store logs of API calls in an Amazon S3 bucket that has versioning enabled. Use AWS AppConfig feature flags to perform simple online splits without offline evaluation."],["C","Send logs for Amazon Bedrock model invocations to Amazon CloudWatch Logs and Amazon S3. Enable AWS CloudTrail for Amazon Bedrock and Amazon S3 data events. Store logs in an S3 bucket that has Object Lock enabled. Run Amazon Bedrock model evaluations offline."],["D","Capture dataset lineage in AWS Glue Data Catalog. Store inference payloads in standard Amazon S3 buckets. Use a judge large language model (LLM) to score responses in production for each request."]]},"ex":{"c":"Bedrock 모델 호출 로깅을 CloudWatch Logs와 S3로 보내면 런타임 지연 없이 입출력이 비동기로 기록됩니다. CloudTrail 데이터 이벤트로 감사 기록을 남기고, S3 Object Lock으로 변경 불가능(immutable)하게 보관하며, Bedrock 모델 평가를 오프라인으로 실행해 회귀 분석을 합니다.","w":{"A":"월간 수동 검토는 체계적인 오프라인 평가가 아니며 불변 저장소도 없습니다.","B":"버전 관리만으로는 불변성을 보장하지 못하고 오프라인 평가가 없습니다.","D":"요청마다 판정 LLM으로 채점하면 지연 시간이 커지고, 일반 S3 버킷은 불변 저장소가 아닙니다."}}},{"n":24,"a":["C"],"orig":"","ko":{"q":"한 미디어 회사가 Amazon Bedrock으로 AI 콘텐츠 검수 시스템을 구축하고 있습니다. 시스템은 먼저 작고 지연 시간이 짧은 모델로 텍스트를 분류한 뒤, 신뢰도 점수가 0.65 미만인 요청은 더 크고 비싼 모델로 넘깁니다. 신뢰도가 높은 결과에는 거의 실시간으로 응답해야 하며, 신뢰도가 낮은 요청은 비동기로 처리해야 합니다. 시스템은 갑작스러운 수요 급증에 맞춰 확장되어야 합니다. 회사는 필요할 때만 큰 모델을 호출해 비용을 최적화하고, 분리된(decoupled) 구성 요소로 높은 복원력을 확보하려고 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon API Gateway로 작은 모델을 동기식으로 호출합니다. 작은 모델의 신뢰도 점수가 0.65 미만이면 큰 모델을 동기식으로 호출합니다. 트래픽 급증은 프로비저닝된 동시성으로 처리합니다."],["B","모든 요청에 대해 작은 모델과 큰 모델을 모두 실행하는 병렬 분기가 있는 AWS Step Functions 워크플로를 사용합니다. 신뢰도 점수가 다르면 큰 모델의 결과를 선택합니다."],["C","요청을 Amazon SQS 대기열로 보냅니다. AWS Fargate로 메시지를 처리하며 먼저 작은 모델을 호출합니다. 신뢰도 점수가 0.65 미만이면 요청을 두 번째 SQS 대기열에 넣어 큰 모델로 비동기 처리합니다."],["D","두 모델을 Amazon EC2 인스턴스에 배포하고 Auto Scaling을 활성화합니다. 문장 길이와 키워드 규칙에 기반한 사용자 지정 휴리스틱으로 요청을 적절한 인스턴스로 라우팅합니다."]]},"en":{"q":"A media company is building an AI-powered content moderation system by using Amazon Bedrock. The system first classifies text by using a small, low-latency model. Then the system escalates requests that have a confidence score below 0.65 to a larger, more expensive model. The system must respond in near real time for high-confidence results. The system must process lowconfidence requests asynchronously. The system must scale to meet sudden spikes in demand. The company wants to optimize costs for the system by invoking the larger model only when required. The company wants to use decoupled components to achieve high resiliency for the system.\nWhich solution will meet these requirements?","o":[["A","Use Amazon API Gateway to invoke the small model synchronously. If the small model's confidence score is below 0.65, synchronously call the larger model. Use provisioned concurrency to handle traffic spikes."],["B","Use an AWS Step Functions workflow that has parallel branches to run both the small model and the large model for every request. Choose the large model result when confidence score values differ."],["C","Send requests to an Amazon SQS queue. Use AWS Fargate to process messages. Invoke the small model first. If the confidence score is below 0.65, place the request in a second SQS queue to process asynchronously by using the large model."],["D","Deploy both models on Amazon EC2 instances and enable auto scaling. Use a custom application heuristic to route requests to the appropriate instance based on phrase length and keyword rules."]]},"ex":{"c":"SQS로 구성 요소를 분리하고 Fargate가 메시지를 처리하며 수요 급증에 맞춰 확장합니다. 작은 모델로 먼저 분류하고 신뢰도가 0.65 미만인 요청만 두 번째 큐에 넣어 큰 모델이 비동기로 처리하므로, 비용 최적화·비동기 처리·복원력 요구를 모두 충족합니다.","w":{"A":"저신뢰 요청까지 동기 호출하므로 비동기 요구에 어긋나고 구성 요소가 분리되지 않습니다.","B":"모든 요청에 큰 모델을 실행하면 비용 최적화 목표에 정면으로 어긋납니다.","D":"EC2 직접 호스팅은 운영 부담이 크고 신뢰도가 아닌 휴리스틱으로 라우팅합니다."}}},{"n":25,"a":["C"],"orig":"","ko":{"q":"한 금융 서비스 회사가 고객에게 투자 안내를 제공하는 Amazon Bedrock 기반 AI 어시스턴트를 운영합니다. 최근 감사에서 인종 및 성별 편향 응답이 발견되었고, 감사자들은 여러 사례를 잠재적 규제 준수 위험으로 지적했습니다. 회사는 편향된 출력을 제거하는 30일 개선 계획을 시행해야 하며, 이 계획은 모델 정확도를 유지하고 지연 시간을 고객 경험상 허용 범위 내로 유지해야 합니다. GenAI 개발자는 규제 위험, 운영 확장성, 모델에 종속되지 않는 적용 사이의 균형을 맞춘 장기 솔루션을 설계해야 합니다. 솔루션은 편향 완화 조치를 우회할 수 없도록 추론 시점에 강제되는 통제를 적용해야 합니다. 감사와 규제 검토를 위해 추론마다 로그를 남겨야 하고, 지속적인 자동 편향 모니터링을 지원해야 합니다. 30일 이내에 모델 재학습이 필요해서는 안 되며, 추론 지연 시간 증가는 최소여야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon SageMaker Clarify로 오프라인 편향 보고서를 생성합니다. 규정 준수 팀과 매주 수동 검토를 진행해 공정성 추세를 평가하고 모델 조정을 권고합니다."],["B","AWS Lambda로 모델 출력을 평가하는 사용자 지정 공정성 분류기를 만듭니다. 분류기 점수를 Amazon DynamoDB에 저장하고, 공정성 임계값 미만인 응답을 차단합니다."],["C","AWS Lambda로 인구통계 공정성 기준에 따라 모델 출력을 평가하는 사용자 지정 공정성 분류기를 만듭니다. 분류기 점수를 Amazon DynamoDB에 저장하고 점수의 메타데이터를 추적합니다. 공정성 임계값 미만인 응답을 차단하고, 플래그가 지정된 사례는 고객에게 응답을 전달하기 전에 규정 준수 팀의 수동 검토로 보냅니다."],["D","모든 응답을 Amazon API Gateway와 AWS WAF로 라우팅합니다. AWS WAF가 사용자 지정 관리형 규칙 그룹으로 편향된 용어를 감지해 허용되지 않은 응답을 차단하도록 구성합니다. AWS CloudTrail Lake로 장기 트래픽 추세를 분석합니다."]]},"en":{"q":"A financial services company provides an Amazon Bedrock-powered AI assistant that provides investment guidance to customers. Recent audits found racially and gender-biased responses. Auditors flagged several cases as potential regulatory compliance risks. The company must implement a 30-day remediation plan to eliminate biased outputs. The plan must preserve model accuracy and keep latency within acceptable customer-experience thresholds. A GenAI developer must design a long-term solution that balances regulatory risks, operational scalability, and model-agnostic enforcement. The solution must apply enforceable at-inference-time controls so bias mitigation measures cannot be bypassed. The solution must provide logging for each inference for audit and regulatory reviews. The solution must support ongoing automated bias monitoring. The solution must not require any model re-training within 30 days. The solution must add minimal inference latency.\nWhich solution will meet these requirements?","o":[["A","Use Amazon SageMaker Clarify to generate offline bias reports. Schedule weekly manual reviews with compliance teams to evaluate fairness trends and recommend model adjustments."],["B","Use AWS Lambda to build a custom fairness classifier that evaluates model outputs. Store classifier scores in Amazon DynamoDB. Block responses that fall below the fairness threshold."],["C","Use AWS Lambda to build a custom fairness classifier that evaluates model outputs against demographic fairness criteria. Store classifier scores in Amazon DynamoDB. Track metadata for the scores. Block responses that fall below the fairness threshold. Route flagged cases to compliance teams for manual reviews before delivering responses to customers."],["D","Route all responses through Amazon API Gateway and AWS WAF. Configure AWS WAF to use a custom managed rule group to detect biased terms and to block disallowed responses. Use AWS CloudTrail Lake to analyze long-term traffic trends."]]},"ex":{"c":"Lambda 기반 공정성 분류기를 추론 경로에 두면 모델에 상관없이 우회할 수 없는 추론 시점 통제가 되고, 기준 미달 응답을 차단합니다. DynamoDB에 점수와 메타데이터를 저장해 추론별 감사 로그와 지속적 자동 모니터링을 제공하며, 플래그된 사례를 규정 준수 팀이 검토하게 합니다. 재학습이 필요 없습니다.","w":{"A":"오프라인 보고서와 주간 수동 검토는 추론 시점 통제가 아닙니다.","B":"C와 비슷하지만 메타데이터 추적과 규정 준수 검토 경로가 없어 감사 요구를 충분히 충족하지 못합니다.","D":"WAF는 응답 본문의 편향을 의미 수준에서 탐지할 수 없습니다."}}},{"n":26,"a":["B"],"orig":"","ko":{"q":"한 전자상거래 회사가 Amazon Bedrock으로 GenAI 애플리케이션을 구축하고 있습니다. 이 애플리케이션은 AWS Step Functions로 멀티 에이전트 워크플로를 오케스트레이션해 상세한 상품 설명을 생성합니다. 워크플로는 설명 생성기, 기술 사양 검증기, 브랜드 보이스 일관성 검사기의 세 가지 순차 상태로 구성됩니다. 각 상태는 중간 추론 기록과 출력을 생성해 다음 상태로 전달합니다. 애플리케이션은 처리용 스토리지와 출력 저장에 Amazon S3 버킷을 사용합니다. 테스트 중 Step Functions 상태 간 출력이 256KB 할당량을 자주 초과해 워크플로가 실패하는 것이 발견되었습니다. GenAI 개발자는 Step Functions 256KB 할당량을 효율적으로 처리하고 워크플로 관측성을 유지하도록 아키텍처를 수정해야 합니다. 수정된 아키텍처는 기존 멀티 에이전트 ReAct(reasoning and acting) 패턴을 유지해야 합니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","중간 출력을 Amazon DynamoDB에 저장하고 상태 간에는 참조만 전달합니다. 각 에이전트 처리 단계에서 필요할 때 DynamoDB에서 전체 데이터를 가져오는 Map 상태를 만듭니다."],["B","큰 출력에 대해 입력 파라미터에 S3 버킷 URI를 사용하도록 Amazon Bedrock 통합을 구성합니다. ResultPath와 ResultSelector 필드로 에이전트 단계 간에 S3 참조를 라우팅하면서 순차 검증 워크플로를 유지합니다."],["C","각 에이전트 상태 전에 AWS Lambda 함수로 출력을 256KB 미만으로 압축합니다. 각 에이전트 작업이 처리 전에 압축을 풀고, 다음 상태로 넘기기 전에 결과를 압축하도록 구성합니다."],["D","에이전트별 처리를 담당하는 별도의 Step Functions 상태 머신을 구성합니다. Amazon EventBridge로 상태 머신 간 실행 흐름을 조정하고, 출력의 S3 참조를 이벤트 데이터로 사용합니다."]]},"en":{"q":"An ecommerce company is using Amazon Bedrock to build a generative AI (GenAI) application. The application uses AWS Step Functions to orchestrate a multi-agent workflow to produce detailed product descriptions. The workflow consists of three sequential states: a description generator, a technical specifications validator, and a brand voice consistency checker. Each state produces intermediate reasoning traces and outputs that are passed to the next state. The application uses an Amazon S3 bucket for process storage and to store outputs. During testing, the company discovers that outputs between Step Functions states frequently exceed the 256 KB quota and cause workflow failures. A GenAI Developer needs to revise the application architecture to efficiently handle the Step Functions 256 KB quota and maintain workflow observability. The revised architecture must preserve the existing multi-agent reasoning and acting (ReAct) pattern.\nWhich solution will meet these requirements with the LEAST operational overhead?","o":[["A","Store intermediate outputs in Amazon DynamoDB . Pass only references between states. Create a Map state that retrieves the complete data from DynamoDB when required for each agent ' s processing step."],["B","Configure an Amazon Bedrock integration to use the S3 bucket URI in the input parameters for large outputs. Use the ResultPath and ResultSelector fields to route S3 references between the agent steps while maintaining the sequential validation workflow."],["C","Use AWS Lambda functions to compress outputs to less than 256 KB before each agent state. Configure each agent task to decompress outputs before processing and to compress results before passing them to the next state."],["D","Configure a separate Step Functions state machine to handle each agent's processing. Use Amazon EventBridge to coordinate the execution flow between state machines. Use S3 references for the outputs as event data."]]},"ex":{"c":"Step Functions의 Bedrock 통합은 큰 입출력에 S3 URI를 사용할 수 있습니다. 큰 결과는 S3에 두고 ResultPath·ResultSelector로 S3 참조만 다음 상태로 넘기면 256KB 할당량을 피하면서 기존 순차 ReAct 흐름과 실행 기록(관측성)을 그대로 유지합니다. 이미 S3 버킷을 쓰고 있어 추가 구성이 거의 없습니다.","w":{"A":"DynamoDB 항목 한도는 400KB이고, 순차 흐름에 Map 상태는 맞지 않습니다.","C":"압축·해제 Lambda는 오버헤드가 크고 압축 후에도 한도를 넘을 수 있습니다.","D":"상태 머신을 여러 개로 나누면 관측성이 흩어지고 운영 부담이 커집니다."}}},{"n":27,"a":["D"],"orig":"","ko":{"q":"한 소매 회사가 웹사이트에서 고객에게 상품을 추천하는 애플리케이션을 운영합니다. 이 애플리케이션은 프롬프트를 동적으로 구성해 FM에 보내는 방식으로 Amazon Bedrock에서 추천을 생성합니다. GenAI 개발자가 FM이 응답을 생성할 때 특정 프로모션 메시지를 포함하도록 지시하는 업데이트를 배포했습니다. 테스트해 보니 프로모션 메시지가 응답에 항상 나타나지는 않고, 나타나더라도 나머지 텍스트와 자연스럽게 이어지지 않는 경우가 있습니다. GenAI 개발자는 프로모션 메시지가 FM 응답에 항상 나타나도록 해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","프롬프트에 Amazon Bedrock Guardrails 필터를 사용하고 입력 필터 강도를 HIGH로 설정합니다."],["B","프로모션 메시지를 다양한 방식으로 포함한 여러 응답 변형을 생성합니다. 리랭커 모델로 원래 프롬프트와의 관련성을 기준으로 가장 일관된 버전을 선택합니다."],["C","프롬프트를 Amazon Bedrock에서 실행합니다. Amazon Bedrock AgentCore로 응답을 처리해 프로모션 메시지를 추가합니다. 원래 프롬프트와 원하는 메시지를 컨텍스트로 사용해 결과를 리랭킹합니다."],["D","FM에 보내는 프롬프트에 출력 지시자(output indicator)를 사용해, 상품 추천 안에 새 프로모션 메시지를 포함하라는 요구 사항을 강화합니다."]]},"en":{"q":"A retail company runs an application that makes product recommendations to customers on the company's website. The application uses Amazon Bedrock to generate recommendations by dynamically constructing prompts and sending them to foundation models (FMs). A GenAI developer has deployed an update to the application that instructs the FM to include a specific promotional message when the FM generates a response to prompts. When the developer tests the application, the promotional message does not always appear in the responses. When the promotional message does appear in the responses, it does not always flow with the rest of the text. The GenAI developer must ensure that the promotional message always appears in the FM responses.\nWhich solution will meet this requirement?","o":[["A","Use an Amazon Bedrock Guardrails filter on the prompt. Set the input filter strength to HIGH."],["B","Generate multiple response variants that include the promotional message in different ways. Use a reranker model to select the most coherent version based on relevance to the original prompt."],["C","Run the prompt through Amazon Bedrock. Process the response through Amazon Bedrock AgentCore to add the promotional message. Rerank the results by using the original prompt and the desired message as context."],["D","Reinforce the requirement to include the new promotional message within product recommendations by using an output indicator in prompts to the FM."]]},"ex":{"c":"출력 지시자(output indicator)는 프롬프트 끝에 응답 형식과 반드시 포함할 내용을 명시하는 프롬프트 엔지니어링 기법입니다. 홍보 메시지를 추천 내용 안에 자연스럽게 포함하도록 출력 형식을 지정하면 메시지가 일관되게 나타나고 문맥과도 잘 어울립니다.","w":{"A":"Guardrails 입력 필터는 유해 콘텐츠를 차단할 뿐 특정 문구를 포함시키지 않습니다.","B":"여러 변형 생성과 재순위화는 비용이 크고 포함 여부를 보장하지 않습니다.","C":"AgentCore는 응답 후처리용 서비스가 아니며 사후에 덧붙이면 흐름이 부자연스럽습니다."}}},{"n":28,"a":["A"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock으로 내부 팀이 비정형 고객 피드백 데이터를 분석하도록 돕는 AI 어시스턴트를 구축하고 있습니다. 고객 피드백은 Amazon S3 버킷에 저장되어 있으며, 모바일 앱 리뷰, 채팅 대화, 콜센터 녹취록 등 25TB가 넘는 과거 데이터가 있습니다. 데이터 소스는 매일 3GB씩 늘어날 것으로 예상됩니다. 데이터 항목 하나에 서로 관련 없는 여러 주제가 섞여 있는 경우가 많습니다. 회사는 데이터 소스를 바탕으로 질문에 정확한 답을 안정적으로 제공하는 솔루션이 필요합니다. 이 솔루션은 처리나 응답 생성 과정에서 PII를 Amazon Bedrock 모델로 내보내서는 안 됩니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","S3 버킷의 새 파일마다 Amazon Comprehend로 PII를 감지·제거하는 AWS Lambda 함수를 구성합니다. 이 함수가 고정 크기 청크 임베딩을 생성해 Amazon OpenSearch Serverless 벡터 스토어에 저장하도록 구성합니다. 두 번째 Lambda 함수가 질문을 처리하고 컨텍스트를 검색한 뒤 Amazon Bedrock FM을 직접 호출해 답변을 생성하도록 구성합니다."],["B","고정 크기 청킹으로 S3 버킷과 동기화하는 Amazon Bedrock 지식 기반을 구성하고, Amazon Aurora PostgreSQL 벡터 스토어를 사용합니다. 입력과 출력 처리 중 모든 유형의 PII를 차단하는 Amazon Bedrock 가드레일을 구성합니다. Amazon Bedrock AgentCore가 지식 기반과 가드레일을 사용해 쿼리를 처리하고 답변하도록 구성합니다."],["C","의미 기반(semantic) 청킹으로 S3 버킷과 동기화하는 Amazon Bedrock 지식 기반을 구성하고, Amazon OpenSearch Serverless 벡터 스토어를 사용합니다. 입력과 출력 처리 중 모든 유형의 PII를 차단하는 Amazon Bedrock 가드레일을 구성합니다. Amazon Bedrock AgentCore가 지식 기반과 가드레일을 사용해 쿼리를 처리하고 답변하도록 구성합니다."],["D","의미 기반 청킹으로 S3 버킷과 동기화하는 Amazon Bedrock 지식 기반을 구성하고, Amazon Aurora PostgreSQL 벡터 스토어를 사용합니다. 입력과 출력 처리 중 모든 유형의 PII를 차단하는 Amazon Bedrock 가드레일을 구성합니다. Amazon Bedrock AgentCore가 지식 기반과 가드레일을 사용해 쿼리를 처리하고 답변하도록 구성합니다."]]},"en":{"q":"A company is using Amazon Bedrock to build an AI assistant to help internal teams analyze unstructured customer feedback data. The company stores the customer feedback in an Amazon S3 bucket. The S3 bucket contains more than 25 TB of historical data from mobile app reviews, chat conversations, and call center transcripts. The company expects the data source to grow by 3 GB every day. The data entries often contain multiple unrelated topics within the same input. The company needs a solution that reliably delivers accurate answers to questions based on the data source. The solution must not export any personally identifiable information (PII) to the Amazon Bedrock model during processing or response generation.\nWhich solution will meet these requirements with the LEAST operational overhead?","o":[["A","Configure an AWS Lambda function that processes each new file in the S3 bucket to detect and remove PII by using Amazon Comprehend. Configure the function to generate fixed-size chunk embeddings and store them in an Amazon OpenSearch Serverless vector store. Configure a second Lambda function to process questions, retrieve context, and invoke an Amazon Bedrock foundation model directly to generate answers."],["B","Configure an Amazon Bedrock knowledge base that synchronizes with the S3 bucket by using fixed- size chunking. Configure the knowledge base to use an Amazon Aurora PostgreSQL vector store . Configure an Amazon Bedrock guardrail to block all types of PII during input and output processing. Configure Amazon Bedrock AgentCore to use the knowledge base and the guardrail to process and answer queries."],["C","Configure an Amazon Bedrock knowledge base that synchronizes with the S3 bucket by using semantic chunking. Configure the knowledge base to use an Amazon OpenSearch Serverless vector store. Configure an Amazon Bedrock guardrail to block all types of PII during input and output processing. Configure Amazon Bedrock AgentCore to use the knowledge base and the guardrail to process and answer queries."],["D","Configure an Amazon Bedrock knowledge base that synchronizes with the S3 bucket by using semantic chunking. Configure the knowledge base to use an Amazon Aurora PostgreSQL vector store. Configure an Amazon Bedrock guardrail to block all types of PII during input and output processing. Configure Amazon Bedrock AgentCore to use the knowledge base and the guardrail to process and answer queries."]]},"ex":{"c":"요구 사항은 처리와 응답 생성 단계 모두에서 PII가 모델로 전달되지 않는 것입니다. Comprehend로 저장 단계에서 PII를 먼저 제거하고 임베딩하면 검색된 컨텍스트에도 PII가 없습니다. Guardrails는 입력·출력을 검사할 뿐, 지식 기반에서 검색한 컨텍스트는 이미 모델로 전달되므로 '모델로 보내지 않음'을 보장하지 못합니다.","w":{"B":"지식 기반 컨텍스트의 PII가 모델에 그대로 전달되고, 고정 크기 청크는 여러 주제가 섞인 입력에 부적합합니다.","C":"시맨틱 청킹은 좋지만 수집 단계에서 PII를 제거하지 않아 모델에 PII가 노출됩니다.","D":"C와 같은 이유로 수집 데이터의 PII가 모델에 전달됩니다."}}},{"n":29,"a":["D"],"orig":"","ko":{"q":"한 금융 서비스 회사가 RAG 애플리케이션을 배포했습니다. 이 애플리케이션은 벡터 스토리지로 Amazon OpenSearch Service를, 텍스트 생성에 Amazon Bedrock을 사용합니다. 매일 수천 건의 문서를 수집하고 시간당 수백 건의 사용자 쿼리를 처리합니다. 배포 몇 주 후, 컴퓨팅 리소스가 충분한데도 응답 시간이 늘었다는 보고가 있었습니다. 회사는 RAG 파이프라인 전체의 성능 문제를 사전에 식별하는 모니터링 솔루션이 필요합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","OpenSearchDashboardsHealthyNodes 지표와 SearchLatency 지표에 Amazon CloudWatch 경보를 구성합니다. 쿼리 응답 시간이 과거 성능 패턴 기반 임계값을 넘으면 수동으로 조사하고 OpenSearch Service 인스턴스를 재시작합니다."],["B","Amazon CloudWatch Container Insights로 OpenSearch Service 클러스터를 모니터링합니다. 메모리 사용률이 80%를 넘으면 Amazon EventBridge가 AWS Systems Manager Automation을 호출해 OpenSearch Service 인스턴스를 재시작하도록 합니다."],["C","개별 서비스의 CPU와 메모리 사용량을 추적하는 기본 Amazon CloudWatch 대시보드를 만듭니다. 쿼리 지연 시간에 대해 정적 임계값 기반 경보를 구성하고, 임계값 초과 시 이메일 알림을 설정합니다."],["D","Amazon CloudWatch 대시보드로 벡터 검색 지연 시간, FM 응답 시간, 문서 수집 속도 등 엔드투엔드 RAG 지표를 모니터링합니다. 지표에 이상 탐지를 설정해 사용자에게 영향이 가기 전에 성능 저하를 사전에 식별합니다."]]},"en":{"q":"A financial services company deploys a RAG application. The application uses Amazon OpenSearch Service to provide vector storage and Amazon Bedrock to generate text. The application ingests thousands of documents daily and processes hundreds of user queries each hour. Several weeks after the deployment, users report increased response times despite sufficient compute resources. The company needs a monitoring solution that proactively identifies performance issues across the entire RAG pipeline.\nWhich solution will meet this requirement?","o":[["A","Configure Amazon CloudWatch alarms for the OpenSearchDashboardsHealthyNodes metric and the SearchLatency metric. Manually investigate and restart OpenSearch Service instances whenever query response times exceed predefined thresholds based on historical performance patterns."],["B","Use Amazon CloudWatch Container Insights to monitor the OpenSearch Service cluster. Use Amazon EventBridge to invoke AWS Systems Manager Automation to restart the OpenSearch Service instances whenever memory usage exceeds 80%."],["C","Create basic Amazon CloudWatch dashboards to track CPU and memory usage for individual services. Configure alarms based on static thresholds for query latency. Set up email notifications when thresholds are exceeded."],["D","Use Amazon CloudWatch dashboards to monitor end-to-end RAG metrics including vector search latency, foundation model (FM) response times, and document ingestion rates. Set up anomaly detection for the metrics to proactively identify performance degradation before users are affected."]]},"ex":{"c":"벡터 검색 지연 시간, FM 응답 시간, 문서 수집 속도처럼 RAG 파이프라인 전체를 아우르는 지표를 CloudWatch 대시보드로 모니터링하고 이상 탐지를 적용하면, 사용자에게 영향이 가기 전에 성능 저하를 사전에 찾아낼 수 있습니다.","w":{"A":"수동 조사와 재시작은 사전 대응이 아니고 파이프라인 일부만 봅니다.","B":"Container Insights는 OpenSearch Service를 모니터링하지 않고 재시작은 근본 원인 해결이 아닙니다.","C":"서비스별 CPU·메모리와 고정 임계값은 전체 파이프라인을 보지 못합니다."}}},{"n":30,"a":["A"],"orig":"","ko":{"q":"한 금융 서비스 회사가 Amazon Bedrock FM을 사용하는 고객 서비스 AI 어시스턴트 애플리케이션을 개발하고 있습니다. 애플리케이션은 추론 과정을 기록하고 RAG에 사용된 출처를 인용해 투명한 응답을 제공해야 합니다. 사용자에 대한 모든 응답의 포괄적인 감사 추적을 수집해야 하고, 최대 10,000명의 동시 사용자를 지원하며 각 고객 문의에 2초 이내로 응답해야 합니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock Agents의 추적(tracing)을 활성화합니다. FM이 근거를 제시하도록 지시하는 구조화된 프롬프트를 구성합니다. Amazon Bedrock Knowledge Bases를 데이터 소스와 통합해 RAG를 활성화하고, 애플리케이션이 신뢰할 수 있는 콘텐츠를 참조·인용하도록 구성합니다. 애플리케이션을 다중 AZ 아키텍처로 배포하고, Amazon API Gateway와 AWS Lambda 함수로 확장하며, Amazon CloudFront로 짧은 지연 시간의 전송을 제공합니다."],["B","Amazon Bedrock 에이전트의 추적을 활성화합니다. Amazon OpenSearch Service와 사용자 지정 RAG 파이프라인을 통합해 출처를 검색·인용합니다. 검색된 근거를 제시하도록 구조화된 프롬프트를 구성합니다. 애플리케이션을 Amazon API Gateway REST API 뒤에 배포하고, AWS Lambda 함수와 Amazon CloudFront로 확장하고 짧은 지연 시간을 제공합니다. 로그는 Amazon S3에 저장하고 AWS CloudTrail로 감사 추적을 수집합니다."],["C","Amazon CloudWatch로 지연 시간과 오류율을 모니터링합니다. 애플리케이션 백엔드에 출처를 인용하는 모델 프롬프트를 직접 포함합니다. 감사를 위해 사용자와의 상호 작용을 Amazon RDS에 저장합니다."],["D","생성된 응답과 근거 자료를 Amazon S3 버킷에 저장하고, 감사를 위해 버킷 버전 관리를 활성화합니다. AWS Glue로 검색된 문서를 카탈로그화하고, Amazon Athena로 검색된 문서를 처리해 주기적 규정 준수 보고서를 생성합니다."]]},"en":{"q":"A financial services company is developing a customer service AI assistant application that uses a foundation model (FM) in Amazon Bedrock. The application must provide transparent responses by documenting reasoning and by citing sources that are used for Retrieval Augmented Generation (RAG). The application must capture comprehensive audit trails for all responses to users. The application must be able to serve up to 10,000 concurrent users and must respond to each customer inquiry within 2 seconds.\nWhich solution will meet these requirements with the LEAST operational overhead?","o":[["A","Enable tracing for Amazon Bedrock Agents. Configure structured prompts that direct the FM to provide evidence presentations. Integrate Amazon Bedrock Knowledge Bases with data sources to enable RAG. Configure the application to reference and cite authoritative content. Deploy the application in a Multi- AZ architecture. Use Amazon API Gateway and AWS Lambda functions to scale the application. Use Amazon CloudFront to provide low-latency delivery."],["B","Enable tracing for Amazon Bedrock agents. Integrate a custom RAG pipeline with Amazon OpenSearch Service to retrieve and cite sources. Configure structured prompts to present retrieved evidence. Deploy the application behind an Amazon API Gateway REST API. Use AWS Lambda functions and Amazon CloudFront to scale the application and to provide low latency. Store logs in Amazon S3 and use AWS CloudTrail to capture audit trails."],["C","Use Amazon CloudWatch to monitor latency and error rates. Embed model prompts directly in the application backend to cite sources. Store application interactions with users in Amazon RDS for audits."],["D","Store generated responses and supporting evidence in an Amazon S3 bucket. Enable versioning on the bucket for audits. Use AWS Glue to catalog retrieved documents. Process the retrieved documents in Amazon Athena to generate periodic compliance reports."]]},"ex":{"c":"Bedrock Agents 추적(trace)은 추론 과정을 기록하고, Knowledge Bases는 출처 인용을 포함한 관리형 RAG를 제공합니다. API Gateway·Lambda·CloudFront와 다중 AZ 구성으로 10,000명 동시 사용자와 2초 응답을 지원하며, 모두 관리형 서비스라 운영 오버헤드가 가장 적습니다.","w":{"B":"사용자 지정 RAG 파이프라인을 직접 구축·운영해야 해 오버헤드가 큽니다.","C":"추론 과정을 문서화하지 않고 확장성 설계도 없습니다.","D":"주기적 보고서만 생성할 뿐 투명한 실시간 응답을 제공하지 않습니다."}}},{"n":31,"a":["D"],"orig":"","ko":{"q":"한 회사가 재무 보고서를 처리하고 분석가에게 요약을 제공하는 GenAI 애플리케이션을 구축하고 있습니다. 애플리케이션은 두 가지 컴퓨팅 환경에서 실행되어야 합니다. 한 환경에서는 AWS Lambda 함수가 Python SDK로 보고서를 온디맨드로 분석하고, 다른 환경에서는 Amazon EKS 컨테이너가 JavaScript SDK로 여러 보고서를 일정에 따라 일괄 처리합니다. 애플리케이션은 다중 턴 상호 작용 내내 대화 컨텍스트를 유지하고, 두 환경에서 동일한 FM을 사용하며, 일관된 인증을 보장해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","환경마다 별도의 인증 방식으로 Amazon Bedrock InvokeModel API를 사용합니다. 대화 상태는 Amazon DynamoDB에 저장하고, 프로그래밍 언어별로 사용자 지정 입출력 형식 로직을 사용합니다."],["B","두 환경 모두에서 IAM 역할 기반의 공통 인증 메커니즘으로 Amazon Bedrock Converse API를 직접 사용합니다. 대화 상태는 Amazon ElastiCache에 저장하고, 모델 파라미터용 언어별 래퍼를 만듭니다."],["C","InvokeModel API로 모든 모델 상호 작용을 처리하는 중앙 Amazon API Gateway REST API 엔드포인트를 만듭니다. 상호 작용 기록은 각 Lambda 함수나 EKS 컨테이너의 프로세스 메모리에 저장하고, 환경 변수로 모델 파라미터를 구성합니다."],["D","Amazon Bedrock Converse API와 IAM 역할 기반 인증을 사용합니다. 대화 컨텍스트를 유지하기 위해 이전 메시지를 요청의 messages 배열에 담아 전달합니다. 언어별 SDK를 사용해 일관된 API 인터페이스를 구성합니다."]]},"en":{"q":"A company is building a generative AI (GenAI) application that processes financial reports and provides summaries for analysts. The application must run two compute environments. In one environment, AWS Lambda functions must use the Python SDK to analyze reports on demand. In the second environment, Amazon EKS containers must use the JavaScript SDK to batch process multiple reports on a schedule. The application must maintain conversational context throughout multi-turn interactions, use the same foundation model (FM) across environments, and ensure consistent authentication.\nWhich solution will meet these requirements?","o":[["A","Use the Amazon Bedrock InvokeModel API with a separate authentication method for each environment. Store conversation states in Amazon DynamoDB. Use custom I/O formatting logic for each programming language."],["B","Use the Amazon Bedrock Converse API directly in both environments with a common authentication mechanism that uses IAM roles. Store conversation states in Amazon ElastiCache. Create programming language-specific wrappers for model parameters."],["C","Create a centralized Amazon API Gateway REST API endpoint that handles all model interactions by using the InvokeModel API. Store interaction history in application process memory in each Lambda function or EKS container. Use environment variables to configure model parameters."],["D","Use the Amazon Bedrock Converse API and IAM roles for authentication. Pass previous messages in the request messages array to maintain conversational context. Use programming languagespecific SDKs to establish consistent API interfaces."]]},"ex":{"c":"Converse API는 모델에 관계없이 일관된 메시지 형식을 제공하고 Python·JavaScript SDK 모두에서 지원됩니다. IAM 역할로 인증을 통일하고, 이전 메시지를 messages 배열에 함께 보내 다중 턴 맥락을 유지하는 것이 표준 방식입니다.","w":{"A":"환경별로 인증 방식을 다르게 하면 일관성 요구에 어긋나고, InvokeModel은 모델별 형식 로직이 필요합니다.","B":"ElastiCache와 언어별 래퍼는 불필요한 복잡성입니다.","C":"Lambda·컨테이너 메모리에 기록을 두면 휘발성이어서 맥락이 유지되지 않습니다."}}},{"n":32,"a":["A"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock과 Agent Squad를 사용하는 멀티클라우드 GenAI 기반 시크릿 해석(secret resolution) 애플리케이션을 구축하고 있습니다. 이 애플리케이션은 키 저장소와 하드웨어 보안 모듈(HSM) 등 여러 소스에서 시크릿을 해석하며, AWS Lambda 함수로 소스에서 시크릿을 가져옵니다. AWS AppConfig로 동적 기능 게이팅을 구현하고, 시크릿 체이닝과 시크릿 드리프트 감지를 지원하며, 수명이 짧거나 만료되는 시크릿을 처리합니다. 또한 템플릿화된 지침을 위한 프롬프트 플로를 지원하고, AWS Step Functions로 에이전트를 오케스트레이션해 시크릿을 해석하고 검증 및 드리프트 감지를 관리합니다. 테스트 중 여러 문제가 발견되었습니다. 만료된 시크릿이 에이전트가 사용할 시점까지 갱신되지 않습니다. 시크릿 드리프트 알림은 전송되지만 에이전트는 여전히 오래된 데이터를 사용합니다. 애플리케이션 내 프롬프트 플로가 오래된 템플릿을 재사용해 연쇄 장애가 발생합니다. 회사는 이 성능 문제를 해결해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Step Functions Map 상태로 에이전트 워크플로를 병렬 실행합니다. 업데이트된 시크릿 메타데이터를 Lambda 함수 출력으로 전달합니다. AWS AppConfig로 모든 프롬프트 플로의 버전을 관리해 결함 있는 템플릿을 게이팅하고 롤백합니다."],["B","Amazon Bedrock Agents만 사용합니다. Amazon Bedrock 가드레일로 프롬프트 변형을 제한하고, 단일 에이전트 워크플로 정의에 인라인 JSON 스키마를 사용해 도구 호출을 연결합니다."],["C","중앙 집중식 Amazon EventBridge 파이프라인으로 각 에이전트를 호출합니다. 중간 프롬프트는 Amazon DynamoDB에 저장하고, TTL 기반 백오프와 재시도로 에이전트 순서를 해결합니다."],["D","Amazon CloudWatch 로그 패턴에 따라 Amazon EventBridge Pipes로 해석기를 호출합니다. 응답 메타데이터는 TTL과 버전 관리 쓰기를 사용해 DynamoDB에 저장하고, Amazon Q Developer로 대체(fallback) 프롬프트를 동적으로 생성합니다."]]},"en":{"q":"A company is building a multicloud generative AI (GenAI)-powered secret resolution application that uses Amazon Bedrock and Agent Squad. The application resolves secrets from multiple sources, including key stores and hardware security modules (HSMs). The application uses AWS Lambda functions to retrieve secrets from the sources. The application uses AWS AppConfig to implement dynamic feature gating. The application supports secret chaining and detects secret drift. The application handles short-lived and expiring secrets. The application also supports prompt flows for templated instructions. The application uses AWS Step Functions to orchestrate agents to resolve the secrets and to manage secret validation and drift detection. The company finds multiple issues during application testing. The application does not refresh expired secrets in time for agents to use. The application sends alerts for secret drift, but agents still use stale data. Prompt flows within the application reuse outdated templates, which cause cascading failures. The company must resolve the performance issues.\nWhich solution will meet this requirement?","o":[["A","Use Step Functions Map states to run agent workflows in parallel. Pass updated secret metadata through Lambda function outputs. Use AWS AppConfig to version all prompt flows to gate and roll back faulty templates."],["B","Use Amazon Bedrock Agents only. Configure Amazon Bedrock guardrails to restrict prompt variation. Use an inline JSON schema for a single agent's workflow definition to chain tool calls."],["C","Use a centralized Amazon EventBridge pipeline to invoke each agent. Store intermediate prompts in Amazon DynamoDB. Resolve agent ordering by using TTL-based backoff and retries."],["D","Use Amazon EventBridge Pipes to invoke resolvers based on Amazon CloudWatch log patterns. Store response metadata in DynamoDB with TTL and versioned writes. Use Amazon Q Developer to dynamically generate fallback prompts."]]},"ex":{"c":"Map 상태로 에이전트 워크플로를 병렬 실행해 만료 전에 비밀을 갱신하고, Lambda 출력으로 최신 비밀 메타데이터를 전달해 오래된 데이터 사용을 막습니다. AppConfig로 프롬프트 플로 템플릿을 버전 관리하면 잘못된 템플릿을 차단하고 롤백할 수 있어 세 가지 문제를 모두 해결합니다.","w":{"B":"Bedrock Agents만으로는 비밀 갱신 문제를 해결하지 못하고 Guardrails는 템플릿 버전 관리를 하지 않습니다.","C":"TTL 기반 백오프는 적시 갱신을 보장하지 않습니다.","D":"Q Developer로 폴백 프롬프트를 동적으로 생성하는 것은 오히려 비결정성을 높입니다."}}},{"n":33,"a":["A"],"orig":"","ko":{"q":"한 회사가 AWS Amplify, AWS AppSync GraphQL API, Amazon Bedrock Knowledge Bases를 사용하는 React 애플리케이션으로 AI 어시스턴트를 배포했습니다. 애플리케이션은 GraphQL API로 Amazon Bedrock RetrieveAndGenerate API를 호출해 지식 기반과 상호 작용합니다. 회사는 AWS Lambda 리졸버를 RequestResponse 호출 유형으로 구성했습니다. 사용자들은 잦은 타임아웃과 느린 응답을 보고하며, 처리 시간이 긴 복잡한 질문에서 이 문제가 더 자주 발생합니다. 회사는 성능 문제를 해결하고 사용자 경험을 개선할 솔루션이 필요합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AWS Amplify AI Kit을 사용해 GraphQL API에서 스트리밍 응답을 구현하고 클라이언트 측 렌더링을 최적화합니다."],["B","Lambda 리졸버의 타임아웃 값을 늘리고, 지수 백오프를 사용하는 재시도 로직을 구현합니다."],["C","애플리케이션이 API 요청을 Amazon SQS 대기열로 보내도록 수정하고, AWS AppSync 리졸버가 대기열을 폴링해 처리하도록 업데이트합니다."],["D","RetrieveAndGenerate API를 InvokeModelWithResponseStream API로 바꾸고, 스트리밍 응답을 지원하도록 애플리케이션이 Amazon API Gateway WebSocket API를 사용하게 업데이트합니다."]]},"en":{"q":"A company has deployed an AI assistant as a React application that uses AWS Amplify, an AWS AppSync GraphQL API, and Amazon Bedrock Knowledge Bases. The application uses the GraphQL API to call the Amazon Bedrock RetrieveAndGenerate API for knowledge base interactions. The company configures an AWS Lambda resolver to use the RequestResponse invocation type. Application users report frequent timeouts and slow response times. Users report these problems more frequently for complex questions that require longer processing. The company needs a solution to fix these performance issues and enhance the user experience.\nWhich solution will meet these requirements?","o":[["A","Use AWS Amplify AI Kit to implement streaming responses from the GraphQL API and to optimize client-side rendering."],["B","Increase the timeout value of the Lambda resolver. Implement retry logic with exponential backoff."],["C","Update the application to send an API request to an Amazon SQS queue. Update the AWS AppSync resolver to poll and process the queue."],["D","Change the RetrieveAndGenerate API to the InvokeModelWithResponseStream API. Update the application to use an Amazon API Gateway WebSocket API to support the streaming response."]]},"ex":{"c":"Amplify AI Kit은 AppSync를 통한 Bedrock 대화의 스트리밍 응답과 클라이언트 렌더링을 기본 지원합니다. 응답을 스트리밍하면 AppSync 동기 해석기의 타임아웃 문제를 피하고 사용자는 첫 토큰부터 바로 결과를 봅니다. 기존 Amplify·AppSync 구조를 그대로 유지합니다.","w":{"B":"AppSync 해석기에는 하드 타임아웃이 있어 시간을 늘리는 데 한계가 있고 재시도는 지연만 늘립니다.","C":"SQS 폴링 구조는 응답 지연을 키우고 사용자 경험을 개선하지 못합니다.","D":"InvokeModelWithResponseStream으로 바꾸면 지식 기반 RAG 기능을 잃고 아키텍처를 크게 바꿔야 합니다."}}},{"n":34,"a":["B"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock으로 고객 지원 AI 어시스턴트를 개발하고 있습니다. AI 어시스턴트는 고객 계정에 관한 질문에 답해야 하지만 응답에 개인 정보를 노출해서는 안 됩니다. 회사는 모든 처리가 각 고객이 있는 AWS 리전 내에서 이루어지도록 해 데이터 상주 정책을 준수해야 합니다. 회사는 고객에게 공개하기 전에 AI 어시스턴트가 개인 정보 노출을 얼마나 잘 막는지 평가하려고 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","민감 정보 필터를 적용하는 교차 리전 Amazon Bedrock 가드레일을 구성합니다. 개발 및 테스트 중에는 가드레일을 감지(detect) 모드로 설정하고, 프로덕션 배포 시 차단(block) 모드로 전환합니다."],["B","민감 정보 필터를 적용하는 Amazon Bedrock 가드레일을 구성합니다. 개발 및 테스트 중에는 마스킹(mask) 모드로 설정하고, 프로덕션 배포 시 차단 모드로 전환합니다. 회사가 운영하는 각 리전에 가드레일 사본을 배포합니다."],["C","콘텐츠 및 주제 필터를 적용하는 Amazon Bedrock 가드레일을 구성합니다. 개발, 테스트, 프로덕션 모두에서 감지 모드로 설정하고, Amazon Bedrock 모델의 호출 로깅을 비활성화합니다."],["D","콘텐츠 및 단어 필터 세트를 적용하는 교차 리전 Amazon Bedrock 가드레일을 구성합니다. 개발 및 테스트 중에는 감지 모드로 설정하고, 프로덕션 배포 시 마스킹 모드로 전환합니다."]]},"en":{"q":"A company is using Amazon Bedrock to develop a customer support AI assistant. The AI assistant must respond to customer questions about their accounts. The AI assistant must not expose personal information in responses. The company must comply with data residency policies by ensuring that all processing occurs within the same AWS Region where each customer is located. The company wants to evaluate how effective the AI assistant is at preventing the exposure of personal information before the company makes the AI assistant available to customers.\nWhich solution will meet these requirements?","o":[["A","Configure a cross-Region Amazon Bedrock guardrail to apply sensitive information filters. Set the guardrail to detect mode during development and testing. Switch to block mode for production deployment."],["B","Configure an Amazon Bedrock guardrail to apply sensitive information filters. Set the guardrail to mask mode during development and testing. Switch to block mode for production deployment. Deploy a copy of the guardrail to each Region where the company operates."],["C","Configure an Amazon Bedrock guardrail to apply content and topic filters. Set the guardrail to detect mode during development, testing, and production. Disable invocation logging for the Amazon Bedrock model."],["D","Configure a cross-Region Amazon Bedrock guardrail to apply a set of content and word filters. Set the guardrail to detect mode during development and testing. Switch to mask mode for production deployment."]]},"ex":{"c":"민감 정보 필터를 마스크 모드로 두면 개발·테스트 중 어떤 PII가 탐지되는지 확인하며 효과를 평가할 수 있고, 운영에서는 차단 모드로 바꿉니다. 데이터 상주를 위해 교차 리전 가드레일 대신 각 리전에 가드레일 사본을 배포합니다.","w":{"A":"교차 리전 가드레일은 다른 리전에서 처리될 수 있어 데이터 상주 요구에 어긋납니다.","C":"콘텐츠·주제 필터는 개인 정보를 다루지 않고, 운영에서도 탐지 모드라 차단하지 않습니다.","D":"교차 리전 구성이며 콘텐츠·단어 필터는 개인 정보 필터가 아닙니다."}}},{"n":35,"a":["C"],"orig":"","ko":{"q":"한 의료기기 회사가 자사 기기를 사용한 의료 시술 보고서를 AI 어시스턴트에 제공하려고 합니다. 환자 개인 정보를 보호하기 위해 AI 어시스턴트는 환자 PII를 외과의에게만 노출하고, 엔지니어에게는 PII를 삭제(redact)해야 합니다. 또한 3년 미만의 의료 보고서만 참조해야 합니다. 회사는 보고서가 발행되는 즉시 Amazon S3 버킷에 저장합니다. 회사는 이미 Amazon Bedrock Knowledge Bases를 설정했으며, AI 어시스턴트는 Amazon Cognito로 사용자를 인증합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","S3 버킷에서 Amazon Macie PII 감지를 활성화합니다. S3 트리거로 보고서에서 PII를 삭제하는 AWS Lambda 함수를 호출하고, 이 함수가 오래된 문서를 삭제하고 지식 기반 동기화를 호출하도록 구성합니다."],["B","새 보고서가 업로드되면 AWS Lambda 함수를 호출해 S3 버킷과 지식 기반을 동기화합니다. Amazon Comprehend를 사용하는 두 번째 Lambda 함수로 엔지니어에게는 PII를 삭제합니다. S3 수명 주기 규칙으로 3년이 지난 보고서를 삭제합니다."],["C","3년이 지난 보고서를 삭제하는 S3 수명 주기 구성을 설정합니다. 버킷과 지식 기반을 매일 동기화하는 AWS Lambda 함수를 예약합니다. 사용자가 AI 어시스턴트와 상호 작용할 때 사용자의 Cognito 사용자 그룹에 따라 선택된 가드레일 구성을 적용해, 필요한 경우 응답에서 PII를 삭제합니다."],["D","두 번째 지식 기반을 만듭니다. Lambda와 Amazon Comprehend로 PII를 삭제한 뒤 두 번째 지식 기반에 동기화합니다. Cognito 그룹 멤버십에 따라 사용자를 적절한 지식 기반으로 라우팅합니다."]]},"en":{"q":"A medical device company wants to feed reports of medical procedures that used the company's devices into an AI assistant. To protect patient privacy, the AI assistant must expose patient personally identifiable information (PII) only to surgeons. The AI assistant must redact PII for engineers. The AI assistant must reference only medical reports that are less than 3 years old. The company stores reports in an Amazon S3 bucket as soon as each report is published. The company has already set up an Amazon Bedrock Knowledge Bases. The AI assistant uses Amazon Cognito to authenticate users.\nWhich solution will meet these requirements?","o":[["A","Enable Amazon Macie PII detection on the S3 bucket. Use an S3 trigger to invoke an AWS Lambda function that redacts PII from the reports. Configure the Lambda function to delete outdated documents and invoke knowledge base syncing."],["B","Invoke an AWS Lambda function to sync the S3 bucket and the knowledge base when a new report is uploaded. Use a second Lambda function with Amazon Comprehend to redact PII for engineers. Use S3 Lifecycle rules to remove reports older than 3 years."],["C","Set up an S3 Lifecycle configuration to remove reports that are older than 3 years. Schedule an AWS Lambda function to run daily syncs between the bucket and the knowledge base. When users interact with the AI assistant, apply a guardrail configuration selected based on the user's Cognito user group to redact PII from responses when required."],["D","Create a second knowledge base. Use Lambda and Amazon Comprehend to redact PII before syncing to the second knowledge base. Route users to the appropriate knowledge base based on Cognito group membership."]]},"ex":{"c":"S3 수명 주기 규칙으로 3년이 지난 보고서를 자동 삭제하고, 정기 동기화로 지식 기반을 최신 상태로 유지합니다. Cognito 그룹(외과의/엔지니어)에 따라 다른 가드레일 구성을 적용하면 같은 지식 기반에서 엔지니어에게만 PII를 마스킹할 수 있습니다.","w":{"A":"모든 보고서에서 PII를 제거하면 외과의도 PII를 볼 수 없습니다.","B":"Comprehend 별도 파이프라인은 Guardrails보다 복잡하고, 사용자별 적용 방식이 불명확합니다.","D":"지식 기반을 두 개 운영하면 비용과 관리 부담이 두 배가 됩니다."}}},{"n":36,"a":["A"],"orig":"","ko":{"q":"한 금융 서비스 회사가 Amazon Bedrock으로 Amazon S3 버킷에 저장된 고객 데이터를 분석합니다. 이 데이터에는 PII가 포함되어 있으며, 회사는 FM 응답에서 PII를 마스킹해야 합니다.\n운영 노력이 가장 적은 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock에서 PII 콘텐츠를 필터링하는 가드레일을 만듭니다. PII 유형을 정의하고 가드레일 작업을 MASK로 설정합니다. Amazon Bedrock이 각 FM 응답에 필터를 적용하도록 구성합니다."],["B","Amazon Bedrock을 호출하기 전에 Amazon Comprehend로 S3 데이터의 PII 엔터티를 감지합니다. AWS Lambda 함수가 Amazon Comprehend DetectPiiEntities API를 호출해 감지된 PII를 마스킹하도록 구성하고, 처리된 데이터를 원래 S3 버킷에 다시 저장합니다."],["C","Amazon Macie로 S3 버킷의 PII 데이터를 스캔합니다. AWS Lambda 함수가 PII를 두 번째 S3 버킷에 저장하도록 구성하고, Amazon EventBridge 규칙으로 Lambda 함수를 호출합니다."],["D","PII 데이터를 검색하는 AWS Lambda 함수를 구성합니다. Lambda 함수 코드에 PII는 두 번째 S3 버킷에, PII가 아닌 데이터는 세 번째 S3 버킷에 저장하는 단계를 구현합니다."]]},"en":{"q":"A financial services company uses Amazon Bedrock to analyze customer data that is stored in an Amazon S3 bucket. The data includes personally identifiable information (PII). The company must mask PII from foundation model (FM) responses.\nWhich solution will meet this requirement with the LEAST operational effort?","o":[["A","Create a guardrail in Amazon Bedrock to filter PII content. Define the PII type and set the guardrail action to MASK. Configure Amazon Bedrock to apply the filter to each FM response."],["B","Use Amazon Comprehend to detect PII entities in the S3 data before invoking Amazon Bedrock. Configure an AWS Lambda function to call the Amazon Comprehend DetectPiiEntities API to mask detected PII. Store the processed data back to the original S3 bucket."],["C","Use Amazon Macie to scan the S3 bucket for PII data. Configure an AWS Lambda function to store PII in a second S3 bucket. Use an Amazon EventBridge rule to invoke the Lambda function."],["D","Configure an AWS Lambda function to search for PII data. Implement a step in the Lambda function code to store the PII in a second S3 bucket and non-PII data into a third S3 bucket."]]},"ex":{"c":"Bedrock Guardrails의 민감 정보 필터에서 PII 유형을 지정하고 동작을 MASK로 설정하면 FM 응답의 PII가 자동으로 마스킹됩니다. 코드나 별도 파이프라인이 필요 없어 운영 노력이 가장 적습니다.","w":{"B":"Comprehend와 Lambda로 원본 데이터를 처리하는 파이프라인을 직접 구축해야 하고 원본도 바뀝니다.","C":"Macie는 PII를 탐지할 뿐 응답을 마스킹하지 않습니다.","D":"Lambda로 직접 PII를 분리하는 구현은 노력이 가장 큽니다."}}},{"n":37,"a":["D"],"orig":"","ko":{"q":"한 회사가 모든 개발자에게 Amazon Q Developer Pro 라이선스를 제공했습니다. 회사는 개발자가 애플리케이션 개발 시 반드시 사용해야 하는 승인된 리소스 목록을 관리하며, 여기에는 내부 라이브러리, 독자적인 알고리즘 기법, 승인된 스타일의 샘플 코드가 포함됩니다. 새 개발자 팀이 Amazon Q Developer로 새로운 Java 기반 애플리케이션을 개발하고 있습니다. 회사는 새 팀이 승인된 리소스를 사용하도록 해야 하며, 프로젝트 수준의 수정은 원하지 않습니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","승인된 내부 라이브러리, 알고리즘, 코드 샘플을 모두 담은 Git 리포지토리를 만듭니다. 이 리포지토리를 작업 공간의 일부로 애플리케이션 프로젝트에 로컬로 포함하고, 개발자가 작업 공간 컨텍스트를 사용해 Git 리포지토리에서 제안을 받도록 합니다."],["B","프로젝트 루트 폴더에 amazonq/rules라는 폴더를 만들고, 승인된 내부 라이브러리, 알고리즘, 코드 샘플을 이 폴더에 추가합니다."],["C","애플리케이션 프로젝트에 rules라는 폴더를 만들고, Amazon Q Developer가 코드 제안 시 참조하도록 가이드라인과 코드를 이 폴더에 저장합니다."],["D","승인된 데이터 소스를 포함하는 Amazon Q Developer 사용자 지정(customization)을 만들고, 개발자가 이 사용자 지정을 사용해 애플리케이션을 개발하도록 합니다."]]},"en":{"q":"A company has set up Amazon Q Developer Pro licenses for all developers at the company. The company maintains a list of approved resources that developers must use when developing applications. The approved resources include internal libraries, proprietary algorithmic techniques, and sample code with approved styling. A new team of developers is using Amazon Q Developer to develop a new Java-based application. The company must ensure that the new developer team uses the company's approved resources. The company does not want to make project-level modifications.\nWhich solution will meet these requirements?","o":[["A","Create a Git repository that contains all of the approved internal libraries, algorithms, and code samples. Include this Git repository in the application project locally as part of the workspace. Ensure that the developers use the workspace context to retrieve suggestions from the Git repository."],["B","In the project root folder, create a folder named amazonq/rules. Add the approved internal libraries, algorithms, and code samples to the folder."],["C","Create a folder in the application project named rules. Store the guidelines and code in the folder for Amazon Q Developer to reference for code suggestions."],["D","Create an Amazon Q Developer customization that includes the approved data sources. Ensure that the developers use the customization to develop the application."]]},"ex":{"c":"Amazon Q Developer 사용자 지정(customization)은 조직의 내부 라이브러리·코드 샘플 같은 승인된 데이터 소스를 바탕으로 코드 제안을 맞춤화하는 Pro 기능입니다. 관리자가 만들고 개발자에게 할당하므로 프로젝트 수준을 수정할 필요가 없습니다.","w":{"A":"로컬 워크스페이스에 리포지토리를 넣는 것은 프로젝트 수준 변경이며 일관되게 강제되지 않습니다.","B":".amazonq/rules 폴더는 프로젝트 수준 변경이며 규칙 파일용이지 라이브러리 저장소가 아닙니다.","C":"프로젝트에 폴더를 추가하는 것은 프로젝트 수준 변경입니다."}}},{"n":38,"a":["A"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock FM을 사용하는 AI 기반 고객 지원 애플리케이션을 구축하고 있습니다. 애플리케이션은 내부 Amazon Bedrock 지식 기반을 바탕으로 사용자에게 추천을 제공해야 합니다. 사용자는 Amazon S3에 저장된 문서와 Amazon RDS의 정형 데이터를 조회합니다. 애플리케이션은 추천 생성에 사용한 출처를 인용해야 하고, 민감한 데이터에 대한 안전한 액세스를 제공해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock AgentCore 에이전트 하나에 지식 기반 두 개를 연결합니다. 하나는 Amazon S3의 문서에, 다른 하나는 Amazon RDS의 정형 데이터에 접근하도록 구성합니다. 에이전트가 응답에 출처(attribution) 메타데이터를 유지하도록 구성하고, IAM 역할로 민감한 데이터에 대한 액세스를 제어합니다."],["B","Amazon Bedrock AgentCore 에이전트 두 개를 만듭니다. 하나는 Amazon S3 문서에 연결된 지식 기반과, 다른 하나는 Amazon RDS에 연결된 지식 기반과 연결합니다. 두 에이전트를 동시에 조회하고 결과를 결합하는 사용자 지정 AWS Lambda 함수를 개발합니다."],["C","AWS Lambda 함수로 Amazon S3의 문서와 Amazon RDS의 정형 데이터를 직접 조회하는 Amazon Bedrock AgentCore 에이전트 하나를 만듭니다. 응답을 처리해 하나의 응답으로 병합합니다."],["D","Amazon S3 문서를 포함하는 지식 기반을 사용하도록 Amazon Bedrock AgentCore 에이전트 하나를 구성합니다. AWS Lambda 함수가 Amazon RDS를 직접 조회해 정형 데이터를 가져오고, 응답을 반환하기 전에 결과를 결합하도록 구성합니다."]]},"en":{"q":"A company is building an AI-powered customer support application that uses Amazon Bedrock FMs. The application must provide users with recommendations based on an internal Amazon Bedrock knowledge base. Users will query documents that the company stores in Amazon S3 and structured data that is in Amazon RDS. The application must provide citations for the sources it uses to generate recommendations. The application must also provide secure access to sensitive data.\nWhich solution will meet these requirements?","o":[["A","Associate one Amazon Bedrock AgentCore agent with two knowledge bases. Configure one knowledge base to access documents from Amazon S3 and the other to access structured data from Amazon RDS. Configure the agent to preserve attribution metadata in responses. Use IAM roles to control access to sensitive data."],["B","Create two Amazon Bedrock AgentCore agents. Associate one agent with a knowledge base that is connected to the documents in Amazon S3 and the other agent with a knowledge base that is connected to Amazon RDS. Develop a custom AWS Lambda function to query both agents simultaneously and combine the results."],["C","Create one Amazon Bedrock AgentCore agent that uses AWS Lambda functions to directly query Amazon S3 for documents and Amazon RDS for structured data. Process the responses and merge the results into a single response."],["D","Configure one Amazon Bedrock AgentCore agent to use a knowledge base that contains the documents from Amazon S3. Configure AWS Lambda functions to query Amazon RDS directly for structured data and to combine the results before returning responses."]]},"ex":{"c":"하나의 에이전트에 지식 기반 두 개를 연결하고, 하나는 S3 문서(비정형), 다른 하나는 RDS 등 구조화된 데이터를 다루도록 구성합니다. 지식 기반 응답의 출처 메타데이터를 보존하면 인용을 제공할 수 있고, IAM 역할로 민감 데이터 접근을 제어합니다.","w":{"B":"에이전트 두 개와 사용자 지정 병합 Lambda는 불필요하게 복잡합니다.","C":"Lambda로 직접 조회하면 관리형 RAG와 인용 기능을 잃습니다.","D":"RDS 결과를 Lambda로 합치면 구조화된 데이터에 대한 인용이 일관되지 않습니다."}}},{"n":39,"a":["C"],"orig":"","ko":{"q":"한 회사가 AWS Lambda 함수로 AI 에이전트 솔루션을 구축합니다. GenAI 개발자는 사용자 정보에 접근하는 MCP(Model Context Protocol) 서버를 설정하고, AI 에이전트가 새 MCP 서버를 사용하도록 구성해야 합니다. 또한 승인된 사용자만 MCP 서버에 접근할 수 있도록 해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Lambda 함수로 MCP 서버를 호스팅합니다. AI 에이전트 Lambda 함수에 MCP 서버 호스팅 Lambda 함수를 호출할 권한을 부여하고, AI 에이전트의 MCP 클라이언트가 MCP 서버를 비동기식으로 호출하도록 구성합니다."],["B","Lambda 함수로 MCP 서버를 호스팅합니다. AI 에이전트 Lambda 함수에 MCP 서버 호스팅 Lambda 함수를 호출할 권한을 부여하고, AI 에이전트가 MCP 서버와 STDIO 전송을 사용하도록 구성합니다."],["C","Lambda 함수로 MCP 서버를 호스팅합니다. Lambda 함수로 요청을 프록시하는 Amazon API Gateway HTTP API를 만듭니다. AI 에이전트 솔루션이 Streamable HTTP 전송으로 HTTP API를 통해 요청하도록 구성하고, Amazon Cognito로 OAuth 2.1을 적용합니다."],["D","Lambda 계층으로 MCP 서버를 호스팅하고 AI 에이전트 Lambda 함수에 추가합니다. 에이전트 AI 솔루션이 STDIO 전송으로 MCP 서버에 요청하도록 구성합니다. AI 에이전트의 MCP 구성에서 Lambda 계층 ARN을 명령으로 지정하고, 사용자 자격 증명은 환경 변수로 지정합니다."]]},"en":{"q":"A company uses AWS Lambda functions to build an AI agent solution. A GenAI developer must set up a Model Context Protocol (MCP) server that accesses user information. The GenAI developer must also configure the AI agent to use the new MCP server. The GenAI developer must ensure that only authorized users can access the MCP server.\nWhich solution will meet these requirements?","o":[["A","Use a Lambda function to host the MCP server. Grant the AI agent Lambda functions permission to invoke the Lambda function that hosts the MCP server. Configure the AI agent's MCP client to invoke the MCP server asynchronously."],["B","Use a Lambda function to host the MCP server. Grant the AI agent Lambda functions permission to invoke the Lambda function that hosts the MCP server. Configure the AI agent to use the STDIO transport with the MCP server."],["C","Use a Lambda function to host the MCP server. Create an Amazon API Gateway HTTP API that proxies requests to the Lambda function. Configure the AI agent solution to use the Streamable HTTP transport to make requests through the HTTP API. Use Amazon Cognito to enforce OAuth 2.1."],["D","Use a Lambda layer to host the MCP server. Add the Lambda layer to the AI agent Lambda functions.Configure the agentic AI solution to use the STDIO transport to send requests to the MCP server. In the AI agent's MCP configuration, specify the Lambda layer ARN as the command. Specify the user credentials as environment variables."]]},"ex":{"c":"원격 MCP 서버는 Streamable HTTP 전송 방식을 사용하며, MCP 사양은 HTTP 전송의 인증으로 OAuth 2.1을 규정합니다. Lambda에 MCP 서버를 호스팅하고 API Gateway HTTP API로 노출한 뒤 Cognito로 OAuth 2.1을 적용하면 인가된 사용자만 접근할 수 있습니다.","w":{"A":"MCP는 요청-응답 프로토콜이라 비동기 Lambda 호출과 맞지 않고 사용자 인가도 없습니다.","B":"STDIO 전송은 같은 호스트의 로컬 프로세스용이어서 다른 Lambda 함수와는 쓸 수 없습니다.","D":"레이어 ARN은 실행 명령이 될 수 없고, 환경 변수에 사용자 자격 증명을 넣는 것은 보안상 부적절합니다."}}},{"n":40,"a":["A"],"orig":"","ko":{"q":"Example Corp는 수백만 기업 고객이 사용하는 개인화 동영상 생성 서비스를 제공합니다. 고객은 회사의 독자적인 GenAI 모델에 프롬프트를 제출해 마케팅 동영상을 생성합니다. 출력의 관련성과 개인화를 높이기 위해 Example Corp는 상품 선호도, 고객 속성, 비즈니스 이력 같은 고객별 컨텍스트로 프롬프트를 보강하려고 합니다. 고객은 엄격한 데이터 거버넌스 요구 사항이 있으며 자신의 데이터에 대한 완전한 소유권과 통제권을 유지해야 합니다. 실시간 접근은 필요하지 않지만, 고객 경험 사용 사례를 위해 의미 정확도가 높고 검색 지연 시간이 낮아야 합니다. Example Corp는 통합 패턴의 아키텍처 복잡성을 최소화하려고 하며, 꼭 필요한 경우가 아니면 각 고객 환경에 서비스를 배포·관리하고 싶어 하지 않습니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","각 고객이 자체 내부 데이터를 포함하는 Amazon Q Business 인덱스를 설정하도록 합니다. 각 고객이 Example Corp를 데이터 접근자(data accessor)로 지정해, Example Corp가 보안 API로 관련 콘텐츠를 가져와 런타임에 프롬프트를 보강할 수 있게 합니다."],["B","고객마다 실시간 MCP 서버를 배포해 MCP 기반 연합 검색을 사용합니다. 프롬프트 생성 중 실시간으로 데이터를 가져옵니다."],["C","각 고객이 Amazon Bedrock 지식 기반을 구성하도록 합니다. 교차 계정 쿼리를 허용해 Example Corp가 프롬프트 보강용 정형 데이터를 가져올 수 있게 합니다."],["D","Amazon Kendra가 고객 데이터 소스를 크롤링하도록 구성합니다. 생성된 인덱스를 계정 간에 공유해 Example Corp가 각 고객의 Amazon Kendra 인덱스를 조회해 보강 데이터를 가져오게 합니다."]]},"en":{"q":"Example Corp provides a personalized video generation service that millions of enterprise customers use. Customers generate marketing videos by submitting prompts to the company's proprietary generative AI (GenAI) model. To improve output relevance and personalization, Example Corp wants to enhance the prompts by using customer-specific context such as product preferences, customer attributes, and business history. The customers have strict data governance requirements. The customers must retain full ownership and control over their own data. The customers do not require real-time access. However, semantic accuracy must be high and retrieval latency must remain low to support customer experience use cases. Example Corp wants to minimize architectural complexity in its integration pattern. Example Corp does not want to deploy and manage services in each customer's environment unless necessary.\nWhich solution will meet these requirements?","o":[["A","Ensure that each customer sets up an Amazon Q Business index that includes the customer's internal data. Ensure that each customer designates Example Corp as a data accessor to allow Example Corp to retrieve relevant content by using a secure API to enrich prompts at runtime."],["B","Use federated search with Model Context Protocol (MCP) by deploying real-time MCP servers for each customer. Retrieve data in real time during prompt generation."],["C","Ensure that each customer configures an Amazon Bedrock knowledge base. Allow cross-account querying so Example Corp can retrieve structured data for prompt augmentation."],["D","Configure Amazon Kendra to crawl customer data sources. Share the resulting indexes across accounts so Example Corp can query each customer's Amazon Kendra index to retrieve augmentation data."]]},"ex":{"c":"Amazon Q Business의 데이터 액세서(data accessor) 기능은 고객이 자기 Q Business 인덱스의 데이터 소유권과 통제권을 유지하면서 ISV가 보안 API(SearchRelevantContent)로 관련 콘텐츠를 검색하도록 허용합니다. 고객 환경에 서비스를 배포할 필요가 없고 시맨틱 검색 품질과 낮은 지연 시간을 제공합니다.","w":{"B":"고객마다 MCP 서버를 배포·관리해야 하고 실시간 접근은 요구 사항이 아닙니다.","C":"Bedrock 지식 기반은 기본적으로 다른 계정에서 쿼리하도록 설계되지 않았습니다.","D":"Kendra 인덱스는 계정 간에 공유할 수 없습니다."}}},{"n":41,"a":["C"],"orig":"","ko":{"q":"한 호텔 회사가 레거시 Java 기반 자산 관리 시스템(PMS)에 AI 기능을 추가하려고 합니다. 회사는 Amazon Bedrock Knowledge Bases로 직원에게 객실 가용성 정보와 호텔별 세부 정보를 제공하려고 합니다. 솔루션은 회사가 관리하는 호텔마다 별도의 액세스 제어를 유지해야 하고, 객실 가용성 정보를 거의 실시간으로 제공해야 하며, 피크 시간에도 일관된 성능을 유지해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","모든 호텔 데이터를 통합한 단일 Amazon Bedrock 지식 기반을 배포합니다. AWS Lambda 함수가 직접 API 연결로 각 호텔 PMS 데이터베이스의 데이터를 동기화하도록 구성합니다. 호텔별 필터가 있는 AWS CloudTrail 로깅으로 각 호텔 데이터의 액세스 로그를 감사합니다."],["B","PMS 데이터베이스 변경으로 호출되는 Amazon EventBridge 규칙을 호텔마다 만듭니다. 이 규칙이 관리용 AWS 계정의 중앙 Amazon Bedrock 지식 기반으로 업데이트를 보내도록 구성하고, 리소스 기반 정책으로 호텔별 액세스 제어를 적용합니다."],["C","다중 계정 구조에서 호텔마다 Amazon Bedrock 지식 기반을 하나씩 구현합니다. 직접 데이터 수집(direct ingestion)으로 거의 실시간 객실 가용성 정보를 제공하고, 덜 중요한 정보는 정기 동기화를 예약합니다."],["D","여러 지식 기반을 사용하는 중앙 집중식 Amazon Bedrock Agents 솔루션을 구축합니다. 호텔별 권한 세트가 있는 AWS IAM Identity Center로 직원 액세스를 제어합니다."]]},"en":{"q":"A hotel company wants to enhance a legacy Java-based property management system (PMS) by adding AI capabilities. The company wants to use Amazon Bedrock Knowledge Bases to provide staff with room availability information and hotel-specific details. The solution must maintain separate access controls for each hotel that the company manages. The solution must provide room availability information in near real time and must maintain consistent performance during peak usage periods.\nWhich solution will meet these requirements?","o":[["A","Deploy a single Amazon Bedrock knowledge base that contains combined data for all hotels. Configure AWS Lambda functions to synchronize data from each hotel's PMS database through direct API connections. Implement AWS CloudTrail logging with hotel-specific filters to audit access logs for each hotel's data."],["B","Create an Amazon EventBridge rule for each hotel that is invoked by changes to the PMS database . Configure the rule to send updates to a centralized Amazon Bedrock knowledge base in a management AWS account. Configure resource-based policies to enforce hotel-specific access controls."],["C","Implement one Amazon Bedrock knowledge base for each hotel in a multi-account structure. Use direct data ingestion to provide near real-time room availability information. Schedule regular synchronization for less critical information."],["D","Build a centralized Amazon Bedrock Agents solution that uses multiple knowledge bases. Implement AWS IAM Identity Center with hotel-specific permission sets to control staff access."]]},"ex":{"c":"호텔마다 별도 계정에 지식 기반을 두면 호텔별 접근 제어가 명확히 분리됩니다. 지식 기반의 직접 수집(direct ingestion, IngestKnowledgeBaseDocuments)으로 객실 가용성 변경을 거의 실시간으로 반영하고, 덜 중요한 정보는 정기 동기화로 처리해 피크 시에도 성능을 유지합니다.","w":{"A":"단일 지식 기반에 모든 호텔 데이터를 넣으면 호텔별 접근 제어가 어렵고, CloudTrail은 감사일 뿐 통제가 아닙니다.","B":"EventBridge는 지식 기반을 직접 갱신하지 못하며 중앙 지식 기반에서 호텔별로 분리하기 어렵습니다.","D":"Identity Center는 지식 기반 문서 수준의 접근 제어와 실시간 갱신을 해결하지 못합니다."}}},{"n":42,"a":["B"],"orig":"","ko":{"q":"한 회사가 AWS에서 동영상 분석 플랫폼을 구축하고 있습니다. 이 플랫폼은 Amazon Rekognition과 Amazon Bedrock으로 대규모 동영상 아카이브를 분석합니다. 플랫폼은 사전 정의된 개인 정보 보호 기준을 준수해야 하고, 안전한 모델 입출력을 사용하고, FM 접근 패턴을 통제하며, 누가 언제 무엇에 접근했는지 감사 기록을 제공해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock 모델 API 호출용 VPC 엔드포인트를 구성합니다. Amazon Bedrock 가드레일로 프롬프트와 응답의 유해하거나 승인되지 않은 콘텐츠를 필터링합니다. Amazon Bedrock 추적 이벤트로 모든 에이전트 및 모델 호출을 추적해 감사에 사용하고, 추적을 모델 사용 감사 기록으로 Amazon CloudWatch Logs에 내보냅니다. 모든 프롬프트와 출력은 AWS KMS 키를 사용한 서버 측 암호화(SSE-KMS)로 Amazon S3에 저장합니다."],["B","부서를 특정 권한에 매핑하는 속성 기반 액세스 제어(ABAC)를 IAM으로 정의합니다. Amazon Bedrock 모델 API 호출용 VPC 엔드포인트를 구성합니다. IAM 조건 키로 특정 GuardrailIdentifier와 ModelId 값을 강제합니다. AWS CloudTrail이 S3 객체의 관리 및 데이터 이벤트와 KMS 키 사용 활동을 수집하도록 구성합니다. S3 서버 액세스 로깅을 활성화해 동영상 아카이브와의 상세 파일 수준 상호 작용을 기록합니다. 모든 CloudTrail 로그를 AWS CloudTrail Lake로 보내고, Amazon Bedrock, Amazon Rekognition, AWS KMS의 예기치 않은 활동을 감지·알리는 Amazon CloudWatch 경보를 설정합니다."],["C","VPC 엔드포인트 정책으로 서비스 액세스를 제한합니다. AWS Config로 리소스 변경과 보안 규칙 준수를 추적합니다. SSE-KMS로 저장 데이터를 암호화하고, 모델 입출력은 별도의 Amazon S3 버킷에 저장합니다. S3 서버 액세스 로깅으로 파일 수준 상호 작용을 추적합니다."],["D","AWS CloudTrail Insights로 계정 전반의 API 호출 패턴을 분석해 Amazon Bedrock, Amazon Rekognition, Amazon S3, AWS KMS의 비정상 활동을 감지합니다. Amazon Macie로 동영상 아카이브를 스캔·분류합니다. SSE-KMS로 모든 저장 데이터를 암호화하고, 감사를 위해 CloudTrail이 KMS API 사용 이벤트를 수집하도록 구성합니다. Amazon EventBridge 규칙으로 CloudTrail Insights 이상 징후와 Macie 결과를 처리하고, 잠재적 보안 문제가 감지되면 CloudWatch 경보로 자동 알림과 보안 대응을 트리거합니다."]]},"en":{"q":"A company is building a video analysis platform on AWS. The platform will analyze a large video archive by using Amazon Rekognition and Amazon Bedrock. The platform must comply with predefined privacy standards. The platform must also use secure model I/O, control foundation model (FM) access patterns, and provide an audit of who accessed what and when.\nWhich solution will meet these requirements?","o":[["A","Configure VPC endpoints for Amazon Bedrock model API calls. Implement Amazon Bedrock guardrails to filter harmful or unauthorized content in prompts and responses. Use Amazon Bedrock trace events to track all agent and model invocations for auditing purposes. Export the traces to Amazon CloudWatch Logs as an audit record of model usage. Store all prompts and outputs in Amazon S3 with server-side encryption with AWS KMS keys (SSE-KMS)."],["B","Define access control by using IAM with attribute-based access control (ABAC) to map departments to specific permissions. Configure VPC endpoints for Amazon Bedrock model API calls. Use IAM condition keys to enforce specific GuardrailIdentifier and ModelId values. Configure AWS CloudTrail to capture management and data events for S3 objects and KMS key usage activities. Enable S3 server access logging to record detailed file-level interactions with the video archives. Send all CloudTrail logs to AWS CloudTrail Lake. Set up Amazon CloudWatch alarms to detect and alert on unexpected activity from Amazon Bedrock, Amazon Rekognition, and AWS KMS."],["C","Restrict access to services by using VPC endpoint policies. Use AWS Config to track resource changes and compliance with security rules. Use server-side encryption with AWS KMS keys (SSEKMS) to encrypt data at rest. Store the model's I/O in separate Amazon S3 buckets. Enable S3 server access logging to track file-level interactions."],["D","Configure AWS CloudTrail Insights to analyze API call patterns across accounts and detect anomalous activity in Amazon Bedrock, Amazon Rekognition, Amazon S3, and AWS KMS. Deploy Amazon Macie to scan and classify the video archive. Use server-side encryption with AWS KMS keys (SSE- KMS) to encrypt all stored data. Configure CloudTrail to capture KMS API usage events for audit purposes. Configure Amazon EventBridge rules to process CloudTrail Insights anomalies and Macie findings. Use CloudWatch alarms to trigger automated notifications and security responses when potential security issues are detected."]]},"ex":{"c":"ABAC로 부서별 권한을 정의하고, VPC 엔드포인트로 모델 I/O를 비공개로 보호하며, IAM 조건 키(bedrock:GuardrailIdentifier, ModelId)로 FM 접근 패턴을 강제합니다. CloudTrail 데이터 이벤트·CloudTrail Lake·S3 서버 액세스 로그로 '누가 언제 무엇에 접근했는지' 감사하고, CloudWatch 경보로 이상 활동을 알립니다.","w":{"A":"트레이스 이벤트는 사용자 접근 감사 기록이 아니며 FM 접근 패턴 통제가 없습니다.","C":"FM 접근 패턴 통제와 모델 호출에 대한 감사가 빠져 있습니다.","D":"이상 탐지와 데이터 분류에 그치고 FM 접근을 통제하지 않습니다."}}},{"n":43,"a":["B"],"orig":"","ko":{"q":"한 회사가 변호사가 수천 건의 법률 문서를 검색하도록 돕는 Amazon Bedrock 애플리케이션을 구현하려고 합니다. 변호사는 사건 유형, 관할권, 사건 결과를 기준으로 조회할 수 있어야 하며, 쿼리 결과에는 문서 작성자와 버전 정보가 포함되어야 합니다. 솔루션은 회사의 기존 도구와 통합되고, 향후 문서량과 쿼리 복잡도 증가를 지원해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","평면(flat) 텍스트 임베딩 스토어와 함께 Amazon Bedrock Knowledge Bases를 사용합니다. 사용자 쿼리에 검색 컨텍스트를 포함합니다."],["B","메타데이터 필터링을 지원하는 벡터 스토어와 함께 Amazon Bedrock Knowledge Bases를 사용합니다. 사건 유형, 관할권, 사건 결과에 대한 메타데이터 속성을 구성해 구조화된 검색을 가능하게 하고, 작성자와 버전 정보는 메타데이터 필드에 저장합니다."],["C","Amazon Comprehend로 법률 문서에서 사건 유형, 관할권, 사건 결과 같은 메타데이터 속성을 추출합니다. 평면 임베딩 스토어와 함께 Amazon Bedrock Knowledge Bases를 사용합니다."],["D","사건 유형, 관할권, 사건 결과 같은 메타데이터 속성을 구조화된 필드가 아니라 텍스트 안에 포함한 문서로 Amazon Bedrock Knowledge Bases를 사용합니다. Amazon Bedrock AgentCore와 RetrieveAndGenerate API로 쿼리 시 문서에서 메타데이터를 추출합니다."]]},"en":{"q":"A company wants to implement an Amazon Bedrock application that helps lawyers search thousands of legal documents. The solution must give lawyers the ability to query based on the type of legal case, jurisdiction, and case outcome. Queries must return information about document authors and versions. The solution must integrate with the company ' s existing tools and support future growth in volume and query complexity.\nWhich solution will meet these requirements?","o":[["A","Use Amazon Bedrock Knowledge Bases with a flat text embedding store. Include search context in user queries."],["B","Use Amazon Bedrock Knowledge Bases with a vector store that supports metadata filtering. Configure metadata attributes for case type, jurisdiction, and case outcome to enable structured retrieval. Store authorship and version information in metadata fields."],["C","Use Amazon Comprehend to extract metadata attributes such as case type, jurisdiction, and case outcome from legal documents. Use Amazon Bedrock Knowledge Bases with a flat embedding store."],["D","Use Amazon Bedrock Knowledge Bases with documents that include metadata attributes such as case type, jurisdiction, and case outcome embedded inside the text rather than defined as structured fields.Use Amazon Bedrock AgentCore with the RetrieveAndGenerate API to extract metadata from embedded documents during queries."]]},"ex":{"c":"메타데이터 필터링을 지원하는 벡터 저장소를 쓰는 Knowledge Bases에 사건 유형·관할·결과를 구조화된 메타데이터 속성으로 정의하면 필터 기반 검색이 가능합니다. 작성자와 버전 정보도 메타데이터로 저장하면 응답과 함께 반환할 수 있고, 관리형 서비스라 규모 확장에도 유리합니다.","w":{"A":"쿼리에 맥락을 넣는 것만으로는 정확한 구조화 필터링이 안 됩니다.","C":"메타데이터를 추출해도 평면 임베딩 저장소에서는 필터로 쓸 수 없습니다.","D":"본문에 섞인 메타데이터는 필터링할 수 없고, 쿼리 시 추출은 비효율적입니다."}}},{"n":44,"a":["B"],"orig":"","ko":{"q":"한 의료 회사가 Amazon Bedrock AgentCore에서 멀티 에이전트 시스템을 사용합니다. 이 시스템은 여러 FM으로 매일 2,000건의 의료 보고서 문서를 처리하며, 문서 분량은 5~50페이지입니다. 회사는 30페이지가 넘는 문서에 대해 시스템이 완전한 분석을 수행하지 못한다는 것을 발견했습니다. 30페이지 초과 문서는 뒷부분의 핵심 정보가 누락되며, 결과는 잘리지만 명시적인 오류는 없습니다. 회사는 응답 시간을 10초 미만으로 유지하면서 이 문제를 해결해야 하고, 처리 비용을 낮게 유지해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon CloudWatch Logs Insights 쿼리로 Amazon Bedrock 에이전트 처리 시간을 분석합니다. 에이전트를 호스팅하는 Lambda 함수의 타임아웃 설정을 늘리고, 큰 문서는 페이지 나누기로 순차 배치 처리합니다."],["B","한 청크의 끝부분 내용이 다음 청크의 시작 부분에 다시 나오도록 청크 간 의미적 중첩(overlap)이 있는 문서 청킹을 구현합니다. Amazon CloudWatch 지표로 InputTokenCount를 모니터링하고, 컨텍스트 사용률 CloudWatch 대시보드를 설정합니다. 처리 흐름에서 잘림 지점을 식별하는 진단 로깅을 구성합니다."],["C","에이전트 액션 그룹이 문서 섹션별로 별도 작업을 자동 생성해 순차 처리하도록 구성합니다. AWS Step Functions 워크플로로 처리를 조정하고, 개별 섹션의 결과를 결합합니다."],["D","전체 문서를 메모리에 수용하도록 더 큰 컴퓨팅 인스턴스 크기와 더 높은 메모리 구성으로 시스템을 배포합니다. Amazon Comprehend Medical을 추가해 핵심 의료 엔터티를 식별하고 우선순위를 지정해 컨텍스트 관리를 개선합니다."]]},"en":{"q":"A healthcare company uses a multi-agent system on Amazon Bedrock AgentCore. The system uses multiple FMs to process 2,000 medical report documents daily. The documents range from 5 to 50 pages each. The company discovers that the system is not performing complete analysis on documents that exceed 30 pages. Documents over 30 pages miss critical information from later sections. The results are truncated, but there are no explicit errors. The company must resolve this issue while maintaining response times under 10 seconds. The company must keep processing costs low.\nWhich solution will meet these requirements?","o":[["A","Use Amazon CloudWatch Logs Insights queries to analyze Amazon Bedrock agent processing times. Increase the timeout settings for the Lambda functions that host the agents. Implement pagination for larger documents to process in sequential batches."],["B","Implement document chunking with semantic overlap between chunks where content from the end of one chunk appears at the beginning of the next chunk. Configure Amazon CloudWatch metrics to monitor InputTokenCount. Set up a CloudWatch dashboard for context utilization percentage. Configure diagnostic logging that identifies truncation points in the processing flow."],["C","Configure agent action groups to process documents sequentially by automatically creating separate tasks for each document section. Set up an AWS Step Functions workflow to coordinate processing. Combine the results from individual sections."],["D","Deploy the system in a higher memory configuration with a larger compute instance size to accommodate complete documents in memory. Add Amazon Comprehend Medical to identify and prioritize critical medical entities for improved context management."]]},"ex":{"c":"30페이지를 넘는 문서가 오류 없이 잘리는 것은 모델 컨텍스트 창 초과로 인한 무음 절단입니다. 의미 중첩을 둔 청크로 나누면 각 청크가 컨텍스트 안에 들어가고 경계의 맥락도 유지됩니다. InputTokenCount와 컨텍스트 사용률을 모니터링하고 절단 지점을 진단 로깅해 재발을 감시하며, 비용과 응답 시간도 유지됩니다.","w":{"A":"타임아웃 문제가 아니며 단순 페이지 분할은 섹션 사이의 맥락을 잃습니다.","C":"섹션별 순차 처리와 Step Functions는 지연 시간과 복잡성을 늘립니다.","D":"메모리나 인스턴스 크기는 모델 컨텍스트 창 한계와 무관합니다."}}},{"n":45,"a":["A","D"],"orig":"","ko":{"q":"한 출판 회사가 Amazon SageMaker AI에서 실행되는 컨테이너형 LLM을 사용하는 채팅 어시스턴트를 개발하고 있습니다. 아키텍처는 사용자 요청을 AWS Lambda 함수로 라우팅하는 Amazon API Gateway REST API로 구성되며, Lambda 함수는 LLM을 호스팅하는 SageMaker AI 실시간 엔드포인트를 호출합니다. 사용자들은 응답 시간이 고르지 않다고 보고하며, 분석 결과 첫 토큰을 2초 기다린 뒤 이탈하는 채팅이 많습니다. 회사는 채팅 어시스턴트의 대화형 요청에 대해 p95 지연 시간을 800ms 미만으로 만들려고 합니다.\n이 요구 사항을 충족하는 솔루션 조합은 무엇입니까? (2개 선택)","o":[["A","컨테이너 시작 시 모델 사전 로드(preload)를 활성화합니다. 여러 사용자 요청을 한 번의 추론 패스로 함께 처리하는 동적 배치 처리를 구현합니다."],["B","SageMaker AI 엔드포인트에 더 큰 GPU 인스턴스 유형을 선택합니다. 최소 인스턴스 수를 0으로 설정하고, 요청별 처리를 유지하며, 첫 요청 시 모델 가중치를 지연 로드합니다."],["C","다중 모델 엔드포인트로 전환하고, 요청 배치 처리 없이 지연 로드를 사용합니다."],["D","최소 인스턴스 수를 0보다 크게 설정하고, 응답 스트리밍을 활성화합니다."],["E","모든 요청에 Amazon SageMaker 비동기 추론을 사용하도록 전환합니다. 요청을 Amazon S3 버킷에 저장하고 최소 인스턴스 수를 0으로 설정합니다."]]},"en":{"q":"A publishing company is developing a chat assistant that uses a containerized large language model (LLM) that runs on Amazon SageMaker AI. The architecture consists of an Amazon API Gateway REST API that routes user requests to an AWS Lambda function. The Lambda function invokes a SageMaker AI real-time endpoint that hosts the LLM. Users report uneven response times. Analytics show that a high number of chats are abandoned after 2 seconds of waiting for the first token. The company wants a solution to ensure that p95 latency is under 800 ms for interactive requests to the chat assistant.\nWhich combination of solutions will meet this requirement? (Select TWO.)","o":[["A","Enable model preload upon container startup. Implement dynamic batching to process multiple user requests together in a single inference pass."],["B","Select a larger GPU instance type for the SageMaker AI endpoint. Set the minimum number of instances to 0. Continue to perform per-request processing. Lazily load model weights on the first request."],["C","Switch to a multi-model endpoint. Use lazy loading without request batching."],["D","Set the minimum number of instances to greater than 0. Enable response streaming."],["E","Switch to Amazon SageMaker Asynchronous Inference for all requests. Store requests in an Amazon S3 bucket. Set the minimum number of instances to 0."]]},"ex":{"c":"컨테이너 시작 시 모델을 미리 로드하면 첫 요청의 콜드 로딩 지연이 사라지고, 동적 배치는 GPU 처리량을 높여 대기 시간을 줄입니다(A). 최소 인스턴스를 1 이상으로 유지하면 콜드 스타트가 없고, 응답 스트리밍으로 첫 토큰을 빠르게 보내 체감 지연을 낮춥니다(D).","w":{"B":"최소 인스턴스 0과 지연 로딩은 콜드 스타트를 유발해 지연을 악화시킵니다.","C":"다중 모델 엔드포인트의 지연 로딩은 첫 호출 지연을 키웁니다.","E":"비동기 추론은 대화형 저지연 요구에 맞지 않습니다."}}},{"n":46,"a":["A","D","F"],"orig":"","ko":{"q":"한 금융 회사가 고객의 투자 계획과 포트폴리오 관리를 돕는 AI 어시스턴트를 개발하고 있습니다. 회사는 특정 종목 추천이나 수익 보장 요청 같은 몇 가지 고위험 대화 패턴을 파악했습니다. 적절한 통제를 구현하지 못하면 이런 패턴은 규제 위반으로 이어질 수 있습니다. 회사는 AI 어시스턴트가 부적절한 금융 조언을 제공하거나, 경쟁사에 관한 콘텐츠를 생성하거나, 회사의 승인된 금융 지침에 사실적 근거가 없는 주장을 하지 않도록 해야 합니다. 회사는 Amazon Bedrock Guardrails로 솔루션을 구현하려고 합니다.\n이 요구 사항을 충족하는 단계 조합은 무엇입니까? (3개 선택)","o":[["A","고위험 대화 패턴을 거부 주제(denied topics) 가드레일에 추가합니다."],["B","고위험 대화 패턴이 포함된 프롬프트를 필터링하는 콘텐츠 필터 가드레일을 구성합니다."],["C","경쟁사 이름이 포함된 프롬프트를 필터링하는 콘텐츠 필터 가드레일을 구성합니다."],["D","경쟁사 이름을 사용자 지정 단어 필터로 추가하고, 입력 및 출력 작업을 차단으로 설정합니다."],["E","근거성(grounding) 점수 임계값을 낮게 설정합니다."],["F","근거성 점수 임계값을 높게 설정합니다."]]},"en":{"q":"A finance company is developing an AI assistant to help clients plan investments and manage their portfolios. The company identifies several high-risk conversation patterns such as requests for specific stock recommendations or guaranteed returns. High-risk conversation patterns could lead to regulatory violations if the company cannot implement appropriate controls. The company must ensure that the AI assistant does not provide inappropriate financial advice, generate content about competitors, or make claims that are not factually grounded in the company ' s approved financial guidance. The company wants to use Amazon Bedrock Guardrails to implement a solution.\nWhich combination of steps will meet these requirements? (Select THREE)","o":[["A","Add the high-risk conversation patterns to a denied topics guardrail."],["B","Configure a content filter guardrail to filter prompts that contain the high-risk conversation patterns."],["C","Configure a content filter guardrail to filter prompts that contain competitor names."],["D","Add the names of competitors as custom word filters. Set the input and output actions to block."],["E","Set a low grounding score threshold."],["F","Set a high grounding score threshold."]]},"ex":{"c":"특정 종목 추천·수익 보장 같은 고위험 대화 패턴은 거부 주제(denied topics)로 차단합니다(A). 경쟁사 이름은 사용자 지정 단어 필터로 입력·출력 모두 차단합니다(D). 승인된 지침에 근거하지 않은 주장은 컨텍스트 근거성 검사에서 근거성 임계값을 높게 설정해 걸러냅니다(F).","w":{"B":"콘텐츠 필터는 혐오·폭력 같은 고정 범주만 다루며 사용자 지정 주제를 정의할 수 없습니다.","C":"콘텐츠 필터는 특정 단어나 이름을 필터링하지 않습니다.","E":"근거성 임계값을 낮게 하면 근거 없는 응답도 통과합니다."}}},{"n":47,"a":["B"],"orig":"","ko":{"q":"한 금융 서비스 회사가 고객 녹취록, 재무 보고서, 문서 같은 비정형 데이터를 전처리해야 합니다. 회사는 Amazon Bedrock 애플리케이션을 지원하기 위해 비정형 데이터를 Amazon S3에 저장합니다. 회사는 데이터 품질을 검증하고, 감사 가능한 메타데이터를 생성하고, 데이터 지표를 모니터링하며, FM 성능을 최적화하도록 텍스트 청킹을 사용자 지정해야 합니다.\n개발 노력이 가장 적은 솔루션은 무엇입니까?","o":[["A","Amazon SageMaker Data Wrangler로 데이터 흐름을 만듭니다. Amazon CloudWatch 지표와 경보로 데이터 품질을 모니터링합니다. 사용자 지정 AWS Lambda 함수로 데이터를 전처리하고, 처리된 데이터를 Amazon Bedrock에 로드합니다."],["B","AWS Glue 크롤러로 데이터 소스를 카탈로그화합니다. AWS Glue ETL 작업으로 사용자 지정 변환 스크립트를 실행하고, AWS Glue Data Quality로 데이터 품질을 검증·모니터링합니다. 처리된 데이터를 Amazon Bedrock에 로드합니다."],["C","Amazon Comprehend로 엔터티를 추출합니다. AWS Lambda 함수로 텍스트를 청킹하고, Amazon Athena로 데이터 품질을 쿼리·검증합니다. 처리된 데이터를 Amazon Bedrock에 로드합니다."],["D","AWS Step Functions 워크플로로 데이터 전처리 작업을 오케스트레이션합니다. Amazon EC2 인스턴스에서 사용자 지정 코드를 실행하고, Amazon SageMaker Model Monitor로 데이터 품질을 모니터링합니다. 처리된 데이터를 Amazon Bedrock에 로드합니다."]]},"en":{"q":"A financial services company needs to pre-process unstructured data such as customer transcripts, financial reports, and documentation. The company stores the unstructured data in Amazon S3 to support an Amazon Bedrock application. The company must validate data quality, create auditable metadata, monitor data metrics, and customize text chunking to optimize foundation model (FM) performance.\nWhich solution will meet these requirements with the LEAST development effort?","o":[["A","Use Amazon SageMaker Data Wrangler to create a data flow. Configure Amazon CloudWatch metrics and alarms to monitor data quality. Use a custom AWS Lambda function to pre-process the data. Load processed data into Amazon Bedrock."],["B","Set up an AWS Glue crawler to catalog data sources. Create AWS Glue ETL jobs to run custom transformation scripts. Use AWS Glue Data Quality to validate and monitor data quality. Load processed data into Amazon Bedrock."],["C","Use Amazon Comprehend to extract entities. Create an AWS Lambda function to chunk text. Run Amazon Athena to query and validate data quality. Load processed data into Amazon Bedrock."],["D","Create an AWS Step Functions workflow to orchestrate data pre-processing tasks. Run custom code on Amazon EC2 instances. Use Amazon SageMaker Model Monitor to monitor data quality. Load processed data into Amazon Bedrock."]]},"ex":{"c":"Glue 크롤러로 카탈로그(감사 가능한 메타데이터)를 만들고, Glue ETL 작업에서 사용자 지정 청크 분할 스크립트를 실행하며, Glue Data Quality로 품질 검증과 지표 모니터링을 합니다. 하나의 관리형 서비스로 모든 요구를 충족해 개발 노력이 가장 적습니다.","w":{"A":"Data Wrangler에 사용자 지정 Lambda와 CloudWatc
