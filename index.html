<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIP-C01 한영 문제풀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar, left number grid (collapses to drawer on phone), one question card at reading width */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#17202c; --muted:#5d6878; --line:#dce2ea;
  --accent:#2f5bd3; --accent-soft:#e6ecfb;
  --ok:#17845a; --ok-soft:#e2f4ec; --bad:#c23b3b; --bad-soft:#fbe7e7; --warn:#b7791f;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --fg:#e4e9f0; --muted:#95a1b2; --line:#2a3443;
  --accent:#7d9cf5; --accent-soft:#1f2b48;
  --ok:#4cc18f; --ok-soft:#163327; --bad:#ef7a7a; --bad-soft:#3a1d1f; --warn:#e0a84a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --fg:#e4e9f0; --muted:#95a1b2; --line:#2a3443;
  --accent:#7d9cf5; --accent-soft:#1f2b48;
  --ok:#4cc18f; --ok-soft:#163327; --bad:#ef7a7a; --bad-soft:#3a1d1f; --warn:#e0a84a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;letter-spacing:-.01em}
.brand code{font-family:var(--mono);font-size:13px;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:5px;font-weight:600}
.modes{display:flex;gap:4px;flex-wrap:wrap}
.modes button{border:1px solid var(--line);background:transparent;padding:5px 11px;border-radius:999px;font-size:13px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.stats{margin-left:auto;display:flex;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;align-items:center}
.stats b{color:var(--fg);font-family:var(--mono);font-weight:600}
.stats .o b{color:var(--ok)} .stats .x b{color:var(--bad)}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:7px;padding:4px 9px;font-size:13px;color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 60px}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.aside-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
.grid button{font-family:var(--mono);font-size:12px;height:32px;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:0;position:relative;font-variant-numeric:tabular-nums}
.grid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid button.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.grid button.cur{outline:2px solid var(--fg);outline-offset:1px}
.grid button.bm::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.side-actions{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.side-actions button{border:1px solid var(--line);background:transparent;border-radius:7px;padding:6px 10px;font-size:13px;text-align:left;color:var(--muted)}
.side-actions .confirm{color:var(--bad);border-color:var(--bad)}
.side-actions .grp{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.side-actions .row{display:flex;gap:6px}.side-actions .row button{flex:1;text-align:center}
.saved{font-size:12px;color:var(--muted);margin-left:auto;font-weight:400}
.rpanel{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.rpanel label{display:flex;gap:7px;align-items:baseline;font-size:13px;cursor:pointer;color:var(--fg)}
.rpanel label small{color:var(--muted);font-family:var(--mono);font-size:11.5px;margin-left:auto}
.rpanel label.off{opacity:.45;cursor:not-allowed}
.rpanel .warn{font-size:12px;color:var(--bad);margin:2px 0 0}
.side-actions .danger{color:var(--bad);border-color:var(--bad)}
.side-actions .danger.armed{background:var(--bad);color:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:20;max-width:calc(100% - 32px)}
main{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px 28px;max-width:820px}
.qmeta{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-bottom:14px}
.qno{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted)}
.qno strong{font-size:22px;color:var(--fg);margin-right:2px}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.multi{background:var(--warn);color:var(--surface)}
.bmbtn{margin-left:auto;border:1px solid var(--line);background:transparent;border-radius:7px;padding:4px 10px;font-size:13px;color:var(--muted)}
.bmbtn[aria-pressed="true"]{color:var(--warn);border-color:var(--warn)}
.stem p{margin:0 0 10px;max-width:68ch;word-break:keep-all;overflow-wrap:anywhere}
.stem p.ask{font-weight:600;margin-top:14px}
.opts{display:flex;flex-direction:column;gap:9px;margin:18px 0 6px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;text-align:left;width:100%;
  border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:12px 14px;line-height:1.6;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-weight:600;font-size:13px;width:28px;height:28px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:50%;color:var(--muted)}
.opt.multi .k{border-radius:6px}
.opt .t{word-break:keep-all;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.result{margin-top:14px;padding:12px 14px;border-radius:9px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.result.ok{background:var(--ok-soft);color:var(--ok)} .result.bad{background:var(--bad-soft);color:var(--bad)}
.result span{font-weight:400;color:var(--fg)}
.result code{font-family:var(--mono)}
.nav{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.nav .sp{flex:1}
.hint{font-size:12px;color:var(--muted);margin-top:14px}
.hint kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--bg)}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px;max-width:820px}
.progress div{height:100%;background:var(--accent);transition:width .2s}
.exambar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;max-width:820px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.exambar b{font-family:var(--mono);color:var(--fg)}
.empty{color:var(--muted);padding:30px 0}
.score{max-width:820px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px 28px;margin-bottom:18px}
.score h2{margin:0 0 6px;font-size:15px;color:var(--muted);font-weight:600}
.score .big{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1.1}
.score .big small{font-size:18px;color:var(--muted)}
.score .verdict{font-weight:700;margin-top:4px}
.score .verdict.pass{color:var(--ok)} .score .verdict.fail{color:var(--bad)}
.search{display:flex;gap:6px;margin-bottom:10px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 9px;font:inherit;font-size:13px;color:var(--fg)}
.menu-toggle{display:none}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.stem .en p,.opt .en{color:var(--muted);font-size:.93em}
.stem .en{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.stem .en p{word-break:normal}
.opt .en{display:block;margin-top:4px;word-break:normal}
.lv{display:flex;gap:3px;align-items:center;font-size:12px;color:var(--muted)}
.lv button{border:1px solid var(--line);background:transparent;border-radius:6px;width:28px;height:26px;padding:0;font-size:12.5px}
.lv button[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.ex{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--bg)}
.ex h3{margin:0 0 8px;font-size:13px;letter-spacing:.04em;color:var(--muted);display:flex;gap:8px;align-items:center}
.ex h3 small{font-weight:400;font-size:11.5px;letter-spacing:0}
.ex .why{margin:0 0 12px;max-width:68ch;word-break:keep-all;overflow-wrap:anywhere}
.ex ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.ex li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;font-size:14px;color:var(--muted);word-break:keep-all;overflow-wrap:anywhere}
.ex li b{font-family:var(--mono);font-size:12px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--bad-soft);color:var(--bad)}
.ex li.ok b{background:var(--ok-soft);color:var(--ok)}
.note{margin-top:10px;font-size:13px;color:var(--warn);font-weight:500}
.note code{font-family:var(--mono)}
.filt{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.filt button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted)}
.filt button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.filt span{font-size:12px;color:var(--muted);align-self:center;margin-right:2px}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none}
  aside.closed .collapsible{display:none}
  .menu-toggle{display:inline-block}
  .card{padding:20px 18px}
  .stats{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><code>AIP-C01</code><span>문제풀이</span></div>
  <div class="modes" role="group" aria-label="풀이 모드">
    <button id="m-seq" data-mode="seq">순서대로</button>
    <button id="m-rand" data-mode="rand">랜덤</button>
    <button id="m-wrong" data-mode="wrong">오답만</button>
    <button id="m-bm" data-mode="bm">북마크</button>
    <button id="m-exam" data-mode="exam">모의고사 65</button>
  </div>
  <div class="lang" role="group" aria-label="언어">
    <button id="l-ko" data-lang="ko">한글</button><button id="l-en" data-lang="en">English</button><button id="l-both" data-lang="both">한+영</button>
  </div>
  <div class="stats" id="stats"></div>
</div></header>

<div class="wrap">
  <aside id="aside" class="closed">
    <div class="aside-h"><span id="aside-title">문항</span><button class="iconbtn menu-toggle" id="toggle">펼치기</button></div>
    <div class="collapsible">
      <div class="search"><input id="search" type="search" placeholder="키워드 검색 (예: Guardrails)" aria-label="문항 검색"></div>
      <div class="filt" id="filt"></div>
      <div class="grid" id="grid"></div>
      <div class="legend"><span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>정답</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>오답</span><span><i style="background:var(--accent-soft);border-color:var(--accent)"></i>응답</span><span><i style="background:var(--warn);border-radius:50%;border:0"></i>북마크</span></div>
      <div class="side-actions" id="side-actions"></div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>
const Q = [{"n":1,"a":["B","C"],"orig":"C, D","ko":{"q":"한 회사가 고객 서비스, 콘텐츠 생성, 문서 분석을 위해 여러 사업부에 걸쳐 다수의 Amazon Bedrock 기반 생성형 AI(GenAI) 애플리케이션을 배포했습니다. 일부 애플리케이션은 예측할 수 없는 토큰 소비 패턴을 보입니다. 회사는 여러 모델에 걸친 토큰 사용 패턴을 실시간으로 파악할 수 있는 포괄적인 관측성 솔루션이 필요합니다. 이 솔루션은 여러 이해관계자 그룹을 위한 사용자 지정 대시보드를 지원하고, 회사 애플리케이션이 사용하는 모든 파운데이션 모델(FM)의 토큰 소비에 대한 알림 기능을 제공해야 합니다.\n운영 오버헤드가 가장 적은 솔루션 조합은 무엇입니까? (2개 선택)","o":[["A","Amazon CloudWatch 지표를 데이터 소스로 사용하여 FM 전반의 토큰 사용 추세와 패턴을 보여주는 사용자 지정 Amazon QuickSight 대시보드를 만듭니다."],["B","CloudWatch Logs Insights로 Amazon Bedrock 호출 로그를 분석하여 토큰 소비 패턴과 애플리케이션별 사용량을 파악합니다. 사용량이 많은 상황을 식별하는 사용자 지정 쿼리를 만들고, 대시보드에 로그 위젯을 추가해 지속적으로 모니터링합니다."],["C","Amazon Bedrock의 기본 토큰 및 호출 CloudWatch 지표를 결합한 사용자 지정 Amazon CloudWatch 대시보드를 만듭니다. 토큰 사용량 임계값을 모니터링하는 CloudWatch 경보를 설정합니다."],["D","Amazon Bedrock과 Amazon Managed Grafana의 제로 ETL 통합을 사용하여 회사 FM 전반의 토큰 사용 추세와 패턴을 보여주는 대시보드를 만듭니다."],["E","Amazon EventBridge 규칙으로 Amazon Bedrock 모델 호출 이벤트를 수집합니다. Amazon Data Firehose를 사용해 토큰 사용 데이터를 Amazon OpenSearch Serverless로 전송하고, OpenSearch 대시보드로 사용 패턴을 분석합니다."]]},"en":{"q":"A company deploys multiple Amazon Bedrock-based generative AI (GenAI) applications across multiple business units for customer service, content generation, and document analysis. Some applications show unpredictable token consumption patterns. The company requires a comprehensive observability solution that provides real-time visibility into token usage patterns across multiple models. The observability solution must support custom dashboards for multiple stakeholder groups and provide alerting capabilities for token consumption across all the foundation models that the company's applications use.\nWhich combination of solutions will meet these requirements with the LEAST operational overhead? (Select TWO.)","o":[["A","Use Amazon CloudWatch metrics as data sources to create custom Amazon QuickSight dashboards that show token usage trends and usage patterns across FMs."],["B","Use CloudWatch Logs Insights to analyze Amazon Bedrock invocation logs for token consumption patterns and usage attribution by application. Create custom queries to identify high-usage scenarios. Add log widgets to dashboards to enable continuous monitoring."],["C","Create custom Amazon CloudWatch dashboards that combine native Amazon Bedrock token and invocation CloudWatch metrics. Set up CloudWatch alarms to monitor token usage thresholds."],["D","Create dashboards that show token usage trends and patterns across the company's FMs by using an Amazon Bedrock zero-ETL integration with Amazon Managed Grafana."],["E","Implement Amazon EventBridge rules to capture Amazon Bedrock model invocation events. Route token usage data to Amazon OpenSearch Serverless by using Amazon Data Firehose. Use OpenSearch dashboards to analyze usage patterns."]]},"ex":{"c":"Amazon Bedrock은 InputTokenCount·OutputTokenCount·Invocations 같은 지표를 CloudWatch에 기본으로 게시합니다. 이 지표로 CloudWatch 대시보드와 경보를 만들면(C) 별도 파이프라인 없이 실시간 가시성과 알림을 얻습니다. 호출 로그를 CloudWatch Logs Insights로 분석하고 로그 위젯을 대시보드에 붙이면(B) 애플리케이션별 사용량 귀속까지 파악할 수 있어, 두 가지 모두 관리형 기능만으로 해결됩니다.","w":{"A":"QuickSight는 별도 데이터셋·권한 구성이 필요하고 알림 기능을 제공하지 않아 오버헤드가 큽니다.","D":"Bedrock과 Managed Grafana 사이에 '제로 ETL 통합'이라는 기능은 없습니다.","E":"EventBridge·Firehose·OpenSearch 파이프라인을 직접 구축·운영해야 하므로 오버헤드가 가장 큽니다."}}},{"n":2,"a":["B"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock으로 고객 문의에 대한 개인화된 응답을 생성하는 고객 서비스 애플리케이션을 운영합니다. 회사는 업데이트 전반에 걸쳐 프롬프트 효과와 모델 구성을 평가하는 품질 보증 프로세스를 수립해야 합니다. 이 프로세스는 여러 프롬프트 템플릿의 출력을 자동으로 비교하고, 응답 품질 문제를 감지하고, 정량적 지표를 제공하며, 사람 검토자가 응답에 피드백을 줄 수 있어야 합니다. 또한 사전에 정의한 품질 임계값을 충족하지 못하는 구성이 배포되지 않도록 막아야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","샘플 고객 문의를 여러 Amazon Bedrock 모델 구성으로 보내고 응답을 Amazon S3에 저장하는 AWS Lambda 함수를 만듭니다. Amazon QuickSight로 응답 패턴을 시각화하고 매일 출력을 수동 검토합니다. AWS CodePipeline으로 품질 임계값을 충족하는 구성을 배포합니다."],["B","사용자 지정 프롬프트 데이터세트를 사용하는 Amazon Bedrock 평가 작업으로 모델 출력을 비교합니다. 프롬프트 템플릿이 변경되면 AWS CodePipeline이 평가 작업을 실행하도록 구성하고, 사전 정의된 품질 임계값을 넘는 구성만 배포하도록 CodePipeline을 구성합니다."],["C","Amazon CloudWatch 경보로 Amazon Bedrock의 응답 지연 시간과 오류율을 모니터링합니다. 임계값을 초과하면 Amazon EventBridge 규칙으로 팀에 알리고, AWS Systems Manager에서 수동 승인 워크플로를 구성합니다."],["D","AWS Lambda 함수로 프로덕션 트래픽을 샘플링하고 중복 요청을 업데이트된 모델 버전으로 라우팅하는 자동 테스트 프레임워크를 만듭니다. Amazon Comprehend 감정 분석으로 결과를 비교하고, 감정 점수가 낮아지면 배포를 차단합니다."]]},"en":{"q":"A company has a customer service application that uses Amazon Bedrock to generate personalized responses to customer inquiries. The company needs to establish a quality assurance process to evaluate prompt effectiveness and model configurations across updates. The process must automatically compare outputs from multiple prompt templates, detect response quality issues, provide quantitative metrics, and allow human reviewers to give feedback on responses. The process must prevent configurations that do not meet a predefined quality threshold from being deployed.\nWhich solution will meet these requirements?","o":[["A","Create an AWS Lambda function that sends sample customer inquiries to multiple Amazon Bedrock model configurations and stores responses in Amazon S3. Use Amazon QuickSight to visualize response patterns. Manually review outputs daily. Use AWS CodePipeline to deploy configurations that meet the quality threshold."],["B","Use Amazon Bedrock evaluation jobs to compare model outputs by using custom prompt datasets . Configure AWS CodePipeline to run the evaluation jobs when prompt templates change. Configure CodePipeline to deploy only configurations that exceed the predefined quality threshold."],["C","Set up Amazon CloudWatch alarms to monitor response latency and error rates from Amazon Bedrock. Use Amazon EventBridge rules to notify teams when thresholds are exceeded. Configure a manual approval workflow in AWS Systems Manager."],["D","Use AWS Lambda functions to create an automated testing framework that samples production traffic and routes duplicate requests to the updated model version. Use Amazon Comprehend sentiment analysis to compare results. Block deployment if sentiment scores decrease."]]},"ex":{"c":"Amazon Bedrock 평가 작업은 사용자 지정 프롬프트 데이터세트로 여러 구성의 출력을 자동 비교하고 정량 지표를 산출하며, 사람 평가(human evaluation) 작업도 지원합니다. CodePipeline에서 프롬프트 변경 시 평가를 실행하고 임계값을 넘는 구성만 배포하도록 게이트를 두면 모든 요구 사항을 충족합니다.","w":{"A":"매일 수동 검토는 자동 비교·정량 지표 요구를 충족하지 못합니다.","C":"지연 시간·오류율은 응답 품질 지표가 아닙니다.","D":"감정 점수는 응답 품질을 대표하지 못하고 사람 피드백 경로도 없습니다."}}},{"n":3,"a":["A","B"],"orig":"","ko":{"q":"한 회사가 AWS Lambda와 REST API를 사용해 지원 워크플로를 자동화하는 추론(reasoning) 에이전트를 구축하고 있습니다. 시스템은 상호 작용 간에 메모리를 유지하고, 관련 에이전트 상태를 공유하며, 이벤트 기반 호출과 동기식 호출을 모두 지원해야 합니다. 또한 액세스 제어와 세션 기반 권한을 적용해야 합니다.\n가장 확장성 있는 솔루션을 제공하는 단계 조합은 무엇입니까? (2개 선택)","o":[["A","Amazon Bedrock AgentCore로 메모리와 세션 인식 추론을 관리합니다. 기본 제공 ID 지원, 이벤트 처리, 관측성 기능과 함께 에이전트를 배포합니다."],["B","Amazon API Gateway와 Amazon EventBridge를 사용해 Lambda 함수와 REST API를 액션으로 등록합니다. Amazon Bedrock AgentCore가 사용자 지정 오케스트레이션 코드 없이 Lambda 함수와 REST API를 호출하도록 합니다."],["C","추론과 대화 관리에는 Amazon Bedrock Agents를 사용합니다. 오케스트레이션에는 AWS Step Functions와 Amazon SQS를 사용하고, 에이전트 상태는 Amazon DynamoDB에 저장합니다."],["D","추론 로직을 API Gateway 뒤의 Amazon ECS 컨테이너로 배포합니다. 메모리와 ID 데이터는 Amazon Aurora에 저장합니다."],["E","Amazon Kendra와 Amazon Bedrock으로 사용자 지정 RAG 파이프라인을 구축합니다. AWS Lambda로 도구 호출을 오케스트레이션하고, 에이전트 상태는 Amazon S3에 저장합니다."]]},"en":{"q":"A company is using AWS Lambda and REST APIs to build a reasoning agent to automate support workflows. The system must preserve memory across interactions, share relevant agent state, and support event-driven invocation and synchronous invocation. The system must also enforce access control and session-based permissions.\nWhich combination of steps provides the MOST scalable solution? (Select TWO.)","o":[["A","Use Amazon Bedrock AgentCore to manage memory and session-aware reasoning. Deploy the agent with built-in identity support, event handling, and observability."],["B","Register the Lambda functions and REST APIs as actions by using Amazon API Gateway and Amazon EventBridge. Enable Amazon Bedrock AgentCore to invoke the Lambda functions and REST APIs without custom orchestration code."],["C","Use Amazon Bedrock Agents for reasoning and conversation management. Use AWS Step Functions and Amazon SQS for orchestration. Store agent state in Amazon DynamoDB."],["D","Deploy the reasoning logic as a container on Amazon ECS behind API Gateway. Use Amazon Aurora to store memory and identity data."],["E","Build a custom RAG pipeline by using Amazon Kendra and Amazon Bedrock. Use AWS Lambda to orchestrate tool invocations. Store agent state in Amazon S3."]]},"ex":{"c":"Amazon Bedrock AgentCore는 Memory(상호 작용 간 메모리), Runtime(세션 격리), Identity(액세스 제어·세션 권한), Observability를 관리형으로 제공합니다(A). AgentCore Gateway를 통해 Lambda와 REST API를 도구(액션)로 등록하면 사용자 지정 오케스트레이션 코드 없이 호출할 수 있고, API Gateway·EventBridge로 동기·이벤트 기반 호출을 모두 지원합니다(B).","w":{"C":"Step Functions·SQS·DynamoDB로 상태와 오케스트레이션을 직접 구현해야 해 확장성과 관리 부담이 큽니다.","D":"ECS와 Aurora로 메모리·ID를 직접 구현하는 방식은 관리형 대안보다 확장성이 떨어집니다.","E":"RAG 파이프라인은 에이전트 메모리·세션 권한 요구와 무관하며 S3는 상태 저장에 부적합합니다."}}},{"n":4,"a":["B","D"],"orig":"B, E","ko":{"q":"한 회사가 AWS Control Tower에 랜딩 존을 구성했습니다. 회사는 유럽 연합(EU) 내에 있어야 하는 민감한 데이터를 다루며, eu-central-1 리전만 사용해야 합니다. 회사는 서비스 제어 정책(SCP)으로 데이터 상주 정책을 적용합니다. GenAI 개발자에게는 Amazon Bedrock 전체 권한이 있는 IAM 역할이 할당되어 있습니다. 회사는 GenAI 개발자가 Amazon Bedrock에서 Amazon Nova Pro 모델을 교차 리전 추론(CRI)으로만, 그리고 eu-central-1에서만 사용할 수 있도록 해야 합니다. 회사는 Amazon Bedrock에서 GenAI 개발자 IAM 역할에 대해 모델 액세스를 활성화했습니다. 그러나 GenAI 개발자가 Amazon Bedrock Chat/Text 플레이그라운드에서 모델을 호출하면 다음 오류가 발생합니다.\nUser arn:aws:sts:123456789012:assumed-role/AssumedDevRole/DevUserName Action: bedrock:InvokeModelWithResponseStream On resource(s): arn:aws:bedrock:eu-west-3::foundation-model/amazon.nova-pro-v1:0 Context: a service control policy explicitly denies the action\n회사는 이 오류를 해결해야 합니다. 솔루션은 기존 거버넌스 통제를 유지하고 정밀한 액세스 제어를 제공해야 하며, 기존 데이터 상주 정책을 준수해야 합니다.\n이 요구 사항을 충족하는 솔루션 조합은 무엇입니까? (2개 선택)","o":[["A","GenAI 개발자 IAM 역할에 AdministratorAccess 정책을 추가합니다."],["B","기존 SCP를 확장하여 eu.amazon.nova-pro-v1:0 추론 프로필에 대해 CRI를 허용합니다."],["C","eu-west-3 리전에서 Amazon Nova Pro에 대한 Amazon Bedrock 모델 액세스를 활성화합니다."],["D","GenAI 개발자 IAM 역할이 모델을 제공할 수 있는 모든 EU 리전에서 eu.amazon.nova-pro-v1:0 추론 프로필을 통해 Amazon Nova Pro를 호출할 권한이 있는지 검증합니다."],["E","기존 SCP를 확장하여 eu-* 추론 프로필에 대해 CRI를 허용합니다."]]},"en":{"q":"Company configures a landing zone in AWS Control Tower. The company handles sensitive data that must remain within the European Union. The company must use only the eu-central-1 Region. The company uses Service Control Policies (SCPs) to enforce data residency policies. GenAI developers at the company are assigned IAM roles that have full permissions for Amazon Bedrock. The company must ensure that GenAI developers can use the Amazon Nova Pro model through Amazon Bedrock only by using cross-Region inference (CRI) and only in eu-central-1. The company enables model access for the GenAI developer IAM roles in Amazon Bedrock. However, when a GenAI developer attempts to invoke the model through the Amazon Bedrock Chat/Text playground, the GenAI developer receives the following error: User arn:aws:sts:123456789012:assumed-role/AssumedDevRole/DevUserName Action: bedrock:InvokeModelWithResponseStream On resource(s): arn:aws:bedrock:eu-west-3::foundation-model/amazon.nova-pro-v1:0 Context: a service control policy explicitly denies the action The company needs a solution to resolve the error. The solution must retain the company ' s existing governance controls and must provide precise access control. The solution must comply with the company ' s existing data residency policies.\nWhich combination of solutions will meet these requirements? (Select TWO.)","o":[["A","Add an AdministratorAccess policy to the GenAI developer IAM role"],["B","Extend the existing SCPs to enable CRI for the eu.amazon.nova-pro-v1:0 inference profile"],["C","Enable Amazon Bedrock model access for Amazon Nova Pro in the eu-west-3 Region"],["D","Validate that the GenAI developer IAM roles have permissions to invoke Amazon Nova Pro through the eu.amazon.nova-pro-v1:0 inference profile on all European Union AWS Regions that can serve the model"],["E","Extend the existing SCP to enable CRI for the eu-* inference profile"]]},"ex":{"c":"EU 교차 리전 추론 프로필(eu.amazon.nova-pro-v1:0)은 요청을 eu-west-3 등 다른 EU 리전으로 라우팅합니다. 따라서 eu-central-1만 허용하는 SCP가 해당 추론 프로필을 통한 호출을 예외로 허용하도록 확장해야 하고(B), IAM 역할도 추론 프로필과 그 프로필이 라우팅하는 모든 EU 리전의 파운데이션 모델 ARN에 대한 호출 권한을 가져야 합니다(D).","w":{"A":"AdministratorAccess는 최소 권한 원칙에 어긋나며 SCP의 명시적 거부를 우회하지도 못합니다.","C":"모델 액세스 문제가 아니라 SCP 거부가 원인이며, eu-west-3 직접 사용은 정책 위반입니다.","E":"eu-* 와일드카드는 Nova Pro 외 다른 프로필까지 허용해 정밀한 액세스 제어 요구에 어긋납니다."}}},{"n":5,"a":["B"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock API로 복잡한 고객 문의를 처리하는 GenAI 애플리케이션을 구축하고 있습니다. 사용량이 최고조일 때 간헐적인 API 타임아웃이 발생해 응답 청크가 끊기고 데이터 전달이 지연됩니다. 또한 길이가 다양한 복잡한 문의를 처리할 때 프롬프트를 토큰 한도 내로 유지하는 데 어려움을 겪고 있으며, 사용자들은 입력이 잘리고 응답이 불완전하다고 보고했습니다. FM 호출 실패도 관찰되었습니다. 회사는 일시적인 서비스 오류를 자동으로 처리하고 피크 시간에 Amazon Bedrock에 과부하를 주지 않는 재시도 전략이 필요합니다. 이 전략은 변화하는 서비스 가용성에 적응하고, 응답 스트리밍과 토큰 인식 요청 처리를 지원해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","모든 오류에 대해 시도 간 1초 고정 지연과 최대 3회 재시도를 사용하는 표준 재시도 전략을 구현합니다. 스트리밍 응답 타임아웃은 스트림을 다시 시작해 처리하고, 세션별 토큰 사용량에 상한을 둡니다."],["B","지터(jitter)가 포함된 지수 백오프와, 오류율이 사전 정의된 임계값을 넘으면 재시도를 일시적으로 중단하는 서킷 브레이커 패턴을 사용하는 적응형 재시도 전략을 구현합니다. 청크 전달 타임아웃을 감시하는 스트리밍 응답 핸들러를 구현하고, 성공적으로 받은 청크를 버퍼링했다가 연결이 복구되면 마지막으로 받은 청크부터 스트리밍을 재개하도록 구성합니다."],["C","AWS SDK에서 표준 모드 재시도 전략을 구성합니다. Amazon Bedrock API 호출을 try-catch 블록으로 감싸 타임아웃 예외를 처리하고, 실패한 스트리밍 요청에는 캐시된 응답을 반환합니다. 모든 사용자에게 전역 토큰 한도를 적용합니다. 지터 기반 재시도 로직과 요청별 경량 토큰 트리밍을 추가하고, 실패 지점부터 누락된 청크만 요청해 끊긴 스트림을 재개합니다. 최근 청크를 담는 작은 인메모리 버퍼를 유지합니다."],["D","Amazon Bedrock 클라이언트 요청 타임아웃을 30초로 설정하고 클라이언트 측 부하 차단(load shedding)을 구현합니다. 부분 결과를 버퍼링하고 애플리케이션 성능이 저하되면 새 요청을 중단합니다. 모든 요청에 고정 토큰 사용 상한을 설정하고, 지수 백오프 재시도, 동적 청크 크기 조정, 컨텍스트 인식 토큰 한도를 구성합니다."]]},"en":{"q":"A company is building a generative AI (GenAI) application that uses Amazon Bedrock APIs to process complex customer inquiries. During peak usage periods, the application experiences intermittent API timeouts that cause issues such as broken response chunks and delayed data delivery. The application struggles to ensure that prompts remain within token limits when handling complex customer inquiries of varying lengths. Users have reported truncated inputs and incomplete responses. The company has also observed foundation model (FM) invocation failures. The company needs a retry strategy that automatically handles transient service errors and prevents overwhelming Amazon Bedrock during peak usage periods. The strategy must also adapt to changing service availability and support response streaming and token-aware request handling.\nWhich solution will meet these requirements?","o":[["A","Implement a standard retry strategy that uses a 1-second fixed delay between attempts and a 3retry maximum for all errors. Handle streaming response timeouts by restarting streams. Cap token usage for each session."],["B","Implement an adaptive retry strategy that uses exponential backoff with jitter and a circuit breaker pattern that temporarily disables retries when error rates exceed a predefined threshold. Implement a streaming response handler that monitors for chunk delivery timeouts. Configure the handler to buffer successfully received chunks and intelligently resume streaming from the last received chunk when connections are re-established."],["C","Use the AWS SDK to configure a retry strategy in standard mode. Wrap Amazon Bedrock API calls in try-catch blocks that handle timeout exceptions. Return cached completions for failed streaming requests. Enforce a global token limit for all users. Add jitter-based retry logic and lightweight token trimming for each request. Resume broken streams by requesting only missing chunks from the point of failure. Maintain a small in-memory buffer of the most recent chunks."],["D","Set Amazon Bedrock client request timeouts to 30 seconds. Implement client-side load shedding.Buffer partial results and stop new requests when application performance degrades. Set static token usage caps for all requests. Configure exponential backoff retries, dynamic chunk sizing, and context- aware token limits."]]},"ex":{"c":"지수 백오프+지터는 피크 시 재시도 폭주를 막고, 서킷 브레이커는 오류율이 높을 때 재시도를 멈춰 변화하는 가용성에 적응합니다. 청크 타임아웃 감시와 버퍼링 후 마지막 청크부터 재개하는 스트리밍 핸들러는 끊긴 응답 문제를 해결합니다. 요구 사항을 빠짐없이 다루는 유일한 선택지입니다.","w":{"A":"고정 지연 재시도는 피크 시 부하를 가중시키고 서비스 상태에 적응하지 못합니다.","C":"실패 시 캐시된 응답을 반환하면 부정확한 답이 전달되고, 전역 토큰 한도는 요청별 토큰 인식 처리와 맞지 않습니다.","D":"고정 토큰 상한과 동적 토큰 한도가 서로 모순되고, 적응형 재시도 차단 메커니즘이 없습니다."}}},{"n":6,"a":["B"],"orig":"","ko":{"q":"한 운송 회사가 사용자가 모바일 앱이나 웹 포털로 이용하는 여행 계획 AI 어시스턴트를 구축하고 있습니다. AI 어시스턴트는 출발 시간, 접근성 요구 사항, 환승 선호도가 포함된 자연어 요청을 해석해야 합니다. 또한 적절한 백엔드 API를 조회해 경로를 찾고, 요금을 계산하고, 운행 장애 정보를 가져와야 합니다. 회사는 모든 요금이 결정론적 방식으로 생성되도록 해야 하며, AI 어시스턴트가 경로나 요금을 스스로 생성해서는 절대 안 됩니다. 규제 검토를 위해 모든 상호 작용을 감사할 수 있어야 하고, 향후 모델을 재학습하거나 수정하지 않고도 새 백엔드 서비스를 추가할 수 있어야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AWS Lambda 함수로 Amazon Bedrock FM을 직접 호출합니다. 모델이 일관된 출력을 생성하도록 구조화된 경로 계획 및 요금 규칙을 프롬프트에 포함합니다."],["B","결정론적 제약을 적용하기 위해 명시적으로 정의된 도구와 함께 Amazon Bedrock AgentCore를 배포합니다. 엄격한 JSON 입출력 스키마를 적용하고, 모델은 도구 출력을 설명하는 역할만 하도록 합니다."],["C","Amazon OpenSearch Serverless와 RAG를 사용해 시간표와 요금 문서를 검색합니다. 모델이 검색된 내용으로 사용자에게 경로와 비용 옵션을 종합해 제시하도록 합니다."],["D","AWS Step Functions로 여러 Amazon Bedrock 모델 호출을 조정해, 모델의 유연성을 제한하지 않으면서 출력 일관성을 높입니다."]]},"en":{"q":"A transportation company is building a trip planning AI assistant that users access through a mobile app or a web portal. The AI assistant must interpret natural-language user requests that include departure times, accessibility needs, and transfer preferences. The AI assistant must query appropriate backend APIs to route requests, calculate fares, and retrieve information about travel disruptions. The company must ensure that the AI assistant generates all fare prices in a deterministic way. The AI assistant must never generate routes or fares on its own. The company must be able to audit all interactions for regulatory review. The company must be able to add new backend services in the future without re-training or modifying the model.\nWhich solution will meet these requirements?","o":[["A","Use an AWS Lambda function to directly invoke an Amazon Bedrock FM. Embed structured route planning and pricing rules in the prompts so the model will generate consistent outputs."],["B","Deploy Amazon Bedrock AgentCore with explicitly defined tools to enforce deterministic constraints. Enforce strict JSON I/O schemas. Ensure that the model can only explain tool outputs."],["C","Use RAG with Amazon OpenSearch Serverless to retrieve schedule and fare documents. Allow the model to synthesize route and cost options for users from the retrieved content."],["D","Use AWS Step Functions to coordinate multiple Amazon Bedrock model calls to improve output consistency without limiting the model ' s flexibility."]]},"ex":{"c":"요금과 경로는 결정론적이어야 하므로 모델이 직접 생성하면 안 됩니다. AgentCore에 명시적 도구(백엔드 API)를 정의하고 엄격한 JSON 스키마를 적용하면 모델은 도구 호출과 결과 설명만 담당합니다. 새 서비스는 도구 추가만으로 확장되고, AgentCore 관측성으로 상호 작용을 감사할 수 있습니다.","w":{"A":"프롬프트에 규칙을 넣어도 모델 출력은 비결정적이어서 요금 생성을 보장할 수 없습니다.","C":"RAG로 검색한 내용을 모델이 종합하면 경로·요금을 모델이 생성하게 됩니다.","D":"모델의 유연성을 제한하지 않는다는 것은 결정론적 요구와 정면으로 충돌합니다."}}},{"n":7,"a":["A"],"orig":"","ko":{"q":"한 회사가 고객 대상 커뮤니케이션을 발송 전에 검토하는 워크플로를 만들고 있습니다. 회사는 사전 정의된 메시지 템플릿으로 커뮤니케이션을 생성하고 Amazon S3 버킷에 저장합니다. 워크플로는 템플릿의 특정 부분을 추출해 Amazon Bedrock 모델로 보내야 하며, 모델 응답을 원래 S3 버킷에 다시 저장해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock Flows에서 플로를 만듭니다. 플로의 시작과 끝에 S3 액션 노드를 구성해 커뮤니케이션을 가져오고 모델 응답을 저장합니다. 플로 중간에 각 커뮤니케이션을 파싱하는 표현식을 구성하고, 파싱된 입력을 모델로 보내 검토하는 에이전트 단계를 구성합니다."],["B","AWS Step Functions Express 워크플로 상태 머신을 만듭니다. Amazon S3 통합 GetObject 단계로 원본 커뮤니케이션을 가져옵니다. 내장 함수(intrinsic function) Pass 단계로 커뮤니케이션을 파싱해 결과를 Amazon Bedrock InvokeModel 단계로 전달합니다. Amazon S3 통합 PutObject 단계로 모델 응답을 S3 버킷에 다시 저장합니다."],["C","액션 그룹이 있는 Amazon Bedrock 에이전트를 만듭니다. 에이전트가 커뮤니케이션을 파싱하는 방법을 지침으로 정의합니다. 액션 그룹이 S3 버킷에서 커뮤니케이션을 가져오고, Amazon Bedrock 모델을 호출하고, 모델 응답을 S3 버킷에 다시 저장하도록 구성합니다."],["D","단일 액션 그룹이 있는 Amazon Bedrock 에이전트를 만듭니다. 액션 그룹에 AWS Lambda 함수 3개를 구성해, S3 버킷에서 커뮤니케이션을 가져오고, 커뮤니케이션을 파싱해 Amazon Bedrock 모델을 호출하고, 모델 응답을 S3 버킷에 다시 저장하도록 합니다."]]},"en":{"q":"A company is creating a workflow to review customer-facing communications before the company sends the communications. The company uses a pre-defined message template to generate the communications and stores the communications in an Amazon S3 bucket. The workflow needs to capture a specific portion from the template and send it to an Amazon Bedrock model. The workflow must store model responses back to the original S3 bucket.\nWhich solution will meet these requirements?","o":[["A","Create a flow in Amazon Bedrock Flows. Configure S3 action nodes at the beginning and end of the flow to retrieve and store the communications and the model responses. In the middle of the flow, configure an expression to parse each communication. Configure an agent step to send the parsed input to the model for review."],["B","Create an AWS Step Functions Express workflow state machine. Use an Amazon S3 integration GetObject step to retrieve the original communications. Use an intrinsic function Pass step to parse the communications and to pass the results to an Amazon Bedrock InvokeModel step. Configure an Amazon S3 integration PutObject step to store the model responses back to the S3 bucket."],["C","Create an Amazon Bedrock agent that has an action group. Configure instructions to define how the agent should parse the communications. Configure the action group to retrieve the communications from the S3 bucket, invoke the Amazon Bedrock model, and store the model responses back to the S3 bucket."],["D","Create an Amazon Bedrock agent that has a single action group. Configure three AWS Lambda functions in the action group. Configure the functions to retrieve the communications from the S3 bucket, parse the communications and invoke the Amazon Bedrock model, and store the model responses back to the S3 bucket."]]},"ex":{"c":"Amazon Bedrock Flows는 S3 검색/저장 노드, 표현식(파싱) 노드, 프롬프트·에이전트 노드를 시각적으로 연결해 코드 없이 'S3에서 읽기 → 일부 추출 → 모델 호출 → S3에 저장' 파이프라인을 구성할 수 있는 서비스입니다.","w":{"B":"Step Functions 내장 함수로는 템플릿의 특정 부분을 유연하게 파싱하기 어렵고 구성 부담이 더 큽니다.","C":"에이전트 지침만으로 파싱을 정의하면 비결정적이며, 액션 그룹 구현은 결국 Lambda 코드가 필요합니다.","D":"고정된 순차 파이프라인에 에이전트와 Lambda 세 개를 쓰는 것은 불필요하게 복잡합니다."}}},{"n":8,"a":["B"],"orig":"","ko":{"q":"한 금융 서비스 회사가 Amazon Bedrock으로 금융 문서를 처리하는 AI 애플리케이션을 사용합니다. 업무 시간에는 시간당 약 10,000건의 요청을 처리하며 일관된 처리량이 필요합니다. 회사는 CreateProvisionedModelThroughput API로 프로비저닝된 처리량을 구매했습니다. 그런데 Amazon CloudWatch 지표를 보면 프로비저닝된 용량은 사용되지 않고 온디맨드 요청이 스로틀링되고 있습니다. 회사는 애플리케이션에서 다음 코드를 발견했습니다.\npython response = bedrock_runtime.invoke_model(modelId=\"anthropic.claude-v2\", body=json.dumps(payload))\n회사는 애플리케이션이 프로비저닝된 처리량을 사용하고 스로틀링 문제를 해결하도록 해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","프로비저닝된 처리량 구성의 모델 유닛(MU) 수를 늘립니다."],["B","모델 ID 파라미터를 CreateProvisionedModelThroughput API가 반환한 프로비저닝된 모델의 ARN으로 바꿉니다."],["C","피크 시간의 스로틀링 예외를 처리하도록 지수 백오프 재시도 로직을 추가합니다."],["D","애플리케이션이 InvokeModel API 대신 InvokeModelWithResponseStream API를 사용하도록 수정합니다."]]},"en":{"q":"A financial services company uses an AI application to process financial documents by using Amazon Bedrock. During business hours, the application handles approximately 10,000 requests each hour, which requires consistent throughput. The company uses the CreateProvisionedModelThroughput API to purchase provisioned throughput. Amazon CloudWatch metrics show that the provisioned capacity is unused while on-demand requests are being throttled. The company finds the following code in the application: python response = bedrock_runtime.invoke_model(modelId= \" anthropic.claude-v2 \" , body=json.dumps(payload)) The company needs the application to use the provisioned throughput and to resolve the throttling issues.\nWhich solution will meet these requirements?","o":[["A","Increase the number of model units (MUs) in the provisioned throughput configuration."],["B","Replace the model ID parameter with the ARN of the provisioned model that the CreateProvisionedModelThroughput API returns."],["C","Add exponential backoff retry logic to handle throttling exceptions during peak hours."],["D","Modify the application to use the InvokeModelWithResponseStream API instead of the InvokeModel API."]]},"ex":{"c":"프로비저닝된 처리량을 사용하려면 InvokeModel의 modelId에 기본 모델 ID가 아니라 CreateProvisionedModelThroughput이 반환한 프로비저닝된 모델 ARN을 지정해야 합니다. 현재 코드는 기본 모델 ID를 써서 온디맨드 할당량으로 요청이 들어가 스로틀링되고 있습니다.","w":{"A":"MU를 늘려도 애플리케이션이 프로비저닝 용량을 호출하지 않으므로 효과가 없습니다.","C":"재시도는 증상 완화일 뿐 프로비저닝 용량을 사용하게 하지 않습니다.","D":"스트리밍 API로 바꿔도 여전히 온디맨드 모델 ID를 호출합니다."}}},{"n":9,"a":["C"],"orig":"","ko":{"q":"한 전자상거래 회사가 규제, 비용 최적화, 성능 요구 사항에 따라 Amazon Bedrock의 여러 FM을 전환해야 하는 글로벌 상품 추천 시스템을 운영합니다. 회사는 동적 비용 임계값, AWS 리전별 규정 준수 규칙, 여러 FM에 걸친 실시간 A/B 테스트 등 자체 비즈니스 로직에 기반한 사용자 지정 통제를 적용해야 합니다. 시스템은 새 코드를 배포하지 않고 FM을 전환할 수 있어야 합니다. 또한 사용자 등급, 거래 금액, 규제 구역, 그리고 매시간 바뀌며 수천 건의 동시 요청에 즉시 반영되어야 하는 실시간 비용 지표 등 복잡한 규칙에 따라 사용자 요청을 라우팅해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","라우팅 규칙과 Amazon Bedrock FM ID를 환경 변수에 저장하는 AWS Lambda 함수를 배포합니다. 비즈니스 요구 사항이 바뀌면 Lambda 콘솔에서 환경 변수를 업데이트합니다. Amazon API Gateway REST API가 요청 파라미터를 읽어 라우팅을 결정하도록 구성합니다."],["B","Amazon API Gateway REST API 요청 변환 템플릿으로 요청 속성 기반 라우팅 로직을 구현합니다. Amazon Bedrock FM 엔드포인트를 REST API 스테이지 변수로 저장하고, 모델을 전환할 때 변수를 업데이트합니다."],["C","각 사용자 요청마다 AWS AppConfig Agent에서 라우팅 구성을 가져오도록 AWS Lambda 함수를 구성합니다. Lambda 함수에서 비즈니스 로직을 실행해 요청별로 적절한 FM을 선택합니다. 단일 Amazon API Gateway REST API 엔드포인트로 FM을 노출합니다."],["D","AWS AppConfig에 저장된 라우팅 규칙을 평가하는 Amazon API Gateway REST API용 AWS Lambda 권한 부여자를 사용합니다. 비즈니스 로직에 따라 권한 부여 컨텍스트를 반환하고, 각 Amazon Bedrock FM 전용 Lambda 함수로 요청을 라우팅합니다."]]},"en":{"q":"An ecommerce company operates a global product recommendation system that needs to switch between multiple foundation models (FMs) in Amazon Bedrock based on regulations, cost optimization, and performance requirements. The company must apply custom controls based on proprietary business logic, including dynamic cost thresholds, AWS Region-specific compliance rules, and real-time A/B testing across multiple FMs. The system must be able to switch between FMs without deploying new code. The system must route user requests based on complex rules including user tier, transaction value, regulatory zone, and real-time cost metrics that change hourly and require immediate propagation across thousands of concurrent requests.\nWhich solution will meet these requirements?","o":[["A","Deploy an AWS Lambda function that uses environment variables to store routing rules and Amazon Bedrock FM IDs. Use the Lambda console to update the environment variables when business requirements change. Configure an Amazon API Gateway REST API to read request parameters to make routing decisions."],["B","Deploy Amazon API Gateway REST API request transformation templates to implement routing logic based on request attributes. Store Amazon Bedrock FM endpoints as REST API stage variables. Update the variables when the system switches between models."],["C","Configure an AWS Lambda function to fetch routing configurations from the AWS AppConfig Agent for each user request. Run business logic in the Lambda function to select the appropriate FM for each request. Expose the FMs through a single Amazon API Gateway REST API endpoint."],["D","Use AWS Lambda authorizers for an Amazon API Gateway REST API to evaluate routing rules that are stored in AWS AppConfig. Return authorization contexts based on business logic. Route requests to model-specific Lambda functions for each Amazon Bedrock FM."]]},"ex":{"c":"AWS AppConfig는 코드 배포 없이 구성을 즉시 바꾸고 검증·점진적 배포를 지원합니다. Lambda가 AppConfig Agent(로컬 캐시)에서 라우팅 구성을 가져와 사용자 등급·거래 금액·규제 구역·비용 지표 같은 복잡한 비즈니스 로직으로 FM을 선택하면, 매시간 바뀌는 규칙도 수천 건의 동시 요청에 바로 반영됩니다.","w":{"A":"환경 변수 변경은 함수 버전 업데이트가 필요하고 복잡한 규칙을 표현하기 어렵습니다.","B":"매핑 템플릿과 스테이지 변수로는 실시간 비용 지표 같은 복잡한 로직을 구현할 수 없습니다.","D":"권한 부여자를 라우팅에 쓰는 것은 용도에 맞지 않고 모델별 Lambda가 늘어나 관리가 복잡해집니다."}}},{"n":10,"a":["B"],"orig":"","ko":{"q":"한 글로벌 연구 회사가 Amazon Bedrock Knowledge Bases를 사용하는 RAG 기반 AI 시스템을 구축하고 있습니다. 회사는 문서를 Amazon S3에 저장하고 Amazon OpenSearch Serverless 벡터 컬렉션에 인덱싱합니다. 시스템 평가에서 세 가지 문제가 발견되었습니다. 사용자가 최신 연구만 요청해도 오래된 문서가 반환됩니다. 의학 연구 쿼리에 의학 문서와 공학 분야 문서가 함께 반환됩니다. 사용자가 회사 정책상 접근하면 안 되는 연구자가 작성한 문서를 검색할 수 있습니다. 회사는 검색이 더 정확하고 맥락에 맞도록 시스템을 개선하려고 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon S3의 문서에 타임스탬프, 작성자, 연구 분야를 기록하는 사용자 지정 메타데이터 필드를 추가합니다. 문서 임베딩과 사용자 지정 메타데이터 필드를 OpenSearch Serverless 벡터 컬렉션에 인덱싱합니다. 쿼리 시 지식 기반으로 벡터 유사도 검색을 실행하고, 모델이 문서 관련성을 해석하도록 저장된 메타데이터를 결과와 함께 반환합니다."],["B","S3 객체 메타데이터에 각 문서의 타임스탬프를 저장합니다. 작성자는 사용자 지정 메타데이터 필드에, 연구 분야는 S3 객체 태그에 기록합니다. 메타데이터 필드를 필터링 가능한 속성으로 OpenSearch Serverless 벡터 컬렉션에 전파합니다. Knowledge Bases에서 벡터 유사도 검색 전에 타임스탬프, 작성자, 분야 필터를 적용합니다."],["C","문서를 Amazon S3에 저장합니다. 타임스탬프, 작성자 메타데이터, 연구 분야 태그를 추출해 Amazon DynamoDB 테이블에 저장합니다. 검색 시 DynamoDB에서 작성자, 분야, 타임스탬프 필터를 적용해 후보 문서 ID를 찾고, 이 ID로 OpenSearch Serverless 컬렉션의 벡터 유사도 검색 범위를 좁힙니다."],["D","작성자를 기록하는 사용자 지정 메타데이터와 함께 문서를 Amazon S3에 저장합니다. Amazon Comprehend로 각 문서를 연구 분야로 분류하고 결과를 Amazon Aurora에 저장합니다. 검색 시 Aurora를 조회해 관련 분야를 파악한 뒤 OpenSearch Serverless 컬렉션에서 벡터 유사도 검색을 수행합니다."]]},"en":{"q":"A global research company is building a RAG-enabled AI system that uses Amazon Bedrock Knowledge Bases. The company stores documents in Amazon S3 and indexes the documents into an Amazon OpenSearch Serverless vector collection. When the company evaluates the system, the company identifies three issues. Queries return outdated documents when users request only recent research. Medical research queries return both medical research documents and engineering domain documents. Users can retrieve documents that were authored by researchers who the users should not have access to based on company policies. The company wants to improve the system so that retrieval becomes more precise and contextually appropriate.\nWhich solution will meet these requirements?","o":[["A","Add custom metadata fields to the documents in Amazon S3 to record timestamp, authorship, and research domain. Index the document embeddings and the custom metadata fields into the OpenSearch Serverless vector collection. At query time, use the knowledge base to run vector similarity search and return the stored metadata with the results to help the model interpret document relevance."],["B","Use S3 object metadata to store each document ' s timestamp. Use a custom metadata field to record authorship. Use S3 object tags to record the research domain. Propagate the metadata fields into the OpenSearch Serverless vector collection as filterable attributes. Use Knowledge Bases to apply timestamp, author, and domain filters before running vector similarity search."],["C","Store documents in Amazon S3. Extract timestamp, author metadata, and research-domain tags, and store the data in an Amazon DynamoDB table. During retrieval, apply author, domain, and timestamp filters in DynamoDB to identify candidate document IDs. Use the filtered document IDs to narrow the vector similarity search in the OpenSearch Serverless collection."],["D","Store documents in Amazon S3 with custom metadata to record authorship. Use Amazon Comprehend to classify each document into a research domain. Store the classification results in Amazon Aurora.Query Aurora during retrieval to identify relevant domains before performing vector similarity search in the OpenSearch Serverless collection."]]},"ex":{"c":"Knowledge Bases는 메타데이터 필터링을 지원합니다. 타임스탬프·작성자·도메인을 필터링 가능한 메타데이터 속성으로 인덱싱하고 벡터 검색 전에 필터를 적용하면 최신성, 도메인 정확도, 작성자 기반 접근 제어를 모두 검색 단계에서 보장할 수 있습니다.","w":{"A":"메타데이터를 결과와 함께 반환만 하고 필터링하지 않으므로 권한 없는 문서가 여전히 검색됩니다.","C":"DynamoDB로 별도 필터링 계층을 만드는 것은 불필요한 복잡성입니다.","D":"Comprehend와 Aurora를 추가하는 것은 복잡하고 타임스탬프 필터 요구도 다루지 않습니다."}}},{"n":11,"a":["C"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock FM을 사용하는 GenAI 애플리케이션을 개발하고 있습니다. 이 애플리케이션에는 여러 사용자 지정 도구 통합이 있습니다. 사용자 트래픽이 일정한데도 토큰 소비가 예기치 않게 급증하고 있습니다. 회사는 Amazon Bedrock 모델 호출 로깅을 사용해 InputTokenCount와 OutputTokenCount 지표를 모니터링하는 솔루션이 필요합니다. 이 솔루션은 도구 사용의 비정상 패턴을 감지하고 어떤 도구 통합이 비정상적인 토큰 소비를 일으키는지 식별해야 하며, 트래픽 패턴이 바뀌면 임계값을 자동으로 조정해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon CloudWatch Logs로 모델 호출 로그를 수집합니다. 토큰 지표용 CloudWatch 대시보드를 만들고, 도구 통합별로 고정 임계값을 사용하는 정적 CloudWatch 경보를 구성합니다."],["B","모델 호출 로그를 Amazon S3에 저장합니다. AWS Glue와 Amazon Athena로 토큰 사용 추세를 분석합니다."],["C","Amazon CloudWatch Logs로 모델 호출 로그를 수집합니다. CloudWatch 지표 필터로 도구별 호출 패턴을 추출하고, 각 도구의 토큰 지표에 대해 기준선을 자동 조정하는 CloudWatch 이상 탐지 경보를 적용합니다."],["D","모델 호출 로그를 Amazon S3 버킷에 저장합니다. AWS Lambda로 로그를 실시간 처리하고, Lambda 함수가 파악한 추세에 따라 CloudWatch 경보 임계값을 수동으로 업데이트합니다."]]},"en":{"q":"A company is developing a generative AI (GenAI) application that uses Amazon Bedrock foundation models. The application has several custom tool integrations. The application has experienced unexpected token consumption surges despite consistent user traffic. The company needs a solution that uses Amazon Bedrock model invocation logging to monitor InputTokenCount and OutputTokenCount metrics. The solution must detect unusual patterns in tool usage and identify which specific tool integrations cause abnormal token consumption. The solution must also automatically adjust thresholds as traffic patterns change.\nWhich solution will meet these requirements?","o":[["A","Use Amazon CloudWatch Logs to capture model invocation logs. Create CloudWatch dashboards for token metrics. Configure static CloudWatch alarms with fixed thresholds for each tool integration."],["B","Store model invocation logs in Amazon S3. Use AWS Glue and Amazon Athena to analyze token usage trends."],["C","Use Amazon CloudWatch Logs to capture model invocation logs. Create CloudWatch metric filters to extract tool-specific invocation patterns. Apply CloudWatch anomaly detection alarms that automatically adjust baselines for each tool's token metrics."],["D","Store model invocation logs in an Amazon S3 bucket. Use AWS Lambda to process logs in real time.Manually update CloudWatch alarm thresholds based on trends identified by the Lambda function."]]},"ex":{"c":"호출 로그를 CloudWatch Logs로 보내고 메트릭 필터로 도구별 토큰 지표를 추출한 뒤, CloudWatch 이상 탐지 경보를 적용하면 트래픽 패턴 변화에 따라 기준선이 자동으로 조정됩니다.","w":{"A":"고정 임계값 경보는 자동 조정 요구를 충족하지 못합니다.","B":"Athena 분석은 사후 분석이며 실시간 탐지나 알림이 없습니다.","D":"임계값을 수동으로 갱신하므로 자동 조정이 아닙니다."}}},{"n":12,"a":["A"],"orig":"","ko":{"q":"한 의료 회사가 Amazon Bedrock으로 임상 문의, 보험 확인, 예약, 보험 청구를 담당하는 각 부서의 질의에 응답하는 실시간 환자 케어 AI 어시스턴트를 개발하고 있습니다. 회사는 멀티 에이전트 아키텍처를 사용하려고 합니다. AI 어시스턴트는 확장 가능해야 하고 환자를 위한 새 기능을 추가할 수 있어야 하며, 수천 건의 환자 상호 작용을 병렬로 처리할 수 있어야 합니다. 환자는 질의에 대해 적절한 분야별 응답을 받아야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","별도의 지식 기반으로 에이전트별 데이터를 격리하고, IAM 필터링으로 각 지식 기반에 대한 액세스를 제어합니다. 환자 문의에 대해 자연어 의도 분류를 수행하는 감독자(supervisor) 에이전트를 배포하고, 감독자 에이전트가 부서별 질의에 응답하는 전문 협업자(collaborator) 에이전트로 질의를 라우팅하도록 구성합니다. 각 전문 협업자 에이전트는 해당 부서 지식 기반을 사용하는 RAG를 수행하도록 구성합니다."],["B","부서마다 별도의 감독자 에이전트를 만듭니다. 각 부서 내 전문 분야별로 자연어 의도 분류를 수행하는 협업자 에이전트를 개별 구성하고, 각 협업자 에이전트는 부서별 지식 기반하고만 통합합니다. 감독자 에이전트 간에는 수동 인계 프로세스를 구현합니다."],["C","부서별 데이터를 별도의 지식 기반으로 격리하고, IAM 필터링으로 각 지식 기반에 대한 액세스를 제어합니다. 범용 에이전트 하나를 배포하고, 그 안에 부서별 기능을 수행하는 여러 액션 그룹을 구성합니다. 범용 에이전트 지침에 규칙 기반 라우팅 로직을 구현합니다."],["D","부서별로 환자 문의에 응답하는 독립된 감독자 에이전트 여러 개를 병렬로 실행합니다. 각 감독자 에이전트에 여러 협업자 에이전트를 구성하고, 모든 에이전트를 동일한 지식 기반과 통합합니다. 외부 라우팅 로직으로 여러 감독자 에이전트의 응답을 병합합니다."]]},"en":{"q":"A healthcare company is using Amazon Bedrock to develop a real-time patient care AI assistant to respond to queries for separate departments that handle clinical inquiries, insurance verification, appointment scheduling, and insurance claims. The company wants to use a multi-agent architecture. The company must ensure that the AI assistant is scalable and can onboard new features for patients. The AI assistant must be able to handle thousands of parallel patient interactions. The company must ensure that patients receive appropriate domain-specific responses to queries.\nWhich solution will meet these requirements?","o":[["A","Isolate data for each agent by using separate knowledge bases. Use IAM filtering to control access to each knowledge base. Deploy a supervisor agent to perform natural language intent classification on patient inquiries. Configure the supervisor agent to route queries to specialized collaborator agents to respond to department-specific queries. Configure each specialized collaborator agent to use Retrieval Augmented Generation (RAG) with the agent's department-specific knowledge base."],["B","Create a separate supervisor agent for each department. Configure individual collaborator agents to perform natural language intent classification for each specialty domain within each department. Integrate each collaborator agent with department-specific knowledge bases only. Implement manual handoff processes between the supervisor agents."],["C","Isolate data for each department in separate knowledge bases. Use IAM filtering to control access to each knowledge base. Deploy a single general-purpose agent. Configure multiple action groups within the general-purpose agent to perform specific department functions. Implement rule-based routing logic within the general-purpose agent instructions."],["D","Implement multiple independent supervisor agents that run in parallel to respond to patient inquiries for each department. Configure multiple collaborator agents for each supervisor agent. Integrate all agents with the same knowledge base. Use external routing logic to merge responses from multiple supervisor agents."]]},"ex":{"c":"Bedrock 다중 에이전트 협업에서 수퍼바이저 에이전트가 의도를 분류해 부서별 협업 에이전트로 라우팅하고, 각 협업 에이전트는 자기 부서 지식 기반으로 RAG를 수행합니다. 지식 기반 분리와 IAM 필터링으로 도메인별 정확한 응답을 보장하고, 새 기능은 협업 에이전트를 추가해 확장합니다.","w":{"B":"부서마다 수퍼바이저를 두고 수동 핸드오프를 하면 확장성과 실시간성이 떨어집니다.","C":"단일 범용 에이전트와 규칙 기반 라우팅은 확장과 도메인 분리에 불리합니다.","D":"모든 에이전트가 같은 지식 기반을 쓰면 도메인별 응답을 보장하기 어렵고 응답 병합이 복잡합니다."}}},{"n":13,"a":["C"],"orig":"","ko":{"q":"한 회사가 웹사이트 콘텐츠를 요약하고 고객에게 정보를 제공하는 AI 어시스턴트 애플리케이션을 사용합니다. 회사는 Amazon Bedrock으로 애플리케이션이 FM에 접근하도록 할 계획입니다. 애플리케이션을 개발 환경과 프로덕션 환경에 배포해야 하며, 두 환경 모두 FM과 통합되어야 합니다. 회사는 각 환경에서 다양한 FM의 효과를 테스트하려고 하며, 제품 담당자가 각 환경에서 테스트용으로 FM을 쉽게 전환할 수 있어야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AWS CDK 애플리케이션 하나를 만듭니다. AWS CodePipeline에 여러 파이프라인을 만들고, 각 파이프라인이 FM별로 자체 설정을 갖도록 구성합니다. 애플리케이션이 aws_bedrock.ProvisionedModel.fromProvisionedModelArn() 메서드로 Amazon Bedrock FM을 호출하도록 구성합니다."],["B","환경별로 별도의 AWS CDK 애플리케이션을 만듭니다. 애플리케이션이 aws_bedrock.FoundationModel.fromFoundationModelId() 메서드로 Amazon Bedrock FM을 호출하도록 구성하고, 환경별로 별도의 AWS CodePipeline 파이프라인을 만듭니다."],["C","AWS CDK 애플리케이션 하나를 만듭니다. 애플리케이션이 aws_bedrock.FoundationModel.fromFoundationModelId() 메서드로 Amazon Bedrock FM을 호출하도록 구성합니다. AWS CodePipeline에 파이프라인 하나를 만들고, AWS CodeBuild 배포 작업을 사용하는 환경별 배포 단계를 둡니다."],["D","프로덕션 환경용 AWS CDK 애플리케이션 하나를 만듭니다. 애플리케이션이 aws_bedrock.ProvisionedModel.fromProvisionedModelArn() 메서드로 Amazon Bedrock FM을 호출하도록 구성합니다. AWS CodePipeline 파이프라인을 만들어 AWS CodeBuild 배포 작업으로 프로덕션 환경에 배포합니다. 개발 환경은 프로덕션 애플리케이션 코드를 참고해 리소스를 수동으로 다시 만듭니다."]]},"en":{"q":"A company uses an AI assistant application to summarize the company's website content and provide information to customers. The company plans to use Amazon Bedrock to give the application access to a foundation model (FM). The company needs to deploy the AI assistant application to a development environment and a production environment. The solution must integrate the environments with the FM. The company wants to test the effectiveness of various FMs in each environment. The solution must provide product owners with the ability to easily switch between FMs for testing purposes in each environment.\nWhich solution will meet these requirements?","o":[["A","Create one AWS CDK application. Create multiple pipelines in AWS CodePipeline. Configure each pipeline to have its own settings for each FM. Configure the application to invoke the Amazon Bedrock FMs by using the aws_bedrock.ProvisionedModel.fromProvisionedModelArn() method."],["B","Create a separate AWS CDK application for each environment. Configure the applications to invoke the Amazon Bedrock FMs by using the aws_bedrock.FoundationModel.fromFoundationModelId() method. Create a separate pipeline in AWS CodePipeline for each environment."],["C","Create one AWS CDK application. Configure the application to invoke the Amazon Bedrock FMs by using the aws_bedrock.FoundationModel.fromFoundationModelId() method. Create a pipeline in AWS CodePipeline that has a deployment stage for each environment that uses AWS CodeBuild deploy actions."],["D","Create one AWS CDK application for the production environment. Configure the application to invoke the Amazon Bedrock FMs by using the aws_bedrock.ProvisionedModel.fromProvisionedModelArn() method. Create a pipeline in AWS CodePipeline. Configure the pipeline to deploy to the production environment by using an AWS CodeBuild deploy action. For the development environment, manually recreate the resources by referring to the production application code."]]},"ex":{"c":"하나의 CDK 애플리케이션에서 FoundationModel.fromFoundationModelId()로 모델 ID를 파라미터화하면 환경마다 모델을 쉽게 바꿀 수 있습니다. 단일 파이프라인에 dev·prod 배포 스테이지를 두면 환경 간 일관성을 유지하면서 관리가 간단합니다.","w":{"A":"ProvisionedModel은 프로비저닝 처리량용이어서 여러 FM을 쉽게 테스트하는 데 맞지 않습니다.","B":"환경별 CDK 앱을 따로 두면 코드 중복과 드리프트가 생깁니다.","D":"개발 환경을 수동으로 재생성하는 것은 일관성과 효율성이 떨어집니다."}}},{"n":14,"a":["A"],"orig":"B","ko":{"q":"한 회사가 Amazon Bedrock을 사용하는 GenAI 요약 애플리케이션을 애플리케이션용 AWS 계정에서 운영합니다. 애플리케이션 아키텍처는 프라이빗 VPC 서브넷에 연결된 AWS Lambda 함수로 요청을 전달하는 Amazon API Gateway REST API로 구성됩니다. 이 애플리케이션은 중앙 데이터 스토리지 계정의 거버넌스 데이터 레이크에 저장된 민감한 고객 레코드를 요약합니다. 데이터 스토리지 계정에서는 Amazon S3, Amazon Athena, AWS Glue를 사용하고 있습니다. 회사는 애플리케이션이 Amazon Bedrock을 호출할 때 애플리케이션 VPC와 Amazon Bedrock 간 프라이빗 연결만 사용하도록 해야 합니다. 또한 데이터 레이크는 AWS 계정 간에 세분화된 열 수준 액세스를 제공해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","애플리케이션 계정에서 Amazon Bedrock 런타임용 인터페이스 VPC 엔드포인트를 만들고, Lambda 함수는 프라이빗 서브넷에서 실행합니다. 추론 및 데이터 플레인 정책에 IAM 조건을 사용해 승인된 엔드포인트와 역할로만 호출을 허용합니다. 데이터 스토리지 계정에서는 AWS Lake Formation LF-Tag 기반 액세스 제어로 테이블 및 열 수준의 계정 간 권한을 부여합니다."],["B","Lambda 함수를 프라이빗 서브넷에서 실행합니다. NAT 게이트웨이를 구성해 Amazon Bedrock과 데이터 레이크에 접근합니다. S3 버킷 정책과 ACL로 권한을 관리하고, AWS CloudTrail 로그를 Amazon S3로 내보내 매주 검토합니다."],["C","애플리케이션 계정에 Amazon S3용 게이트웨이 엔드포인트만 만듭니다. Amazon Bedrock은 퍼블릭 엔드포인트로 호출합니다. AWS Lake Formation의 데이터베이스 수준 권한으로 데이터 액세스를 관리합니다. AWS CloudTrail 로그를 Amazon CloudWatch Logs로 스트리밍하되 지표 필터나 경보는 설정하지 않습니다."],["D","애플리케이션 계정에서 VPC 엔드포인트로 Amazon Bedrock과 Amazon S3에 접근합니다. 데이터 레이크 액세스는 IAM 경로 기반 정책만으로 관리합니다. AWS CloudTrail 로그를 Amazon CloudWatch Logs로 보냅니다. 주기적으로 대시보드를 만들고, 설정 시간을 줄이기 위해 교차 리전 읽기에는 퍼블릭 폴백을 허용합니다."]]},"en":{"q":"A company runs a generative AI (GenAI)-powered summarization application in an application AWS account that uses Amazon Bedrock. The application architecture includes an Amazon API Gateway REST API that forwards requests to AWS Lambda functions that are attached to private VPC subnets. The application summarizes sensitive customer records that the company stores in a governed data lake in a centralized data storage account. The company has enabled Amazon S3, Amazon Athena, and AWS Glue in the data storage account. The company must ensure that calls that the application makes to Amazon Bedrock use only private connectivity between the company ' s application VPC and Amazon Bedrock. The company ' s data lake must provide fine-grained column-level access across the company ' s AWS accounts.\nWhich solution will meet these requirements?","o":[["A","In the application account, create interface VPC endpoints for Amazon Bedrock runtimes. Run Lambda functions in private subnets. Use IAM conditions on inference and data-plane policies to allow calls only to approved endpoints and roles. In the data storage account, use AWS Lake Formation LF-tag- based access control to create table-level and column-level cross-account grants."],["B","Run Lambda functions in private subnets. Configure a NAT gateway to provide access to Amazon Bedrock and the data lake. Use S3 bucket policies and ACLs to manage permissions. Export AWS CloudTrail logs to Amazon S3 to perform weekly reviews."],["C","Create a gateway endpoint only for Amazon S3 in the application account. Invoke Amazon Bedrock through public endpoints. Use database-level grants in AWS Lake Formation to manage data access. Stream AWS CloudTrail logs to Amazon CloudWatch Logs. Do not set up metric filters or alarms."],["D","Use VPC endpoints to provide access to Amazon Bedrock and Amazon S3 in the application account.Use only IAM path-based policies to manage data lake access. Send AWS CloudTrail logs to Amazon CloudWatch Logs. Periodically create dashboards and allow public fallback for cross-Region reads to reduce setup time."]]},"ex":{"c":"Bedrock 런타임용 인터페이스 VPC 엔드포인트(PrivateLink)와 프라이빗 서브넷의 Lambda로 비공개 연결을 보장하고, IAM 조건(aws:SourceVpce 등)으로 승인된 엔드포인트만 허용합니다. Lake Formation LF-Tag 기반 접근 제어는 계정 간 테이블·열 수준 권한을 제공합니다. (원본 덤프 답 B는 NAT 게이트웨이를 써서 공용 경로를 거치므로 요구 사항에 맞지 않습니다.)","w":{"B":"NAT 게이트웨이는 인터넷 경로를 사용하며 S3 정책·ACL은 열 수준 제어를 제공하지 않습니다.","C":"Bedrock 공용 엔드포인트를 사용하고 데이터베이스 수준 권한만 부여합니다.","D":"공용 폴백 허용은 비공개 연결 요구에 어긋나고, IAM 경로 정책으로는 열 수준 제어가 불가능합니다."}}},{"n":15,"a":["A"],"orig":"B","ko":{"q":"한 소매 회사가 Amazon Bedrock을 사용하는 GenAI 상품 추천 애플리케이션을 운영합니다. 이 애플리케이션은 고객의 탐색 기록과 인구통계 정보를 바탕으로 상품을 추천합니다. 회사는 두 가지 프롬프트 방식 간 추천의 편향을 감지하고 측정하기 위해 여러 인구통계 그룹에 걸친 공정성 평가를 구현해야 합니다. 공정성 지표를 실시간으로 수집·모니터링하고, 인구통계 그룹 간 공정성 지표 차이가 15%를 넘으면 알림을 받아야 합니다. 또한 두 프롬프트 방식의 성능을 비교하는 주간 보고서를 받아야 합니다.\n사용자 지정 개발 노력이 가장 적은 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock API 호출의 기본 지표를 보여주는 Amazon CloudWatch 대시보드를 구성합니다. 모델 출력 기반 사용자 지정 지표를 만들고, Amazon EventBridge 규칙으로 AWS Lambda 함수를 호출해 모델 응답을 후처리 분석하고 사용자 지정 공정성 지표를 게시합니다."],["B","Amazon Bedrock Prompt Management에서 두 프롬프트 변형을 만듭니다. Amazon Bedrock Flows로 트래픽 할당을 정의해 프롬프트 변형을 배포합니다. Amazon Bedrock 가드레일로 인구통계 공정성을 모니터링하도록 구성하고, InvocationsIntervened 지표의 GuardrailContentSource 차원에 Amazon CloudWatch 경보를 설정해 추천 차이 임계값 위반을 감지합니다."],["C","Amazon SageMaker Clarify로 모델 출력을 분석합니다. 공정성 지표를 Amazon CloudWatch에 게시하고, SageMaker Clarify 편향 지표와 Amazon Bedrock 지연 시간 지표를 결합한 CloudWatch 복합 경보를 만듭니다."],["D","Amazon Bedrock 모델 평가 작업을 만들어 두 프롬프트 변형 간 공정성을 비교합니다. Amazon CloudWatch에서 모델 호출 로깅을 활성화하고, 인구통계 그룹별 차원을 가진 InvocationsIntervened 지표에 CloudWatch 경보를 설정합니다."]]},"en":{"q":"A retail company has a generative AI (GenAI) product recommendation application that uses Amazon Bedrock. The application suggests products to customers based on browsing history and demographics. The company needs to implement fairness evaluation across multiple demographic groups to detect and measure bias in recommendations between two prompt approaches. The company wants to collect and monitor fairness metrics in real time. The company must receive an alert if the fairness metrics show a discrepancy of more than 15% between demographic groups. The company must receive weekly reports that compare the performance of the two prompt approaches.\nWhich solution will meet these requirements with the LEAST custom development effort?","o":[["A","Configure an Amazon CloudWatch dashboard to display default metrics from Amazon Bedrock API calls. Create custom metrics based on model outputs. Set up Amazon EventBridge rules to invoke AWS Lambda functions that perform post-processing analysis on model responses and publish custom fairness metrics."],["B","Create the two prompt variants in Amazon Bedrock Prompt Management. Use Amazon Bedrock Flows to deploy the prompt variants with defined traffic allocation. Configure Amazon Bedrock guardrails to monitor demographic fairness. Set up Amazon CloudWatch alarms on the GuardrailContentSource dimension by using InvocationsIntervened metrics to detect recommendation discrepancy threshold violations."],["C","Set up Amazon SageMaker Clarify to analyze model outputs. Publish fairness metrics to Amazon CloudWatch. Create CloudWatch composite alarms that combine SageMaker Clarify bias metrics with Amazon Bedrock latency metrics."],["D","Create an Amazon Bedrock model evaluation job to compare fairness between the two prompt variants.Enable model invocation logging in Amazon CloudWatch. Set up CloudWatch alarms for InvocationsIntervened metrics with a dimension for each demographic group."]]},"ex":{"c":"공정성 지표는 기본 제공 지표가 아니므로 모델 출력을 후처리해 인구 집단별 지표를 계산하고 CloudWatch 사용자 지정 지표로 게시해야 합니다. EventBridge+Lambda로 분석하고 CloudWatch 대시보드·경보로 15% 격차를 알리며 주간 비교 보고를 할 수 있어, 나머지 선택지보다 현실적으로 구현 가능한 최소 개발 방식입니다. (원본 덤프 답 B는 Guardrails가 공정성을 측정하지 않는다는 점에서 맞지 않습니다.)","w":{"B":"Guardrails는 유해 콘텐츠·PII 등을 차단할 뿐 인구 집단별 공정성 격차를 측정하지 않습니다.","C":"SageMaker Clarify는 SageMaker 모델용이며 지연 시간과 결합한 복합 경보는 공정성과 무관합니다.","D":"평가 작업은 일회성 배치이고 InvocationsIntervened는 가드레일 개입 지표라 공정성을 나타내지 않습니다."}}},{"n":16,"a":["A","B"],"orig":"","ko":{"q":"한 금융 서비스 회사가 투자 자문가가 투자 데이터를 빠르게 찾도록 돕는 AI 검색 어시스턴트 애플리케이션을 개발하고 있습니다. 애플리케이션은 AWS Lambda 함수로 실행되며, Amazon OpenSearch Serverless를 데이터 소스로 사용하는 Amazon Bedrock 지식 기반으로 개발되고 있습니다. 애플리케이션 에이전트는 특정 패턴과 일치하는 컬렉션과 인덱스에 액세스 권한을 자동으로 할당해 대규모로 컬렉션을 관리해야 합니다. 회사는 Amazon Bedrock 도구로 지식 기반을 테스트합니다. 지식 기반 동기화는 성공적으로 완료되었지만, 테스트에서 BedrockAgentRuntime API의 400 Bad Authorization 오류와 OpenSearch Serverless 접근 시 403 Forbidden 오류가 발생했습니다. 회사는 권한 문제를 해결해야 합니다.\n이 요구 사항을 충족하는 솔루션 조합은 무엇입니까? (2개 선택)","o":[["A","Lambda 함수 실행 역할에 bedrock:InvokeAgent 권한을 추가하고, aoss:APIAccessAll 권한도 추가합니다."],["B","패턴 기반 리소스 규칙을 포함하는 OpenSearch Serverless 데이터 액세스 정책을 만듭니다."],["C","OpenSearch Serverless용 VPC 엔드포인트 정책을 구성하고, 엔드포인트를 Lambda 함수의 VPC 구성에 추가합니다."],["D","AWS Secrets Manager에 OpenSearch Serverless 자격 증명을 저장하고, Lambda 함수가 자격 증명을 가져올 수 있도록 권한을 부여합니다."],["E","OpenSearch Serverless 도메인에 IAM 인증을 활성화하고, Lambda 함수 실행 역할에 es:ESHttp* 권한을 추가합니다."]]},"en":{"q":"A financial services company is developing an AI-powered search assistant application to help investment advisors quickly retrieve investment data. The application runs as an AWS Lambda function. The company is using Amazon Bedrock to develop the application by using an Amazon Bedrock knowledge base that uses Amazon OpenSearch Serverless as its data source. The application agent must manage collections at scale by automatically assigning access permissions to collections and indexes that match a specific pattern. The company uses Amazon Bedrock tools to test the knowledge base. The knowledge base sync process finishes successfully. However, the test reveals a 400 Bad Authorization error from the BedrockAgentRuntime API and a 403 Forbidden error when the test attempts to access OpenSearch Serverless. The company must resolve the permissions issues.\nWhich combination of solutions will meet this requirement? (Select TWO.)","o":[["A","Update the Lambda function execution role to include the bedrock:InvokeAgent permission. Add the aoss:APIAccessAll permission to the Lambda execution role."],["B","Create an OpenSearch Serverless data access policy that includes pattern-based resource rules."],["C","Configure a VPC endpoint policy for OpenSearch Serverless. Add the endpoint to the Lambda function ' s VPC configuration."],["D","Configure AWS Secrets Manager to store OpenSearch Serverless credentials. Grant the Lambda function access to retrieve the credentials."],["E","Enable IAM authentication for the OpenSearch Serverless domain. Add the es:ESHttp* permission to the Lambda function execution role."]]},"ex":{"c":"400 오류는 Lambda 실행 역할에 bedrock:InvokeAgent 권한이 없고, 403 오류는 OpenSearch Serverless 접근 권한(aoss:APIAccessAll)이 없기 때문입니다(A). OpenSearch Serverless는 IAM 권한과 별도로 데이터 액세스 정책이 필요하며, 패턴 기반 리소스 규칙(예: collection/kb-*)으로 컬렉션과 인덱스에 자동으로 권한을 부여할 수 있습니다(B).","w":{"C":"VPC 엔드포인트는 네트워크 경로 문제이며 권한 오류를 해결하지 못합니다.","D":"OpenSearch Serverless는 IAM 기반 인증을 쓰며 사용자 이름/비밀번호 자격 증명을 사용하지 않습니다.","E":"es:ESHttp*는 관리형 OpenSearch 도메인용 권한으로 Serverless에는 적용되지 않습니다."}}},{"n":17,"a":["A"],"orig":"","ko":{"q":"한 금융 서비스 회사가 GenAI 애플리케이션에서 Amazon Bedrock의 여러 FM을 사용합니다. 민감한 금융 데이터에 GenAI를 사용하는 것에 관한 새 규제를 준수하기 위해 토큰 관리 솔루션이 필요합니다. 이 솔루션은 애플리케이션이 모델별 토큰 한도에 근접하면 사전에 알림을 보내야 합니다. 또한 분당 5,000건 이상의 요청을 처리하고, 사업부별 비용 배분을 위한 토큰 사용 지표를 유지해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AWS Lambda 함수에 모델별 토크나이저를 개발합니다. Lambda 함수가 Amazon Bedrock에 요청을 보내기 전에 토큰 사용량을 추정하도록 구성합니다. 지표를 Amazon CloudWatch에 게시하고 요청이 임계값에 근접하면 경보를 트리거하도록 구성합니다. 비용 보고를 위해 상세 토큰 사용량을 Amazon DynamoDB에 저장합니다."],["B","토큰 할당량 정책이 있는 Amazon Bedrock Guardrails를 구현합니다. 거부된 요청에 대한 지표를 수집하고, Amazon Bedrock Guardrails 지표를 기반으로 알림을 트리거하는 Amazon EventBridge 규칙을 구성합니다. Amazon CloudWatch 대시보드로 모델 전반의 토큰 사용 추세를 시각화합니다."],["C","실패한 요청을 위한 Amazon SQS 배달 못한 편지 대기열(DLQ)을 배포합니다. AWS Lambda 함수로 토큰 관련 실패를 분석하고, Amazon CloudWatch Logs Insights로 Amazon Bedrock API 응답의 오류 로그를 기반으로 토큰 사용 패턴 보고서를 생성합니다."],["D","Amazon API Gateway로 모든 Amazon Bedrock API 호출의 프록시를 만듭니다. 사전 정의된 토큰 할당량이 있는 사용자 지정 사용량 계획 기반 요청 스로틀링을 구성하고, 토큰 한도를 초과할 요청은 API Gateway가 거부하도록 구성합니다."]]},"en":{"q":"A financial services company uses multiple foundation models (FMs) through Amazon Bedrock for its generative AI (GenAI) applications. To comply with a new regulation for GenAI use with sensitive financial data, the company needs a token management solution. The token management solution must proactively alert when applications approach model-specific token limits. The solution must also process more than 5,000 requests each minute and maintain token usage metrics to allocate costs across business units.\nWhich solution will meet these requirements?","o":[["A","Develop model-specific tokenizers in an AWS Lambda function. Configure the Lambda function to estimate token usage before sending requests to Amazon Bedrock. Configure the Lambda function to publish metrics to Amazon CloudWatch and trigger alarms when requests approach thresholds. Store detailed token usage in Amazon DynamoDB to report costs."],["B","Implement Amazon Bedrock Guardrails with token quota policies. Capture metrics on rejected requests. Configure Amazon EventBridge rules to trigger notifications based on Amazon Bedrock Guardrails metrics. Use Amazon CloudWatch dashboards to visualize token usage trends across models."],["C","Deploy an Amazon SQS dead-letter queue for failed requests. Configure an AWS Lambda function to analyze token-related failures. Use Amazon CloudWatch Logs Insights to generate reports on token usage patterns based on error logs from Amazon Bedrock API responses."],["D","Use Amazon API Gateway to create a proxy for all Amazon Bedrock API calls. Configure request throttling based on custom usage plans with predefined token quotas. Configure API Gateway to reject requests that will exceed token limits."]]},"ex":{"c":"모델별 토크나이저로 요청 전 토큰 수를 추정하면 한도에 다가가기 전에 사전 알림이 가능합니다. CloudWatch 지표·경보로 알림을 보내고 DynamoDB에 상세 사용량을 저장해 사업부별 비용을 배분할 수 있으며, Lambda는 분당 5,000건 이상을 처리할 수 있습니다.","w":{"B":"Guardrails에는 토큰 할당량 정책이 없습니다.","C":"실패 후 사후 분석이므로 사전 알림이 아닙니다.","D":"API Gateway 사용 계획은 요청 수 기준이며 토큰 수를 인식하지 못합니다."}}},{"n":18,"a":["A"],"orig":"","ko":{"q":"한 의료 회사가 Amazon Bedrock으로 GenAI 시스템을 만들고 있습니다. 시스템은 다양한 소스의 데이터를 처리하며 엔드투엔드 데이터 계보(lineage)를 유지해야 합니다. 또한 실시간 개인 식별 정보(PII) 필터링과 감사 추적을 사용해 규정 준수를 자동으로 보고해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AWS Glue Data Catalog에 모든 데이터 소스를 등록하고 계보를 추적합니다. Amazon Bedrock Guardrails PII 필터를 사용합니다. Amazon S3와 통합된 AWS CloudTrail 로깅을 모든 Amazon Bedrock API 호출에 대해 활성화합니다. Amazon Macie로 저장된 데이터에서 민감 정보를 스캔하고 결과를 Amazon CloudWatch Logs에 게시합니다. CloudWatch 대시보드로 결과를 시각화하고 자동 규정 준수 보고서를 생성합니다."],["B","AWS Config로 데이터 소스 구성과 변경 사항을 추적합니다. Amazon Bedrock이 데이터를 처리하기 전에 사용자 지정 규칙이 있는 AWS WAF로 애플리케이션 계층에서 PII를 필터링합니다. Amazon EventBridge로 감사 이벤트를 수집해 Amazon S3로 라우팅합니다. 예약된 AWS Lambda 함수와 Amazon Comprehend Medical로 저장된 출력을 분석해 규정 위반을 찾습니다."],["C","AWS DataSync로 데이터 소스를 복제해 계보를 추적합니다. Amazon Macie로 Amazon Bedrock 출력에서 민감 정보를 스캔합니다. AWS Systems Manager Session Manager로 사용자 상호 작용을 기록합니다. Amazon Textract와 AWS Step Functions 워크플로로 생성된 보고서에서 PII를 식별하고 삭제합니다."],["D","Amazon Athena로 데이터 소스를 쿼리해 데이터 계보를 분석·보고합니다. Amazon CloudWatch 사용자 지정 지표로 Amazon Bedrock 응답의 PII 노출을 모니터링하고, AWS X-Ray 추적으로 감사 추적을 생성합니다. Amazon Rekognition Custom Labels 모델로 Amazon Bedrock이 처리하는 데이터의 민감 정보를 감지합니다."]]},"en":{"q":"A medical company is creating a generative AI (GenAI) system by using Amazon Bedrock. The system processes data from various sources and must maintain end-to-end data lineage. The system must also use real- time personally identifiable information (PII) filtering and audit trails to automatically report compliance.\nWhich solution will meet these requirements?","o":[["A","Use AWS Glue Data Catalog to register all data sources and track lineage. Use Amazon Bedrock Guardrails PII filters. Enable AWS CloudTrail logging for all Amazon Bedrock API calls with Amazon S3 integration. Use Amazon Macie to scan stored data for sensitive information and publish findings to Amazon CloudWatch Logs. Create CloudWatch dashboards to visualize the findings and generate automated compliance reports."],["B","Use AWS Config to track data source configurations and changes. Use AWS WAF with custom rules to filter PII at the application layer before Amazon Bedrock processes the data. Configure Amazon EventBridge to capture and route audit events to Amazon S3. Use Amazon Comprehend Medical with scheduled AWS Lambda functions to analyze stored outputs for compliance violations."],["C","Use AWS DataSync to replicate data sources to track lineage. Configure Amazon Macie to scan Amazon Bedrock outputs for sensitive information. Use AWS Systems Manager Session Manager to log user interactions. Deploy Amazon Textract with AWS Step Functions workflows to identify and redact PII from generated reports."],["D","Configure Amazon Athena to query data sources to analyze and report on data lineage. Use Amazon CloudWatch custom metrics to monitor PII exposure in Amazon Bedrock responses and establish AWS X-Ray tracing to generate an audit trail. Use an Amazon Rekognition Custom Labels model to detect sensitive information in the data that Amazon Bedrock processes."]]},"ex":{"c":"Glue Data Catalog로 데이터 소스와 계보를 추적하고, Bedrock Guardrails의 PII 필터로 실시간 필터링을 합니다. CloudTrail은 감사 추적을, Macie는 저장 데이터의 민감 정보 탐지를, CloudWatch 대시보드는 자동 규정 준수 보고를 담당해 모든 요구를 충족합니다.","w":{"B":"WAF는 요청 본문 PII 필터링에 적합하지 않고, 예약 Lambda 분석은 실시간이 아닙니다.","C":"DataSync는 데이터 복제 도구이며 계보를 추적하지 않습니다.","D":"X-Ray는 감사 추적용이 아니고 Rekognition은 텍스트 PII 탐지에 맞지 않습니다."}}},{"n":19,"a":["B"],"orig":"","ko":{"q":"한 회사가 AWS Lake Formation으로 여러 AWS 리전에 걸친 여러 사업부의 데이터베이스와 테이블을 포함하는 데이터 레이크를 구성했습니다. 회사는 Amazon Bedrock의 FM으로 사기 탐지를 수행하려고 합니다. FM은 데이터 레이크의 민감한 금융 데이터를 수집해야 하며, 이 데이터에는 일부 고객 PII가 포함되어 있습니다. 회사는 PII가 프로덕션 환경에 나타나지 않도록 하는 액세스 제어 솔루션을 설계해야 합니다. FM은 특정 열에서 PII가 삭제된 승인된 데이터 하위 집합에만 접근해야 하며, 모든 데이터 액세스에 대한 감사 추적을 수집해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","사업부와 리전 조합마다 별도의 Amazon S3 버킷에 별도의 데이터세트를 만듭니다. FM 학습 인스턴스에 할당된 IAM 역할 기반으로 액세스를 제어하는 S3 버킷 정책을 구성합니다. S3 액세스 로그로 데이터 액세스를 추적합니다."],["B","FM이 AWS IAM 역할과 LF-Tag 표현식 기반 Lake Formation 권한으로 인증하도록 구성합니다. 사업부와 리전을 LF-Tag로 정의해 데이터베이스와 테이블에 할당합니다. AWS CloudTrail로 데이터 액세스에 대한 포괄적인 감사 추적을 수집합니다."],["C","Lake Formation에서 특정 데이터베이스와 테이블에 IAM 보안 주체를 직접 지정해 권한을 부여합니다. 액세스 요청을 기록하고 FM에 데이터를 보내기 전에 민감한 열을 추가로 필터링하는 사용자 지정 애플리케이션 계층을 만듭니다."],["D","FM이 AWS Security Token Service에서 임시 자격 증명을 요청하도록 구성합니다. 사업부 및 리전 필터를 적용하는 API가 생성한 미리 서명된 S3 URL로 데이터에 접근합니다. AWS CloudTrail로 데이터 액세스에 대한 포괄적인 감사 추적을 수집합니다."]]},"en":{"q":"A company uses AWS Lake Formation to set up a data lake that contains databases and tables for multiple business units across multiple AWS Regions. The company wants to use a foundation model (FM) through Amazon Bedrock to perform fraud detection. The FM must ingest sensitive financial data from the data lake. The data includes some customer personally identifiable information (PII). The company must design an access control solution that prevents PII from appearing in a production environment. The FM must access only authorized data subsets that have PII redacted from specific data columns. The company must capture audit trails for all data access.\nWhich solution will meet these requirements?","o":[["A","Create a separate dataset in a separate Amazon S3 bucket for each business unit and Region combination. Configure S3 bucket policies to control access based on IAM roles that are assigned to FM training instances. Use S3 access logs to track data access."],["B","Configure the FM to authenticate by using AWS Identity and Access Management roles and Lake Formation permissions based on LF-Tag expressions. Define business units and Regions as LF-Tags that are assigned to databases and tables. Use AWS CloudTrail to collect comprehensive audit trails of data access."],["C","Use direct IAM principal grants on specific databases and tables in Lake Formation. Create a custom application layer that logs access requests and further filters sensitive columns before sending data to the FM."],["D","Configure the FM to request temporary credentials from AWS Security Token Service . Access the data by using presigned S3 URLs that are generated by an API that applies business unit and Regional filters. Use AWS CloudTrail to collect comprehensive audit trails of data access."]]},"ex":{"c":"Lake Formation LF-Tag 기반 접근 제어(LF-TBAC)는 여러 사업부·리전의 데이터베이스와 테이블에 태그로 확장 가능한 권한을 부여하고 열 수준 필터링으로 PII 열을 제외할 수 있습니다. IAM 역할로 인증하고 CloudTrail로 모든 데이터 접근을 감사합니다.","w":{"A":"사업부·리전 조합마다 데이터 사본을 만들면 관리가 어렵고 열 수준 제어가 없습니다.","C":"직접 권한 부여는 확장성이 떨어지고 사용자 지정 필터링 계층이 필요합니다.","D":"사전 서명된 URL은 객체 단위이며 열 수준 PII 제외를 보장하지 않습니다."}}},{"n":20,"a":["A"],"orig":"","ko":{"q":"한 회사가 결제 처리 API를 위한 카나리 배포 전략을 설계하고 있습니다. 시스템은 실시간 추론 지표, 과거 트래픽 패턴, 서비스 상태를 바탕으로 여러 Amazon Bedrock 모델 간에 트래픽을 자동으로 점진 전환해야 합니다. 새 모델 버전으로 트래픽을 점진적으로 늘릴 수 있어야 하고, 지표가 정상이면 트래픽을 늘리고 성능이 허용 임계값 아래로 떨어지면 줄여야 합니다. 배포 단계 동안 추론 지연 시간과 오류율을 포괄적으로 모니터링해야 하며, 수동 개입 없이 배포를 중단하고 이전 모델 버전으로 되돌릴 수 있어야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","프로비저닝된 처리량을 사용하는 Amazon Bedrock으로 모델 버전을 호스팅합니다. 새 모델 버전이 출시되면 Amazon EventBridge 규칙이 AWS Step Functions 워크플로를 호출하도록 구성합니다. 워크플로가 단계적으로 트래픽을 전환하고, 지정 시간 동안 대기한 뒤, AWS Lambda 함수를 호출해 Amazon CloudWatch 성능 지표를 확인하도록 구성합니다. 지표가 임계값을 충족하면 트래픽을 늘리고, 임계값 아래로 떨어지면 트래픽 롤백을 트리거하도록 구성합니다."],["B","AWS Lambda 함수로 여러 Amazon Bedrock 모델 버전을 호출합니다. 스테이지 변수와 가중치 라우팅이 있는 Amazon API Gateway HTTP API로 트래픽을 점진 전환합니다. Amazon CloudWatch로 성능을 모니터링하고, 외부 로직으로 트래픽을 조정하며 성능이 임계값 아래로 떨어지면 롤백합니다."],["C","Amazon SageMaker AI 엔드포인트 변형으로 여러 Amazon Bedrock 모델 버전을 표현합니다. 변형 가중치로 트래픽을 전환합니다. Amazon CloudWatch와 SageMaker Model Monitor로 롤백을 트리거하고, 이상이 감지되면 EventBridge로 배포를 롤백합니다."],["D","Amazon OpenSearch Service로 추론 로그를 추적합니다. OpenSearch Service가 AWS Systems Manager Automation 런북을 호출해 추론 로그를 기반으로 Amazon Bedrock 모델 엔드포인트를 업데이트하고 트래픽을 전환하도록 구성합니다."]]},"en":{"q":"A company is designing a canary deployment strategy for a payment processing API. The system must support automated gradual traffic shifting between multiple Amazon Bedrock models based on real-time inference metrics, historical traffic patterns, and service health. The solution must be able to gradually increase traffic to new model versions. The system must increase traffic if metrics remain healthy and decrease traffic if the performance degrades below acceptable thresholds. The company needs to comprehensively monitor inference latency and error rates during the deployment phase. The company must also be able to halt deployments and revert to a previous model version without any manual intervention.\nWhich solution will meet these requirements?","o":[["A","Use Amazon Bedrock with provisioned throughput to host model versions. Configure an Amazon EventBridge rule to invoke an AWS Step Functions workflow when a new model version is released. Configure the workflow to shift traffic in stages, wait for a specified time period, and invoke an AWS Lambda function to check Amazon CloudWatch performance metrics. Configure the workflow to increase traffic if metrics meet thresholds and to trigger a traffic rollback if performance metrics fall below thresh
