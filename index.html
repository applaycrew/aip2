"순차 처리는 그대로라 시간이 줄지 않습니다.","C":"각 Lambda가 보고서의 여러 측면을 순차 처리하므로 병렬화 효과가 제한적입니다.","D":"컨테이너가 보고서를 순차 처리하고, CPU 기반 확장은 FM 호출 대기에 맞지 않습니다."}}},{"n":159,"a":["C"],"orig":"","ko":{"q":"한 전자상거래 회사가 규제, 비용 최적화, 성능 요구 사항에 따라 Amazon Bedrock의 여러 FM을 전환해야 하는 글로벌 상품 추천 시스템을 운영합니다. 회사는 동적 비용 임계값, AWS 리전별 규정 준수 규칙, 여러 FM에 걸친 실시간 A/B 테스트 등 자체 비즈니스 로직에 기반한 사용자 지정 통제를 적용해야 합니다. 시스템은 새 코드를 배포하지 않고 FM을 전환할 수 있어야 합니다. 또한 사용자 등급, 거래 금액, 규제 구역, 그리고 매시간 바뀌며 수천 건의 동시 요청에 즉시 반영되어야 하는 실시간 비용 지표 등 복잡한 규칙에 따라 사용자 요청을 라우팅해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AWS AppConfig에 저장된 라우팅 규칙을 평가하는 Amazon API Gateway REST API용 AWS Lambda 권한 부여자를 사용합니다. 비즈니스 로직에 따라 권한 부여 컨텍스트를 반환하고, 각 Amazon Bedrock FM 전용 Lambda 함수로 요청을 라우팅합니다."],["B","라우팅 규칙과 Amazon Bedrock FM ID를 환경 변수에 저장하는 AWS Lambda 함수를 배포합니다. 비즈니스 요구 사항이 바뀌면 Lambda 콘솔에서 환경 변수를 업데이트합니다. Amazon API Gateway REST API가 요청 파라미터를 읽어 라우팅을 결정하도록 구성합니다."],["C","각 사용자 요청마다 AWS AppConfig Agent에서 라우팅 구성을 가져오도록 AWS Lambda 함수를 구성합니다. Lambda 함수에서 비즈니스 로직을 실행해 요청별로 적절한 FM을 선택합니다. 단일 Amazon API Gateway REST API 엔드포인트로 FM을 노출합니다."],["D","Amazon API Gateway REST API 요청 변환 템플릿으로 요청 속성 기반 라우팅 로직을 구현합니다. Amazon Bedrock FM 엔드포인트를 REST API 스테이지 변수로 저장하고, 모델을 전환할 때 변수를 업데이트합니다."]]},"en":{"q":"An ecommerce company operates a global product recommendation system that needs to switch between multiple foundation models (FMs) in Amazon Bedrock based on regulations, cost optimization, and performance requirements. The company must apply custom controls based on proprietary business logic, including dynamic cost thresholds, AWS Region-specific compliance rules, and real-time A/B testing across multiple FMs. The system must be able to switch between FMs without deploying new code. The system must route user requests based on complex rules including user tier, transaction value, regulatory zone, and real-time cost metrics that change hourly and require immediate propagation across thousands of concurrent requests.\nWhich solution will meet these requirements?","o":[["A","Use AWS Lambda authorizers for an Amazon API Gateway REST API to evaluate routing rules that are stored in AWS AppConfig. Return authorization contexts based on business logic. Route requests to model-specific Lambda functions for each Amazon Bedrock FM."],["B","Deploy an AWS Lambda function that uses environment variables to store routing rules and Amazon Bedrock FM IDs. Use the Lambda console to update the environment variables when business requirements change. Configure an Amazon API Gateway REST API to read request parameters to make routing decisions."],["C","Configure an AWS Lambda function to fetch routing configuration from the AWS AppConfig Agent for each user request. Run business logic in the Lambda function to select the appropriate FM for each request. Expose the FM through a single Amazon API Gateway REST API endpoint."],["D","Deploy Amazon API Gateway REST API request transformation templates to implement routing logic based on request attributes. Store Amazon Bedrock FM endpoints as REST API stage variables. Update the variables when the system switches between models."]]},"ex":{"c":"9번과 같은 문제(보기 순서만 다름)입니다. Lambda가 요청마다 AWS AppConfig Agent에서 라우팅 구성을 가져와 비즈니스 로직으로 FM을 선택하면 코드 배포 없이 규칙 변경이 즉시 반영됩니다.","w":{"A":"Lambda 권한 부여자는 라우팅용이 아니며 모델별 Lambda로 복잡해집니다.","B":"환경 변수 변경은 함수 업데이트가 필요하고 복잡한 규칙을 표현하기 어렵습니다.","D":"매핑 템플릿과 스테이지 변수로는 복잡한 동적 로직을 구현할 수 없습니다."}}},{"n":160,"a":["A"],"orig":"","ko":{"q":"한 금융 서비스 회사가 Amazon Bedrock으로 계좌 활동과 회사 정책에 관한 고객 질문에 답하는 GenAI 어시스턴트를 배포하고 있습니다. 회사는 책임 있는 AI 원칙과 거버넌스 요구 사항을 준수해야 하며, 솔루션은 다음 요구 사항을 충족해야 합니다.\n* 유해하거나 편향되거나 규정을 위반하는 응답을 방지합니다.\n* 모든 모델 호출에 일관된 정책을 적용합니다.\n* AI 생성 출력에 대한 추적성과 감사 가능성을 제공합니다.\n* 애플리케이션 코드에 복잡한 안전 로직을 넣지 않고 개발자 생산성을 유지합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock Guardrails로 콘텐츠 정책을 적용합니다. 응답 필터링과 주제 제한을 구성하고, 모델 상호 작용에 대한 로깅을 구성합니다."],["B","프롬프트 엔지니어링 기법과 시스템 프롬프트로 모델 동작을 유도합니다."],["C","AWS Lambda 함수로 후처리 검사를 구현해, 사용자에게 응답을 반환하기 전에 모델 출력을 수동 검토하고 삭제합니다."],["D","모든 프롬프트와 응답을 Amazon S3에 기록하고, 주기적으로 사람이 검토해 책임 있는 AI 원칙 위반을 식별합니다."]]},"en":{"q":"A financial services company is deploying a GenAI assistant that uses Amazon Bedrock to answer customer questions about account activity and company policies. The company must comply with responsible AI principles and governance requirements. The solution must meet the following requirements:\n* Prevent harmful, biased, or non-compliant responses.\n* Ensure consistent policy enforcement across all model invocations.\n* Provide traceability and auditability for AI-generated outputs.\n* Maintain developer productivity without embedding complex safety logic in application code.\nWhich solution will meet these requirements?","o":[["A","Use Amazon Bedrock Guardrails to enforce content policies. Configure response filtering and topic restrictions. Configure logging for model interactions."],["B","Use prompt engineering techniques and system prompts to guide the model ' s behavior."],["C","Implement post-processing checks in AWS Lambda functions to manually review and redact model outputs before returning responses to users."],["D","Log all prompts and responses to Amazon S3. Conduct periodic human reviews to identify violations of responsible AI principles."]]},"ex":{"c":"Bedrock Guardrails는 애플리케이션 코드와 분리된 관리형 정책으로 유해·편향·비준수 응답을 막고, 모든 모델 호출에 일관되게 적용됩니다. 응답 필터링과 주제 제한을 구성하고 모델 상호 작용 로깅으로 추적성과 감사 가능성을 확보하며, 개발자는 복잡한 안전 로직을 코드에 넣을 필요가 없습니다.","w":{"B":"프롬프트 엔지니어링은 일관된 강제력이 없습니다.","C":"후처리 로직을 코드에 넣는 것은 '복잡한 안전 로직을 코드에 넣지 않음' 요구에 어긋납니다.","D":"주기적 사람 검토는 사후 대응이라 유해 응답을 막지 못합니다."}}},{"n":161,"a":["B"],"orig":"","ko":{"q":"한 의료 회사가 환자 의료 기록과 공개된 치료 지침을 바탕으로 환자 질문에 답하는 GenAI 애플리케이션을 구축하고 있습니다. 의료 규정을 준수하기 위해 애플리케이션은 모든 정보 출처에 대해 투명한 인용을 제공해야 합니다. 또한 모든 데이터 액세스에 대한 감사 추적을 유지하고, 응답이 승인된 의료 정보만 참조하도록 해야 합니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock AgentCore 에이전트와 Amazon Bedrock Prompt Management를 배포해 환자 응답을 생성합니다."],["B","Amazon Bedrock Knowledge Bases로 애플리케이션을 승인된 데이터 소스에 연결합니다. Amazon CloudWatch로 모든 쿼리 및 응답 활동에 대한 포괄적인 로그를 수집합니다."],["C","Amazon Bedrock Guardrails로 환자 정보를 필터링하도록 구성합니다. AWS 외부에 의료 기록을 저장할 사용자 지정 벡터 데이터베이스를 만들고, AWS Lambda 함수로 인용을 추적합니다."],["D","Amazon SageMaker AI로 의료 데이터를 사용해 Amazon Bedrock 모델을 미세 조정합니다. Amazon API Gateway 계층의 사용자 지정 출처 표시 메커니즘으로 데이터 소스를 인용하고, 데이터 계보 기록을 Amazon DynamoDB에 저장합니다."]]},"en":{"q":"A healthcare company is building a generative AI (GenAI) application to answer patient questions based on patient medical records and published treatment guidelines. To comply with healthcare regulations, the application must provide transparent citations for all information sources. The application must also maintain an audit trail for all data access and ensure that responses reference only authorized medical information.\nWhich solution will meet these requirements with the LEAST operational overhead?","o":[["A","Deploy an Amazon Bedrock AgentCore agent and Amazon Bedrock Prompt Management to generate patient responses."],["B","Use Amazon Bedrock Knowledge Bases to connect the application to authorized data sources. Use Amazon CloudWatch to collect comprehensive logs for all queries and response activities."],["C","Configure Amazon Bedrock Guardrails to filter patient information. Create a custom vector database outside of AWS to store medical records. Use AWS Lambda functions to track citations."],["D","Use Amazon SageMaker AI to fine-tune Amazon Bedrock models by using medical data. Use a custom attribution mechanism in an Amazon API Gateway layer to cite data sources. Store data lineage records in Amazon DynamoDB."]]},"ex":{"c":"Bedrock Knowledge Bases를 승인된 데이터 소스에 연결하면 응답이 승인된 의료 정보만 참조하고 출처 인용을 자동으로 제공합니다. CloudWatch로 모든 쿼리와 응답 활동 로그를 수집해 감사 추적을 남깁니다. 관리형 기능이라 운영 오버헤드가 가장 적습니다.","w":{"A":"에이전트와 Prompt Management만으로는 인용과 승인된 데이터 소스 제한이 보장되지 않습니다.","C":"AWS 외부 벡터 DB와 Lambda 인용 추적은 오버헤드와 규정 준수 위험이 큽니다.","D":"미세 조정한 모델은 출처를 인용할 수 없고 사용자 지정 메커니즘 부담이 큽니다."}}},{"n":162,"a":["B"],"orig":"","ko":{"q":"한 회사가 여러 콘텐츠 소스로부터 학습 자료를 자동 생성하는 시스템이 필요합니다. 콘텐츠 소스에는 문서 파일(PDF, PowerPoint 프레젠테이션, Word 문서)과 멀티미디어 파일(녹화 동영상)이 포함됩니다. 시스템은 매일 10,000개 이상의 콘텐츠 소스를 처리해야 하며, 피크 시 동시 업로드가 500건에 이릅니다. 또한 문서와 멀티미디어 파일에서 핵심 개념을 추출하고 맥락상 정확한 요약을 만들어야 합니다. 생성된 학습 자료는 버전 관리와 함께 실시간 협업을 지원해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock Data Automation(BDA)과 AWS Lambda 함수로 문서 파일 처리를 오케스트레이션합니다. Amazon Bedrock Knowledge Bases로 모든 멀티미디어를 처리합니다. 콘텐츠를 복제가 설정된 Amazon DocumentDB에 저장하고, Amazon SNS 주제 구독으로 협업하며, Amazon Bedrock Agents로 변경 사항을 추적합니다."],["B","Amazon Bedrock Data Automation(BDA)과 FM으로 문서 파일을 처리합니다. BDA를 PDF 추출용 Amazon Textract, 멀티미디어 파일용 Amazon Transcribe와 통합합니다. 처리된 콘텐츠는 버전 관리를 활성화한 Amazon S3에, 메타데이터는 Amazon DynamoDB에 저장합니다. AWS AppSync GraphQL 구독과 DynamoDB로 실시간 협업을 지원합니다."],["C","Amazon Bedrock Data Automation(BDA)과, 콘텐츠 추출 및 요약 모델을 호스팅하는 Amazon SageMaker AI 엔드포인트를 사용합니다. Amazon Bedrock Guardrails로 모든 파일 유형에서 콘텐츠를 추출합니다. 시계열 분석을 위해 문서 파일을 Amazon Neptune에 저장하고, 실시간 메시징에 Amazon Bedrock Chat을 사용해 협업합니다."],["D","Amazon Bedrock Data Automation(BDA)과 AWS Lambda 함수로 콘텐츠 파일 배치를 처리합니다. Amazon Bedrock에서 FM을 미세 조정해 모든 콘텐츠 유형의 문서를 분류합니다. 처리된 데이터를 샤딩된 클러스터 모드의 Amazon ElastiCache(Redis OSS)에 저장하고, Amazon Bedrock Prompt management로 버전 관리를 합니다."]]},"en":{"q":"A company needs a system to automatically generate study materials from multiple content sources. The content sources include document files (PDF files, PowerPoint presentations, and Word documents) and multimedia files (recorded videos). The system must process more than 10,000 content sources daily with peak loads of 500 concurrent uploads. The system must also extract key concepts from document files and multimedia files and create contextually accurate summaries. The generated study materials must support real- time collaboration with version control.\nWhich solution will meet these requirements?","o":[["A","Use Amazon Bedrock Data Automation (BDA) with AWS Lambda functions to orchestrate document file processing. Use Amazon Bedrock Knowledge Bases to process all multimedia. Store the content in Amazon DocumentDB with replication. Collaborate by using Amazon SNS topic subscriptions. Track changes by using Amazon Bedrock Agents."],["B","Use Amazon Bedrock Data Automation (BDA) with foundation models (FMs) to process document files. Integrate BDA with Amazon Textract for PDF extraction and with Amazon Tran scribe for multimedia files. Store the processed content in Amazon S3 with versioning enabled. Store the metadata in Amazon DynamoDB. Collaborate in real time by using AWS AppSync GraphQL subscriptions and DynamoDB."],["C","Use Amazon Bedrock Data Automation (BDA) with Amazon SageMaker AI endpoints to host content extraction and summarization models. Use Amazon Bedrock Guardrails to extract content from all file types. Store document files in Amazon Neptune for time series analysis. Collaborate by using Amazon Bedrock Chat for real-time messaging."],["D","Use Amazon Bedrock Data Automation (BDA) with AWS Lambda functions to process batches of content files. Fine-tune foundation models (FMs) in Amazon Bedrock to classify documents across all content types. Store the processed data in Amazon ElastiCache (Redis OSS) by using Cluster Mode with sharding. Use Prompt management in Amazon Bedrock for version control."]]},"ex":{"c":"Bedrock Data Automation(BDA)과 FM으로 문서를 처리하고, Textract(PDF 추출)와 Transcribe(동영상 음성)를 통합해 핵심 개념을 추출하고 요약합니다. S3 버전 관리로 콘텐츠 버전을 관리하고, DynamoDB와 AppSync GraphQL 구독으로 실시간 협업을 지원합니다. 대량 처리와 동시 업로드에도 확장 가능합니다.","w":{"A":"Knowledge Bases는 멀티미디어 처리 도구가 아니고, SNS와 Agents는 협업·변경 추적 수단이 아닙니다.","C":"Guardrails는 콘텐츠 추출 도구가 아니고, Neptune은 시계열 DB가 아니며 'Bedrock Chat'은 협업 서비스가 아닙니다.","D":"ElastiCache는 영구 저장소가 아니고, Prompt Management는 학습 자료 버전 관리 도구가 아닙니다."}}},{"n":163,"a":["C"],"orig":"","ko":{"q":"한 전자상거래 회사가 규제, 비용 최적화, 성능 요구 사항에 따라 Amazon Bedrock의 여러 FM을 전환해야 하는 글로벌 상품 추천 시스템을 운영합니다. 회사는 동적 비용 임계값, AWS 리전별 규정 준수 규칙, 여러 FM에 걸친 실시간 A/B 테스트 등 자체 비즈니스 로직에 기반한 사용자 지정 통제를 적용해야 합니다. 시스템은 새 코드를 배포하지 않고 FM을 전환할 수 있어야 합니다. 또한 사용자 등급, 거래 금액, 규제 구역, 그리고 매시간 바뀌며 수천 건의 동시 요청에 즉시 반영되어야 하는 실시간 비용 지표 등 복잡한 규칙에 따라 사용자 요청을 라우팅해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","라우팅 규칙과 Amazon Bedrock FM ID를 환경 변수에 저장하는 AWS Lambda 함수를 배포합니다. 비즈니스 요구 사항이 바뀌면 Lambda 콘솔에서 환경 변수를 업데이트합니다. Amazon API Gateway REST API가 요청 파라미터를 읽어 라우팅을 결정하도록 구성합니다."],["B","Amazon API Gateway REST API 요청 변환 템플릿으로 요청 속성 기반 라우팅 로직을 구현합니다. Amazon Bedrock FM 엔드포인트를 REST API 스테이지 변수로 저장하고, 모델을 전환할 때 변수를 업데이트합니다."],["C","각 사용자 요청마다 AWS AppConfig Agent에서 라우팅 구성을 가져오도록 AWS Lambda 함수를 구성합니다. Lambda 함수에서 비즈니스 로직을 실행해 요청별로 적절한 FM을 선택합니다. 단일 Amazon API Gateway REST API 엔드포인트로 FM을 노출합니다."],["D","AWS AppConfig에 저장된 라우팅 규칙을 평가하는 Amazon API Gateway REST API용 AWS Lambda 권한 부여자를 사용합니다. 비즈니스 로직에 따라 권한 부여 컨텍스트를 반환하고, 각 Amazon Bedrock FM 전용 Lambda 함수로 요청을 라우팅합니다."]]},"en":{"q":"An ecommerce company operates a global product recommendation system that needs to switch between multiple foundation models (FM) in Amazon Bedrock based on regulations, cost optimization, and performance requirements. The company must apply custom controls based on proprietary business logic, including dynamic cost thresholds, AWS Region-specific compliance rules, and real-time A/B testing across multiple FMs. The system must be able to switch between FMs without deploying new code. The system must route user requests based on complex rules including user tier, transaction value, regulatory zone, and real-time cost metrics that change hourly and require immediate propagation across thousands of concurrent requests.\nWhich solution will meet these requirements?","o":[["A","Deploy an AWS Lambda function that uses environment variables to store routing rules and Amazon Bedrock FM IDs. Use the Lambda console to update the environment variables when business requirements change. Configure an Amazon API Gateway REST API to read request parameters to make routing decisions."],["B","Deploy Amazon API Gateway REST API request transformation templates to implement routing logic based on request attributes. Store Amazon Bedrock FM endpoints as REST API stage variables. Update the variables when the system switches between models."],["C","Configure an AWS Lambda function to fetch routing configurations from the AWS AppConfig Agent for each user request. Run business logic in the Lambda function to select the appropriate FM for each request. Expose the FM through a single Amazon API Gateway REST API endpoint."],["D","Use AWS Lambda authorizers for an Amazon API Gateway REST API to evaluate routing rules that are stored in AWS AppConfig. Return authorization contexts based on business logic. Route requests to model-specific Lambda functions for each Amazon Bedrock FM."]]},"ex":{"c":"9번과 같은 문제입니다. Lambda가 요청마다 AWS AppConfig Agent에서 라우팅 구성을 가져와 비즈니스 로직으로 FM을 선택하면, 코드 배포 없이 매시간 바뀌는 규칙이 수천 건의 동시 요청에 즉시 반영됩니다.","w":{"A":"환경 변수 변경은 함수 업데이트가 필요하고 복잡한 규칙을 표현하기 어렵습니다.","B":"매핑 템플릿과 스테이지 변수로는 복잡한 동적 로직을 구현할 수 없습니다.","D":"Lambda 권한 부여자는 라우팅용이 아니며 모델별 Lambda로 복잡해집니다."}}}];
const byN = new Map(Q.map(q=>[q.n,q]));
const S = (()=>{ // persistence (per-viewer convenience only)
  const K='aipc01-v2';
  let d={};
  try{ d=JSON.parse(localStorage.getItem(K)||'{}')||{} }catch(e){}
  d.res=d.res||{}; d.lv=d.lv||{}; d.lang=d.lang||'ko'; d.lvf=d.lvf||'all'; d.bm=d.bm||[]; d.mode=d.mode||'seq'; d.pos=d.pos||{};
  return {d, save(){ try{localStorage.setItem(K,JSON.stringify(d))}catch(e){} }};
})();
const st = { mode:S.d.mode, list:[], idx:0, sel:[], checked:false, exam:S.d.exam||null, search:'', confirmReset:false, resetOpen:false, resetScope:'cur' };

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const bmSet=()=>new Set(S.d.bm);

function buildList(){
  const all=Q.map(q=>q.n);
  let list;
  if(st.mode==='seq') list=all;
  else if(st.mode==='rand') list = S.d.randList && S.d.randList.length===all.length ? S.d.randList : (S.d.randList=shuffle(all));
  else if(st.mode==='wrong') list=all.filter(n=>S.d.res[n] && !S.d.res[n].ok);
  else if(st.mode==='bm') list=all.filter(n=>bmSet().has(n));
  else if(st.mode==='exam'){
    if(!st.exam){ st.exam={list:shuffle(all).slice(0,65),sel:{},done:false,t0:Date.now()}; S.d.exam=st.exam; }
    list=st.exam.list;
  }
  if(st.search){
    const k=st.search.toLowerCase();
    list=list.filter(n=>{const q=byN.get(n);return [q.ko,q.en].map(L=>L.q+' '+L.o.map(o=>o[1]).join(' ')).join(' ').toLowerCase().includes(k)||String(n)===k});
  }
  if(st.mode!=='exam' && S.d.lvf!=='all') list=list.filter(n=>(S.d.lv[n]||'none')===S.d.lvf);
  st.list=list;
  const p=S.d.pos[st.mode]||0;
  st.idx=Math.min(p,Math.max(0,list.length-1));
}

function curQ(){return byN.get(st.list[st.idx])}

function loadSel(){
  const q=curQ(); st.sel=[]; st.checked=false; st.fromSave=false;
  if(!q) return;
  if(st.mode==='exam'){ st.sel=(st.exam.sel[q.n]||[]).slice(); st.checked=st.exam.done; }
  else if(S.d.res[q.n]){ const r=S.d.res[q.n]; st.sel=(r.sel||[]).slice(); st.checked=st.sel.length===q.a.length; st.fromSave=true; }
}

function go(i){
  if(i<0||i>=st.list.length) return;
  st.idx=i; S.d.pos[st.mode]=i; S.save(); loadSel(); render();
  window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});
}

function toggle(k){
  const q=curQ(); if(!q||st.checked) return;
  const multi=q.a.length>1;
  if(multi){ st.sel = st.sel.includes(k)? st.sel.filter(x=>x!==k) : (st.sel.length<q.a.length? [...st.sel,k] : st.sel) ; }
  else st.sel=[k];
  if(st.mode==='exam'){ st.exam.sel[q.n]=st.sel.slice(); S.save(); }
  render();
}

function check(){
  const q=curQ(); if(!q||st.checked||st.sel.length!==q.a.length) return;
  st.checked=true;
  const ok=[...st.sel].sort().join()===[...q.a].sort().join();
  S.d.res[q.n]={ok,sel:st.sel.slice(),t:Date.now()}; S.save();
  render();
}

function submitExam(){
  st.exam.done=true; st.exam.t1=Date.now(); S.save(); st.checked=true; loadSel(); render(); window.scrollTo(0,0);
}

function examScore(){
  const e=st.exam; let c=0;
  e.list.forEach(n=>{const q=byN.get(n),s=e.sel[n]||[]; if(s.slice().sort().join()===q.a.slice().sort().join()) c++;});
  return c;
}

function renderStats(){
  const r=Object.values(S.d.res), o=r.filter(x=>x.ok).length, x=r.length-o;
  const acc=r.length?Math.round(o/r.length*100):0;
  const th=document.documentElement.dataset.theme;
  document.getElementById('stats').innerHTML=
    `<span>풀이 <b>${r.length}</b>/${Q.length}</span><span class="o">정답 <b>${o}</b></span><span class="x">오답 <b>${x}</b></span><span>정답률 <b>${acc}%</b></span>`;
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===st.mode));
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.d.lang));
}

function renderGrid(){
  const g=document.getElementById('grid'), bm=bmSet(), exam=st.mode==='exam';
  document.getElementById('aside-title').textContent = ({seq:'전체 문항',rand:'랜덤 순서',wrong:'오답 노트',bm:'북마크',exam:'모의고사 문항'})[st.mode]+` · ${st.list.length}`;
  g.innerHTML=st.list.map((n,i)=>{
    let c='';
    if(exam){ const s=st.exam.sel[n]; if(st.exam.done){const q=byN.get(n); c=(s||[]).slice().sort().join()===q.a.slice().sort().join()?'ok':'bad'} else if(s&&s.length) c='ans'; }
    else if(S.d.res[n]) c=S.d.res[n].ok?'ok':'bad';
    if(i===st.idx) c+=' cur'; if(bm.has(n)) c+=' bm';
    return `<button class="${c}" data-i="${i}" aria-label="${n}번">${exam?i+1:n}</button>`;
  }).join('');
  const f=document.getElementById('filt');
  if(st.mode==='exam') f.innerHTML='';
  else { const cnt=l=>Q.filter(q=>(S.d.lv[q.n]||'none')===l).length;
    f.innerHTML='<span>난이도</span>'+[['all','전체'],['상','상'],['중','중'],['하','하'],['none','미지정']].map(([v,t])=>`<button data-lvf="${v}" aria-pressed="${S.d.lvf===v}">${t}${v!=='all'?' '+cnt(v):''}</button>`).join(''); }
  const sa=document.getElementById('side-actions');
  let h='';
  if(st.mode==='rand') h+=`<button id="reshuffle">순서 다시 섞기</button>`;
  if(exam) h+= st.exam.done? `<button id="newexam">새 모의고사 시작</button>` : `<button id="submit-side">답안 제출</button>`;
  h+=`<div class="grp">내 답 저장</div><div class="row"><button id="export">기록 파일 저장</button><button id="import">불러오기</button></div><button id="csv">풀이 결과 엑셀(CSV) 저장</button>`;
  h+= st.resetOpen? resetPanel() : `<button id="resetOpen">기록 초기화…</button>`;
  sa.innerHTML=h;
}

function paras(t,cls){
  const ls=t.split('\n').filter(x=>x.trim());
  return ls.map((p,i)=>`<p${i===ls.length-1&&/\?/.test(p)&&cls!=='en'?' class="ask"':''}>${esc(p)}</p>`).join('');
}
function stemHTML(q){
  const L=S.d.lang;
  if(L==='en') return paras(q.en.q).replace(/<p>([^<]*\?[^<]*)<\/p>$/,'<p class="ask">$1</p>');
  if(L==='both') return paras(q.ko.q)+`<div class="en" lang="en">${paras(q.en.q,'en')}</div>`;
  return paras(q.ko.q);
}
function exHTML(q){
  const e=q.ex; if(!e) return '';
  const keys=q.ko.o.map(o=>o[0]);
  const items=keys.filter(k=>e.w[k]).map(k=>`<li><b>${k}</b><span>${esc(e.w[k])}</span></li>`).join('');
  return `<section class="ex" aria-label="해설"><h3>해설 <small>· AI 작성, 학습 참고용</small></h3>
    <p class="why"><strong>정답 ${q.a.join(', ')}</strong> — ${esc(e.c)}</p>
    ${items?`<ul>${items}</ul>`:''}</section>`;
}
function renderMain(){
  const M=document.getElementById('main'); const q=curQ(); const exam=st.mode==='exam';
  let pre='';
  if(exam){
    const answered=st.exam.list.filter(n=>(st.exam.sel[n]||[]).length).length;
    if(st.exam.done){
      const c=examScore(), pct=Math.round(c/65*100), mins=Math.round(((st.exam.t1||Date.now())-st.exam.t0)/60000);
      pre+=`<section class="score"><h2>모의고사 결과</h2><div class="big">${c}<small> / 65</small> · ${pct}%</div>
        <div class="verdict ${pct>=75?'pass':'fail'}">${pct>=75?'합격권 (75% 이상)':'합격권 미달 (기준 75%)'}</div>
        <div class="hint">소요 시간 약 ${mins}분 · 왼쪽 번호를 눌러 문항별 정답을 확인하세요. 합격 기준 75%는 참고용입니다.</div></section>`;
    } else {
      pre+=`<div class="exambar"><span>응답 <b>${answered}</b>/65</span><span>시작 후 <b id="elapsed">0</b>분</span><span class="sp"></span></div>`;
    }
  }
  if(!q){
    const msg={wrong:'아직 틀린 문제가 없습니다. 다른 모드에서 문제를 풀면 오답이 여기에 모입니다.',bm:'북마크한 문제가 없습니다. 문제 카드 오른쪽 위의 북마크 버튼으로 추가하세요.'}[st.mode]||'검색 결과가 없습니다.';
    M.innerHTML=pre+`<div class="card"><p class="empty">${st.search?'검색 결과가 없습니다.':msg}</p></div>`; return;
  }
  const multi=q.a.length>1, bm=bmSet().has(q.n);
  const reveal = st.checked;
  const L=S.d.lang, base=L==='en'?q.en:q.ko;
  const opts=base.o.map(([k,t],oi)=>{
    let c='opt'+(multi?' multi':'');
    if(reveal){ if(q.a.includes(k)) c+=' right'; else if(st.sel.includes(k)) c+=' wrong'; }
    else if(st.sel.includes(k)) c+=' sel';
    return `<button class="${c}" data-k="${k}" ${reveal?'disabled':''}><span class="k">${k}</span><span class="t">${esc(t)}${L==='both'?`<span class="en" lang="en">${esc(q.en.o[oi][1])}</span>`:''}</span></button>`;
  }).join('');
  let result='';
  if(reveal){
    const ok=st.sel.slice().sort().join()===q.a.slice().sort().join();
    const lv=S.d.lv[q.n]||'';
    const sv=S.d.res[q.n]&&st.mode!=='exam'?`<span class="saved">${st.fromSave?'저장된 내 답':'저장됨'} · ${fmt(S.d.res[q.n].t)}</span>`:'';
    result=`<div class="result ${ok?'ok':'bad'}">${ok?'정답입니다':(st.sel.length?'오답입니다':'미응답')}<span>정답 <code>${q.a.join(', ')}</code>${st.sel.length&&!ok?` · 내 답 <code>${st.sel.join(', ')}</code>`:''}</span>${sv}</div>`+
      (q.orig?`<div class="note">참고: 원본 덤프의 답은 <code>${esc(q.orig)}</code>였고, 검증 후 <code>${q.a.join(', ')}</code>로 바뀌었습니다.</div>`:'')+
      exHTML(q)+
      (st.mode!=='exam'?`<div class="nav lv" style="margin-top:12px">이 문제 난이도 ${['상','중','하'].map(v=>`<button data-lvset="${v}" aria-pressed="${lv===v}">${v}</button>`).join('')}</div>`:'');
  }
  const last=st.idx===st.list.length-1;
  let actions='';
  if(exam && !st.exam.done){
    actions=`<button class="btn" id="prev" ${st.idx===0?'disabled':''}>이전</button><span class="sp"></span>`+
      (last?`<button class="btn primary" id="submit">답안 제출</button>`:`<button class="btn primary" id="next">다음</button>`);
  } else {
    actions=`<button class="btn" id="prev" ${st.idx===0?'disabled':''}>이전</button><span class="sp"></span>`+
      (reveal? `<button class="btn" id="retry">다시 풀기</button><button class="btn primary" id="next" ${last?'disabled':''}>다음 문제</button>`
             : `<button class="btn primary" id="check" ${st.sel.length!==q.a.length?'disabled':''}>정답 확인</button>`);
  }
  const pct=Math.round((st.idx+1)/st.list.length*100);
  M.innerHTML=pre+`<div class="progress"><div style="width:${pct}%"></div></div>
  <article class="card">
    <div class="qmeta"><span class="qno"><strong>${exam?st.idx+1:q.n}</strong>${exam?` / 65 · 원문 ${q.n}번`:` · ${st.idx+1} / ${st.list.length}`}</span>
      ${multi?`<span class="pill multi">${q.a.length}개 선택</span>`:`<span class="pill">단일 선택</span>`}
      <button class="bmbtn" id="bm" aria-pressed="${bm}">${bm?'북마크됨':'북마크'}</button></div>
    <div class="stem">${stemHTML(q)}</div>
    <div class="opts">${opts}</div>
    ${result}
    <div class="nav">${actions}</div>
    <div class="hint"><kbd>A</kbd>–<kbd>F</kbd> 보기 선택 · <kbd>Enter</kbd> ${exam&&!st.exam.done?'다음':'정답 확인 / 다음'} · <kbd>←</kbd><kbd>→</kbd> 이동</div>
  </article>`;
}

function fmt(t){ if(!t) return ''; const d=new Date(t); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function toast(m){ const o=document.querySelector('.toast'); if(o) o.remove(); const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function stamp(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
function download(name,text,type){
  try{ const b=new Blob([text],{type}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); toast(name+' 파일을 저장했습니다.'); }
  catch(e){ toast('이 환경에서는 파일을 저장할 수 없습니다. 내려받은 HTML 파일로 열어 주세요.'); }
}
function exportJSON(){
  const n=Object.keys(S.d.res).length;
  if(!n && !S.d.bm.length){ toast('저장할 풀이 기록이 아직 없습니다.'); return; }
  const data={app:'aipc01',version:1,savedAt:new Date().toISOString(),res:S.d.res,bm:S.d.bm,lv:S.d.lv};
  download(`AIP-C01_풀이기록_${stamp()}.json`,JSON.stringify(data,null,1),'application/json');
}
function exportCSV(){
  const rows=Q.filter(q=>S.d.res[q.n]).map(q=>{const r=S.d.res[q.n];return [q.n,(r.sel||[]).join(' '),q.a.join(' '),r.ok?'O':'X',S.d.lv[q.n]||'',S.d.bm.includes(q.n)?'Y':'',fmt(r.t)]});
  if(!rows.length){ toast('저장할 풀이 기록이 아직 없습니다.'); return; }
  const head=['번호','내 답','정답','결과','난이도','북마크','풀이 시각'];
  const csv='\ufeff'+[head,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  download(`AIP-C01_풀이결과_${stamp()}.csv`,csv,'text/csv;charset=utf-8');
}
document.addEventListener('change',e=>{ if(e.target.name==='rscope'){ st.resetScope=e.target.value; st.confirmReset=false; renderGrid(); } });
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
      const d=JSON.parse(rd.result);
      if(d.app!=='aipc01'||typeof d.res!=='object') throw 0;
      let c=0; Object.entries(d.res).forEach(([n,r])=>{ if(byN.has(+n)&&r&&Array.isArray(r.sel)){ const cur=S.d.res[n]; if(!cur||(r.t||0)>=(cur.t||0)){S.d.res[n]={ok:!!r.ok,sel:r.sel,t:r.t||Date.now()};c++;} } });
      if(Array.isArray(d.bm)) S.d.bm=[...new Set([...S.d.bm,...d.bm.filter(n=>byN.has(n))])];
      if(d.lv&&typeof d.lv==='object') Object.entries(d.lv).forEach(([n,v])=>{ if(byN.has(+n)&&['상','중','하'].includes(v)) S.d.lv[n]=v; });
      S.save(); buildList(); loadSel(); render(); toast(`풀이 기록 ${c}문항을 불러왔습니다.`);
    }catch(err){ toast('불러올 수 없는 파일입니다. 이 사이트에서 저장한 기록 파일(.json)을 선택하세요.'); } };
  rd.readAsText(f);
});
function scopeTargets(sc){
  const all=Object.keys(S.d.res).map(Number), q=curQ();
  if(sc==='cur') return q&&S.d.res[q.n]&&st.mode!=='exam'?[q.n]:[];
  if(sc==='wrong') return all.filter(n=>!S.d.res[n].ok);
  if(sc==='right') return all.filter(n=>S.d.res[n].ok);
  return all;
}
function resetPanel(){
  const q=curQ();
  const opts=[['cur',`현재 문제만${q&&st.mode!=='exam'?` (${q.n}번)`:''}`],['wrong','틀린 문제 기록만'],['right','맞힌 문제 기록만'],['answers','풀이 기록 전체'],['all','전부 (북마크·난이도·모의고사 포함)']];
  if(scopeTargets(st.resetScope).length===0 && st.resetScope!=='all') st.resetScope=(opts.find(([v])=>scopeTargets(v).length)||['all'])[0];
  const rows=opts.map(([v,t])=>{const c=scopeTargets(v).length, off=v!=='all'&&!c;
    return `<label class="${off?'off':''}"><input type="radio" name="rscope" value="${v}" ${st.resetScope===v?'checked':''} ${off?'disabled':''}>${t}<small>${v==='all'?'':c+'문항'}</small></label>`}).join('');
  const armed=st.confirmReset;
  return `<div class="rpanel" role="group" aria-label="기록 초기화">${rows}
    ${armed?`<p class="warn">지운 기록은 되돌릴 수 없습니다. 한 번 더 누르면 초기화됩니다.</p>`:''}
    <div class="row"><button id="resetSave">저장 후 초기화</button><button id="resetDo" class="danger ${armed?'armed':''}">${armed?'초기화 확인':'초기화'}</button></div>
    <button id="resetCancel">취소</button></div>`;
}
function doReset(){
  const sc=st.resetScope, t=scopeTargets(sc);
  if(sc==='all'){ S.d.res={}; S.d.bm=[]; S.d.lv={}; S.d.exam=null; st.exam=null; S.d.pos={}; S.d.randList=null; }
  else { t.forEach(n=>delete S.d.res[n]); }
  const msg = sc==='all'?'모든 기록을 초기화했습니다.':`${t.length}문항의 풀이 기록을 지웠습니다.`;
  st.confirmReset=false; st.resetOpen=false; S.save();
  setMode(st.mode); toast(msg);
}
function render(){ renderStats(); renderGrid(); renderMain(); tick(); }
function tick(){ const e=document.getElementById('elapsed'); if(e&&st.exam) e.textContent=Math.floor((Date.now()-st.exam.t0)/60000); }
setInterval(tick,15000);

function setMode(m){
  st.mode=m; S.d.mode=m; st.confirmReset=false; S.save(); buildList(); loadSel(); render();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.id!=='resetDo' && t.id!=='resetSave' && st.confirmReset){ st.confirmReset=false; renderGrid(); }
  if(t.dataset.mode) return setMode(t.dataset.mode);
  if(t.dataset.i) { go(+t.dataset.i); if(innerWidth<=860) document.getElementById('aside').classList.add('closed'), document.getElementById('toggle').textContent='펼치기'; return; }
  if(t.dataset.k) return toggle(t.dataset.k);
  if(t.dataset.lang){ S.d.lang=t.dataset.lang; S.save(); return render(); }
  if(t.dataset.lvf){ S.d.lvf=t.dataset.lvf; S.d.pos[st.mode]=0; S.save(); buildList(); loadSel(); return render(); }
  if(t.dataset.lvset){ const n=curQ().n; S.d.lv[n]===t.dataset.lvset? delete S.d.lv[n] : S.d.lv[n]=t.dataset.lvset; S.save(); return render(); }
  switch(t.id){
    case 'check': return check();
    case 'next': return go(st.idx+1);
    case 'prev': return go(st.idx-1);
    case 'retry': st.sel=[]; st.checked=false; st.fromSave=false; return render();
    case 'export': return exportJSON();
    case 'csv': return exportCSV();
    case 'import': return document.getElementById('importFile').click();
    case 'submit': case 'submit-side': return submitExam();
    case 'newexam': st.exam=null; S.d.exam=null; S.d.pos.exam=0; S.save(); return setMode('exam');
    case 'reshuffle': S.d.randList=null; S.d.pos.rand=0; S.save(); return setMode('rand');
    case 'bm': { const n=curQ().n, s=bmSet(); s.has(n)?s.delete(n):s.add(n); S.d.bm=[...s]; S.save(); return render(); }
    case 'resetOpen': st.resetOpen=true; st.resetScope='cur'; return renderGrid();
    case 'resetCancel': st.resetOpen=false; st.confirmReset=false; return renderGrid();
    case 'resetDo': case 'resetSave':
      if(!st.confirmReset){ st.confirmReset=true; st.pendingSave=t.id==='resetSave'; return renderGrid(); }
      if(st.pendingSave) exportJSON();
      return doReset();
    case 'toggle': { const a=document.getElementById('aside'); a.classList.toggle('closed'); t.textContent=a.classList.contains('closed')?'펼치기':'접기'; return; }
  }
});
document.getElementById('search').addEventListener('input',e=>{ st.search=e.target.value.trim(); S.d.pos[st.mode]=0; buildList(); loadSel(); render(); });
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey||e.altKey) return;
  const q=curQ(); if(!q) return;
  const k=e.key.toUpperCase();
  if(/^[A-F]$/.test(k) && q.ko.o.some(o=>o[0]===k)) { toggle(k); e.preventDefault(); }
  else if(/^[1-6]$/.test(k) && q.ko.o[+k-1]) { toggle(q.ko.o[+k-1][0]); e.preventDefault(); }
  else if(e.key==='Enter'){ e.preventDefault();
    if(st.mode==='exam'&&!st.exam.done){ st.idx<st.list.length-1?go(st.idx+1):null; }
    else if(!st.checked) check(); else go(st.idx+1); }
  else if(e.key==='ArrowRight') go(st.idx+1);
  else if(e.key==='ArrowLeft') go(st.idx-1);
});
if(innerWidth>860) document.getElementById('aside').classList.remove('closed');
buildList(); loadSel(); render();
</script>

</body>
