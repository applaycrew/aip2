h 구성이 더해져 여러 도구를 엮어야 합니다.","C":"Athena 쿼리는 데이터 품질 검증·모니터링 도구가 아닙니다.","D":"EC2 사용자 지정 코드는 개발·운영 부담이 크고 Model Monitor는 모델 엔드포인트용입니다."}}},{"n":48,"a":["B"],"orig":"","ko":{"q":"한 제약 회사가 Amazon Bedrock 지식 기반을 사용하는 RAG 애플리케이션을 개발하고 있습니다. 지식 기반은 2,500만 편 이상의 과학 논문에 대해 Amazon OpenSearch Service를 데이터 소스로 사용합니다. 사용자들은 쿼리가 논문의 방법론, 결과, 논의 섹션에 걸쳐 있을 때 애플리케이션이 일관되지 않은 답변을 내고 논문의 관련 없는 부분을 인용한다고 보고합니다. 회사는 전체 데이터 말뭉치 규모에서 관련 문단 간 의미 맥락을 보존하도록 지식 기반을 개선해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","지식 기반이 고정 크기 청킹을 사용하도록 구성합니다. 최대 청크 크기를 300토큰, 청크 간 중첩을 10%로 설정하고 적절한 Amazon Bedrock 임베딩 모델을 사용합니다."],["B","지식 기반이 계층적(hierarchical) 청킹을 사용하도록 구성합니다. 부모 청크는 1,000토큰, 자식 청크는 200토큰으로 하고, 청크 간 중첩을 50토큰으로 설정합니다."],["C","지식 기반이 의미 기반 청킹을 사용하도록 구성합니다. 버퍼 크기 1과 중단점 백분위 임계값 85%를 사용해 내용의 의미에 따라 청크 경계를 정합니다."],["D","지식 기반이 청킹을 사용하지 않도록 구성합니다. 수집 전에 각 문서를 수동으로 별도 파일로 분할하고, 검색 시 후처리 리랭킹을 적용합니다."]]},"en":{"q":"A pharmaceutical company is developing a Retrieval Augmented Generation application that uses an Amazon Bedrock knowledge base. The knowledge base uses Amazon OpenSearch Service as a data source for more than 25 million scientific papers. Users report that the application produces inconsistent answers that cite irrelevant sections of papers when queries span methodology, results, and discussion sections of the papers. The company needs to improve the knowledge base to preserve semantic context across related paragraphs on the scale of the entire corpus of data.\nWhich solution will meet these requirements?","o":[["A","Configure the knowledge base to use fixed-size chunking. Set a 300-token maximum chunk size and a 10% overlap between chunks. Use an appropriate Amazon Bedrock embedding model."],["B","Configure the knowledge base to use hierarchical chunking. Use parent chunks that contain 1,000 tokens and child chunks that contain 200 tokens. Set a 50-token overlap between chunks."],["C","Configure the knowledge base to use semantic chunking. Use a buffer size of 1 and a breakpoint percentile threshold of 85% to determine chunk boundaries based on content meaning."],["D","Configure the knowledge base not to use chunking. Manually split each document into separate files before ingestion. Apply post-processing reranking during retrieval."]]},"ex":{"c":"계층적 청킹은 작은 하위 청크로 정밀하게 검색한 뒤 더 큰 상위 청크를 모델에 제공해, 관련 단락 전체의 의미 맥락을 보존합니다. 방법론·결과·고찰처럼 여러 섹션에 걸친 질의에 적합하고 대규모 코퍼스에서도 잘 동작합니다.","w":{"A":"300토큰 고정 청크는 단락 간 맥락을 보존하지 못합니다.","C":"시맨틱 청킹은 경계를 의미 단위로 나누지만 여러 단락을 아우르는 상위 맥락은 제공하지 않고, 2,500만 건에서는 수집 비용도 큽니다.","D":"2,500만 건을 수동으로 분할하는 것은 비현실적입니다."}}},{"n":49,"a":["B"],"orig":"","ko":{"q":"한 금융 서비스 회사가 Amazon Bedrock으로 금융 문서를 처리하는 AI 애플리케이션을 사용합니다. 업무 시간에는 시간당 약 10,000건의 요청을 처리하며 일관된 처리량이 필요합니다. 회사는 CreateProvisionedModelThroughput API로 프로비저닝된 처리량을 구매했습니다. 그런데 Amazon CloudWatch 지표를 보면 프로비저닝된 용량은 사용되지 않고 온디맨드 요청이 스로틀링되고 있습니다. 회사는 애플리케이션에서 다음 코드를 발견했습니다.\nresponse = bedrock_runtime.invoke_model(modelId=\"anthropic.claude-v2\", body=json.dumps(payload))\n회사는 애플리케이션이 프로비저닝된 처리량을 사용하고 스로틀링 문제를 해결하도록 해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","프로비저닝된 처리량 구성의 모델 유닛(MU) 수를 늘립니다."],["B","모델 ID 파라미터를 CreateProvisionedModelThroughput API가 반환한 프로비저닝된 모델의 ARN으로 바꿉니다."],["C","피크 시간의 스로틀링 예외를 처리하도록 지수 백오프 재시도 로직을 추가합니다."],["D","애플리케이션이 InvokeModel API 대신 InvokeModelWithResponseStream API를 사용하도록 수정합니다."]]},"en":{"q":"A financial services company uses an AI application to process financial documents by using Amazon Bedrock. During business hours, the application handles approximately 10,000 requests each hour, which requires consistent throughput. The company uses the CreateProvisionedModelThroughput API to purchase provisioned throughput. Amazon CloudWatch metrics show that the provisioned capacity is unused while on-demand requests are being throttled. The company finds the following code in the application: response = bedrock_runtime.invoke_model( modelId= \" anthropic.claude-v2 \" , body=json.dumps(payload) ) The company needs the application to use the provisioned throughput and to resolve the throttling issues.\nWhich solution will meet these requirements?","o":[["A","Increase the number of model units (MUs) in the provisioned throughput configuration."],["B","Replace the model ID parameter with the ARN of the provisioned model that the CreateProvisionedModelThroughput API returns."],["C","Add exponential backoff retry logic to handle throttling exceptions during peak hours."],["D","Modify the application to use the invokeModelWithResponseStream API instead of the invokeModel API."]]},"ex":{"c":"8번과 같은 문제입니다. 프로비저닝된 처리량은 modelId에 프로비저닝된 모델 ARN을 지정해야 사용됩니다. 기본 모델 ID로 호출하면 온디맨드 할당량으로 처리되어 스로틀링됩니다.","w":{"A":"애플리케이션이 프로비저닝 용량을 호출하지 않으므로 MU를 늘려도 소용이 없습니다.","C":"재시도는 근본 원인을 해결하지 않습니다.","D":"스트리밍 API도 같은 온디맨드 모델 ID를 사용합니다."}}},{"n":50,"a":["A"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock으로 내부 문서를 바탕으로 직원 질문에 답하는 GenAI 어시스턴트를 구축하고 있습니다. 문서는 Amazon S3, Atlassian Confluence, 내부 위키 시스템에 저장되어 있습니다. GenAI 어시스턴트는 관련 콘텐츠를 검색해 근거 있는 응답을 제공해야 합니다. 솔루션은 다음 요구 사항을 충족해야 합니다.\n* 여러 문서 소스를 단일 검색 계층으로 통합합니다.\n* 키워드 전용 쿼리가 아닌 의미 검색을 지원합니다.\n* 사용자 지정 수집 및 동기화 로직을 최소화합니다.\n* 검색된 콘텐츠를 GenAI 어시스턴트의 FM 보강에 바로 사용할 수 있어야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock Knowledge Bases와 관리형 데이터 커넥터로 소스 문서의 콘텐츠를 수집합니다. 의미 검색을 활성화해 FM을 보강합니다."],["B","키워드 매핑을 사용해 소스 문서를 Amazon OpenSearch Service에 인덱싱합니다. FM을 호출하고 검색 결과를 수동으로 선택합니다."],["C","소스 문서를 Amazon S3에 저장합니다. AWS Lambda 함수로 임베딩을 생성하고, GenAI 어시스턴트 애플리케이션 계층에 사용자 지정 검색 로직을 구현합니다."],["D","소스 문서를 Amazon DynamoDB에 저장합니다. DynamoDB 테이블을 직접 조회해 FM에 컨텍스트 입력을 제공합니다."]]},"en":{"q":"A company is using Amazon Bedrock to build a GenAI assistant that answers employee questions based on internal documentation. The company stores documents in Amazon S3, Atlassian Confluence, and an internal wiki system. The GenAI assistant must retrieve relevant content and provide grounded responses. The solution must meet the following requirements:\n* Integrate multiple document sources into a single retrieval layer.\n* Support semantic search rather than keyword-only queries.\n* Minimize custom ingestion and synchronization logic.\n* Ensure that retrieved content can be directly used to augment the GenAI assistant ' s foundation model (FM).\nWhich solution will meet these requirements?","o":[["A","Use Amazon Bedrock Knowledge Bases and managed data connectors to ingest content from the source documents. Enable semantic retrieval to augment the FM."],["B","Index documents from the source documents into Amazon OpenSearch Service by using keyword mappings. Invoke the FM and manually select search results."],["C","Store the source documents in Amazon S3. Use AWS Lambda functions to generate embeddings. Implement custom retrieval logic in the GenAI assistant application layer."],["D","Store the source documents in Amazon DynamoDB. Query the DynamoDB table directly to provide contextual input to the FM."]]},"ex":{"c":"Bedrock Knowledge Bases는 S3, Confluence, 웹 크롤러 등 관리형 데이터 커넥터로 여러 소스를 하나의 검색 계층에 통합하고, 자동 동기화·임베딩·시맨틱 검색을 제공합니다. 검색 결과를 FM 프롬프트 보강에 바로 쓸 수 있습니다.","w":{"B":"키워드 매핑은 시맨틱 검색이 아니고 결과를 수동으로 선택해야 합니다.","C":"임베딩과 검색 로직을 직접 구현해야 해 사용자 지정 로직 최소화 요구에 어긋납니다.","D":"DynamoDB는 시맨틱 검색을 지원하지 않습니다."}}},{"n":51,"a":["B"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock으로 고객 문의에 실시간으로 응답하는 GenAI 애플리케이션을 운영합니다. 피크 트래픽 시 FM API 호출이 간헐적으로 실패하는 것이 확인되었습니다. 회사는 일시적 오류를 처리하고 FM 성능에 대한 상세한 관측성을 제공하는 솔루션이 필요합니다. 솔루션은 스로틀링 이벤트 중 연쇄 장애를 방지하고, 지연 요인을 식별할 수 있도록 서비스 경계를 넘는 분산 추적을 제공해야 합니다. 또한 성능 문제를 특정 FM 특성과 연관 지을 수 있어야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","재시도 간 1초 고정 지연을 사용하는 사용자 지정 재시도 메커니즘을 구현합니다. Amazon CloudWatch 경보로 애플리케이션 오류율과 지연 시간 지표를 모니터링합니다."],["B","AWS SDK를 표준 재시도 모드와 지터가 포함된 지수 백오프로 구성합니다. 어노테이션이 있는 AWS X-Ray 추적으로 서비스 구성 요소를 식별·필터링합니다."],["C","모든 FM 응답을 클라이언트 측에 캐싱합니다. 애플리케이션 코드에 사용자 지정 로그 문을 추가해 API 호출 시간을 기록합니다."],["D","AWS SDK를 적응형(adaptive) 재시도 모드로 구성합니다. AWS CloudTrail 분산 추적으로 스로틀링 이벤트를 모니터링합니다."]]},"en":{"q":"A company has a generative AI (GenAI) application that uses Amazon Bedrock to provide realtime responses to customer queries. The company has noticed intermittent failures with API calls to foundation models (FMs) during peak traffic periods. The company needs a solution to handle transient errors and provide detailed observability into FM performance. The solution must prevent cascading failures during throttling events and provide distributed tracing across service boundaries to identify latency contributors. The solution must also enable correlation of performance issues with specific FM characteristics.\nWhich solution will meet these requirements?","o":[["A","Implement a custom retry mechanism with a fixed delay of 1 second between retries. Configure Amazon CloudWatch alarms to monitor the application's error rates and latency metrics."],["B","Configure the AWS SDK with standard retry mode and exponential backoff with jitter. Use AWS XRay tracing with annotations to identify and filter service components."],["C","Implement client-side caching of all FM responses. Add custom logging statements in the application code to record API call durations."],["D","Configure the AWS SDK with adaptive retry mode. Use AWS CloudTrail distributed tracing to monitor throttling events."]]},"ex":{"c":"AWS SDK의 표준 재시도 모드는 지터가 포함된 지수 백오프로 일시적 오류를 처리하고 재시도 할당량으로 연쇄 장애를 막습니다. X-Ray 분산 추적은 서비스 경계를 넘어 지연 요인을 찾고, 주석(annotation)에 모델 ID 같은 FM 특성을 넣어 성능 문제와 연관 지을 수 있습니다.","w":{"A":"고정 지연 재시도는 스로틀링 시 연쇄 장애를 키우고 분산 추적이 없습니다.","C":"캐싱과 사용자 지정 로깅은 분산 추적이나 재시도 처리를 제공하지 않습니다.","D":"CloudTrail은 API 감사 서비스이며 분산 추적 기능이 없습니다."}}},{"n":52,"a":["A"],"orig":"","ko":{"q":"한 의료 회사가 의사에게 환자 치료 계획을 추천하는 GenAI 애플리케이션을 개발하고 있으며 Amazon Bedrock으로 구축하려고 합니다. 애플리케이션은 모델의 한계를 문서화하고, 승인되지 않은 임상 권고를 막고, 모든 AI 생성 출력의 상세 감사 추적을 유지해야 합니다. 출력은 의료 규정에 따라 저장해야 하며, 출력 변조를 방지해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","모델 카드로 FM 한계를 문서화합니다. 의료 규정 준수 정책이 있는 Amazon Bedrock Guardrails를 구현합니다. 모든 AI 생성 출력을 Amazon S3에 저장하고 S3 Object Lock을 활성화합니다."],["B","Amazon CloudWatch로 AI 생성 출력을 모니터링·기록합니다. 후처리 AWS Lambda 함수로 출력의 규정 위반을 스캔합니다. 출력을 Amazon S3에 저장하고 S3 Object Lock을 활성화합니다."],["C","모델 카드로 FM 한계를 문서화합니다. Amazon Bedrock Guardrails로 모든 AI 생성 출력을 의료 규정에 따라 필터링합니다. 출력을 Amazon S3에 저장하고 Amazon QuickSight 대시보드로 규정 준수 지표를 분석합니다."],["D","규정 준수 지침을 포함한 사용자 지정 프롬프트 템플릿으로 Amazon Bedrock을 구현합니다. 모든 AI 생성 출력을 Amazon DynamoDB에 저장하고, 규정 위반 가능성이 있는 출력이 감지되면 트리거되는 Amazon CloudWatch 경보를 만듭니다."]]},"en":{"q":"A healthcare company is developing a generative AI (GenAI) application that recommends patient treatment plans to physicians. The company wants to use Amazon Bedrock to build the application. The application must document model limitations, prevent unauthorized clinical recommendations, and maintain detailed audit trails of all AI-generated outputs. The company must store outputs in compliance with healthcare regulations. The solution must prevent output tampering.\nWhich solution will meet these requirements?","o":[["A","Use model cards to document FM limitations. Implement Amazon Bedrock Guardrails with healthcare compliance policies. Store all AI-generated outputs in Amazon S3. Enable S3 Object Lock."],["B","Use Amazon CloudWatch to monitor and log AI-generated outputs. Configure a postprocessing AWS Lambda function to scan outputs for compliance violations. Store the outputs in Amazon S3. Enable S3 Object Lock."],["C","Use model cards to document FM limitations. Implement Amazon Bedrock Guardrails to filter all AI- generated outputs against healthcare regulations. Store the outputs in Amazon S3. Use Amazon QuickSight dashboards to analyze compliance metrics."],["D","Implement Amazon Bedrock with custom prompt templates that include compliance instructions. Use Amazon DynamoDB to store all AI-generated outputs. Create Amazon CloudWatch alarms that trigger when potential noncompliant outputs are detected."]]},"ex":{"c":"모델 카드로 FM의 한계를 문서화하고, Bedrock Guardrails(거부 주제 등)로 승인되지 않은 임상 권고를 막습니다. 출력을 S3에 저장하고 Object Lock(WORM)을 켜면 변조를 방지하고 규제 요건에 맞는 보존이 가능합니다.","w":{"B":"모델 한계 문서화가 없고, 사후 스캔은 승인되지 않은 권고를 사전에 막지 못합니다.","C":"Object Lock이 없어 출력 변조를 막지 못합니다.","D":"프롬프트 지침은 강제력이 없고 DynamoDB는 변조 방지 저장소가 아닙니다."}}},{"n":53,"a":["B"],"orig":"","ko":{"q":"한 미디어 회사가 Amazon Bedrock으로 AI 생성 콘텐츠에 대한 견고한 거버넌스 프로세스를 구현해야 합니다. 회사는 수백 개의 프롬프트 템플릿을 관리해야 하며, 여러 팀이 여러 AWS 리전에서 이 템플릿으로 콘텐츠를 생성합니다. 솔루션은 검토 대기 알림을 포함한 승인 워크플로와 버전 관리를 제공해야 합니다. 또한 프롬프트 활동을 기록하는 상세 감사 추적과, 품질 기준을 적용하기 위한 일관된 프롬프트 파라미터화를 제공해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock Studio 프롬프트 템플릿을 구성합니다. Amazon CloudWatch 대시보드로 프롬프트 사용 지표를 표시하고, 승인 상태는 Amazon DynamoDB에 저장하며, AWS Lambda 함수로 승인을 강제합니다."],["B","Amazon Bedrock Prompt Management로 버전 관리를 구현합니다. AWS CloudTrail로 감사 로깅을 구성하고, AWS IAM 정책으로 승인 권한을 제어합니다. 변수를 지정해 파라미터화된 프롬프트 템플릿을 만듭니다."],["C","AWS Step Functions로 승인 워크플로를 만듭니다. 프롬프트는 Amazon S3에 저장하고, 태그로 버전 관리를 구현하며, Amazon EventBridge로 알림을 보냅니다."],["D","Amazon S3에 저장된 프롬프트 템플릿과 함께 Amazon SageMaker Canvas를 배포합니다. AWS CloudFormation으로 버전 관리를 하고, AWS Config로 승인 정책을 강제합니다."]]},"en":{"q":"A media company must use Amazon Bedrock to implement a robust governance process for AI-generated content. The company needs to manage hundreds of prompt templates. Multiple teams use the templates across multiple AWS Regions to generate content. The solution must provide version control with approval workflows that include notifications for pending reviews. The solution must also provide detailed audit trails that document prompt activities and consistent prompt parameterization to enforce quality standards.\nWhich solution will meet these requirements?","o":[["A","Configure Amazon Bedrock Studio prompt templates. Use Amazon CloudWatch dashboards to display prompt usage metrics. Store approval status in Amazon DynamoDB. Use AWS Lambda functions to enforce approvals."],["B","Use Amazon Bedrock Prompt Management to implement version control. Configure AWS CloudTrail for audit logging. Use AWS Identity and Access Management policies to control approval permissions. Create parameterized prompt templates by specifying variables."],["C","Use AWS Step Functions to create an approval workflow. Store prompts in Amazon S3. Use tags to implement version control. Use Amazon EventBridge to send notifications."],["D","Deploy Amazon SageMaker Canvas with prompt templates stored in Amazon S3. Use AWS CloudFormation for version control. Use AWS Config to enforce approval policies."]]},"ex":{"c":"Bedrock Prompt Management는 프롬프트 버전 관리와 변수 기반 파라미터화 템플릿을 제공합니다. CloudTrail로 프롬프트 활동 감사 기록을 남기고, IAM 정책으로 버전 생성·승인 권한을 분리해 승인 통제를 구현합니다. 관리형 기능을 활용해 가장 적합합니다.","w":{"A":"Bedrock Studio와 DynamoDB·Lambda로 승인을 직접 구현해야 하고 버전 관리가 부족합니다.","C":"S3 태그로 버전 관리를 흉내 내면 일관된 파라미터화와 관리가 어렵습니다.","D":"SageMaker Canvas와 CloudFormation은 프롬프트 거버넌스 도구가 아닙니다."}}},{"n":54,"a":["B"],"orig":"","ko":{"q":"한 회사가 교차 리전 추론과 프로비저닝된 처리량을 지원하는 FM을 사용하는 AI 애플리케이션을 Amazon Bedrock으로 개발하고 있습니다. 애플리케이션은 유럽과 북미 사용자에게 일관되게 짧은 지연 시간으로 서비스해야 하며, 유럽 사용자 데이터가 유럽 AWS 리전 내에 머물러야 한다는 데이터 상주 규정을 준수해야 합니다. 테스트 중 리전 트래픽이 급증해 서비스 할당량에 도달하면 서비스 성능이 저하됩니다. 회사는 애플리케이션 복원력을 유지하고 운영 복잡성을 최소화하는 솔루션이 필요합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","북미와 유럽 리전에 별도의 Amazon Bedrock 인스턴스를 배포합니다. 사용자 위치에 따라 트래픽을 보내는 사용자 지정 라우팅 계층을 사용합니다. Amazon CloudWatch 경보로 리전별 서비스 사용량을 모니터링하고, 사용량이 지정 임계값에 근접하면 Amazon SNS로 이메일 알림을 보냅니다."],["B","애플리케이션이 InvokeModel API를 호출할 때 프로필 ID에 지역(geographic) 코드를 지정해 Amazon Bedrock 교차 리전 추론 프로필을 사용합니다. 유럽과 북미 사용자를 적절한 리전 엔드포인트로 보내는 별도의 Amazon API Gateway HTTP API를 구성합니다."],["C","스로틀링을 처리하는 재시도 로직을 구현한 다중 리전 Amazon API Gateway HTTP API와 AWS Lambda 함수를 배포합니다. 기본 리전에서 서비스 할당량에 도달하면 Lambda 함수가 가장 가까운 보조 리전의 FM을 호출하도록 구성하고, 지능형 라우팅으로 데이터 상주 요구 사항 준수를 보장합니다."],["D","여러 리전에 Amazon Bedrock 프로비저닝된 처리량을 구성합니다. 스로틀링이 발생하면 리전을 전환하는 장애 조치 로직을 애플리케이션 코드에 구현하고, AWS Global Accelerator로 사용자 위치에 따라 적절한 엔드포인트로 트래픽을 라우팅합니다."]]},"en":{"q":"A company is using Amazon Bedrock to develop an AI-powered application that uses a foundation model that supports cross-Region inference and provisioned throughput. The application must serve users in Europe and North America with consistently low latency. The application must comply with data residency regulations that require European user data to remain within Europebased AWS Regions. During testing, the application experiences service degradation when Regional traffic spikes reach service quotas. The company needs a solution that maintains application resilience and minimizes operational complexity.\nWhich solution will meet these requirements?","o":[["A","Deploy separate Amazon Bedrock instances in North American and European Regions. Use a custom routing layer that directs traffic based on user location. Configure Amazon CloudWatch alarms to monitor Regional service usage. Use Amazon SNS to send email alerts to the company when usage approaches specified thresholds."],["B","Use Amazon Bedrock cross-Region inference profiles by specifying geographical codes in profile IDs when the application calls the InvokeModel API. Configure separate Amazon API Gateway HTTP APIs to direct European and North American users to the appropriate Regional endpoints."],["C","Deploy a multi-Region Amazon API Gateway HTTP API and AWS Lambda functions that implement retry logic to handle throttling. Configure the Lambda functions to call the foundation model in the nearest secondary Region when the application reaches service quotas in the primary Region. Use intelligent routing to ensure compliance with data residency requirements."],["D","Configure provisioned throughput for Amazon Bedrock in multiple Regions. Implement failover logic in the application code to switch between Regions when throttling occurs. Use AWS Global Accelerator to route traffic to the appropriate endpoints based on user location."]]},"ex":{"c":"지리적 접두사(eu., us.)가 붙은 교차 리전 추론 프로필은 같은 지역 안의 여러 리전으로 트래픽을 자동 분산해 할당량 초과 시 복원력을 높이면서 데이터를 해당 지역 안에 유지합니다. 유럽·북미 사용자를 지역별 API로 나누면 데이터 상주와 낮은 지연 시간을 충족하고 운영도 간단합니다.","w":{"A":"사용자 지정 라우팅과 알림만으로는 할당량 초과 시 복원력이 생기지 않습니다.","C":"재시도·장애 조치 로직을 직접 구현해야 해 복잡하고 데이터 상주를 위반할 위험이 있습니다.","D":"여러 리전의 프로비저닝 처리량은 비용이 크고 장애 조치 로직을 직접 관리해야 합니다."}}},{"n":55,"a":["B"],"orig":"","ko":{"q":"한 엘리베이터 서비스 회사가 Amazon Bedrock으로 AI 어시스턴트 애플리케이션을 개발했습니다. 이 애플리케이션은 엘리베이터 기술자를 지원하기 위해 유지보수 권장 사항을 생성하며, 회사는 Amazon Kinesis Data Streams로 엘리베이터 센서 데이터를 수집합니다. 새 규제에 따라 사람 기술자가 모든 AI 생성 권장 사항을 검토해야 합니다. 회사는 AI 권장 사항을 검토·승인하는 사람 감독 워크플로를 수립하고, 감사를 위해 모든 기술자 검토 결정을 저장해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AWS Lambda 함수와 Amazon SQS 대기열로 AI 권장 사항을 사람이 검토하는 사용자 지정 승인 워크플로를 만듭니다. 감사를 위해 모든 검토 결정을 Amazon DynamoDB에 저장합니다."],["B","waitForTaskToken API로 실행을 일시 중지하는 사람 승인 단계가 있는 AWS Step Functions 워크플로를 만듭니다. 기술자가 검토를 마치면 AWS Lambda 함수가 승인 결정과 함께 SendTaskSuccess API를 호출합니다. 모든 검토 결정을 Amazon DynamoDB에 저장합니다."],["C","사람 승인 단계가 있는 AWS Glue 워크플로를 만듭니다. 기술자 검토 후 SendTaskSuccess API를 호출하는 AWS Lambda 함수와 애플리케이션을 통합합니다. 모든 기술자 검토 결정을 Amazon DynamoDB에 저장합니다."],["D","사용자 지정 이벤트 패턴이 있는 Amazon EventBridge 규칙으로 AI 권장 사항을 기술자에게 라우팅해 검토하게 합니다. AWS Glue 작업으로 기술자 승인 대기열을 처리하고, Amazon ElastiCache에 모든 기술자 검토 결정을 캐싱합니다."]]},"en":{"q":"An elevator service company has developed an AI assistant application by using Amazon Bedrock. The application generates elevator maintenance recommendations to support the company's elevator technicians. The company uses Amazon Kinesis Data Streams to collect the elevator sensor data. New regulatory rules require that a human technician must review all AI-generated recommendations. The company needs to establish human oversight workflows to review and approve AI recommendations. The company must store all human technician review decisions for audit purposes.\nWhich solution will meet these requirements?","o":[["A","Create a custom approval workflow by using AWS Lambda functions and Amazon SQS queues for human review of AI recommendations. Store all review decisions in Amazon DynamoDB for audit purposes."],["B","Create an AWS Step Functions workflow that has a human approval step that uses the waitForTaskToken API to pause execution. After a human technician completes a review, use an AWS Lambda function to call the SendTaskSuccess API with the approval decision. Store all review decisions in Amazon DynamoDB."],["C","Create an AWS Glue workflow that has a human approval step. After the human technician review, integrate the application with an AWS Lambda function that calls the SendTaskSuccess API. Store all human technician review decisions in Amazon DynamoDB."],["D","Configure Amazon EventBridge rules with custom event patterns to route AI recommendations to human technicians for review. Create AWS Glue jobs to process human technician approval queues.Use Amazon ElastiCache to cache all human technician review decisions."]]},"ex":{"c":"Step Functions의 콜백 패턴(.waitForTaskToken)은 사람의 승인이 끝날 때까지 실행을 멈추고, 기술자가 검토하면 Lambda가 SendTaskSuccess로 결정을 전달해 워크플로를 재개합니다. 결정을 DynamoDB에 저장해 감사에 활용합니다.","w":{"A":"Lambda와 SQS로 승인 워크플로를 직접 만들면 상태 관리가 복잡합니다.","C":"Glue 워크플로에는 사람 승인 단계나 SendTaskSuccess 연동이 없습니다.","D":"ElastiCache는 휘발성 캐시라 감사 기록 저장에 부적합합니다."}}},{"n":56,"a":["B"],"orig":"","ko":{"q":"한 회사가 전 세계 사용자가 새 레스토랑을 찾도록 돕는 서비스를 제공하며 월간 활성 사용자는 5,000만 명입니다. 회사는 2,000만 개의 레스토랑과 2억 건의 리뷰가 있는 데이터베이스 전반에 의미 검색 솔루션을 구현하려고 합니다. 데이터는 현재 PostgreSQL에 저장되어 있습니다. 솔루션은 복잡한 자연어 쿼리를 지원하고 쿼리의 95% 이상에 대해 500ms 이내에 결과를 반환해야 합니다. 매시간 업데이트되는 레스토랑 정보의 최신성을 유지해야 하고, 피크 시간에도 비용 효율적으로 확장되어야 합니다.\n개발 노력이 가장 적은 솔루션은 무엇입니까?","o":[["A","레스토랑 데이터를 Amazon OpenSearch Service로 마이그레이션합니다. 사용자 지정 분석기와 관련성 튜닝을 사용하는 키워드 기반 검색 규칙을 구현해 요리 유형, 특징, 위치 같은 속성으로 레스토랑을 찾습니다. 사용자 쿼리를 구조화된 검색 파라미터로 변환하는 Amazon API Gateway HTTP API 엔드포인트를 만듭니다."],["B","레스토랑 데이터를 Amazon OpenSearch Service로 마이그레이션합니다. Amazon Bedrock의 FM으로 레스토랑 설명, 리뷰, 메뉴 항목의 벡터 임베딩을 생성합니다. 사용자가 자연어 쿼리를 제출하면 같은 FM으로 쿼리를 임베딩으로 변환하고, k-NN(k-최근접 이웃) 검색으로 의미가 유사한 결과를 찾습니다."],["C","레스토랑 데이터를 PostgreSQL에 그대로 두고 pgvector 확장을 구현합니다. Amazon Bedrock의 FM으로 레스토랑 데이터의 벡터 임베딩을 생성해 PostgreSQL에 직접 저장합니다. 같은 FM으로 자연어 쿼리를 벡터로 변환하는 AWS Lambda 함수를 만들고, 이 함수가 데이터베이스 내에서 유사도 검색을 수행하도록 구성합니다."],["D","사용자 지정 수집 파이프라인으로 레스토랑 데이터를 Amazon Bedrock 지식 기반으로 마이그레이션합니다. 지식 기반이 레스토랑 정보에서 임베딩을 자동 생성하도록 구성하고, 기본 벡터 검색 기능이 있는 Amazon Bedrock Retrieve API로 자연어 입력을 사용해 지식 기반을 직접 조회합니다."]]},"en":{"q":"A company provides a service that helps users from around the world discover new restaurants. The service has 50 million monthly active users. The company wants to implement a semantic search solution across a database that contains 20 million restaurants and 200 million reviews. The company currently stores the data in PostgreSQL. The solution must support complex natural language queries and return results for at least 95% of queries within 500 ms. The solution must maintain data freshness for restaurant details that update hourly. The solution must also scale cost-effectively during peak usage periods.\nWhich solution will meet these requirements with the LEAST development effort?","o":[["A","Migrate the restaurant data to Amazon OpenSearch Service. Implement keyword-based search rules that use custom analyzers and relevance tuning to find restaurants based on attributes such as cuisine type, features, and location. Create Amazon API Gateway HTTP API endpoints to transform user queries into structured search parameters."],["B","Migrate the restaurant data to Amazon OpenSearch Service. Use a foundation model (FM) in Amazon Bedrock to generate vector embeddings from restaurant descriptions, reviews, and menu items. When users submit natural language queries, convert the queries to embeddings by using the same FM. Perform k-nearest neighbors (k-NN) searches to find semantically similar results."],["C","Keep the restaurant data in PostgreSQL and implement a pgvector extension. Use a foundation model (FM) in Amazon Bedrock to generate vector embeddings from restaurant data. Store the vector embeddings directly in PostgreSQL. Create an AWS Lambda function to convert natural language queries to vector representations by using the same FM. Configure the Lambda function to perform similarity searches within the database."],["D","Migrate restaurant data to an Amazon Bedrock knowledge base by using a custom ingestion pipeline.Configure the knowledge base to automatically generate embeddings from restaurant information. Use the Amazon Bedrock Retrieve API with built-in vector search capabilities to query the knowledge base directly by using natural language input."]]},"ex":{"c":"OpenSearch Service의 k-NN 벡터 검색은 수억 건 규모에서도 낮은 지연 시간을 제공하고 확장성이 좋습니다. Bedrock 임베딩 모델로 레스토랑·리뷰를 벡터화하고 질의도 같은 모델로 임베딩해 시맨틱 검색을 수행하며, 시간별 업데이트도 인덱스에 반영할 수 있습니다.","w":{"A":"키워드 기반 검색은 복잡한 자연어 질의를 처리하지 못합니다.","C":"2억 건 리뷰와 5천만 MAU 규모에서 pgvector는 500ms 성능과 비용 효율적 확장을 맞추기 어렵습니다.","D":"사용자 지정 수집 파이프라인이 필요하고, 시간별 업데이트와 대규모 저지연 검색에는 지식 기반이 덜 적합합니다."}}},{"n":57,"a":["D"],"orig":"","ko":{"q":"한 의료 회사가 Amazon Bedrock으로 의료진의 임상 의사 결정을 돕는 RAG 애플리케이션을 구축하고 있습니다. 애플리케이션은 환자 정보 검색에서 높은 정확도를 달성하고, 생성된 콘텐츠에서 환각을 식별하며, 사람 검토 비용을 줄여야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Comprehend로 RAG 응답을 분석·분류하고 의료 엔터티와 관계를 추출합니다. AWS Step Functions로 자동 평가를 오케스트레이션합니다. Amazon CloudWatch 지표로 엔터티 인식 신뢰도 점수를 추적하고, 정확도가 지정 임계값 아래로 떨어지면 CloudWatch가 알림을 보내도록 구성합니다."],["B","의료 콘텐츠에 맞게 미세 조정된 전문 모델로 모든 응답을 평가하는 자동 LLM 기반 평가를 구현합니다. AWS Lambda 함수를 배포해 평가를 병렬화하고, 관련성과 사실 정확도를 추적하는 Amazon CloudWatch 지표에 결과를 게시합니다."],["C","Amazon CloudWatch Synthetics로 정답이 알려진 테스트 쿼리를 정기적으로 생성하고 모델 성공률을 추적합니다. 합성 테스트 결과를 기대 결과와 비교하는 대시보드를 설정합니다."],["D","자동화된 LLM-as-a-judge 평가로 응답을 1차 선별하고 예외 사례는 사람이 집중 검토하는 하이브리드 평가 시스템을 배포합니다. Amazon Bedrock 기본 제공 평가로 검색 정밀도와 환각 비율을 추적합니다."]]},"en":{"q":"A healthcare company is using Amazon Bedrock to build a Retrieval Augmented Generation (RAG) application that helps practitioners make clinical decisions. The application must achieve high accuracy for patient information retrievals, identify hallucinations in generated content, and reduce human review costs.\nWhich solution will meet these requirements?","o":[["A","Use Amazon Comprehend to analyze and classify RAG responses and to extract medical entities and relationships. Use AWS Step Functions to orchestrate automated evaluations. Configure Amazon CloudWatch metrics to track entity recognition confidence scores. Configure CloudWatch to send an alert when accuracy falls below specified thresholds."],["B","Implement automated large language model (LLM)-based evaluations that use a specialized model that is fine-tuned for medical content to assess all responses. Deploy AWS Lambda functions to parallelize evaluations. Publish results to Amazon CloudWatch metrics that track relevance and factual accuracy."],["C","Configure Amazon CloudWatch Synthetics to generate test queries that have known answers on a regular schedule, and track model success rates. Set up dashboards that compare synthetic test results against expected outcomes."],["D","Deploy a hybrid evaluation system that uses an automated LLM-as-a-judge evaluation to initially screen responses and targeted human reviews for edge cases. Use a built-in Amazon Bedrock evaluation to track retrieval precision and hallucination rates."]]},"ex":{"c":"LLM-as-a-judge로 응답을 자동 선별하고 경계 사례만 사람이 검토하면 검토 비용을 줄이면서 품질을 지킵니다. Bedrock 기본 제공 평가(RAG 평가)는 검색 정밀도와 환각(정확성·충실성) 지표를 추적합니다.","w":{"A":"Comprehend 엔터티 신뢰도는 환각이나 검색 정확도를 측정하지 못합니다.","B":"의료 특화 모델을 미세 조정해 운영하는 부담이 크고 사람 검토가 없습니다.","C":"고정된 합성 질의로는 실제 응답의 환각을 탐지할 수 없습니다."}}},{"n":58,"a":["A","B","D"],"orig":"","ko":{"q":"한 은행이 스캔한 재무 문서로 대출 신청을 평가하는, Amazon Bedrock 기반 GenAI 애플리케이션을 구축하고 있습니다. 애플리케이션은 문서에서 정형 데이터를 추출해야 하고, 추론 전에 PII를 삭제해야 하며, FM으로 승인 결과를 생성해야 합니다. 신뢰도가 낮은 문서 추출 결과는 대출 신청자와 같은 AWS 리전 내의 사람 검토자에게 라우팅해야 합니다. 회사는 엄격한 리전 데이터 상주 및 감사 가능성 요구 사항을 준수해야 하며, 애플리케이션은 하루 25,000건의 신청을 처리하도록 확장되고 99.9% 가용성을 제공해야 합니다.\n이 요구 사항을 충족하는 솔루션 조합은 무엇입니까? (3개 선택)","o":[["A","같은 리전에 Amazon Textract와 Amazon Augmented AI(A2I)를 배포해 스캔 문서에서 관련 데이터를 추출하고, 신뢰도가 낮은 페이지는 사람 검토자에게 라우팅합니다."],["B","AWS Lambda 함수로 추론 전에 제출된 문서에서 PII를 감지·삭제합니다. Amazon Bedrock 가드레일로 모델 출력의 부적절하거나 승인되지 않은 콘텐츠를 방지합니다. 리전별 IAM 역할로 데이터 상주 요구 사항을 적용하고 추출된 데이터에 대한 액세스를 제어합니다."],["C","추론 전에 Amazon Kendra와 Amazon OpenSearch Service로 업로드된 문서에서 필드 수준 값을 의미적으로 추출합니다."],["D","업로드된 문서를 Amazon S3에 저장하고 객체 메타데이터를 적용합니다. 원본 문서를 각 신청자와 같은 리전에 저장하도록 IAM 정책을 구성하고, 향후 감사를 위해 객체 태그 지정을 활성화합니다."],["E","AWS Glue Data Quality로 정형 문서 데이터를 검증합니다. AWS Step Functions로, 검증된 데이터를 최적화된 프롬프트로 변환하는 프롬프트 엔지니어링 단계가 포함된 검토 워크플로를 오케스트레이션한 뒤 Amazon Bedrock을 호출해 대출 신청을 평가합니다."],["F","Amazon SageMaker Clarify로 Amazon Bedrock의 모델 점수 결정을 바탕으로 공정성 및 편향 보고서를 생성합니다."]]},"en":{"q":"A bank is building a generative AI (GenAI) application that uses Amazon Bedrock to assess loan applications by using scanned financial documents. The application must extract structured data from the documents. The application must redact personally identifiable information (PII) before inference. The application must use foundation models (FMs) to generate approvals. The application must route low-confidence document extraction results to human reviewers who are within the same AWS Region as the loan applicant. The company must ensure that the application complies with strict Regional data residency and auditability requirements. The application must be able to scale to handle 25,000 applications each day and provide 99.9% availability.\nWhich combination of solutions will meet these requirements? (Select THREE.)","o":[["A","Deploy Amazon Textract and Amazon Augmented AI within the same Region to extract relevant data from the scanned documents. Route low-confidence pages to human reviewers."],["B","Use AWS Lambda functions to detect and redact PII from submitted documents before inference. Apply Amazon Bedrock guardrails to prevent inappropriate or unauthorized content in model outputs. Configure Region-specific IAM roles to enforce data residency requirements and to control access to the extracted data."],["C","Use Amazon Kendra and Amazon OpenSearch Service to extract field-level values semantically from the uploaded documents before inference."],["D","Store uploaded documents in Amazon S3 and apply object metadata. Configure IAM policies to store original documents within the same Region as each applicant. Enable object tagging for future audits."],["E","Use AWS Glue Data Quality to validate the structured document data. Use AWS Step Functions to orchestrate a review workflow that includes a prompt engineering step that transforms validated data into optimized prompts before invoking Amazon Bedrock to assess loan applications."],["F","Use Amazon SageMaker Clarify to generate fairness and bias reports based on model scoring decisions that Amazon Bedrock makes."]]},"ex":{"c":"같은 리전의 Textract로 구조화된 데이터를 추출하고 Amazon A2I로 신뢰도가 낮은 결과를 같은 리전의 검토자에게 보냅니다(A). Lambda로 추론 전에 PII를 제거하고, Guardrails로 출력을 통제하며, 리전별 IAM 역할로 데이터 상주와 접근을 관리합니다(B). 원본 문서는 신청자와 같은 리전의 S3에 저장하고 메타데이터와 태그로 감사에 대비합니다(D).","w":{"C":"Kendra와 OpenSearch는 스캔 문서에서 필드 값을 추출하는 서비스가 아닙니다.","E":"Glue Data Quality와 프롬프트 변환 단계는 PII 제거, 사람 검토, 데이터 상주 요구를 다루지 않습니다.","F":"Clarify 편향 보고서는 요구 사항에 없고 Bedrock 결정에 직접 적용되지도 않습니다."}}},{"n":59,"a":["C"],"orig":"","ko":{"q":"한 의료 회사가 Amazon Bedrock으로 임상 문서 요약을 생성하는 애플리케이션을 배포했습니다. 응답 품질이 일정하지 않고 가끔 사실과 다른 환각이 발생하며, 월 비용이 예상보다 40% 높습니다. GenAI 개발자는 환각을 감지하고, 비정상적인 토큰 소비를 식별하며, 비용 이상에 대한 조기 경고를 제공하는 거의 실시간 모니터링 솔루션을 구현해야 합니다. 솔루션은 사용자 지정 개발과 유지보수 부담이 최소여야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon CloudWatch 경보로 InputTokenCount와 OutputTokenCount 지표를 모니터링해 이상을 감지합니다. 모델 호출 로그를 Amazon S3 버킷에 저장하고, AWS Glue와 Amazon Athena로 잠재적 환각을 식별합니다."],["B","LLM 기반 판정을 사용하는 Amazon Bedrock 평가 작업으로 환각을 감지합니다. Amazon CloudWatch로 토큰 사용량을 추적하고, CloudWatch 지표를 처리해 사용 패턴 알림을 보내는 AWS Lambda 함수를 만듭니다."],["C","Amazon Bedrock이 모델 호출 로그를 Amazon S3 버킷에 저장하도록 구성하고 텍스트 출력 로깅을 활성화합니다. Amazon Bedrock Guardrails의 컨텍스트 근거성 검사를 활성화해 환각을 감지합니다. 토큰 사용 지표에 대해 Amazon CloudWatch 이상 탐지 경보를 만듭니다."],["D","AWS CloudTrail로 모든 Amazon Bedrock API 호출을 기록합니다. Amazon QuickSight에 사용자 지정 대시보드를 만들어 토큰 사용 패턴을 시각화하고, Amazon SageMaker Model Monitor로 생성된 요약의 품질 드리프트를 감지합니다."]]},"en":{"q":"A healthcare company uses Amazon Bedrock to deploy an application that generates summaries of clinical documents. The application experiences inconsistent response quality with occasional factual hallucinations. Monthly costs exceed the company's projections by 40%. A GenAI developer must implement a near real-time monitoring solution to detect hallucinations, identify abnormal token consumption, and provide early warnings of cost anomalies. The solution must require minimal custom development work and maintenance overhead.\nWhich solution will meet these requirements?","o":[["A","Configure Amazon CloudWatch alarms to monitor InputTokenCount and OutputTokenCount metrics to detect anomalies. Store model invocation logs in an Amazon S3 bucket. Use AWS Glue and Amazon Athena to identify potential hallucinations."],["B","Run Amazon Bedrock evaluation jobs that use LLM-based judgments to detect hallucinations. Configure Amazon CloudWatch to track token usage. Create an AWS Lambda function to process CloudWatch metrics. Configure the Lambda function to send usage pattern notifications."],["C","Configure Amazon Bedrock to store model invocation logs in an Amazon S3 bucket. Enable text output logging. Configure Amazon Bedrock Guardrails to enable contextual grounding checks to detect hallucinations. Create Amazon CloudWatch anomaly detection alarms for token usage metrics."],["D","Use AWS CloudTrail to log all Amazon Bedrock API calls. Create a custom dashboard in Amazon QuickSight to visualize token usage patterns. Use Amazon SageMaker Model Monitor to detect quality drift in generated summaries."]]},"ex":{"c":"모델 호출 로깅(텍스트 출력 포함)으로 기록을 남기고, Guardrails 컨텍스트 근거성 검사로 환각을 거의 실시간에 탐지하며, 토큰 지표에 CloudWatch 이상 탐지 경보를 걸어 비정상 소비와 비용 이상을 조기에 경고합니다. 모두 관리형 기능이라 사용자 지정 개발이 거의 없습니다.","w":{"A":"Athena 쿼리로는 환각을 탐지할 수 없고 실시간도 아닙니다.","B":"평가 작업은 배치라 거의 실시간 탐지가 아니고 Lambda 개발이 필요합니다.","D":"CloudTrail에는 토큰 사용량이 없고 Model Monitor는 Bedrock 출력을 모니터링하지 않습니다."}}},{"n":60,"a":["C"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock으로 회사 데이터의 패턴과 관계를 분석하는 GenAI 애플리케이션을 개발하고 있습니다. 애플리케이션은 유럽, 북미, 아시아의 AWS 리전에서 매일 수백만 건의 새 데이터 포인트를 처리한 뒤 Amazon S3에 저장합니다. 애플리케이션은 현지 데이터 보호 및 저장 규정을 준수해야 하며, 데이터 상주와 처리는 같은 대륙 내에서 이루어져야 합니다. 또한 애플리케이션의 의사 결정 과정에 대한 감사 추적을 유지하고 데이터 분류 기능을 제공해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","로컬 IAM 정책과 함께 각 리전에 애플리케이션을 배포합니다. Amazon Bedrock 교차 리전 추론으로 워크로드를 분산하고, Amazon CloudWatch로 AI 의사 결정 과정과 데이터 처리 활동을 기록합니다. 리전별 규정 준수 인증은 수동으로 추적합니다."],["B","AWS Organizations의 SCP로 위치별 권한을 관리합니다. AWS CloudTrail의 변경 불가능한 로그로 의사 결정 과정을 감사합니다. 사용자 지정 모델을 Amazon Bedrock으로 가져와 각 리전에 배포합니다."],["C","리전별 S3 버킷 정책과 함께 Amazon S3 Object Lock을 사용합니다. 데이터 포인트를 Amazon Bedrock으로 보내기 전에 지리적 출처에 따라 해당 리전 내에서 전처리합니다. Amazon Macie로 데이터를 분류하고, AWS CloudTrail의 변경 불가능한 로그로 의사 결정 과정을 감사합니다."],["D","리전마다 개별 규정 준수 프레임워크를 가진 별도의 AWS 계정을 만듭니다. 사용자 지정 모니터링이 있는 Amazon SageMaker AI로 모델 성능과 데이터 상주 요구 사항 준수를 추적하고, 규제 관할권별로 보고서를 수동 작성합니다."]]},"en":{"q":"A company is developing a generative AI (GenAI) application by using Amazon Bedrock. The application will analyze patterns and relationships in the company ' s data. The application will process millions of new data points daily across AWS Regions in Europe, North America, and Asia before storing the data in Amazon S3. The application must comply with local data protection and storage regulations. Data residency and processing must occur within the same continent. The application must also maintain audit trails of the application ' s decision-making processes and provide data classification capabilities.\nWhich solution will meet these requirements?","o":[["A","Deploy the application in each Region with local IAM policies. Use Amazon Bedrock cross-Region inference to distribute the workload. Use Amazon CloudWatch to log AI decision-making processes and data processing activities. Manually track compliance certifications across Regions."],["B","Use SCPs with AWS Organizations to manage location-specific permissions. Use AWS CloudTrail immutable logs to audit the decision-making processes. Import a custom model into Amazon Bedrock and deploy the model to each Region."],["C","Use Amazon S3 Object Lock with Region-specific S3 bucket policies. Pre-process the data points within the Region based on geographic origin before sending the data points to Amazon Bedrock. Use Amazon Macie to classify the data. Use AWS CloudTrail immutable logs to audit the decision-making processes."],["D","Create separate AWS accounts for each Region with individual compliance frameworks. Use Amazon SageMaker AI with custom monitoring to track model performance and compliance with data residency requirements. Create manual reports for each regulatory jurisdiction."]]},"ex":{"c":"데이터를 출처 지역(대륙) 안에서 전처리한 뒤 Bedrock으로 보내 처리 위치를 지키고, 리전별 버킷 정책과 Object Lock으로 저장 위치와 불변성을 보장합니다. Macie가 데이터 분류를 제공하고 CloudTrail 불변 로그로 의사 결정 과정을 감사합니다.","w":{"A":"교차 리전 추론으로 워크로드를 분산하면 대륙 간 이동 위험이 있고, 규정 준수를 수동으로 추적합니다.","B":"데이터 분류 기능이 없고, 사용자 지정 모델 가져오기는 불필요합니다.","D":"SageMaker 사용자 지정 모니터링과 수동 보고서는 오버헤드가 크고 데이터 분류가 없습니다."}}},{"n":61,"a":["D"],"orig":"","ko":{"q":"한 회사가 다국어 고객 서비스 어시스턴트를 지원하는 Amazon Bedrock 기반 FM을 업그레이드했습니다. 업그레이드 후 어시스턴트가 언어마다 일관되지 않게 동작해, 동일한 질문에 대해 일부 언어에서 다른 응답을 생성하기 시작했습니다. 회사는 향후 업데이트에서 비슷한 문제를 감지하고 해결할 솔루션이 필요합니다. 평가는 지원하는 모든 언어에 대해 45분 이내에 완료되어야 하고, 최소 15,000개의 테스트 대화를 병렬로 처리해야 합니다. 평가 프로세스는 완전히 자동화되어 CI/CD 파이프라인에 통합되어야 하며, 품질 임계값을 충족하지 못하면 배포를 차단해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","여러 언어로 번역 비중이 큰 워크로드를 동시에 어시스턴트에 보내는 분산 트래픽 시뮬레이션 프레임워크를 만듭니다. Amazon CloudWatch 지표로 지연 시간, 동시성, 처리량을 모니터링하고, 프로덕션 릴리스 전에 시뮬레이션을 실행해 인프라 병목을 찾습니다."],["B","Amazon Route 53 지연 시간 기반 라우팅과 AWS Global Accelerator를 사용해 여러 AWS 리전에 어시스턴트를 배포해 글로벌 성능을 개선합니다. 다국어 대화 로그를 Amazon S3에 저장하고, 배포 후 매주 감사를 수행해 일관성을 검토합니다."],["C","모든 수신 메시지를 일관된 형식으로 정규화한 뒤 어시스턴트로 보내는 전처리 파이프라인을 만듭니다. 규칙 기반 검사로 출력의 잠재적 환각을 표시하고, 언어 간 테스트를 단순화하기 위해 정규화된 텍스트에 평가를 집중합니다."],["D","의미가 동일한 표준화된 다국어 테스트 대화를 준비합니다. Amazon Bedrock 모델 평가 작업으로 테스트 대화를 병렬 실행하고, 유사도 및 환각 임계값을 적용합니다. 이 프로세스를 CI/CD 파이프라인에 통합해 실패한 릴리스를 차단합니다."]]},"en":{"q":"A company upgraded its Amazon Bedrock-powered foundation model (FM) that supports a multilingual customer service assistant. After the upgrade, the assistant exhibited inconsistent behavior across languages. The assistant began generating different responses in some languages when presented with identical questions. The company needs a solution to detect and address similar problems for future updates. The evaluation must be completed within 45 minutes for all supported languages. The evaluation must process at least 15,000 test conversations in parallel. The evaluation process must be fully automated and integrated into the CI/CD pipeline. The solution must block deployment if quality thresholds are not met.\nWhich solution will meet these requirements?","o":[["A","Create a distributed traffic simulation framework that sends translation-heavy workloads to the assistant in multiple languages simultaneously. Use Amazon CloudWatch metrics to monitor latency, concurrency, and throughput. Run simulations before production releases to identify infrastructure bottlenecks."],["B","Deploy the assistant in multiple AWS Regions with Amazon Route 53 latency-based routing and AWS Global Accelerator to improve global performance. Store multilingual conversation logs in Amazon S3. Perform weekly post-deployment audits to review consistency."],["C","Create a pre-processing pipeline that normalizes all incoming messages into a consistent format before sending the messages to the assistant. Apply rule-based checks to flag potential hallucinations in the outputs. Focus evaluation on normalized text to simplify testing across languages."],["D","Set up standardized multilingual test conversations with identical meaning. Run the test conversations in parallel by using Amazon Bedrock model evaluation jobs. Apply similarity and hallucination thresholds. Integrate the process into the CI/CD pipeline to block releases that fail."]]},"ex":{"c":"의미가 같은 표준 다국어 테스트 대화를 만들어 Bedrock 모델 평가 작업으로 병렬 실행하고, 유사도·환각 임계값을 적용합니다. CI/CD 파이프라인에 통합해 기준 미달 시 릴리스를 차단하면 완전 자동화된 품질 게이트가 됩니다.","w":{"A":"부하 테스트는 인프라 병목만 확인할 뿐 언어 간 응답 일관성을 평가하지 않습니다.","B":"주간 사후 감사는 배포 전 차단이 아닙니다.","C":"정규화된 텍스트만 평가하면 실제 언어별 차이를 놓칩니다."}}},{"n":62,"a":["B"],"orig":"","ko":{"q":"한 회사가 고객 서비스 통화를 실시간으로 분석하고 상담원에게 추천 응답을 생성하는 GenAI 애플리케이션을 개발하고 있습니다. 애플리케이션은 피크 시간에 50만 건의 동시 통화를 처리해야 하며, 추천마다 엔드투엔드 지연 시간이 200ms 미만이어야 합니다. 회사는 기존 아키텍처로 고객 통화 오디오 스트림을 전사(transcribe)합니다. 애플리케이션은 사전 정의된 월 컴퓨팅 예산을 초과해서는 안 되며 자동 확장 기능을 유지해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock에 대규모의 복잡한 추론 모델을 배포합니다. 프로비저닝된 처리량을 구매하고 배치 처리에 최적화합니다."],["B","Amazon Bedrock에 지연 시간이 짧고 실시간에 최적화된 모델을 배포합니다. 프로비저닝된 처리량을 구매하고 자동 확장 정책을 설정합니다."],["C","전용 GPU 인스턴스를 사용하는 Amazon SageMaker 실시간 엔드포인트에 LLM을 배포합니다."],["D","배치 처리에 최적화된 Amazon SageMaker 서버리스 엔드포인트에 중간 크기 언어 모델을 배포합니다."]]},"en":{"q":"A company is developing a generative AI (GenAI) application that analyzes customer service calls in real time and generates suggested responses for human customer service agents. The application must process 500,000 concurrent calls during peak hours with less than 200 ms end-to-end latency for each suggestion. The company uses existing architecture to transcribe customer call audio streams. The application must not exceed a predefined monthly compute budget and must maintain auto scaling capabilities.\nWhich solution will meet these requirements?","o":[["A","Deploy a large, complex reasoning model on Amazon Bedrock. Purchase provisioned throughput and optimize for batch processing."],["B","Deploy a low-latency, real-time optimized model on Amazon Bedrock. Purchase provisioned throughput and set up automatic scaling policies."],["C","Deploy a large language model (LLM) on an Amazon SageMaker real-time endpoint that uses dedicated GPU instances."],["D","Deploy a mid-sized language model on an Amazon SageMaker serverless endpoint that is optimized for batch processing."]]},"ex":{"c":"200ms 미만 지연이 필요하므로 저지연·실시간 최적화 모델을 사용하고, 대규모 동시 처리에는 프로비저닝 처리량으로 일관된 용량을 확보합니다. 자동 확장 정책을 함께 두어 예산 안에서 피크에 대응합니다.","w":{"A":"큰 추론 모델과 배치 최적화는 실시간 저지연 요구와 반대입니다.","C":"전용 GPU 엔드포인트에 큰 모델을 올리면 비용이 크고 지연 시간도 깁니다.","D":"서버리스 엔드포인트는 콜드 스타트가 있고 배치 최적화는 실시간에 맞지 않습니다."}}},{"n":63,"a":["A"],"orig":"","ko":{"q":"한 회사가 고객 지원 티켓을 처리하는 애플리케이션을 사용합니다. 회사는 Amazon Bedrock으로 AI 기반 감정 분석과 자동 응답 생성을 애플리케이션에 통합하려고 합니다. 긴급한 문제의 우선순위를 높이고, 수동 응답 대비 초기 응답 시간을 40% 줄이려고 합니다. 솔루션은 100건의 동시 웹훅 요청을 500ms 미만으로 처리해야 하고, 여러 AWS 리전에서 99.9% 가용성을 유지하며, 들어오는 모든 요청을 인증해야 합니다. 인증 실패가 전혀 없어야 합니다. 회사는 여러 웹훅 인증 방식을 사용하는 다수의 티켓 시스템으로 구성된 기존 애플리케이션 인프라를 수정하고 싶어 하지 않습니다. 솔루션은 피크 기간에 간헐적으로 하루 최대 25만 건까지 급증하는 티켓을 처리하도록 확장되어야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","리전 엔드포인트가 있는 Amazon API Gateway REST API로 웹훅 요청을 받아 AWS Lambda 함수를 호출합니다. Lambda 권한 부여자가 모든 웹훅 인증 방식을 검증하도록 구성합니다. Lambda 함수가 Amazon Bedrock을 호출해 감정 분석과 응답 생성을 수행하도록 구성하고, 결과를 Amazon DynamoDB 글로벌 테이블에 저장해 다중 리전 가용성을 제공합니다."],["B","티켓 시스템마다 AWS Lambda 함수 URL을 만들고, 인증 유형을 NONE으로 구성합니다. 별도의 Lambda 함수가 함수 코드에서 HMAC 검증으로 웹훅 서명을 확인하도록 구성합니다. 함수를 여러 리전에 배포하고 AWS Global Accelerator로 트래픽을 라우팅합니다. Amazon Bedrock으로 감정 분석과 응답 생성을 수행하고, 웹훅 콜백으로 응답을 반환합니다."],["C","리전마다 웹훅 메시지를 받는 Amazon SQS 대기열을 설정합니다. SQS 대기열로 AWS Lambda 함수를 호출하고, 이 함수가 Amazon Comprehend로 감정 분석을, Amazon Lex로 응답 생성을 수행합니다. Amazon EventBridge로 애플리케이션 API에 대한 메시지 전송을 재시도합니다."],["D","여러 리전에 AWS AppSync GraphQL API를 배포합니다. API 토큰으로 수신 요청을 인증하도록 구성합니다. Amazon EventBridge에 이벤트를 게시하는 GraphQL 뮤테이션 리졸버를 만들고, EventBridge 규칙이 Amazon Bedrock으로 감정 분석과 응답 생성을 수행하는 AWS Lambda 함수를 호출하도록 구성합니다. Amazon CloudFront로 지연 시간을 줄입니다."]]},"en":{"q":"A company uses an application to process customer support tickets. The company wants to integrate AI- powered sentiment analysis and auto-response generation into the application by using Amazon Bedrock. The company wants to prioritize urgent issues and reduce initial response times by 40% compared to manual responses. The solution must process 100 concurrent webhook requests with response times under 500 ms. The solution must maintain 99.9% availability across multiple AWS Regions and authenticate all incoming requests. The company must avoid any authentication failures. The company does not want to modify the existing application infrastructure, which includes several ticketing systems that use multiple webhook authentication methods. The solution must support scaling to handle occasional spikes up to 250,000 daily tickets during peak periods.\nWhich solution will meet these requirements?","o":[["A","Use an Amazon API Gateway REST API with a Regional endpoint to receive webhook requests and invoke AWS Lambda functions. Configure Lambda authorizers to validate all the webhook authentication methods. Configure the Lambda functions to call Amazon Bedrock to perform sentiment analysis and generate responses. Store results in Amazon DynamoDB global tables to provide multi- Region availability."],["B","Create AWS Lambda function URLs for each ticketing system. Configure the function URLs with the NONE authentication type. Configure separate Lambda functions to verify webhook signatures by using Hash-based Message Authentication Code (HMAC) validation in the function code. Deploy the functions to multiple Regions and use AWS Global Accelerator to route traffic. Use Amazon Bedrock to perform sentiment analysis and generate responses. Return responses through webhook callbacks."],["C","Set up an Amazon SQS queue in each Region to receive webhook messages. Use the SQS queue to invoke AWS Lambda functions that call Amazon Comprehend to perform sentiment analysis and Amazon Lex to generate responses. Use Amazon EventBridge to retry message delivery to the application API."],["D","Deploy an AWS AppSync GraphQL API to multiple Regions. Configure API tokens to authenticate incoming requests. Create GraphQL mutation resolvers that publish events to Amazon EventBridge.Configure EventBridge rules to invoke AWS Lambda functions that use Amazon Bedrock to perform sentiment analysis and generate responses. Use Amazon CloudFront to reduce latency."]]},"ex":{"c":"API Gateway REST API가 웹후크를 받고, Lambda 권한 부여자로 각 티켓 시스템의 여러 인증 방식을 기존 시스템 변경 없이 검증합니다. Lambda가 Bedrock으로 감정 분석과 응답을 생성하고, DynamoDB 글로벌 테이블로 다중 리전 가용성을 확보합니다.","w":{"B":"NONE 인증 유형은 인증 계층이 없어 모든 요청 인증 요구에 어긋납니다.","C":"SQS는 웹후크를 직접 받을 수 없고, Lex는 응답 생성 서비스가 아닙니다.","D":"API 토큰 방식은 기존 웹후크 인증 방식을 지원하지 않으며 티켓 시스템을 수정해야 합니다."}}},{"n":64,"a":["B"],"orig":"","ko":{"q":"한 연구 회사가 기술 문서 요약을 생성하는 GenAI 시스템을 개발하고 있습니다. 회사는 모든 데이터 소스를 중앙 위치에 카탈로그화해야 하며, 데이터 소스를 자동으로 검색하고 업데이트하는 솔루션이 필요합니다. 솔루션은 생성된 각 요약에 사용자가 조회할 수 있는 메타데이터로 인용 정보를 태그해야 합니다. 또한 모든 모델 호출에 대해 변조 증거가 남는(tamper-evident) 변경 불가능한 감사 로그를 보관하고 입출력 기록을 저장해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Comprehend로 문서의 데이터 소스를 식별합니다. 생성된 요약을 Amazon S3에 저장하고 S3 Object Lock을 활성화합니다. Amazon CloudWatch 지표로 애플리케이션 처리량 보고서를 생성하고, 호출별 로그는 포함하지 않습니다."],["B","크롤러가 있는 AWS Glue Data Catalog로 데이터 소스를 관리합니다. 생성된 요약을 Amazon S3에 저장하고 소스 ID를 포함한 객체 태그를 기록합니다. Amazon Bedrock 모델 호출 로그를 Amazon S3에 저장하고, 호출 로그를 저장하는 S3 버킷에 S3 Object Lock을 활성화합니다. AWS CloudTrail 로그 파일 무결성 검증으로 변조 증거가 남는 불변성을 제공합니다."],["C","애플리케이션 출력을 Amazon DynamoDB에 저장하고, 출처 정보를 포함한 항목 수준 태그를 적용합니다. 애플리케이션 이벤트를 Amazon CloudWatch Logs에 기록하고, IAM 역할로 감사 추적성을 제공합니다."],["D","AWS AppConfig 기능 플래그로 데이터 버전 관리를 구현합니다. IAM 조건 키로 모델 액세스를 제한하고, 소스와 출력 간 관계를 담은 버전 관리 매핑 파일을 Amazon S3에 유지합니다."]]},"en":{"q":"A research company is developing a GenAI system to produce summaries of technical documents. The company must catalog all data sources in a central location. The company needs a solution that can automatically discover and update data sources. The solution must tag each generated summary with citations as metadata that users can query. The solution must retain tamper-evident, immutable audit logs for every model invocation and store I/O records.\nWhich solution will meet these requirements?","o":[["A","Use Amazon Comprehend to identify data sources in the documents. Store generated summaries in Amazon S3 and enable S3 Object Lock. Use Amazon CloudWatch metrics to generate reports about application throughput. Do not include logs for each invocation."],["B","Use AWS Glue Data Catalog with crawlers to maintain data sources. Store generated summaries in Amazon S3. Write object tags that include a source ID. Store Amazon Bedrock model invocation logs in Amazon S3. Enable S3 Object Lock on the S3 bucket that stores invocation logs. Use AWS CloudTrail log file integrity validation to provide tamper-evident immutability."],["C","Store application outputs in Amazon DynamoDB. Apply item-level tags that include source attribution. Write application events to Amazon CloudWatch Logs. Use IAM roles to provide audit traceability."],["D","Use AWS AppConfig feature flags to implement data versioning. Restrict access to the model by using IAM condition keys. Maintain a versioned mapping file of source-to-output relationships in Amazon S3."]]},"ex":{"c":"Glue Data Catalog와 크롤러로 데이터 소스를 자동 발견하고 중앙에서 관리합니다. 요약은 S3에 저장하고 출처 ID를 객체 태그로 붙여 쿼리 가능한 메타데이터로 만듭니다. 호출 로그는 Object Lock이 켜진 S3에 불변으로 저장하고, CloudTrail 로그 파일 무결성 검증으로 변조를 탐지합니다.","w":{"A":"호출별 로그를 남기지 않아 감사 요구를 충족하지 못합니다.","C":"DynamoDB와 CloudWatch Logs는 변조 증거가 남는 불변 저장소가 아니고 소스 자동 발견도 없습니다.","D":"중앙 카탈로그와 불변 감사 로그가 없습니다."}}},{"n":65,"a":["C"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock으로 RAG 시스템을 구축합니다. 이 시스템은 긴급 뉴스 동영상 콘텐츠용 데이터 소스로 Amazon S3 버킷 기반의 Amazon Bedrock Knowledge Bases를 사용하며, S3 버킷에서 녹취록, 보관된 보도, 관련 문서를 검색합니다. 최신 임베딩 모델과 고성능 검색 구성을 사용하고 있지만, 사용자들은 응답이 느리고 관련 없는 결과가 나온다고 보고해 만족도가 떨어지고 있습니다. 회사는 벡터 검색이 너무 많은 콘텐츠 유형과 너무 긴 기간에 걸쳐 너무 많은 문서를 평가하고 있음을 확인했습니다. 회사는 기반 모델이 추가 미세 조정으로 개선되지 않을 것이라고 판단했습니다. 회사는 더 똑똑한 제약 조건을 적용해 검색 정확도를 높여야 하며, 기존 아키텍처 변경을 최소화하려고 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","긴급 뉴스 콘텐츠로 특화 학습된 도메인 적응 모델을 사용해 임베딩을 개선하고 벡터 유사도를 높입니다."],["B","Amazon OpenSearch Service로 마이그레이션합니다. 벡터 필드와 메타데이터 필터로 검색 결과 범위를 정의합니다."],["C","S3 객체 메타데이터를 인덱싱해 Amazon Bedrock 지식 기반에서 메타데이터 인식 필터링을 활성화합니다."],["D","Amazon Q Business 인덱스로 마이그레이션해 검색 중 구조화된 메타데이터 필터링과 문서 분류를 수행합니다."]]},"en":{"q":"A company uses Amazon Bedrock to build a Retrieval Augmented Generation (RAG) system. The RAG system uses an Amazon Bedrock Knowledge Bases that is based on an Amazon S3 bucket as the data source for emergency news video content. The system retrieves transcripts, archived reports, and related documents from the S3 bucket. The RAG system uses state-of-the-art embedding models and a high-performing retrieval setup. However, users report slow responses and irrelevant results, which cause decreased user satisfaction. The company notices that vector searches are evaluating too many documents across too many content types and over long periods of time. The company determines that the underlying models will not benefit from additional fine-tuning. The company must improve retrieval accuracy by applying smarter constraints and wants a solution that requires minimal changes to the existing architecture.\nWhich solution will meet these requirements?","o":[["A","Enhance embeddings by using a domain-adapted model that is specifically trained on emergency news content for improved vector similarity."],["B","Migrate to Amazon OpenSearch Service. Use vector fields and metadata filters to define the scope of results retrieval."],["C","Enable metadata-aware filtering within the Amazon Bedrock knowledge base by indexing S3 object metadata."],["D","Migrate to an Amazon Q Business index to perform structured metadata filtering and document categorization during retrieval."]]},"ex":{"c":"S3 객체 메타데이터(콘텐츠 유형, 날짜 등)를 지식 기반에 메타데이터로 인덱싱하고 검색 시 필터를 적용하면, 벡터 검색 범위가 줄어 정확도와 속도가 함께 좋아집니다. 기존 아키텍처를 거의 바꾸지 않습니다.","w":{"A":"미세 조정이 도움이 되지 않는다고 명시되어 있으며 검색 범위 문제를 해결하지 못합니다.","B":"OpenSearch Service로 마이그레이션하면 아키텍처 변경이 큽니다.","D":"Q Business로 옮기는 것도 큰 아키텍처 변경입니다."}}},{"n":66,"a":["A","D"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock으로 연구자의 연구비 신청을 돕는 애플리케이션을 설계하고 있습니다. 애플리케이션은 Amazon Nova Pro FM을 기반으로 하며, 필수 입력 4개가 있고 일관된 텍스트 형식으로 응답해야 합니다. 회사는 응답에 괴롭힘(bullying) 언어가 포함되면 Amazon Bedrock에서 알림을 받고 싶지만, 플래그된 응답을 모두 차단하고 싶지는 않습니다. 회사는 입력 프롬프트를 받아 Amazon Nova Pro FM으로 보내는 Amazon Bedrock 플로를 만들었고, FM이 응답을 제공합니다.\n이 요구 사항을 충족하기 위해 회사가 추가로 수행해야 하는 단계는 무엇입니까? (2개 선택)","o":[["A","Amazon Bedrock Prompt Management에서 필수 입력을 변수로 지정합니다. Amazon Nova Pro FM을 선택하고 응답 출력 형식을 지정한 뒤, 프롬프트를 플로의 프롬프트 노드에 추가합니다."],["B","혐오(hate) 콘텐츠 필터를 적용하는 Amazon Bedrock 가드레일을 만듭니다. 필터 응답을 차단으로 설정하고, 가드레일을 플로의 프롬프트 노드에 추가합니다."],["C","Amazon Bedrock 프롬프트 라우터를 만들고 Amazon Nova Pro FM을 지정합니다. 필수 입력을 변수로 플로의 입력 노드에 추가하고, 프롬프트 라우터를 프롬프트 노드에, 출력 형식을 출력 노드에 추가합니다."],["D","모욕(insults) 콘텐츠 필터를 적용하는 Amazon Bedrock 가드레일을 만듭니다. 필터 응답을 감지(detect)로 설정하고, 가드레일을 플로의 프롬프트 노드에 추가합니다."],["E","Amazon Nova Pro FM을 지정하는 Amazon Bedrock 애플리케이션 추론 프로필을 만듭니다. 설명에 응답 출력 형식을 지정하고, 입력 변수마다 태그를 포함한 뒤, 프로필을 플로의 프롬프트 노드에 추가합니다."]]},"en":{"q":"A company is using Amazon Bedrock to design an application to help researchers apply for grants. The application is based on an Amazon Nova Pro foundation model (FM). The application contains four required inputs and must provide responses in a consistent text format. The company wants to receive a notification in Amazon Bedrock if a response contains bullying language. However, the company does not want to block all flagged responses. The company creates an Amazon Bedrock flow that takes an input prompt and sends it to the Amazon Nova Pro FM. The Amazon Nova Pro FM provides a response.\nWhich additional steps must the company take to meet these requirements? (Select TWO.)","o":[["A","Use Amazon Bedrock Prompt Management to specify the required inputs as variables. Select an Amazon Nova Pro FM. Specify the output format for the response. Add the prompt to the prompts node of the flow."],["B","Create an Amazon Bedrock guardrail that applies the hate content filter. Set the filter response to block. Add the guardrail to the prompts node of the flow."],["C","Create an Amazon Bedrock prompt router. Specify an Amazon Nova Pro FM. Add the required inputs as variables to the input node of the flow. Add the prompt router to the prompts node. Add the output format to the output node."],["D","Create an Amazon Bedrock guardrail that applies the insults content filter. Set the filter response to detect. Add the guardrail to the prompts node of the flow."],["E","Create an Amazon Bedrock application inference profile that specifies an Amazon Nova Pro FM.Specify the output format for the response in the description. Include a tag for each of the input variables. Add the profile to the prompts node of the flow."]]},"ex":{"c":"Prompt Management에서 네 가지 필수 입력을 변수로 정의하고 Nova Pro와 출력 형식을 지정한 프롬프트를 플로의 프롬프트 노드에 넣으면 일관된 형식이 보장됩니다(A). 괴롭힘 언어는 콘텐츠 필터의 모욕(insults) 범주에 해당하며, 동작을 탐지(detect)로 두면 차단하지 않고 알림만 받을 수 있습니다(D).","w":{"B":"차단 동작은 모든 플래그 응답을 막으므로 요구 사항에 어긋나고, 괴롭힘은 혐오보다 모욕 범주에 가깝습니다.","C":"프롬프트 라우터는 모델 간 라우팅 기능이며 입력·출력 형식 정의와 무관합니다.","E":"추론 프로필 설명이나 태그로는 출력 형식이나 입력 변수를 정의할 수 없습니다."}}},{"n":67,"a":["C"],"orig":"","ko":{"q":"GenAI 개발자가 유럽 기반 회사의 내부 업무 애플리케이션을 개선하기 위해 Amazon Bedrock FM을 평가하고 있습니다. 회사는 AWS Control Tower에 다중 계정 랜딩 존을 갖추고 있으며, SCP로 계정이 eu-north-1과 eu-west-1 리전만 사용하도록 허용합니다. 모든 고객 데이터는 승인된 AWS 리전 내의 프라이빗 네트워크에 머물러야 합니다. GenAI 개발자는 분석과 테스트를 거쳐 FM을 선택했으며, 이 모델은 eu-central-1과 eu-west-3 리전에서 호스팅됩니다. GenAI 개발자는 직원들이 FM에 접근할 수 있게 해야 하며, FM에 대한 요청이 프라이빗하고 FM과 같은 리전 내에 머물도록 해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","eu-north-1의 VPC에 프라이빗 Amazon API Gateway REST API로 노출되는 AWS Lambda 함수를 배포합니다. eu-central-1과 eu-west-3에 선택한 FM용 VPC 엔드포인트를 만듭니다. 기존 SCP를 확장해 직원이 FM을 사용할 수 있게 하고, REST API를 업무 애플리케이션과 통합합니다."],["B","eu-north-1의 Amazon EC2 인스턴스에 FM을 배포합니다. EC2 인스턴스 앞에 프라이빗 Amazon API Gateway REST API를 배포하고, Amazon Bedrock VPC 엔드포인트를 구성합니다. REST API를 업무 애플리케이션과 통합합니다."],["C","유럽 범위의 엔드포인트를 통해 FM이 교차 리전 추론을 사용하도록 구성합니다. Amazon Bedrock VPC 엔드포인트를 구성합니다. 기존 SCP를 확장해 FM을 사용할 수 있는 유럽 리전에서 직원이 추론 프로필을 통해 FM을 사용할 수 있게 하고, 추론 프로필로 Amazon Bedrock을 업무 애플리케이션과 통합합니다."],["D","eu-north-1의 Amazon SageMaker에 FM을 배포합니다. SageMaker VPC 엔드포인트를 구성하고, 기존 SCP를 확장해 직원이 SageMaker 엔드포인트를 사용할 수 있게 합니다. SageMaker의 FM을 업무 애플리케이션과 통합합니다."]]},"en":{"q":"A GenAI developer is evaluating Amazon Bedrock foundation models (FMs) to enhance a Europe-based company ' s internal business application. The company has a multi-account landing zone in AWS Control Tower. The company uses Service Control Policies (SCPs) to allow its accounts to use only the eu-north-1 and eu-west-1 Regions. All customer data must remain in private networks within the approved AWS Regions. The GenAI developer selects an FM based on analysis and testing and hosts the model in the eucentral-1 Region and the eu-west-3 Region. The GenAI developer must enable access to the FM for the company ' s employees. The GenAI developer must ensure that requests to the FM are private and remain within the same Regions as the FM.\nWhich solution will meet these requirements?","o":[["A","Deploy an AWS Lambda function that is exposed by a private Amazon API Gateway REST API to a VPC in eu-north-1. Create a VPC endpoint for the selected FM in eu-central-1 and eu-west-3. Extend existing SCPs to allow employees to use the FM. Integrate the REST API with the business application."],["B","Deploy the FM on Amazon EC2 instances in eu-north-1. Deploy a private Amazon API Gateway REST API in front of the EC2 instances. Configure an Amazon Bedrock VPC endpoint. Integrate the REST API with the business application."],["C","Configure the FM to use cross-Region inference through a Europe-scoped endpoint. Configure an Amazon Bedrock VPC endpoint. Extend existing SCPs to allow employees to use the FM through inference profiles in Europe-based Regions where the FM is available. Use an inference profile to integrate Amazon Bedrock with the business application."],["D","Deploy the FM in Amazon SageMaker in eu-north-1. Configure a SageMaker VPC endpoint. Extend existing SCPs to allow employees to use the SageMaker endpoint. Integrate the FM in SageMaker with the business application."]]},"ex":{"c":"FM이 승인된 리전(eu-north-1, eu-west-1) 밖인 eu-central-1·eu-west-3에 있으므로 유럽 범위의 교차 리전 추론 프로필을 사용하고, SCP를 확장해 해당 EU 리전에서 추론 프로필을 통한 호출을 허용합니다. Bedrock VPC 엔드포인트로 요청을 비공개로 유지합니다.","w":{"A":"다른 리전의 VPC 엔드포인트를 eu-north-1 VPC에서 직접 쓰려면 리전 간 네트워킹이 필요해 복잡합니다.","B":"Bedrock FM을 EC2에 배포할 수 없습니다.","D":"선택한 Bedrock FM을 SageMaker에 그대로 배포할 수 없으며 모델이 있는 리전과도 맞지 않습니다."}}},{"n":68,"a":["B"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock과 Anthropic Claude 3 Haiku로 AI 어시스턴트를 개발하고 있습니다. AI 어시스턴트는 평소 시간당 10,000건을 처리하지만 피크 시간에는 시간당 최대 30,000건까지 급증합니다. 여러 AWS 리전에서 운영되며 2초 이내에 응답해야 합니다. 피크 시간에 처리량 병목으로 지연 시간이 늘고 가끔 요청 타임아웃이 발생합니다. 회사는 성능 문제를 해결해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","단일 리전에서 프로비저닝된 처리량과 충분한 모델 유닛(MU)을 구매합니다. 실패한 요청을 지수 백오프로 재시도하도록 애플리케이션을 구성합니다."],["B","API 오버헤드를 줄이기 위해 토큰 배칭을 구현합니다. 교차 리전 추론 프로필로 사용 가능한 리전에 트래픽을 자동 분산합니다."],["C","각 리전에 자동 확장되는 AWS Lambda 함수를 설정합니다. 클라이언트 측 라운드 로빈 요청 분산을 구현하고, 백업용으로 프로비저닝된 처리량 1 MU를 구매합니다."],["D","여러 리전의 Amazon S3 버킷을 사용해 모든 요청에 배치 추론을 구현합니다. Amazon SQS로 비동기 결과 조회 프로세스를 구성합니다."]]},"en":{"q":"A company is using Amazon Bedrock and Anthropic Claude 3 Haiku to develop an AI assistant. The AI assistant normally processes 10,000 requests each hour but experiences surges of up to 30,000 requests each hour during peak usage periods. The AI assistant must respond within 2 seconds while operating across multiple AWS Regions. The company observes that during peak usage periods, the AI assistant experiences throughput bottlenecks that cause increased latency and occasional request timeouts. The company must resolve the performance issues.\nWhich solution will meet this requirement?","o":[["A","Purchase provisioned throughput and sufficient model units (MUs) in a single Region. Configure the application to retry failed requests with exponential backoff."],["B","Implement token batching to reduce API overhead. Use cross-Region inference profiles to automatically distribute traffic across available Regions."],["C","Set up auto scaling AWS Lambda functions in each Region. Implement client-side round-robin request distribution. Purchase one model unit (MU) of provisioned throughput as a backup."],["D","Implement batch inference for all requests by using Amazon S3 buckets across multiple Regions. Use Amazon SQS to set up an asynchronous retrieval process."]]},"ex":{"c":"교차 리전 추론 프로필은 여러 리전에 트래픽을 자동 분산해 피크 시 처리량을 늘리고 스로틀링을 줄입니다. 요청을 묶어 API 오버헤드를 줄이는 것도 병목 완화에 도움이 됩니다.","w":{"A":"단일 리전 프로비저닝은 다중 리전 요구와 맞지 않고, 재시도는 지연을 늘립니다.","C":"클라이언트 라운드 로빈과 1MU 백업으로는 3배 급증을 처리하지 못합니다.","D":"배치 추론은 비동기라 2초 응답 요구를 충족하지 못합니다."}}},{"n":69,"a":["B"],"orig":"","ko":{"q":"한 의료 회사가 Amazon Bedrock으로 CSV 파일, JSON 문서, 텍스트 파일의 환자 피드백 데이터를 분석하는 GenAI 애플리케이션을 구축하고 있습니다. 회사는 환각을 방지하기 위해 높은 데이터 품질이 필요한 RAG 솔루션에서 데이터를 사용할 수 있게 해야 하며, 애플리케이션은 이 데이터로 정확한 임상 권장 사항을 제시합니다. 애플리케이션은 거의 실시간으로 데이터를 처리하도록 확장성이 높아야 하고, 데이터 이탈률도 높습니다. FM에 데이터를 제공하기 전에 데이터 완전성을 검증하고, 이상을 감지하고, PII를 제거하고, 품질 지표를 모니터링해야 합니다. 애플리케이션은 서버리스여야 하며, 규칙을 자동으로 추천하고, 규정 준수를 위한 품질 점수를 생성해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AWS Lambda 함수로 사용자 지정 검증 로직을 실행합니다. 결과를 Amazon DynamoDB 테이블에 저장하고, Amazon CloudWatch로 품질 점수를 생성·추적합니다."],["B","AWS Glue Data Quality로 DQDL(Data Quality Definition Language) 기반 규칙을 추천·평가하고, 품질 점수를 생성하며, ML로 이상을 감지합니다. 지표를 Amazon CloudWatch에 게시합니다."],["C","Amazon SageMaker Data Wrangler로 변환 흐름을 만들고 품질 검사를 적용한 뒤, 검증된 데이터를 Amazon S3 버킷으로 내보냅니다."],["D","Amazon Comprehend로 PII를 감지합니다. AWS Lambda 함수로 데이터 완전성을 검증하고, 지표를 Amazon CloudWatch Logs에 저장합니다."]]},"en":{"q":"A healthcare company is using Amazon Bedrock to build a GenAI application to analyze patient feedback data from CSV files, JSON documents, and text files. The company needs to make the data available for a RAG solution that requires high data quality to prevent hallucinations. The GenAI application will use the data to make accurate clinical recommendations. The application must be highly scalable to handle data in near real time. Data attrition is also high. Before the company feeds data to a foundation model (FM), the company needs to validate data completeness, detect anomalies, remove personally identifiable information (PII), and monitor quality metrics. The application must be serverless, provide automated rule recommendations, and generate quality scores for regulatory compliance.\nWhich solution will meet these requirements?","o":[["A","Use AWS Lambda functions to run custom validation logic. Store the results in an Amazon DynamoDB table. Use Amazon CloudWatch to generate and track quality scores."],["B","Use AWS Glue Data Quality to recommend and evaluate rules by using Data Quality Definition Language (DQDL), generate quality scores, and detect anomalies by using ML. Publish metrics to Amazon CloudWatch."],["C","Use Amazon SageMaker Data Wrangler to create transformation flows, apply quality checks, and export validated data to an Amazon S3 bucket."],["D","Use Amazon Comprehend to detect PII. Use AWS Lambda functions to validate data completeness.Store metrics in Amazon CloudWatch Logs."]]},"ex":{"c":"AWS Glue Data Quality는 서버리스이며 데이터 품질 규칙을 자동 추천하고 DQDL로 평가해 품질 점수를 생성합니다. ML 기반 이상 탐지로 데이터 이상을 찾고, 지표를 CloudWatch에 게시해 모니터링합니다. 자동 규칙 추천과 품질 점수 요구를 그대로 충족합니다.","w":{"A":"사용자 지정 검증 로직은 자동 규칙 추천을 제공하지 않습니다.","C":"Data Wrangler는 대화형 도구로 자동 규칙 추천과 품질 점수가 없습니다.","D":"이상 탐지와 품질 점수 기능이 없습니다."}}},{"n":70,"a":["B"],"orig":"","ko":{"q":"한 핀테크 회사가 Amazon Bedrock으로 고객 서비스 AI 어시스턴트를 위한 평가 시스템을 구축하고 있습니다. AI 어시스턴트는 사실적으로 정확하고, 금융 규제를 준수하며, 대화상 적절한 금융 권장 사항을 제공해야 합니다. 회사는 대규모 자동 품질 평가와 중요한 상호 작용에 대한 선별적 사람 검토를 결합해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","금융 전문가가 모든 응답의 정확성, 규정 준수, 대화 품질을 수동으로 채점하는 파이프라인을 구성합니다. Amazon SageMaker 노트북으로 결과를 분석해 개선 영역을 파악합니다."],["B","Anthropic Claude Sonnet을 심사(judge) 모델로 사용해 응답 정확성과 적절성을 평가하는 Amazon Bedrock 평가를 구성합니다. 사용자 지정 Amazon Bedrock 가드레일로 응답의 금융 정책 준수를 확인하고, 플래그된 중요 상호 작용에 대해 Amazon Augmented AI(Amazon A2I) 사람 검토를 추가합니다."],["C","Amazon Lex 봇으로 고객 서비스 상호 작용을 관리합니다. AWS Lambda 함수가 정적 규정 준수 데이터베이스와 응답을 대조하도록 구성하고, Lambda 함수를 호출하는 인텐트를 구성합니다. 최종 사용자 리뷰를 수집하는 인텐트를 추가합니다."],["D","Amazon CloudWatch로 AI 어시스턴트의 응답 패턴을 모니터링합니다. 잠재적 규정 위반에 대한 CloudWatch 알림을 구성하고, 플래그된 상호 작용을 검토할 사람 평가자 팀을 구성합니다."]]},"en":{"q":"A financial technology company is using Amazon Bedrock to build an assessment system for the company's customer service AI assistant. The AI assistant must provide financial recommendations that are factually accurate, compliant with financial regulations, and conversationally appropriate. The company needs to combine automated quality evaluations at scale with targeted human reviews of critical interactions.\nWhat solution will meet these requirements?","o":[["A","Configure a pipeline in which financial experts manually score all responses for accuracy, compliance, and conversational quality. Use Amazon SageMaker notebooks to analyze results to identify improvement areas."],["B","Configure Amazon Bedrock evaluations that use Anthropic Claude Sonnet as a judge model to assess response accuracy and appropriateness. Configure custom Amazon Bedrock guardrails to check responses for compliance with financial policies. Add Amazon Augmented AI (Amazon A2I) human reviews for flagged critical interactions."],["C","Create an Amazon Lex bot to manage customer service interactions. Configure AWS Lambda functions to check responses against a static compliance database. Configure intents that call the Lambda functions. Add an additional intent to collect end-user reviews."],["D","Configure Amazon CloudWatch to monitor response patterns from the AI assistant. Configure CloudWatch alerts for potential compliance violations. Establish a team of human evaluators to review flagged interactions."]]},"ex":{"c":"Bedrock 평가에서 Claude Sonnet을 판정 모델로 써서 정확성과 적절성을 대규모로 자동 평가하고, 사용자 지정 Guardrails로 금융 정책 준수를 검사합니다. 플래그된 중요 상호 작용은 Amazon A2I로 사람 검토에 보내 자동 평가와 표적 사람 검토를 결합합니다.","w":{"A":"모든 응답을 수동 채점하면 대규모 자동 평가가 아닙니다.","C":"Lex 봇과 정적 DB 확인은 품질 평가 체계가 아닙니다.","D":"CloudWatch는 응답의 정확성이나 규정 준수를 평가하지 못합니다."}}},{"n":71,"a":["A"],"orig":"B","ko":{"q":"한 금융 서비스 회사가 Amazon Bedrock으로 시장 활동 요약을 생성하는 RAG 애플리케이션을 만들고 있습니다. 애플리케이션은 인덱스 수가 적은 소규모 독점 데이터세트를 저장하는 벡터 데이터베이스를 사용하며, 유사도 검색을 수행해야 합니다. Amazon Bedrock 모델 응답은 정확도를 최대화하고 높은 성능을 유지해야 합니다. 회사는 벡터 데이터베이스를 구성하고 애플리케이션과 통합해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon MemoryDB 클러스터를 시작하고 Flat 알고리즘으로 인덱스를 구성합니다. 성능 지표 기반의 수평 확장 정책을 구성합니다."],["B","Amazon MemoryDB 클러스터를 시작하고 HNSW(Hierarchical Navigable Small World) 알고리즘으로 인덱스를 구성합니다. 성능 지표 기반의 수직 확장 정책을 구성합니다."],["C","Amazon Aurora PostgreSQL 클러스터를 시작하고 IVFFlat(Inverted File with Flat Compression) 알고리즘으로 인덱스를 구성합니다. 부하가 증가하면 인스턴스 클래스가 더 큰 크기로 확장되도록 구성합니다."],["D","IVFFlat 인덱스와 높은 probe 값을 가진 Amazon DocumentDB 클러스터를 시작합니다. 클러스터 연결을 복제본 세트로 구성하고 읽기를 복제본 인스턴스로 분산합니다."]]},"en":{"q":"A financial services company is creating a Retrieval Augmented Generation (RAG) application that uses Amazon Bedrock to generate summaries of market activities. The application relies on a vector database that stores a small proprietary dataset with a low index count. The application must perform similarity searches. The Amazon Bedrock model's responses must maximize accuracy and maintain high performance. The company needs to configure the vector database and integrate it with the application.\nWhich solution will meet these requirements?","o":[["A","Launch an Amazon MemoryDB cluster and configure the index by using the Flat algorithm. Configure a horizontal scaling policy based on performance metrics."],["B","Launch an Amazon MemoryDB cluster and configure the index by using the Hierarchical Navigable Small World (HNSW) algorithm. Configure a vertical scaling policy based on performance metrics."],["C","Launch an Amazon Aurora PostgreSQL cluster and configure the index by using the Inverted File with Flat Compression (IVFFlat) algorithm. Configure the instance class to scale to a larger size when the load increases."],["D","Launch an Amazon DocumentDB cluster that has an IVFFlat index and a high probe value. Configure connections to the cluster as a replica set. Distribute reads to replica instances."]]},"ex":{"c":"인덱스 수가 적은 소규모 데이터에서는 Flat(완전 탐색) 알고리즘이 근사 없이 정확한 최근접 이웃을 찾아 정확도를 최대화하고 성능도 충분합니다. MemoryDB는 인메모리 벡터 검색으로 지연 시간이 매우 낮고, 수평 확장으로 처리량을 늘릴 수 있습니다. (원본 덤프 답 B의 HNSW는 근사 검색이라 정확도가 Flat보다 낮습니다.)","w":{"B":"HNSW는 대규모 데이터용 근사 검색으로, 작은 데이터에서는 정확도에서 Flat보다 불리합니다.","C":"IVFFlat은 근사 검색이며 작은 데이터셋에서는 군집 품질이 떨어집니다.","D":"DocumentDB IVFFlat도 근사 검색이며 인메모리 저장소보다 느립니다."}}},{"n":72,"a":["A"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock FM으로 직원에게 실시간 AI 지원을 제공하는 고객 지원 애플리케이션을 개발하고 있습니다. 애플리케이션은 AI 생성 응답을 생성되는 대로 한 글자씩 표시해야 하며, 수천 명의 동시 사용자를 최소 지연 시간으로 지원해야 합니다. 응답이 완료되기까지 보통 15~45초가 걸립니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AWS Lambda 통합이 있는 Amazon API Gateway WebSocket API를 구성합니다. WebSocket API가 Amazon Bedrock InvokeModelWithResponseStream API를 호출하고 WebSocket 연결로 부분 응답을 스트리밍하도록 구성합니다."],["B","AWS Lambda 통합이 있는 Amazon API Gateway REST API를 구성합니다. REST API가 Amazon Bedrock 표준 InvokeModel API를 호출하도록 구성하고, 프런트엔드 클라이언트가 100ms마다 완료된 응답 청크를 폴링하도록 구현합니다."],["C","중간 게이트웨이나 프록시 계층 없이 IAM 사용자 자격 증명과 InvokeModelWithResponseStream API로 프런트엔드 클라이언트가 Amazon Bedrock에 직접 연결하도록 구현합니다."],["D","AWS Lambda 통합이 있는 Amazon API Gateway HTTP API를 구성합니다. HTTP API가 완료된 응답을 Amazon DynamoDB 테이블에 캐싱하고, 여러 번의 페이지 단위 GET 요청으로 프런트엔드 클라이언트에 제공하도록 구성합니다."]]},"en":{"q":"A company is developing a customer support application that uses Amazon Bedrock foundation models (FMs) to provide real-time AI assistance to the company's employees. The application must display AI- generated responses character by character as the responses are generated. The application needs to support thousands of concurrent users with minimal latency. The responses typically take 15 to 45 seconds to finish.\nWhich solution will meet these requirements?","o":[["A","Configure an Amazon API Gateway WebSocket API with an AWS Lambda integration. Configure the WebSocket API to invoke the Amazon Bedrock InvokeModelWithResponseStream API and stream partial responses through WebSocket connections."],["B","Configure an Amazon API Gateway REST API with an AWS Lambda integration. Configure the REST API to invoke the Amazon Bedrock standard InvokeModel API and implement frontend client-side polling every 100 ms for complete response chunks."],["C","Implement direct frontend client connections to Amazon Bedrock by using IAM user credentials and the InvokeModelWithResponseStream API without any intermediate gateway or proxy layer."],["D","Configure an Amazon API Gateway HTTP API with an AWS Lambda integration. Configure the HTTP API to cache complete responses in an Amazon DynamoDB table and serve the responses through multiple paginated GET requests to frontend clients."]]},"ex":{"c":"API Gateway WebSocket API는 장시간 양방향 연결을 유지하므로, Lambda가 InvokeModelWithResponseStream으로 받은 부분 응답을 바로 클라이언트에 푸시할 수 있습니다. 15~45초 걸리는 응답을 글자 단위로 표시하는 데 적합하고 동시 사용자 확장도 가능합니다.","w":{"B":"REST API는 29초 기본 타임아웃이 있고, 100ms 폴링은 비효율적이며 글자 단위 표시가 아닙니다.","C":"클라이언트에 IAM 사용자 자격 증명을 노출하는 것은 보안상 부적절합니다.","D":"완성된 응답을 캐시해 나눠 보내는 방식은 실시간 스트리밍이 아닙니다."}}},{"n":73,"a":["A"],"orig":"","ko":{"q":"한 다국적 은행이 AWS에서 내부 정책 및 규정 준수 문서를 조회하는 RAG 솔루션을 구현하려고 합니다. 데이터 상주 규정을 준수하기 위해 중요한 고객 데이터가 특정 AWS 리전 내에 머물러야 합니다. 은행은 인프라 비용을 줄이고 모델 유지보수를 최소화하기 위해 AWS의 FM을 사용하려고 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","중요한 고객 데이터를 규제 대상 리전의 전용 Amazon S3 버킷에 저장합니다. Amazon Bedrock이 VPC 엔드포인트를 통해 문서에 직접 접근하도록 구성하고, 모든 RAG 검색을 AWS에서 수행합니다."],["B","규제 대상 리전에서 AWS Outposts로 중요한 고객 데이터를 로컬에 저장합니다. 보안 벡터 스토어에서 로컬로 임베딩을 생성하고, 검색된 컨텍스트만 사용해 Amazon Bedrock으로 AWS의 LLM을 오케스트레이션합니다."],["C","규제 대상 리전과 가까운 리전의 프라이빗 Amazon OpenSearch Service 클러스터에 중요한 고객 데이터를 저장합니다. 엔드투엔드 암호화를 구성하고, 임베딩을 로컬에 저장하지 않고 AWS의 LLM으로 데이터를 동적으로 검색·요약합니다."],["D","규제 대상 리전의 Amazon ECS에 FM을 컨테이너화합니다. 중요한 고객 데이터를 컨테이너화된 FM에 수집하고, RAG 쿼리를 전적으로 컨테이너 내부에서 수행합니다."]]},"en":{"q":"A multinational bank wants to implement a RAG solution on AWS to run queries on internal policy and compliance documents. To comply with data residency regulations, the company must ensure that critical customer data remains within a specific AWS Region. The bank wants to use foundation models (FMs) on AWS to reduce infrastructure costs and minimize model maintenance.\nWhich solution will meet these requirements?","o":[["A","Store critical customer data in a dedicated Amazon S3 bucket in the regulated Region. Configure Amazon Bedrock to directly access the documents through a VPC endpoint. Perform all RAG retrieval on AWS."],["B","Store critical customer data locally by using AWS Outposts in the regulated Region. Create embeddings locally in a secure vector store. Use Amazon Bedrock to orchestrate LLMs on AWS by using only retrieved context."],["C","Store critical customer data in a private Amazon OpenSearch Service cluster in a Region that is close to the regulated Region. Configure end-to-end encryption. Use an LLM on AWS to retrieve and summarize the data dynamically without storing embeddings locally."],["D","Containerize FMs on Amazon ECS in the regulated Region. Ingest critical customer data into the containerized FMs. Perform RAG queries entirely inside the container."]]},"ex":{"c":"규제 리전의 전용 S3 버킷에 데이터를 두고, 같은 리전의 Bedrock이 VPC 엔드포인트로 접근해 RAG를 수행하면 데이터가 리전 밖으로 나가지 않습니다. 관리형 FM을 쓰므로 인프라 비용과 모델 유지 관리가 최소화됩니다.","w":{"B":"Outposts는 인프라 비용과 관리 부담이 크고 불필요합니다.","C":"규제 리전이 아닌 '가까운' 리전에 저장하면 데이터 상주 위반입니다.","D":"FM을 컨테이너로 직접 운영하면 모델 유지 관리 부담이 큽니다."}}},{"n":74,"a":["A"],"orig":"","ko":{"q":"한 의료 회사가 Amazon Bedrock으로 임상 문의, 보험 확인, 예약, 보험 청구를 담당하는 각 부서의 질의에 응답하는 실시간 환자 케어 AI 어시스턴트를 개발하고 있습니다. 회사는 멀티 에이전트 아키텍처를 사용하려고 합니다. AI 어시스턴트는 확장 가능해야 하고 환자를 위한 새 기능을 추가할 수 있어야 하며, 수천 건의 환자 상호 작용을 병렬로 처리할 수 있어야 합니다. 환자는 질의에 대해 적절한 분야별 응답을 받아야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","별도의 지식 기반으로 에이전트별 데이터를 격리하고, IAM 필터링으로 각 지식 기반에 대한 액세스를 제어합니다. 환자 문의에 대해 자연어 의도 분류를 수행하는 감독자(supervisor) 에이전트를 배포하고, 감독자 에이전트가 부서별 질의에 응답하는 전문 협업자(collaborator) 에이전트로 질의를 라우팅하도록 구성합니다. 각 전문 협업자 에이전트는 해당 부서 지식 기반을 사용하는 RAG를 수행하도록 구성합니다."],["B","부서마다 별도의 감독자 에이전트를 만듭니다. 각 부서 내 전문 분야별로 자연어 의도 분류를 수행하는 협업자 에이전트를 개별 구성하고, 각 협업자 에이전트는 부서별 지식 기반하고만 통합합니다. 감독자 에이전트 간에는 수동 인계 프로세스를 구현합니다."],["C","부서별 데이터를 별도의 지식 기반으로 격리하고, IAM 필터링으로 각 지식 기반에 대한 액세스를 제어합니다. 범용 에이전트 하나를 배포하고, 그 안에 부서별 기능을 수행하는 여러 액션 그룹을 구성합니다. 범용 에이전트 지침에 규칙 기반 라우팅 로직을 구현합니다."],["D","부서별로 환자 문의에 응답하는 독립된 감독자 에이전트 여러 개를 병렬로 실행합니다. 각 감독자 에이전트에 여러 협업자 에이전트를 구성하고, 모든 에이전트를 동일한 지식 기반과 통합합니다. 외부 라우팅 로직으로 여러 감독자 에이전트의 응답을 병합합니다."]]},"en":{"q":"A healthcare company is using Amazon Bedrock to develop a real-time patient care AI assistant to respond to queries for separate departments that handle clinical inquiries, insurance verification, appointment scheduling, and insurance claims. The company wants to use a multi-agent architecture. The company must ensure that the AI assistant is scalable and can onboard new features for patients. The AI assistant must be able to handle thousands of parallel patient interactions. The company must ensure that patients receive appropriate domain-specific responses to queries.\nWhich solution will meet these requirements?","o":[["A","Isolate data for each agent by using separate knowledge bases. Use IAM filtering to control access to each knowledge base. Deploy a supervisor agent to perform natural language intent classification on patient inquiries. Configure the supervisor agent to route queries to specialized collaborator agents to respond to department-specific queries. Configure each specialized collab orator agent to use Retrieval Augmented Generation (RAG) with the agent ' s department-specific knowledge base."],["B","Create a separate supervisor agent for each department. Configure individual collaborator agents to perform natural language intent classification for each specialty domain within each department. Integrate each collaborator agent with department-specific knowledge bases only. Implement manual handoff processes between the supervisor agents."],["C","Isolate data for each department in separate knowledge bases. Use IAM filtering to control access to each knowledge base. Deploy a single general-purpose agent. Configure multiple action groups within the general-purpose agent to perform specific department functions. Implement rule-based routing logic in the general-purpose agent instructions."],["D","Implement multiple independent supervisor agents that run in parallel to respond to patient inquiries for each department. Configure multiple collaborator agents for each supervisor agent. Integrate all agents with the same knowledge base. Use external routing logic to merge responses from multiple supervisor agents."]]},"ex":{"c":"12번과 같은 문제입니다. 수퍼바이저 에이전트가 의도를 분류해 부서별 협업 에이전트로 라우팅하고, 각 협업 에이전트는 부서 전용 지식 기반으로 RAG를 수행합니다. 지식 기반 분리와 IAM 필터링으로 도메인별 정확한 응답과 확장성을 확보합니다.","w":{"B":"부서별 수퍼바이저와 수동 핸드오프는 확장성과 실시간성이 떨어집니다.","C":"단일 범용 에이전트의 규칙 기반 라우팅은 확장에 불리합니다.","D":"모든 에이전트가 같은 지식 기반을 쓰고 응답을 병합하는 방식은 복잡합니다."}}},{"n":75,"a":["B"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock으로 멀티모달 콘텐츠 분석 애플리케이션을 개발했습니다. 애플리케이션은 텍스트, 이미지, 코드 등 콘텐츠 유형별로 전문 FM에 라우팅합니다. 애플리케이션은 여러 유형의 라우팅 결정을 처리해야 합니다. 파일 확장자 기반의 단순 라우팅은 지연 시간이 최소여야 하고, 콘텐츠 의미 기반의 복잡한 라우팅은 FM 선택 전에 분석이 필요합니다. 애플리케이션은 상세 이력을 제공하고, 기본 FM이 실패하면 대체(fallback) 옵션을 지원해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","모든 라우팅 로직에 대해 Amazon Bedrock FM을 호출하는 AWS Lambda 함수를 구성합니다. 조건문으로 콘텐츠 유형과 의미에 따라 적절한 FM을 결정합니다."],["B","하이브리드 솔루션을 만듭니다. 파일 확장자 기반 단순 라우팅은 애플리케이션 코드에서 처리합니다. 복잡한 콘텐츠 기반 라우팅은 콘텐츠 분석용 JSONata와 전문 FM용 InvokeModel API를 사용하는 AWS Step Functions 상태 머신으로 처리합니다."],["C","콘텐츠 유형마다 별도의 AWS Step Functions 워크플로를 배포하고 라우팅 로직은 AWS Lambda 함수에 둡니다. 대체 FM으로 폴백해야 할 때 Amazon EventBridge로 워크플로 간을 조정합니다."],["D","콘텐츠 유형마다 다른 Amazon SQS 대기열을 사용합니다. 콘텐츠를 분석하고 메시지 속성에 따라 AWS SDK와 Amazon Bedrock으로 적절한 FM을 호출하는 AWS Lambda 소비자를 구성합니다."]]},"en":{"q":"A company developed a multimodal content analysis application by using Amazon Bedrock. The application routes different content types (text, images, and code) to specialized foundation models (FMs). The application needs to handle multiple types of routing decisions. Simple routing based on file extension must have minimal latency. Complex routing based on content semantics requires analysis before FM selection. The application must provide detailed history and support fallback options when primary FMs fail.\nWhich solution will meet these requirements?","o":[["A","Configure AWS Lambda functions that call Amazon Bedrock FMs for all routing logic. Use conditional statements to determine the appropriate FM based on content type and semantics."],["B","Create a hybrid solution. Handle simple routing based on file extensions in application code. Handle complex content-based routing by using an AWS Step Functions state machine with JSONata for content analysis and the InvokeModel API for specialized FMs."],["C","Deploy separate AWS Step Functions workflows for each content type with routing logic in AWS Lambda functions. Use Amazon EventBridge to coordinate between workflows when fallback to alternate FMs is required."],["D","Use Amazon SQS with different SQS queues for each content type. Configure AWS Lambda consumers that analyze content and invoke appropriate FMs based on message attributes by using Amazon Bedrock with an AWS SDK."]]},"ex":{"c":"파일 확장자 기반의 단순 라우팅은 애플리케이션 코드에서 처리해 지연을 최소화하고, 의미 분석이 필요한 복잡한 라우팅만 Step Functions에서 처리합니다. JSONata로 콘텐츠를 분석하고 InvokeModel로 전문 FM을 호출하며, Step Functions 실행 기록과 Catch·Retry로 상세 이력과 폴백을 제공합니다.","w":{"A":"모든 라우팅을 Lambda로 하면 이력 관리와 폴백 구현을 직접 해야 합니다.","C":"콘텐츠 유형별 워크플로와 EventBridge 조정은 불필요하게 복잡합니다.","D":"SQS 기반은 단순 라우팅 지연이 늘고 상세 이력과 폴백 구현이 어렵습니다."}}},{"n":76,"a":["B","C"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock으로 고객용 기술 콘텐츠를 생성합니다. 최근 긴 기술 문서의 요약을 생성할 때 환각 출력이 급증해, 부정확하거나 지어낸 세부 정보가 포함되고 있습니다. 현재 솔루션은 전체 문서를 단일 입력에 넣는 기본 원샷 프롬프트와 대형 FM을 사용합니다. 회사는 환각을 줄이고 사실 정확도 목표를 충족하는 솔루션이 필요합니다. 솔루션은 시간당 1,000건 이상의 문서를 처리하고 문서당 3초 이내에 요약을 제공해야 합니다.\n이 요구 사항을 충족하는 솔루션 조합은 무엇입니까? (2개 선택)","o":[["A","각 요약을 생성하기 전에 명시적 사실 검증과 함께 단계별 추론을 요구하는 제로샷 CoT(chain-of-thought) 지침을 구현합니다."],["B","Amazon Bedrock 지식 기반으로 RAG를 사용합니다. 의미 기반 청킹과 조정된 임
