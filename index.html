베딩을 적용해 요약을 원본 콘텐츠에 근거하게 합니다."],["C","환각 콘텐츠와 관련된 패턴과 일치하는 생성 출력을 차단하도록 Amazon Bedrock 가드레일을 구성합니다."],["D","Amazon Bedrock에서 temperature 파라미터를 높입니다."],["E","Amazon Bedrock 모델이 각 전체 문서를 한 번에 요약하도록 프롬프트합니다."]]},"en":{"q":"A company uses Amazon Bedrock to generate technical content for customers. The company has recently experienced a surge in hallucinated outputs when the company's model generates summaries of long technical documents. The model outputs include inaccurate or fabricated details. The company's current solution uses a large foundation model (FM) with a basic one-shot prompt that includes the full document in a single input. The company needs a solution that will reduce hallucinations and meet factual accuracy goals. The solution must process more than 1,000 documents each hour and deliver summaries within 3 seconds for each document.\nWhich combination of solutions will meet these requirements? (Select TWO.)","o":[["A","Implement zero-shot chain-of-thought (CoT) instructions that require step-by-step reasoning with explicit fact verification before the model generates each summary."],["B","Use Retrieval Augmented Generation (RAG) with an Amazon Bedrock knowledge base. Apply semantic chunking and tuned embeddings to ground summaries in source content."],["C","Configure Amazon Bedrock guardrails to block any generated output that matches patterns that are associated with hallucinated content."],["D","Increase the temperature parameter in Amazon Bedrock."],["E","Prompt the Amazon Bedrock model to summarize each full document in one pass."]]},"ex":{"c":"지식 기반 RAG와 시맨틱 청킹으로 요약을 원문 내용에 근거하게 하면 환각이 줄고, 전체 문서를 한 번에 넣지 않아 처리 속도도 빨라집니다(B). Guardrails(컨텍스트 근거성 검사)로 근거 없는 출력을 차단해 사실 정확도 목표를 맞춥니다(C).","w":{"A":"단계별 추론은 응답 시간을 늘려 3초 요구를 맞추기 어렵습니다.","D":"temperature를 높이면 무작위성이 커져 환각이 늘어납니다.","E":"현재의 문제적 방식(전체 문서 원패스 요약)을 그대로 유지하는 것입니다."}}},{"n":77,"a":["A","E"],"orig":"","ko":{"q":"한 전자상거래 회사가 Amazon Bedrock의 Anthropic Claude Sonnet 모델로 상품 추천을 생성합니다. AWS Lambda 함수가 Amazon DynamoDB에서 고객 구매 데이터를, Amazon S3에서 상품 리뷰를, Amazon RDS에서 고객 프로필 정보를 가져온 뒤 API 호출로 Amazon Bedrock 모델에 데이터를 직접 보냅니다. 최근 구매 이력이 많은 고객이 불완전한 추천을 받기 시작했습니다. Lambda 함수의 CloudWatch 로그에는 실행 타임아웃이, Amazon Bedrock API 호출의 CloudWatch 로그에는 간헐적 오류가 나타납니다. 로그를 검토한 결과 일부 요청은 컨텍스트 길이 초과(context-length-exceeded) 오류로 실패하고, 다른 요청은 완료되지만 입력 데이터의 일부를 무시하는 것으로 보입니다. 회사는 추천 생성 시 모든 고객 데이터를 고려하도록 하고 싶으며, Amazon Bedrock Knowledge Bases로 데이터 구성과 검색을 개선하려고 합니다.\n이 요구 사항을 충족하는 솔루션 조합은 무엇입니까? (2개 선택)","o":[["A","고객 데이터를 더 작은 세그먼트로 나누는 청킹 전략을 구현합니다. 모델이 각 세그먼트를 개별 처리하도록 구성하고, 마지막으로 모델을 한 번 더 호출해 개별 응답을 종합적인 추천으로 합칩니다."],["B","가장 중요한 정보를 컨텍스트 윈도우의 시작과 끝에 배치하도록 프롬프트 구조를 수정합니다. 상호 작용이 모델의 최대 컨텍스트 길이에 근접하면 덜 중요한 데이터를 잘라내는 토큰 계산 로직을 구현합니다."],["C","Claude Sonnet을 컨텍스트 윈도우가 더 큰 모델로 교체하고, 더 큰 입력의 긴 처리 시간을 수용하도록 Lambda 함수 타임아웃을 늘립니다."],["D","추천 시스템이 Converse API를 사용하도록 구성하고, additionalModelRequestFields 파라미터를 수정해 최대 토큰 한도를 모델의 기본 컨텍스트 윈도우 크기 이상으로 늘립니다."],["E","지식 기반으로 고객 데이터를 벡터 임베딩으로 인덱싱하는 RAG를 구현합니다. 현재 고객 컨텍스트를 바탕으로 각 추천 요청에 의미상 가장 관련 있는 정보만 검색합니다."]]},"en":{"q":"An ecommerce company is using an Anthropic Claude Sonnet model in Amazon Bedrock to generate product recommendations. An AWS Lambda function retrieves customer purchase data from Amazon DynamoDB, product reviews from Amazon S3, and customer profile information from Amazon RDS. Then the function sends the data directly to the Amazon Bedrock model through API calls. Recently, customers who have extensive purchase histories have begun to receive incomplete recommendations. Amazon CloudWatch logs for the Lambda function show execution timeouts. CloudWatch logs for Amazon Bedrock API calls show intermittent errors. The company reviews the logs and finds that some requests are failing with context-length-exceeded errors. Other requests finish but appear to ignore portions of the input data. The company wants the recommendation system to consider all customer data when the system generates recommendations. The company wants to use Amazon Bedrock Knowledge Bases to improve data organization and retrieval.\nWhich combination of solutions will meet these requirements? (Select TWO.)","o":[["A","Implement a chunking strategy that divides the customer data into smaller segments. Configure the model to process each segment separately. Invoke the model a final time to synthesize the individual responses into comprehensive recommendations."],["B","Modify the prompt structure to place the most critical information at the beginning and end of the context window. Implement token-counting logic to truncate less important data when the interaction approaches the model's maximum context length."],["C","Replace Claude Sonnet with a model that has a larger context-window capacity. Increase the Lambda function timeout to accommodate longer processing times for larger inputs."],["D","Configure the recommendation system to use the Converse API. Modify the additionalModelRequestFields parameter to increase the maximum token limit beyond the model's default context-window size."],["E","Implement RAG by using a knowledge base to index the customer data with vector embeddings.Retrieve only the most semantically relevant information for each recommendation request based on the current customer context."]]},"ex":{"c":"구매 이력이 긴 고객의 데이터가 컨텍스트 창을 넘는 것이 원인입니다. 데이터를 작은 세그먼트로 나눠 각각 처리한 뒤 마지막 호출로 결과를 종합하면 모든 데이터를 반영할 수 있습니다(A). 지식 기반에 고객 데이터를 벡터로 인덱싱하고 요청마다 관련성이 높은 정보만 검색하면 입력이 컨텍스트 안에 들어가고 데이터 구성과 검색도 개선됩니다(E).","w":{"B":"덜 중요한 데이터를 잘라내면 '모든 고객 데이터 고려' 요구에 어긋납니다.","C":"더 큰 컨텍스트 모델도 결국 한계가 있고, 지식 기반 활용 요구를 다루지 않습니다.","D":"모델의 컨텍스트 창 크기는 파라미터로 늘릴 수 없습니다."}}},{"n":78,"a":["C"],"orig":"","ko":{"q":"한 의료 회사가 FM으로 임상의의 진단 의사 결정을 돕는 AI 시스템을 배포하고 있습니다. 회사 윤리위원회는 AI 시스템이 환자 인구통계 그룹 전반에서 공정성을 입증하고 의료 AI 거버넌스 정책을 준수하도록 요구합니다. 초기 테스트에서 AI 시스템은 명확한 설명이나 의사 결정 추적 없이 권장 사항을 제공해, 임상의가 진단 결론의 도출 과정을 검토할 수 없었습니다. 회사는 AI 출력에 투명한 추론을 제공하고, 체계적인 공정성 테스트를 가능하게 하며, 의료 환경에서 책임 있는 AI 사용을 위한 정책 준수를 보장하는 솔루션을 구현해야 합니다. 솔루션은 포괄적인 설명 가능성과 실시간 성능 요구 사이의 균형을 맞추고, 여러 인구통계 변수에 대한 신속한 편향 테스트 반복을 지원해야 합니다. 또한 엄격한 데이터 프라이버시 통제를 유지하면서 기존 임상 워크플로와 원활하게 통합되어야 하고, 복잡한 의료 및 규제 용어를 처리해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon SageMaker Clarify로 모델 설명을 생성합니다. Amazon Augmented AI(Amazon A2I)로 사람 검토 워크플로를 구현하고, AWS Config로 AI 시스템 전반에 규정 준수 정책을 적용합니다."],["B","Amazon Comprehend Medical로 의료 용어를 분석하고, Amazon Textract로 문서를 처리합니다. AWS CloudFormation으로 배포 구성을 표준화합니다."],["C","Amazon Bedrock 에이전트 추적으로 추론 추적 정보를 제공합니다. A/B 테스트가 있는 Amazon Bedrock Prompt Management로 공정성 평가를 수행하고, Amazon Bedrock Guardrails로 정책 준수를 보장합니다."],["D","Amazon CloudWatch로 성능 지표를 수집하고, Amazon EventBridge로 규정 준수 검사를 트리거합니다. AWS Lambda 함수로 사용자 지정 설명 보고서를 생성합니다."]]},"en":{"q":"A healthcare company is deploying an AI system that uses a foundation model (FM) to help clinicians make diagnostic decisions. The company's ethics board requires the AI system to demonstrate fairness across patient demographic groups and comply with medical AI governance policies. During initial testing, the AI system provides recommendations without clear explanations or decision tracing. Clinicians are unable to review how the AI system produces diagnostic conclusions. The company needs to implement a solution that provides transparent reasoning for AI outputs, enables systematic fairness testing, and ensures policy compliance for responsible AI use in healthcare settings. The solution must balance comprehensive explainability with real-time performance requirements. The solution must support rapid iteration for bias testing across multiple demographic variables. The solution must integrate seamlessly with existing clinical workflows while maintaining strict data privacy controls. The solution must handle complex medical and regulatory terminology.\nWhich solution will meet these requirements?","o":[["A","Use Amazon SageMaker Clarify to generate model explanations. Use Amazon Augmented AI (Amazon A2I) to implement human review workflows. Use AWS Config to enforce compliance policies across the AI system."],["B","Use Amazon Comprehend Medical to analyze medical terminology. Use Amazon Textract to process documents. Use AWS CloudFormation to standardize deployment configurations."],["C","Use Amazon Bedrock agent tracing to provide reasoning traces. Use Amazon Bedrock Prompt Management with A/B testing to perform fairness evaluations. Use Amazon Bedrock Guardrails to ensure policy compliance."],["D","Use Amazon CloudWatch to collect performance metrics. Use Amazon EventBridge to trigger compliance checks. Use AWS Lambda functions to generate custom explanation reports."]]},"ex":{"c":"Bedrock 에이전트 추적은 단계별 추론 과정을 보여 임상의가 결론 도출 과정을 검토할 수 있게 합니다. Prompt Management로 프롬프트 변형을 빠르게 만들어 인구 집단 변수별 A/B 테스트로 공정성을 평가하고, Guardrails로 의료 AI 정책 준수를 강제합니다.","w":{"A":"Clarify 설명은 SageMaker 모델용이며 AWS Config는 리소스 구성 규정 준수 도구이지 AI 출력 정책 도구가 아닙니다.","B":"용어 분석과 문서 처리만 다루고 설명 가능성과 공정성 테스트가 없습니다.","D":"사용자 지정 설명 보고서를 직접 개발해야 하고 실시간 추론 투명성이 없습니다."}}},{"n":79,"a":["A"],"orig":"","ko":{"q":"한 금융 서비스 회사가 Amazon Bedrock AgentCore를 사용하는 멀티 에이전트 GenAI 애플리케이션으로 매일 10,000건 이상의 고객 문의를 처리합니다. 애플리케이션 에이전트는 여러 사용자 지정 도구를 호출합니다. 피크 시간에 사용자 지정 도구의 실패율이 최대 40%에 달한다는 보고가 있고, 도구 성능이 팀마다 일관되지 않습니다. GenAI 개발자는 에이전트 상호 작용과 도구 동작에 대한 엔드투엔드 가시성을 제공하는 관측성 솔루션을 구현해야 합니다. 솔루션은 Amazon Bedrock 기본 제공 기능을 사용해야 하고 사용자 지정 계측이 필요하지 않아야 하며, 성능 오버헤드가 최소여야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AgentCore Observability와 추적 수집을 활성화합니다. AWS X-Ray로 사용자 지정 도구의 분산 추적을 수집하고, 피크 시간의 오류, 스로틀링, 지연 시간 지표를 시각화하는 Amazon CloudWatch 대시보드를 구축합니다."],["B","Amazon CloudWatch Container Insights로 에이전트를 모니터링합니다. AWS Lambda 함수가 Amazon Bedrock API를 폴링해 도구 사용 지표를 가져오고, 결과를 CloudWatch에 저장해 알림을 생성하도록 구성합니다."],["C","Amazon Bedrock의 Amazon CloudWatch 로그를 처리하는 AWS Lambda 함수로 사용자 지정 ETL 파이프라인을 구축합니다. 처리된 데이터를 Amazon DynamoDB에 저장하고, Amazon QuickSight로 팀 간 성능 패턴을 시각화합니다."],["D","AgentCore Observability를 활성화하고 추적 데이터를 Amazon CloudWatch Logs로 보냅니다. 사용자 지정 AWS Lambda 함수로 로그에서 도구 성능 지표를 추출하고, Amazon Managed Grafana로 추세를 시각화합니다."]]},"en":{"q":"A financial services company processes more than 10,000 customer inquiries every day through a multi-agent GenAI application that uses Amazon Bedrock AgentCore. The application agents invoke several custom tools. During peak usage periods, users report that the custom tools experience up to 40% failure rates. The tools perform inconsistently for different teams at the company. A GenAI developer must implement an observability solution that provides end-to-end visibility into agent interactions and tool behavior. The solution must use built-in Amazon Bedrock capabilities and must not require custom instrumentation. The GenAI developer needs a solution that requires minimal performance overhead.\nWhich solution will meet these requirements?","o":[["A","Enable AgentCore Observability and trace collection. Use AWS X-Ray to capture distributed traces for the custom tools. Build Amazon CloudWatch dashboards to visualize metrics for errors, throttling, and latency during peak usage periods."],["B","Use Amazon CloudWatch Container Insights to monitor the agents. Configure an AWS Lambda function to poll the Amazon Bedrock API for tool usage metrics. Configure the function to store results in CloudWatch to generate alerts."],["C","Build a custom ETL pipeline that uses AWS Lambda functions to process Amazon CloudWatch logs from Amazon Bedrock. Store the processed data in Amazon DynamoDB. Use Amazon QuickSight to visualize cross-team performance patterns."],["D","Enable AgentCore Observability and send trace data to Amazon CloudWatch Logs. Use a custom AWS Lambda function to extract tool performance metrics from the logs. Use Amazon Managed Grafana to visualize trends."]]},"ex":{"c":"AgentCore Observability는 에이전트 상호 작용과 도구 호출에 대한 추적·지표를 기본 제공하며 X-Ray·CloudWatch와 통합됩니다. 사용자 지정 계측 없이 분산 추적과 오류·스로틀링·지연 시간 대시보드를 구성할 수 있어 성능 오버헤드도 적습니다.","w":{"B":"Container Insights는 에이전트를 모니터링하지 않고, 폴링 Lambda는 사용자 지정 구현입니다.","C":"사용자 지정 ETL 파이프라인은 기본 제공 기능 활용 요구에 어긋납니다.","D":"사용자 지정 Lambda로 지표를 추출해야 해 '사용자 지정 계측 없음' 요구에 어긋납니다."}}},{"n":80,"a":["D"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock FM 기반 AI 어시스턴트를 사용하는 고객 커뮤니케이션 플랫폼을 개발하고 있습니다. AI 어시스턴트는 고객 메시지를 요약하고 초기 응답 초안을 생성합니다. 회사는 Amazon Comprehend로 계층형 콘텐츠 필터링을 구현하려고 합니다. 계층형 필터링은 불쾌한 콘텐츠 공유를 방지하고, 고객 개인 정보를 보호하며, 부적절한 조언 요청을 감지해야 합니다. 부적절한 조언 요청에는 비윤리적 관행, 유해한 활동, 조작적 행동에 대한 요청이 포함됩니다. 솔루션은 전체 응답 시간을 허용 범위로 유지해야 하므로, 모든 전처리 필터가 콘텐츠가 FM에 도달하기 전에 완료되어야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","비동기 API 호출로 병렬 처리를 사용합니다. 불쾌한 콘텐츠에는 독성(toxicity) 감지를, 부적절한 조언 요청에는 프롬프트 안전성 분류를 사용하고, PII 감지는 삭제(redaction) 없이 사용합니다."],["B","사용자 지정 분류로 불쾌한 콘텐츠와 부적절한 조언 요청을 감지하는 FM을 구축합니다. 메시지가 사용자 지정 분류기를 통과한 경우에만 2차 필터로 PII 감지를 적용합니다."],["C","다단계 프로세스를 배포합니다. 먼저 프롬프트 안전성 분류를, 다음으로 안전한 프롬프트에만 독성 감지를, 마지막으로 스트리밍 모드로 PII 감지를 수행하도록 구성합니다. 플래그된 메시지는 Amazon EventBridge를 통해 사람 검토로 라우팅합니다."],["D","모든 범주의 임계값을 0.5로 구성한 독성 감지를 사용합니다. 프롬프트 안전성 분류와 엔터티 삭제가 포함된 PII 감지를 병렬로 처리하고, 필터 지표에 Amazon CloudWatch 경보를 적용합니다."]]},"en":{"q":"A company is developing a customer communication platform that uses an AI assistant powered by an Amazon Bedrock foundation model (FM). The AI assistant summarizes customer messages and generates initial response drafts. The company wants to use Amazon Comprehend to implement layered content filtering. The layered content filtering must prevent sharing of offensive content, protect customer privacy, and detect potential inappropriate advice solicitation. Inappropriate advice solicitation includes requests for unethical practices, harmful activities, or manipulative behaviors. The solution must maintain acceptable overall response times, so all pre-processing filters must finish before the content reaches the FM.\nWhich solution will meet these requirements?","o":[["A","Use parallel processing with asynchronous API calls. Use toxicity detection for offensive content. Use prompt safety classification for inappropriate advice solicitation. Use personally identifiable information (PII) detection without redaction."],["B","Use custom classification to build an FM that detects offensive content and inappropriate advice solicitation. Apply personally identifiable information (PII) detection as a secondary filter only when messages pass the custom classifier."],["C","Deploy a multi-stage process. Configure the process to use prompt safety classification first, then toxicity detection on safe prompts only, and finally personally identifiable information (PII) detection in streaming mode. Route flagged messages through Amazon EventBridge for human review."],["D","Use toxicity detection with thresholds configured to 0.5 for all categories. Use parallel processing for both prompt safety classification and personally identifiable information (PII) detection with entity redaction. Apply Amazon CloudWatch alarms to filter metrics."]]},"ex":{"c":"Comprehend의 독성 탐지(toxicity detection)로 불쾌한 콘텐츠를 걸러내고, 프롬프트 안전 분류(prompt safety classification)로 부적절한 조언 요청을 탐지하며, PII 탐지와 엔터티 수정(redaction)으로 개인 정보를 보호합니다. 필터를 병렬로 실행하면 FM 호출 전에 모두 끝나면서 응답 시간도 유지됩니다.","w":{"A":"PII를 탐지만 하고 수정하지 않아 개인 정보가 FM에 전달됩니다.","B":"사용자 지정 분류기 구축은 불필요하고, 순차 처리로 지연이 늘어납니다.","C":"다단계 순차 처리는 지연을 늘리고, 스트리밍 모드 PII 탐지는 FM 전 완료 요구와 맞지 않습니다."}}},{"n":81,"a":["A"],"orig":"","ko":{"q":"한 의료 회사가 Amazon Bedrock으로 의료 문서를 자동 요약하는 개념 증명(PoC) 애플리케이션을 개발하려고 합니다. 회사는 3주 안에 애플리케이션의 정확도를 검증해야 하며, 애플리케이션은 회사의 데이터 프라이버시 정책을 준수해야 합니다. 또한 요약 정확도와 처리 시간을 평가하는 지표를 포함해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","익명화된 환자 기록 50~100건으로 데이터세트를 만듭니다. 보안 지식 기반으로 RAG를 구현하고, 심사 모델로 세 가지 FM의 정확도 지표를 평가합니다."],["B","환자 기록으로 단일 FM을 미세 조정해 Amazon Bedrock에 배포합니다. Amazon Bedrock AgentCore로 FM을 에이전트로 구성하고, 회사 직원 500명을 대상으로 사용자 테스트를 진행합니다."],["C","사용 가능한 가장 강력한 AWS FM을 선택하고 Converse API로 채팅 인터페이스를 만듭니다. 이해관계자의 정성적 피드백만으로 실제 환자 기록 50~100건에서 애플리케이션을 테스트하고, 사용자 지정 웹 인터페이스로 실제 성능 지표를 수집합니다."],["D","Strands SDK로 전문 의료 문서가 담긴 여러 지식 기반에 연결되는 여러 에이전트를 배포합니다. 에이전트 응답을 비교하고, 에이전트와 회사 기존 시스템의 통합을 평가합니다."]]},"en":{"q":"A healthcare company wants to develop a proof-of-concept application that uses Amazon Bedrock to automatically summarize medical documents. The company has 3 weeks to validate the application ' s accuracy. The application must comply with the company's data privacy policies. The application must include metrics to evaluate summarization accuracy and processing time.\nWhich solution will meet these requirements?","o":[["A","Create a dataset that includes 50-100 anonymized patient records. Implement Retrieval Augmented Generation (RAG) with a secure knowledge base. Use a judge model to evaluate accuracy metrics across three foundation models (FMs)."],["B","Fine-tune a single foundation model (FM) on patient records. Deploy the FM on Amazon Bedrock. Use Amazon Bedrock AgentCore to configure the FM as an agent. Conduct user testing on 500 company staff members."],["C","Select the most powerful available AWS foundation model (FM). Create a chat interface by using Converse APIs. Test the application on 50-100 actual patient records by using only qualitative feedback from stakeholders. Use a custom web interface to gather real-world performance metrics."],["D","Use the Strands SDK to deploy multiple agents that connect to multiple knowledge bases that contain specialized medical documents. Compare the responses of the agents. Evaluate the integration of the agents with the company ' s existing systems."]]},"ex":{"c":"익명화된 50~100건의 데이터셋으로 개인 정보 정책을 지키면서 3주 안에 검증할 수 있습니다. 보안이 적용된 지식 기반으로 RAG를 구현하고, 판정 모델로 세 개 FM의 정확도를 정량 평가하면 정확도와 처리 시간 지표를 확보할 수 있습니다.","w":{"B":"환자 기록으로 미세 조정하면 개인 정보 위험이 있고 3주 안에 끝내기 어렵습니다.","C":"실제 환자 기록 사용은 개인 정보 정책 위반이며, 정성적 피드백만으로는 정확도 지표가 없습니다.","D":"다중 에이전트 통합 평가는 요약 정확도 검증이라는 PoC 목표에서 벗어납니다."}}},{"n":82,"a":["A"],"orig":"","ko":{"q":"한 스페셜티 커피 회사가 Amazon Bedrock과 3단계 프롬프트 체인으로 개인화된 커피 로스팅 프로필을 생성하는 모바일 앱을 운영합니다. 프롬프트 체인은 사용자 입력을 구조화된 메타데이터로 변환하고, 관련 로스팅 로그를 검색한 뒤, 고객별 맞춤 로스팅 추천을 생성합니다. 여러 AWS 리전의 사용자들이 동일한 입력에 대해 추천이 일관되지 않고, 검색 단계에서 추론이 느리며, 지나치게 높은 온도로 추출하라는 등 안전하지 않은 추천이 나온다고 보고합니다. 회사는 반복 입력에 대한 출력 안정성을 높이고, 앱 성능과 출력 안전성을 개선해야 합니다. 업데이트된 솔루션은 동일 입력에 대해 99.5%의 출력 일관성과 1초 미만의 추론 지연 시간을 달성해야 하며, 검증된 안전 통제로 안전하지 않거나 환각된 추천을 차단해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","추론 지연 시간을 안정화하기 위해 프로비저닝된 처리량으로 Amazon Bedrock을 배포합니다. 의미 기반 거부 규칙이 있는 Amazon Bedrock 가드레일로 안전하지 않은 출력을 차단하고, Amazon Bedrock Prompt Management의 승인 워크플로로 프롬프트를 관리합니다."],["B","Amazon Bedrock Agents로 체이닝을 관리합니다. 모델 입출력을 Amazon CloudWatch Logs에 기록하고, CloudWatch 로그로 프롬프트 버전의 A/B 테스트를 수행합니다."],["C","프롬프트 결과를 Amazon ElastiCache에 캐싱합니다. AWS Lambda 함수로 메타데이터를 전처리하고 엔드투엔드 지연 시간을 추적하며, AWS X-Ray로 성능 병목을 식별·해결합니다."],["D","Amazon Kendra로 로스팅 로그 검색 정확도를 높입니다. 정규화된 프롬프트 메타데이터를 Amazon DynamoDB에 저장하고, AWS Step Functions로 다단계 프롬프트를 오케스트레이션합니다."]]},"en":{"q":"A specialty coffee company has a mobile app that generates personalized coffee roast profiles by using Amazon Bedrock with a three-stage prompt chain. The prompt chain converts user inputs into structured metadata, retrieves relevant logs for coffee roasts, and generates a personalized roast recommendation for each customer. Users in multiple AWS Regions report inconsistent roast recommendations for identical inputs, slow inference during the retrieval step, and unsafe recommendations such as brewing at excessively high temperatures. The company must improve the stability of outputs for repeated inputs. The company must also improve app performance and the safety of the app ' s outputs. The updated solution must ensure 99.5% output consistency for identical inputs and achieve inference latency of less than 1 second. The solution must also block unsafe or hallucinated recommendations by using validated safety controls.\nWhich solution will meet these requirements?","o":[["A","Deploy Amazon Bedrock with provisioned throughput to stabilize inference latency. Apply Amazon Bedrock guardrails that have semantic denial rules to block unsafe outputs. Use Amazon Bedrock Prompt Management to manage prompts by using approval workflows."],["B","Use Amazon Bedrock Agents to manage chaining. Log model inputs and outputs to Amazon CloudWatch Logs. Use logs from Amazon CloudWatch to perform A/B testing for prompt versions."],["C","Cache prompt results in Amazon ElastiCache. Use AWS Lambda functions to pre-process metadata and to trace end-to-end latency. Use AWS X-Ray to identify and remediate performance bottlenecks."],["D","Use Amazon Kendra to improve roast log retrieval accuracy. Store normalized prompt metadata within Amazon DynamoDB. Use AWS Step Functions to orchestrate multi-step prompts."]]},"ex":{"c":"프로비저닝 처리량으로 추론 지연 시간을 안정화하고, Guardrails의 거부 규칙으로 과도하게 높은 추출 온도 같은 위험한 권고를 차단합니다. Prompt Management의 승인 워크플로로 리전과 관계없이 동일한 승인된 프롬프트 버전을 쓰게 해 같은 입력에 대한 출력 일관성을 높입니다.","w":{"B":"로깅과 A/B 테스트는 일관성·안전성을 직접 보장하지 않습니다.","C":"캐시는 안전성 통제를 제공하지 않고 지연 원인 분석에 그칩니다.","D":"Kendra와 Step Functions는 안전성 통제와 일관성 문제를 해결하지 못합니다."}}},{"n":83,"a":["A"],"orig":"","ko":{"q":"한 의료 회사가 근거 기반 의료 정보를 제공하기 위해 RAG를 사용하는 GenAI 애플리케이션을 구축하고 있습니다. 애플리케이션은 Amazon OpenSearch Service로 벡터 임베딩을 검색합니다. 사용자들은 정확한 의학 용어와 약어가 포함된 결과가 검색에서 자주 누락되고, 의미적으로 유사하지만 관련 없는 문서가 너무 많이 반환된다고 보고합니다. 회사는 문서 컬렉션이 수백만 건으로 늘어나도 낮은 최종 사용자 지연 시간을 유지하면서 검색 품질을 개선해야 합니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","벡터 유사도와 키워드 매칭을 결합한 하이브리드 검색을 구성해 의미 이해와 정확한 용어·약어 매칭을 모두 개선합니다."],["B","벡터 임베딩 차원을 384에서 1536으로 늘리고, 검색 후 관련 없는 결과를 걸러내는 후처리 AWS Lambda 함수를 사용합니다."],["C","OpenSearch Service를 Amazon Kendra로 교체하고, 전처리 중 쿼리 확장으로 의료 약어와 용어 변형을 처리합니다."],["D","초기 벡터 검색 결과를 Amazon SageMaker에 호스팅한 ML 모델로 리랭킹하는 2단계 검색 아키텍처를 구현합니다."]]},"en":{"q":"A medical company is building a generative AI (GenAI) application that uses Retrieval Augmented Generation (RAG) to provide evidence-based medical information. The application uses Amazon OpenSearch Service to retrieve vector embeddings. Users report that searches frequently miss results that contain exact medical terms and acronyms and return too many semantically similar but irrelevant documents. The company needs to improve retrieval quality and maintain low enduser latency, even as the document collection grows to millions of documents.\nWhich solution will meet these requirements with the LEAST operational overhead?","o":[["A","Configure hybrid search by combining vector similarity with keyword matching to improve semantic understanding and exact term and acronym matching."],["B","Increase the dimensions of the vector embeddings from 384 to 1536. Use a post-processing AWS Lambda function to filter out irrelevant results after retrieval."],["C","Replace OpenSearch Service with Amazon Kendra. Use query expansion to handle medical acronyms and terminology variants during pre-processing."],["D","Implement a two-stage retrieval architecture in which initial vector search results are re-ranked by an ML model hosted on Amazon SageMaker."]]},"ex":{"c":"OpenSearch 하이브리드 검색은 벡터 유사도와 키워드(BM25) 매칭을 결합해 의미 이해와 정확한 의학 용어·약어 매칭을 동시에 제공합니다. 기존 OpenSearch 기능 설정만으로 가능해 운영 오버헤드가 가장 적고 대규모에서도 지연 시간이 낮습니다.","w":{"B":"차원을 늘려도 정확한 용어 매칭 문제는 해결되지 않고 Lambda 후처리는 지연을 늘립니다.","C":"Kendra로 교체하는 것은 큰 마이그레이션입니다.","D":"SageMaker 재순위화 모델은 운영 부담과 지연을 늘립니다."}}},{"n":84,"a":["B","D"],"orig":"","ko":{"q":"한 금융 서비스 회사가 Amazon Bedrock FM으로 콜센터 녹음을 분석하려고 합니다. 통화가 끝나면 콜센터는 녹음을 MP3 파일로 Amazon S3 버킷에 저장합니다. 회사는 새 파일이 생성되는 즉시 녹음에 대한 요약과 감정 분석을 구조화된 형식으로 생성해야 합니다. 녹음 파일의 평균 크기는 20MB입니다.\n이 요구 사항을 충족하는 솔루션 조합은 무엇입니까? (2개 선택)","o":[["A","AWS Step Functions로 녹음 처리 워크플로를 오케스트레이션합니다. Amazon Transcribe로 오디오를 텍스트로 변환하고, 작업 완료를 확인하고, AWS Lambda 함수를 호출해 Amazon Bedrock FM으로 텍스트를 처리해 구조화된 분석 출력을 생성하는 단계를 구성합니다."],["B","AWS Step Functions로 녹음 처리 워크플로를 오케스트레이션합니다. Amazon Transcribe로 오디오를 텍스트로 변환하고, 작업 완료를 확인하고, Amazon Bedrock FM을 직접 호출해 JSON 형식의 요약과 감정 분석을 생성하는 단계를 구성합니다."],["C","AWS Step Functions로 녹음 처리 워크플로를 오케스트레이션합니다. Amazon Transcribe로 오디오를 텍스트로 변환하고, 작업 완료를 확인하고, AWS Lambda 함수를 호출해 프롬프트를 만든 뒤 Amazon Bedrock FM을 호출해 구조화된 분석 출력을 생성하는 단계를 구성합니다."],["D","소스 S3 버킷이 Amazon EventBridge로 이벤트를 보내도록 구성합니다. 버킷에 객체가 생성되면 Step Functions 워크플로를 호출하는 EventBridge 규칙을 만듭니다."],["E","버킷에 객체가 생성되면 소스 S3 버킷이 Step Functions 워크플로로 알림을 보내도록 구성합니다."]]},"en":{"q":"A financial services company wants to use Amazon Bedrock foundation models (FMs) to analyze call center recordings. When calls end, the call center stores recordings as MP3 files in an Amazon S3 bucket. The company needs to generate summaries and sentiment analysis for the recordings in a structured format as soon as new files are created. The recordings average 20 MB in size.\nWhich combination of solutions will meet these requirements? (Select TWO.)","o":[["A","Use AWS Step Functions to orchestrate a workflow to process the recordings. Configure steps to invoke Amazon Transcribe to convert audio to text, validate job completion, and to invoke an AWS Lambda function to process the text by using Amazon Bedrock FMs to generate structured analysis output."],["B","Use AWS Step Functions to orchestrate a workflow to process the recordings. Configure steps to invoke Amazon Transcribe to convert audio to text, validate job completion, and to directly invoke Amazon Bedrock FMs to generate summaries and sentiment analysis in JSON format."],["C","Use AWS Step Functions to orchestrate a workflow to process the recordings. Configure steps to invoke Amazon Transcribe to convert audio to text, validate job completion, and to invoke an AWS Lambda function to create a prompt to invoke Amazon Bedrock FMs to generate structured analysis output."],["D","Configure the source S3 bucket to send events to Amazon EventBridge. Create an EventBridge rule to invoke the Step Functions workflow when an object is created in the bucket."],["E","Configure the source S3 bucket to send notifications to the Step Functions workflow when an object is created in the bucket."]]},"ex":{"c":"Step Functions가 Transcribe로 음성을 텍스트로 변환하고 작업 완료를 확인한 뒤, Bedrock 서비스 통합으로 FM을 직접 호출해 JSON 형식의 요약과 감정 분석을 생성합니다. Lambda가 필요 없습니다(B). S3 이벤트를 EventBridge로 보내고 객체 생성 규칙으로 워크플로를 시작하면 새 파일이 생기자마자 처리됩니다(D).","w":{"A":"Step Functions가 Bedrock을 직접 호출할 수 있으므로 Lambda는 불필요한 구성 요소입니다.","C":"프롬프트 생성은 Step Functions 안에서 할 수 있어 Lambda가 불필요합니다.","E":"S3 이벤트 알림은 Step Functions를 직접 대상으로 지정할 수 없습니다."}}},{"n":85,"a":["B"],"orig":"","ko":{"q":"한 의료 회사가 Amazon Bedrock으로 임상 문서 요약 시스템을 운영합니다. 이 시스템은 단순한 임상 문서에서는 잘 작동했지만 복잡한 임상 문서에서는 일관되지 않은 요약을 생성합니다. 회사는 불일치를 진단하고, 확립된 지표로 프롬프트 성능을 비교하며, 프롬프트 버전의 이력을 유지하는 솔루션이 필요합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock Prompt management로 여러 프롬프트 변형을 만듭니다. 단순한 임상 문서로 프롬프트를 수동 테스트하고, Amazon Bedrock 콘솔로 가장 성능이 좋은 버전을 배포합니다."],["B","코드 리포지토리에서 프롬프트 버전 관리를 구현하고, 복잡한 임상 문서와 정량적 평가 지표가 포함된 테스트 스위트를 둡니다. 자동화된 테스트 프레임워크로 프롬프트 버전을 비교하고 성능 패턴을 문서화합니다."],["C","각 새 프롬프트 버전을 별도의 Amazon Bedrock API 엔드포인트에 배포하고 프로덕션 트래픽을 엔드포인트 간에 분할합니다. Amazon CloudWatch가 응답 지표와 사용자 피드백을 수집해 버전을 자동 선택하도록 구성합니다."],["D","Amazon Bedrock Flows에서 동일한 임상 문서 입력을 여러 프롬프트 변형에 적용하는 사용자 지정 프롬프트 평가 플로를 만듭니다. Amazon Comprehend Medical로 각 버전의 사실 정확도를 분석·채점합니다."]]},"en":{"q":"A medical company uses Amazon Bedrock to power a clinical documentation summarization system. The system produces inconsistent summaries when handling complex clinical documents. The system performed well on simple clinical documents. The company needs a solution that diagnoses inconsistencies, compares prompt performance against established metrics, and maintains historical records of prompt versions.\nWhich solution will meet these requirements?","o":[["A","Create multiple prompt variants by using Prompt management in Amazon Bedrock. Manually test the prompts with simple clinical documents. Deploy the highest performing version by using the Amazon Bedrock console."],["B","Implement version control for prompts in a code repository with a test suite that contains complex clinical documents and quantifiable evaluation metrics. Use an automated testing framework to compare prompt versions and document performance patterns."],["C","Deploy each new prompt version to separate Amazon Bedrock API endpoints. Split production traffic between the endpoints. Configure Amazon CloudWatch to capture response metrics and user feedback for automatic version selection."],["D","Create a custom prompt evaluation flow in Amazon Bedrock Flows that applies the same clinical document inputs to different prompt variants. Use Amazon Comprehend Medical to analyze and score the factual accuracy of each version."]]},"ex":{"c":"코드 리포지토리로 프롬프트 버전 이력을 관리하고, 복잡한 임상 문서를 포함한 테스트 모음과 정량 평가 지표로 자동 테스트 프레임워크를 돌리면 불일치를 진단하고 버전 간 성능을 비교·기록할 수 있습니다.","w":{"A":"단순 문서로 수동 테스트하면 복잡한 문서의 문제를 진단하지 못합니다.","C":"Bedrock에는 프롬프트 버전별 API 엔드포인트가 없고, 운영 트래픽 실험은 진단 도구가 아닙니다.","D":"Comprehend Medical은 엔터티 추출 도구로 요약의 사실 정확도를 채점하지 않습니다."}}},{"n":86,"a":["D"],"orig":"","ko":{"q":"한 회사가 다양한 내부 및 외부 데이터 소스를 바탕으로 콘텐츠를 생성하는 GenAI 애플리케이션을 구축하고 있습니다. 회사는 생성된 출력을 완전히 추적할 수 있기를 원합니다. 애플리케이션은 데이터 소스 등록을 지원하고, 콘텐츠를 원본 소스로 귀속할 수 있도록 메타데이터 태그 지정을 지원해야 합니다. 또한 파이프라인 전반의 데이터 액세스 및 사용에 대한 감사 로그를 유지해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AWS Lake Formation으로 데이터 소스를 카탈로그화하고 액세스를 제어합니다. Amazon S3에 메타데이터 태그를 직접 적용하고, AWS CloudTrail로 API 활동을 모니터링합니다."],["B","AWS Glue Data Catalog로 데이터 소스를 등록하고 태그를 지정합니다. Amazon CloudWatch Logs로 액세스 패턴과 애플리케이션 동작을 모니터링합니다."],["C","데이터를 Amazon S3에 저장하고 객체 태그로 출처를 표시합니다. AWS Glue Data Catalog로 스키마 정보를 관리하고, AWS CloudTrail로 S3 버킷 액세스를 기록합니다."],["D","AWS Glue Data Catalog에 모든 데이터 소스를 등록합니다. 메타데이터 태그를 적용해 데이터 소스를 귀속하고, AWS CloudTrail로 서비스 전반의 액세스와 활동을 기록합니다."]]},"en":{"q":"A company is building a generative AI (GenAI) application that produces content based on a variety of internal and external data sources. The company wants to ensure that the generated output is fully traceable. The application must support data source registration and enable metadata tagging to attribute content to its original source. The application must also maintain audit logs of data access and usage throughout the pipeline.\nWhich solution will meet these requirements?","o":[["A","Use AWS Lake Formation to catalog data sources and control access. Apply metadata tags directly in Amazon S3. Use AWS CloudTrail to monitor API activity."],["B","Use AWS Glue Data Catalog to register and tag data sources. Use Amazon CloudWatch Logs to monitor access patterns and application behavior."],["C","Store data in Amazon S3 and use object tagging for attribution. Use AWS Glue Data Catalog to manage schema information. Use AWS CloudTrail to log access to S3 buckets."],["D","Use AWS Glue Data Catalog to register all data sources. Apply metadata tags to attribute data sources.Use AWS CloudTrail to log access and activity across services."]]},"ex":{"c":"Glue Data Catalog로 모든 데이터 소스를 등록하고 메타데이터 태그로 출처를 기록하며, CloudTrail로 여러 서비스에 걸친 접근과 활동을 감사합니다. 소스 등록, 태그 기반 출처 표시, 파이프라인 전체 감사 로그를 모두 충족합니다.","w":{"A":"태그를 S3에만 적용하면 외부 데이터 소스를 포괄하지 못합니다.","B":"CloudWatch Logs는 데이터 접근 감사 기록이 아닙니다.","C":"S3에 저장된 데이터만 다뤄 외부 소스 등록과 파이프라인 전체 감사가 부족합니다."}}},{"n":87,"a":["C"],"orig":"","ko":{"q":"한 은행이 웹사이트 사용자의 계좌 문의와 금융 안내를 돕기 위해 Amazon Bedrock을 사용하는 GenAI 기반 AI 어시스턴트를 개발하고 있습니다. 은행은 AI 어시스턴트가 고객 상호 작용에서 PII를 노출하지 않도록 해야 하며, 프롬프트에 PII를 담아 GenAI 모델로 보내서도 안 됩니다. AI 어시스턴트는 투자 조언 요청에 응답해서는 안 됩니다. 은행은 상호 작용 중 전송된 이미지나 문서를 포함해 모든 고객 상호 작용의 감사 로그를 수집해야 합니다.\n운영 노력이 가장 적은 솔루션은 무엇입니까?","o":[["A","Amazon Macie로 사용자 입력과 모델 응답의 PII를 감지·삭제합니다. 프롬프트 엔지니어링 기법으로 모델이 투자 조언 주제를 피하도록 하고, AWS CloudTrail로 대화 로그를 수집합니다."],["B","AWS Lambda 함수와 Amazon Comprehend로 PII를 감지·삭제합니다. Amazon Comprehend 토픽 모델링으로 AI 어시스턴트가 투자 조언 주제를 다루지 못하게 하고, Amazon CloudWatch 사용자 지정 지표로 고객 대화를 수집합니다."],["C","민감 정보 정책을 적용해 PII를 감지·필터링하도록 Amazon Bedrock 가드레일을 구성합니다. 주제 정책을 설정해 AI 어시스턴트가 투자 조언 주제를 피하도록 합니다. Converse API로 모델 호출을 기록하고, Amazon S3로의 전송(delivery) 로깅과 이미지 로깅을 활성화합니다."],["D","정규식으로 PII 패턴을 매칭합니다. 프롬프트 엔지니어링 기법으로 PII나 투자 조언 주제를 고객에게 반환하지 않도록 하고, Amazon S3로의 모델 호출 로깅, 전송 로깅, 이미지 로깅을 활성화합니다."]]},"en":{"q":"A bank is developing a generative AI (GenAI)-powered AI assistant that uses Amazon Bedrock to assist the bank's website users with account inquiries and financial guidance. The bank must ensure that the AI assistant does not reveal any personally identifiable information (PII) in customer interactions. The AI assistant must not send PII in prompts to the GenAI model. The AI assistant must not respond to customer requests to provide investment advice. The bank must collect audit logs of all customer interactions, including any images or documents that are transmitted during customer interactions.\nWhich solution will meet these requirements with the LEAST operational effort?","o":[["A","Use Amazon Macie to detect and redact PII in user inputs and in the model responses. Apply prompt engineering techniques to force the model to avoid investment advice topics. Use AWS CloudTrail to capture conversation logs."],["B","Use an AWS Lambda function and Amazon Comprehend to detect and redact PII. Use Amazon Comprehend topic modeling to prevent the AI assistant from discussing investment advice topics. Set up custom metrics in Amazon CloudWatch to capture customer conversations."],["C","Configure Amazon Bedrock guardrails to apply a sensitive information policy to detect and filter PII. Set up a topic policy to ensure that the AI assistant avoids investment advice topics. Use the Converse API to log model invocations. Enable delivery and image logging to Amazon S3."],["D","Use regex controls to match patterns for PII. Apply prompt engineering techniques to avoid returning PII or investment advice topics to customers. Enable model invocation logging, delivery logging, and image logging to Amazon S3."]]},"ex":{"c":"Bedrock Guardrails의 민감 정보 정책으로 입력과 출력의 PII를 탐지·필터링하고, 주제 정책으로 투자 조언을 거부합니다. 모델 호출 로깅을 S3로 보내고 이미지 로깅을 켜면 이미지와 문서를 포함한 모든 상호 작용을 감사할 수 있습니다. 관리형 기능만 사용해 운영 노력이 가장 적습니다.","w":{"A":"Macie는 S3 데이터 스캔 서비스로 실시간 입출력 수정이 불가능하고, CloudTrail에는 대화 내용이 없습니다.","B":"토픽 모델링은 분석 기법으로 대화를 차단하지 못하고, 사용자 지정 지표로는 대화를 기록할 수 없습니다.","D":"정규식과 프롬프트 엔지니어링은 신뢰성이 낮고 유지 관리 부담이 큽니다."}}},{"n":88,"a":["B"],"orig":"","ko":{"q":"한 금융 서비스 회사가 분석가가 분기 실적 보고서와 재무제표를 조회할 수 있는 Amazon Bedrock 애플리케이션을 개발하려고 합니다. 재무 문서는 보통 5~100페이지이며 표 데이터와 텍스트를 모두 포함합니다. 애플리케이션은 재무 지표와 그 설명 텍스트 간 관계를 보존하는, 맥락상 정확한 응답을 제공해야 합니다. 정확하고 확장 가능한 검색을 위해 문서 분할과 컨텍스트 관리 전략을 포함해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Anthropic Claude로 각 재무 문서를 단일 입력으로 처리하는 직접 모델 호출 방식을 사용합니다. 모델이 표와 텍스트를 따로 파싱하도록 지시하는 정교한 프롬프트를 사용합니다."],["B","Amazon Bedrock Knowledge Bases로, 재무 문서의 맥락 단위로 청킹된 섹션에서 관련 정보를 검색하는 RAG 애플리케이션을 만듭니다. 문서의 구조적 레이아웃을 기준으로 분할하고, 원본 자료를 참조하는 인용을 포함합니다."],["C","재무 문서를 분석하는 사용자 지정 AWS Lambda 함수를 호출하는 액션 그룹이 있는 Amazon Bedrock 에이전트를 배포합니다. 사용자가 재무 지표에 관한 쿼리를 제출하면 Lambda 함수가 고정 크기 청킹을 수행하도록 구성합니다."],["D","정형 데이터에 최적화된 전문 Amazon Bedrock 애플리케이션과 비정형 데이터에 최적화된 두 번째 애플리케이션을 만듭니다. 각 애플리케이션이 콘텐츠 유형에 맞는 청킹 전략을 사용하도록 구성하고, 쿼리를 적절한 소스로 연결하는 로직을 구현합니다."]]},"en":{"q":"A financial services company wants to develop an Amazon Bedrock application that gives analysts the ability to query quarterly earnings reports and financial statements. The financial docu ments are typically 5-100 pages long and contain both tabular data and text. The application must provide contextually accurate responses that preserve the relationship between financial metrics and their explanatory text. To support accurate and scalable retrieval, the application must incorporate document segmentation and context management strategies.\nWhich solution will meet these requirements?","o":[["A","Use a direct model invocation approach that uses Anthropic Claude to process each financial document as a single input. Use fine-tuned prompts that instruct the model to parse tables and text separately."],["B","Use Amazon Bedrock Knowledge Bases to create a Retrieval Augmented Generation (RAG) application that retrieves relevant information from contextually chunked sections of financial documents. Segment documents based on their structural layout. Include citations that reference the original source materials."],["C","Deploy an Amazon Bedrock agent that has an action group that calls custom AWS Lambda functions to analyze financial documents. Configure the Lambda functions to perform fixed-size chunking when a user submits a query about financial metrics."],["D","Create one specialized Amazon Bedrock application that is optimized for structured data. Create a second application that is optimized for unstructured data. Configure each application to use a tailored chunking strategy that is suited to the application ' s content type. Implement logic to link queries to the appropriate sources."]]},"ex":{"c":"Knowledge Bases에서 문서의 구조적 레이아웃(섹션, 표)을 기준으로 청크를 나누면 재무 지표와 설명 텍스트의 관계가 유지됩니다. RAG로 관련 섹션만 검색해 확장성 있게 응답하고, 원문 출처 인용도 제공합니다.","w":{"A":"100페이지 문서를 단일 입력으로 처리하는 것은 확장성이 없고 컨텍스트 관리 전략이 없습니다.","C":"쿼리 때마다 고정 크기로 청크를 나누면 표와 설명이 분리되고 비효율적입니다.","D":"정형·비정형을 분리하면 지표와 설명 텍스트의 관계가 끊어집니다."}}},{"n":89,"a":["A"],"orig":"","ko":{"q":"한 글로벌 금융 서비스 회사가 Amazon Bedrock FM으로 의심 거래에 대한 설명을 생성하는 사기 경보 시스템을 운영합니다. 회사는 세 지역에 걸쳐 규제 대상 금융 데이터를 처리합니다. 시스템은 전 세계적으로 일관된 응답성을 유지하고, 다중 리전 장애 조치를 지원하며, 감사 및 규정 준수 팀을 위한 완전한 관측성을 제공해야 합니다. 부하 테스트 결과 FM의 총 추론 시간은 줄일 수 없습니다. 회사는 추론 비용을 늘리거나, FM을 바꾸거나, 토큰 수를 수정하거나, 추가 컴퓨팅 용량을 프로비저닝할 수 없습니다. 사용자들은 UI가 전체 모델 응답을 기다린 뒤에야 콘텐츠를 보여줘서 느리다고 보고합니다. 회사는 동시 요청이 10,000~15,000건에 이르는 피크 시간에 체감 응답성을 개선해야 하며, 다중 리전 복원력과 완전한 모니터링 가시성을 유지해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","InvokeModelWithResponseStream API로 응답 스트리밍을 활성화해, 프런트엔드가 생성된 토큰을 도착하는 대로 표시하게 합니다. Amazon CloudWatch에서 지표를 수집하고 분산 추적을 활성화해 스트리밍 지연 시간과 리전별 성능을 모니터링합니다."],["B","리전별 Amazon Bedrock 추론 엔드포인트를 배포하고 Amazon Route 53 지연 시간 기반 라우팅을 설정합니다. 부분 처리된 설명을 글로벌 Amazon DynamoDB 테이블에 캐싱해 피크 시간에 더 빠르게 응답합니다."],["C","Lambda@Edge 전처리 계층으로 피크 시간에 입력을 압축합니다. 시스템이 고객에게 임시 자리 표시 응답을 반환하는 동안 Amazon Bedrock을 비동기로 호출합니다."],["D","여러 AWS 리전에서 추론 요청을 처리하는 AWS Lambda 함수를 배포하고 Lambda 동시성 한도를 늘립니다. 피크 시간의 백엔드 부하를 줄이기 위해 Amazon CloudWatch Logs 보존 기간을 줄입니다."]]},"en":{"q":"A global financial services company hosts a fraud-alert system that uses an Amazon Bedrock foundation model (FM) to generate explanations for suspicious transactions. The company processes regulated financial data across three geographic areas. The system must maintain consistent responsiveness globally, support multi-Region failover, and provide full observability for audit and compliance teams. Load testing shows that the FM's total inference time cannot be reduced. The company cannot increase its inference costs, change the FM, modify token counts, or provision additional compute capacity. Users report that the UI performs slowly because it waits for the complete model response before it shows any content. The company must improve perceived responsiveness during peak periods, when the system can receive 10,000-15,000 concurrent requests. The solution must maintain multi-Region resiliency and full monitoring visibility.\nWhich solution will meet these requirements?","o":[["A","Enable response streaming by using the InvokeModelWithResponseStream API so the frontend can display generated tokens as the tokens arrive. Collect metrics in Amazon CloudWatch and enable distributed tracing to monitor streaming latency and Regional performance."],["B","Deploy Regional Amazon Bedrock inference endpoints. Set up latency-based Amazon Route 53 routing. Cache partially processed explanations in a global Amazon DynamoDB table to serve responses more quickly during peak periods."],["C","Use a Lambda@Edge preprocessing layer to condense inputs during peak periods. Asynchronously call Amazon Bedrock while the system returns interim placeholder responses to customers."],["D","Deploy AWS Lambda functions to handle inference requests across multiple AWS Regions. Increase Lambda concurrency limits. Scale down Amazon CloudWatch Logs retention to reduce backend load during peak periods."]]},"ex":{"c":"전체 추론 시간을 줄일 수 없으므로 InvokeModelWithResponseStream으로 토큰이 생성되는 대로 화면에 표시해 체감 응답성을 높입니다. 비용·모델·토큰·용량을 바꾸지 않고, CloudWatch 지표와 분산 추적으로 리전별 성능과 스트리밍 지연을 모니터링합니다.","w":{"B":"부분 처리된 설명을 캐시하는 것은 실제로 의미가 없고 추가 비용이 듭니다.","C":"입력 축약은 토큰 수 변경이고, 자리 표시자 응답은 실제 내용이 아닙니다.","D":"로그 보존 기간 단축은 모니터링 가시성 요구에 어긋나고 응답성을 개선하지 않습니다."}}},{"n":90,"a":["B"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock FM을 사용하는 GenAI 기반 고객 지원 애플리케이션을 개발하고 있습니다. 애플리케이션은 같은 사용자와의 여러 상호 작용에 걸쳐 대화 컨텍스트를 유지해야 하고, 모호한 사용자 쿼리를 처리하기 위한 확인(clarification) 워크플로를 실행해야 합니다. 회사는 개인화에 사용하기 위해 각 사용자 대화의 암호화된 기록을 저장해야 합니다. 애플리케이션은 각 사용자에게 빠르게 응답하면서 수천 명의 동시 사용자를 처리할 수 있어야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AWS Step Functions Express 워크플로로 대화 흐름을 오케스트레이션합니다. AWS Lambda 함수로 확인 로직을 실행하고, 세션 ID를 기본 키로 사용해 대화 기록을 Amazon RDS에 저장합니다."],["B","AWS Step Functions Standard 워크플로로 확인 워크플로를 오케스트레이션하고, 콜백 대기(Wait for a Callback) 패턴으로 워크플로를 관리합니다. 대화 기록을 Amazon DynamoDB에 저장하고, 온디맨드 용량을 사용하며 서버 측 암호화를 구성합니다."],["C","Amazon API Gateway REST API로 사용자 요청을 AWS Lambda 함수로 라우팅해 대화 컨텍스트를 업데이트·조회하도록 애플리케이션을 배포합니다. 대화 기록을 Amazon S3에 저장하고 서버 측 암호화를 구성하며, 각 상호 작용을 별도의 JSON 파일로 저장합니다."],["D","AWS Lambda 함수로 Amazon Bedrock 추론 API를 호출합니다. Amazon SQS 대기열로 확인 단계를 오케스트레이션하고, 대화 기록을 Amazon ElastiCache(Redis OSS) 클러스터에 저장하며 저장 데이터 암호화를 구성합니다."]]},"en":{"q":"A company is developing a generative AI (GenAI)-powered customer support application that uses Amazon Bedrock foundation models (FMs). The application must maintain conversational context across multiple interactions with the same user. The application must run clarification workflows to handle ambiguous user queries. The company must store encrypted records of each user conversation to use for personalization. The application must be able to handle thousands of concurrent users while responding to each user quickly.\nWhich solution will meet these requirements?","o":[["A","Use an AWS Step Functions Express workflow to orchestrate conversation flow. Invoke AWS Lambda functions to run clarification logic. Store conversation history in Amazon RDS and use session IDs as the primary key."],["B","Use an AWS Step Functions Standard workflow to orchestrate clarification workflows. Include Wait for a Callback patterns to manage the workflows. Store conversation history in Amazon DynamoDB. Purchase on-demand capacity and configure server-side encryption."],["C","Deploy the application by using an Amazon API Gateway REST API to route user requests to an AWS Lambda function to update and retrieve conversation context. Store conversation history in Amazon S3 and configure server-side encryption. Save each interaction as a separate JSON file."],["D","Use AWS Lambda functions to call Amazon Bedrock inference APIs. Use Amazon SQS queues to orchestrate clarification steps. Store conversation history in an Amazon ElastiCache (Redis OSS) cluster. Configure encryption at rest."]]},"ex":{"c":"Step Functions Standard 워크플로의 콜백 대기(waitForTaskToken) 패턴으로 사용자 응답을 기다리는 명확화 워크플로를 구현합니다. 대화 기록은 DynamoDB 온디맨드 용량에 서버 측 암호화로 저장해 수천 명 동시 사용자에게 빠르게 응답합니다.","w":{"A":"Express 워크플로는 최대 5분이라 사용자 응답을 기다리는 콜백에 맞지 않고, RDS는 확장성이 낮습니다.","C":"상호 작용마다 S3 JSON 파일로 저장하면 맥락 조회가 느리고 명확화 워크플로가 없습니다.","D":"ElastiCache는 지속적 기록 저장소로 적합하지 않고 SQS는 대화형 흐름 관리에 맞지 않습니다."}}},{"n":91,"a":["B"],"orig":"C","ko":{"q":"한 회사가 Amazon Bedrock으로 여러 AWS 리전과 여러 언어의 사용자를 위한 기술 문서를 생성하는 애플리케이션을 배포했습니다. 사용자들이 서로 다른 언어로 의미가 비슷한 질문을 자주 제출해 추론 비용과 응답 지연 시간이 늘고 있습니다. 회사는 추론 비용을 크게 줄이고, 전 세계에 짧은 지연 시간으로 응답하며, 5분 TTL로 캐시 최신성을 유지하고, 사용자 지정 캐시 키 생성과 애플리케이션이 관리하는 캐싱 로직을 최소화하는 캐싱 솔루션이 필요합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","AWS Lambda 함수로 추론 결과를 Amazon DynamoDB 테이블에 저장하는 사용자 지정 캐싱 시스템을 만듭니다. Amazon CloudFront로 5분 TTL과 함께 캐시된 응답을 전 세계 사용자에게 배포합니다."],["B","언어 간 의미가 비슷한 쿼리에 대해 Amazon Bedrock 프롬프트 캐싱을 구성합니다. Amazon CloudFront와 Lambda@Edge 함수로 리전별 캐시 배포를 처리하고, 두 캐싱 계층 모두 TTL을 5분으로 설정합니다."],["C","애플리케이션이 실행되는 각 리전에 Amazon ElastiCache(Redis OSS) 클러스터를 만들어, 다국어 쿼리용 사용자 지정 핑거프린팅과 함께 추론 결과를 저장합니다. 5분 TTL로 리전 클러스터 간 자동 복제를 구성합니다."],["D","Amazon DynamoDB Accelerator(DAX)로 추론 결과를 캐싱하고 TTL을 자동 관리합니다. Amazon CloudFront로 API 응답을 전 세계에 배포하고, 엣지 함수로 언어별 변환을 처리합니다."]]},"en":{"q":"A company uses Amazon Bedrock to deploy an application that generates technical documentation for users across multiple AWS Regions and in multiple languages. Users frequently submit semantically similar questions in different languages, which results in increased inference costs and response latency. The company needs a caching solution that significantly reduces inference costs, provides low-latency responses globally, maintains cache freshness with a 5-minute TTL, and minimizes custom cache key generation and application-managed caching logic.\nWhich solution will meet these requirements?","o":[["A","Create a custom caching system that uses AWS Lambda functions to store inference results in an Amazon DynamoDB table. Use Amazon CloudFront to distribute cached responses to global users with a 5-minute TTL."],["B","Configure prompt caching in Amazon Bedrock for semantically similar queries across languages. Use Amazon CloudFront and Lambda@Edge functions to handle Regional cache distribution. Set a TTL of 5 minutes for both caching layers."],["C","Create Amazon ElastiCache (Redis OSS) clusters in each Region where the application runs to store inference results with custom fingerprinting for multilingual queries. Configure automatic replication between Regional clusters with a 5-minute TTL."],["D","Use Amazon DynamoDB Accelerator (DAX) to cache inference results and to automatically manage TTL. Use Amazon CloudFront to distribute API responses globally. Use edge functions to handle language-specific transformations."]]},"ex":{"c":"Bedrock 프롬프트 캐싱은 반복되는 프롬프트 접두사를 캐시해 추론 비용과 지연 시간을 줄이는 관리형 기능이고, CloudFront와 Lambda@Edge는 전 세계 사용자에게 낮은 지연으로 응답을 배포합니다. 두 계층에 5분 TTL을 두면 신선도를 유지하면서 애플리케이션 캐시 로직을 최소화합니다. (원본 덤프 답은 C였지만 사용자 지정 핑거프린팅이 필요해 '사용자 지정 키 최소화' 요구에 어긋납니다.)","w":{"A":"사용자 지정 캐시 시스템을 직접 구현해야 합니다.","C":"다국어 질의용 사용자 지정 핑거프린팅과 리전 간 복제 관리가 필요합니다.","D":"DAX는 DynamoDB 읽기 캐시로 추론 결과 캐싱에 맞지 않고 사용자 지정 로직이 필요합니다."}}},{"n":92,"a":["A"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock으로 민감한 고객 문의를 처리하는 고객용 AI 어시스턴트를 구축하고 있습니다. 회사는 정교한 프롬프트 인젝션 공격을 차단하기 위해 심층 방어(defense-in-depth) 안전 통제를 사용해야 하며, 모든 안전 개입에 대한 감사 로그를 유지해야 합니다. AI 어시스턴트는 교차 리전 장애 조치 기능을 갖춰야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","프롬프트 인젝션 공격을 막기 위해 콘텐츠 필터를 높음(high)으로 설정한 Amazon Bedrock 가드레일을 구성합니다. 가드레일 프로필로 교차 리전 가드레일 추론을 구현하고, 사용자 지정 지표가 있는 Amazon CloudWatch Logs로 상세한 가드레일 개입 이벤트를 수집합니다."],["B","콘텐츠 필터를 높음으로 설정한 Amazon Bedrock 가드레일을 구성합니다. AWS WAF로 의심스러운 입력을 차단하고, AWS CloudTrail로 API 호출을 기록합니다."],["C","Amazon Comprehend 사용자 지정 분류기로 프롬프트 인젝션 공격을 감지합니다. Amazon API Gateway 요청 검증을 사용하고, CloudWatch Logs로 개입 이벤트를 수집합니다."],["D","사용자 지정 콘텐츠 필터와 단어 필터를 높음으로 설정한 Amazon Bedrock 가드레일을 구성합니다. 장애 조치를 위해 교차 리전 가드레일 복제를 구성하고, 규정 준수 감사를 위해 로그를 AWS CloudTrail에 저장합니다."]]},"en":{"q":"A company is using Amazon Bedrock to build a customer-facing AI assistant that handles sensitive customer inquiries. The company must use defense-in-depth safety controls to block sophisticated prompt injection attacks. The company must keep audit logs of all safety interventions. The AI assistant must have cross- Region failover capabilities.\nWhich solution will meet these requirements?","o":[["A","Configure Amazon Bedrock guardrails with content filters set to high to protect against prompt injection attacks. Use a guardrail profile to implement cross-Region guardrail inference. Use Amazon CloudWatch Logs with custom metrics to capture detailed guardrail intervention events."],["B","Configure Amazon Bedrock guardrails with content filters set to high. Use AWS WAF to block suspicious inputs. Use AWS CloudTrail to log API calls."],["C","Deploy Amazon Comprehend custom classifiers to detect prompt injection attacks. Use Amazon API Gateway request validation. Use CloudWatch Logs to capture intervention events."],["D","Configure Amazon Bedrock guardrails with custom content filters and word filters set to high.Configure cross-Region guardrail replication for failover. Store logs in AWS CloudTrail for compliance auditing."]]},"ex":{"c":"Guardrails 콘텐츠 필터의 프롬프트 공격(prompt attack) 강도를 높음으로 설정해 프롬프트 인젝션을 막고, 가드레일 프로필로 교차 리전 가드레일 추론을 구성해 리전 장애에 대비합니다. CloudWatch Logs와 사용자 지정 지표로 가드레일 개입 이벤트를 상세히 기록합니다.","w":{"B":"WAF는 의미 기반 프롬프트 인젝션을 탐지하지 못하고, 교차 리전 장애 조치가 없습니다.","C":"Comprehend 사용자 지정 분류기를 직접 구축해야 하고 장애 조치가 없습니다.","D":"단어 필터는 프롬프트 인젝션 방어책이 아니고 '가드레일 복제' 기능은 없으며, CloudTrail에는 개입 상세 내용이 남지 않습니다."}}},{"n":93,"a":["D"],"orig":"","ko":{"q":"GenAI 개발자가 Amazon Bedrock AgentCore로 에이전트형 AI 애플리케이션을 구축하고 있습니다. 애플리케이션은 개발 및 프로덕션 환경에서 여러 FM을 오케스트레이션합니다. 도구 호출 단계에서 간헐적인 장애가 발생하며, FM 체인의 복잡한 오류 패턴 때문에 장애 하나를 진단하는 데 평균 3시간이 걸립니다. GenAI 개발자는 기존 수동 프로세스보다 짧은 시간에 도구 호출 체인의 AI 특유의 오류 패턴을 식별할 수 있는 솔루션이 필요합니다. 솔루션은 개발팀과 보안팀 간 협업을 지원하고, 민감한 고객 데이터를 보호하는 기능을 제공해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","상세한 Amazon Bedrock API 지표를 표시하는 Amazon CloudWatch 대시보드를 만들고 Amazon GuardDuty와 통합합니다. CloudWatch Logs Insights로 오류를 분석합니다."],["B","Kiro를 IDE로 사용해 애플리케이션 코드베이스와 추적 로그에 직접 접근합니다. 애플리케이션 코드와 추적 로그를 함께 분석해 에이전트가 도구 호출을 오케스트레이션하는 방식을 이해하도록, IDE에서 바로 오류 패턴을 실시간 분석합니다."],["C","모델 호출을 처리하는 모든 AWS Lambda 함수에 AWS X-Ray 추적을 설정합니다. Amazon OpenSearch Service로 OpenSearch 대시보드 시각화가 포함된 사용자 지정 모니터링 솔루션을 만듭니다."],["D","AWS Distro for OpenTelemetry 계측과 함께 Amazon Bedrock AgentCore Observability를 활성화합니다. Amazon CloudWatch Generative AI Observability로 추적을 분석하고 도구 호출을 모니터링합니다."]]},"en":{"q":"A GenAI developer is using Amazon Bedrock AgentCore to build an agentic AI application. The application orchestrates multiple foundation models (FMs) across development and production environments. The application experiences intermittent failures during tool invocation phases. Each incident requires an average of 3 hours to diagnose because of complex error patterns in the FM chains. The GenAI developer needs a solution that can identify AI-specific error patterns in tool invocation chains in less time than the existing manual process. The solution must support collaboration between development and security teams. The solution must provide capabilities to protect sensitive customer data.\nWhich solution will meet these requirements?","o":[["A","Create an Amazon CloudWatch dashboard that displays detailed Amazon Bedrock API metrics. Integrate the dashboard with Amazon GuardDuty. Use CloudWatch Logs Insights to perform error analysis."],["B","Use Kiro as the integrated development environment (IDE) to directly access both application codebases and trace logs. Enable real-time analysis of error patterns directly in the IDE by analyzing both application code and trace logs together to understand how the agents orchestrate tool invocations."],["C","Set up AWS X-Ray tracing for all AWS Lambda functions that handle model invocations. Use Amazon OpenSearch Service to create a custom monitoring solution with OpenSearch dashboard visualizations."],["D","Enable Amazon Bedrock AgentCore Observability with AWS Distro for OpenTelemetry instrumentation. Use Amazon CloudWatch Generative AI Observability to perform trace analysis and to monitor tool invocations."]]},"ex":{"c":"AgentCore Observability는 AWS Distro for OpenTelemetry(ADOT)로 에이전트·도구 호출 체인을 추적하고, CloudWatch 생성형 AI 관측성에서 AI 특화 오류 패턴을 분석합니다. 개발팀과 보안팀이 같은 CloudWatch 데이터를 공유하며, CloudWatch Logs 데이터 보호로 민감 데이터를 마스킹할 수 있습니다.","w":{"A":"GuardDuty는 위협 탐지 서비스로 도구 호출 오류 분석과 무관합니다.","B":"IDE 기반 분석은 팀 간 협업과 데이터 보호 요구를 충족하지 못합니다.","C":"OpenSearch로 사용자 지정 모니터링 솔루션을 구축해야 합니다."}}},{"n":94,"a":["A"],"orig":"","ko":{"q":"한 회사가 Amazon Bedrock으로 고객에게 추천을 제공하는 AI 자문 애플리케이션을 구축하고 있습니다. 애플리케이션은 추론 과정을 설명하고 데이터의 구체적인 출처를 인용해야 합니다. 회사 데이터 소스에서 정보를 검색하고 추천에 대한 단계별 추론을 보여줘야 하며, 데이터 주장을 원본 문서에 연결하고 응답 지연 시간을 3초 미만으로 유지해야 합니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","출처 표시(source attribution)를 활성화한 Amazon Bedrock Knowledge Bases를 사용합니다. RAG와 함께 Anthropic Claude Messages API를 사용해 원본 문서에 높은 관련성 임계값을 설정합니다. 감사를 위해 추론과 인용 정보를 Amazon S3에 저장합니다."],["B","확장 사고(extended thinking)가 있는 Anthropic Claude 모델과 Amazon Bedrock을 사용합니다. 사고 예산을 4,000토큰으로 구성하고, 감사를 위해 추론 기록과 인용을 Amazon DynamoDB에 저장합니다."],["C","사용자 지정 Anthropic Claude 모델로 Amazon SageMaker AI를 구성합니다. 모델의 reasoning 파라미터와 AWS Lambda로 응답을 처리하고, 별도의 Amazon RDS 데이터베이스에서 출처 인용을 추가합니다."],["D","CoT(chain-of-thought) 추론이 있는 Anthropic Claude 모델과 Amazon Bedrock을 사용합니다. Amazon Bedrock Knowledge Bases API로 사용자 지정 검색 추적을 구성하고, Amazon CloudWatch로 응답 지연 시간 지표를 모니터링합니다."]]},"en":{"q":"A company is building an AI advisory application by using Amazon Bedrock. The application will provide recommendations to customers. The company needs the application to explain its reasoning process and cite specific sources for data. The application must retrieve information from company data sources and show step- by-step reasoning for recommendations. The application must also link data claims to source documents and maintain response latency under 3 seconds.\nWhich solution will meet these requirements with the LEAST operational overhead?","o":[["A","Use Amazon Bedrock Knowledge Bases with source attribution enabled. Use the Anthropic Claude Messages API with RAG to set high-relevance thresholds for source documents. Store reasoning and citations in Amazon S3 for auditing purposes."],["B","Use Amazon Bedrock with Anthropic Claude models and extended thinking. Configure a 4,000token thinking budget. Store reasoning traces and citations in Amazon DynamoDB for auditing purposes."],["C","Configure Amazon SageMaker AI with a custom Anthropic Claude model. Use the model's reasoning parameter and AWS Lambda to process responses. Add source citations from a separate Amazon RDS database."],["D","Use Amazon Bedrock with Anthropic Claude models and chain-of-thought reasoning. Configure custom retrieval tracking with the Amazon Bedrock Knowledge Bases API. Use Amazon CloudWatch to monitor response latency metrics."]]},"ex":{"c":"Knowledge Bases의 출처 표시(source attribution)는 응답의 주장을 원문 문서와 연결하는 인용을 제공합니다. Claude Messages API로 RAG를 수행하면서 관련성 임계값을 높여 정확한 출처만 사용하고, 추론과 인용을 S3에 저장해 감사합니다. 관리형 기능이라 오버헤드가 적고 3초 지연 요구도 충족합니다.","w":{"B":"4,000토큰 확장 사고는 지연 시간을 늘리고, 회사 데이터 검색과 출처 연결이 없습니다.","C":"SageMaker에 사용자 지정 Claude 모델을 호스팅할 수 없고 운영 부담도 큽니다.","D":"사용자 지정 검색 추적을 직접 구성해야 해 오버헤드가 큽니다."}}},{"n":95,"a":["B"],"orig":"","ko":{"q":"한 회사가 유럽과 미주 여러 국가에서 운영되는 5개의 독립 사업부에 여러 GenAI 애플리케이션을 배포할 계획입니다. 각 애플리케이션은 테라바이트 규모의 비정형 데이터를 저장하는 사업부별 지식 기반과 함께 Amazon Bedrock RAG 패턴을 사용합니다. 회사는 모든 GenAI 애플리케이션에 걸쳐 보안 통제, 관측성 관행, 배포 패턴에 대해 잘 설계된 표준화 구성 요소를 수립해야 합니다. 이 구성 요소는 재사용 가능하고, 버전 관리되며, 일관되게 관리되어야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","GenAI 애플리케이션용 Amazon API Gateway REST API 엔드포인트를 구성합니다. AWS Well-Architected Generative AI Lens에 기반한 공통 보안, 관측성, RAG 패턴을 표준화된 AWS CloudFormation 템플릿으로 배포합니다. 배포 후 CloudFormation Guard로 각 사업부의 정책 준수를 검증합니다."],["B","AWS Well-Architected Generative AI Lens에 기반한 보안, 관측성, RAG 패턴을 구현하는 표준화된 AWS CloudFormation 템플릿을 만듭니다. 버전 관리를 위한 중앙 리포지토리를 구축하고, CloudFormation Guard와 CI/CD 파이프라인을 통합해 사업부 전반에 일관되고 반복 가능한 배포를 강제합니다."],["C","AWS Service Catalog로 사업부별 표준화된 포트폴리오와 버전 관리 제품을 정의합니다. 포트폴리오로 AWS Well-Architected Generative AI Lens 기반 보안, 관측성, RAG 패턴을 강제하고, 사업부가 Service Catalog 콘솔로 리소스를 배포하도록 요구합니다."],["D","AWS Well-Architected Generative AI Lens 기반 보안 통제, 관측성 요구 사항, RAG 패턴을 공유 설계 문서에 정리합니다. Amazon Macie로 배포를 강제하고, 구현 책임은 각 사업부에 위임합니다."]]},"en":{"q":"A company is planning to deploy multiple generative AI (GenAI) applications to five independent business units that operate in multiple countries in Europe and the Americas. Each application uses Amazon Bedrock Retrieval Augmented Generation (RAG) patterns with business unit-specific knowledge bases that store terabytes of unstructured data. The company must establish well-architected, standardized components for security controls, observability practices, and deployment patterns across all the GenAI applications. The components must be reusable, versioned, and governed consistently.\nWhich solution will meet these requirements?","o":[["A","Configure Amazon API Gateway REST API endpoints for the GenAI applications. Deploy common security, observability, and RAG patterns based on the AWS Well-Architected Generative AI Lens in standardized AWS CloudFormation templates. Use CloudFormation Guard after deployment to validate policy compliance in each business unit."],["B","Create standardized AWS CloudFormation templates to implement security, observability, and RAG patterns based on the AWS Well-Architected Generative AI Lens. Establish a centralized repository for version control. Integrate a CI/CD pipeline with CloudFormation Guard to enforce consistent and repeatable deployments across business units."],["C","Use AWS Service Catalog to define standardized portfolios and versioned products for each business unit. Use the portfolios to enforce security, observability, and RAG patterns based on the AWS Well- Architected Generative AI Lens. Require business units to use the Service Catalog console to deploy resources."],["D","Document security controls, observability requirements, and RAG patterns based on the AWS Well- Architected Generative AI Lens in a shared design document. Use Amazon Macie to enforce deployment. Delegate implementation responsibility to each business unit."]]},"ex":{"c":"Well-Architected 생성형 AI 렌즈를 기반으로 보안·관측성·RAG 패턴을 표준 CloudFormation 템플릿으로 만들고, 중앙 리포지토리에서 버전 관리합니다. CI/CD 파이프라인에서 배포 전에 CloudFormation Guard로 정책을 강제하면 재사용 가능하고 일관되게 관리되는 구성 요소가 됩니다.","w":{"A":"배포 후 검증은 사후 대응이며 버전 관리 체계가 없습니다.","C":"콘솔로만 배포하게 하면 CI/CD 자동화가 없고 확장성이 떨어집니다.","D":"설계 문서와 Macie로는 배포를 강제할 수 없습니다."}}},{"n":96,"a":["C"],"orig":"B","ko":{"q":"한 회사가 코드 품질과 생산성을 높이기 위해 개발자 500명분의 Amazon Q Developer Pro 구독을 구매했습니다. 회사는 전사 도입 지표를 추적하는 관측성 시스템을 만들어야 합니다. 이 시스템은 활성 구독 사용자와 활용도가 낮은 구독을 구분할 수 있어야 하고, 분기마다 파워 유저를 파악하고 추가 교육이 필요한 팀을 식별할 수 있어야 합니다. 또한 사용자별로 수락한 Amazon Q 생성 코드 라인 수 같은 사용 패턴을 볼 수 있어야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Q Developer 사용 대시보드를 만들고, 집계된 사용 도입 지표를 추적합니다."],["B","Amazon Q Developer 기본 제공 관리자 대시보드로 AWS Organizations 조직 전반의 사용자 도입 지표를 추적합니다."],["C","Amazon Q Developer에서 사용자 수준 지표를 수집해 Amazon S3 버킷에 저장합니다. Amazon QuickSight로 사용 데이터를 시각화하고, 사용자와 팀의 도입 지표를 보여주는 대시보드를 만듭니다."],["D","AWS CloudTrail로 AWS Organizations 조직 내 모든 Amazon Q Developer API 호출을 추적합니다. AWS Lambda 함수로 로그를 처리해 Amazon DynamoDB에 저장하고, Amazon Managed Grafana에 사용자 지정 대시보드를 만들어 데이터를 시각화합니다."]]},"en":{"q":"A company purchases Amazon Q Developer Pro subscriptions for 500 developers to improve code quality and productivity. The company needs to create an observability system that tracks adoption metrics across the company. The observability system must be able to identify active subscription users compared to underused subscriptions. The system must give the company the ability to recognize power users every quarter and to identify teams that require additional training. The system must provide visibility into usage patterns such as the number of lines of Amazon Q generated code that each user has accepted.\nWhich solution will meet these requirements?","o":[["A","Create a usage dashboard for Amazon Q Developer. Use the usage dashboard to track aggregated usage adoption metrics."],["B","Use the Amazon Q Developer built-in administrator dashboard to track user adoption metrics across the company's organization in AWS Organizations."],["C","Collect user-level metrics in Amazon Q Developer. Store the metrics in an Amazon S3 bucket. Use Amazon QuickSight to visualize the usage data. Create dashboards to show adoption metrics for users and teams."],["D","Configure AWS CloudTrail to track all Amazon Q Developer API calls in the company's organization in AWS Organizations. Use an AWS Lambda function to process the logs. Store the processed logs in Amazon DynamoDB. Create custom dashboards in Amazon Managed Grafana to visualize the data."]]},"ex":{"c":"Amazon Q Developer는 사용자 수준 활동 보고서(user activity report)를 S3 버킷으로 내보내는 기능을 제공하며, 여기에는 사용자별 수락된 코드 줄 수 같은 세부 지표가 포함됩니다. 이 데이터를 QuickSight로 시각화하면 사용자·팀별 채택 현황, 파워 유저, 교육이 필요한 팀을 분기마다 파악할 수 있습니다. (원본 덤프 답 B의 기본 대시보드는 집계 지표 위주라 사용자 수준 분석에 한계가 있습니다.)","w":{"A":"사용 대시보드는 집계 지표만 보여주어 사용자별 분석이 불가능합니다.","B":"기본 관리자 대시보드는 조직 전체 집계 위주라 팀·사용자 단위 분석과 분기별 추적이 어렵습니다.","D":"CloudTrail에는 수락된 코드 줄 수 같은 사용 지표가 없고, 사용자 지정 파이프라인 부담이 큽니다."}}},{"n":97,"a":["A"],"orig":"","ko":{"q":"한 금융 서비스 회사가 투자 분석가가 여러 투자 수단, 시장 부문, 규제 환경에 걸친 복잡한 금융 관계를 조회할 수 있도록 RAG 애플리케이션을 개발하고 있습니다. 데이터세트에는 다중 홉(multi-hop) 관계를 가진 고도로 연결된 엔터티가 포함되어 있습니다. 분석가는 정확한 투자 안내를 위해 관계를 전체적으로 검토해야 합니다. 애플리케이션은 금융 엔터티 간 간접 관계까지 포착한 포괄적인 답변을 3초 이내에 제공해야 합니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","GraphRAG와 Amazon Neptune Analytics가 있는 Amazon Bedrock Knowledge Bases로 금융 데이터를 저장합니다. 엔터티 간 다중 홉 관계를 분석하고 문서 전반의 관련 정보를 자동으로 식별합니다."],["B","Amazon Bedrock Knowledge Bases와 Amazon OpenSearch Service 벡터 스토어를 사용하고, AWS Lambda로 여러 벡터 임베딩을 순차 조회하는 사용자 지정 관계 식별 로직을 구현합니다."],["C","k-NN이 있는 Amazon OpenSearch Serverless 벡터 검색을 사용합니다. Amazon EC2 Auto Scaling에서 실행되는 애플리케이션 계층에 수동 관계 매핑을 구현합니다."],["D","Amazon DynamoDB의 사용자 지정 인덱싱 시스템에 금융 데이터를 저장합니다. AWS Lambda로 관련 레코드를 조회하고, Amazon SageMaker로 응답을 생성합니다."]]},"en":{"q":"A financial services company is developing a Retrieval Augmented Generation (RAG) application to help investment analysts query complex financial relationships across multiple investment vehicles, market sectors, and regulatory environments. The dataset contains highly interconnected entities that have multi-hop relationships. Analysts must examine relationships holistically to provide accurate investment guidance. The application must deliver comprehensive answers that capture indirect relationships between financial entities and must respond in less than 3 seconds.\nWhich solution will meet these requirements with the LEAST operational overhead?","o":[["A","Use Amazon Bedrock Knowledge Bases with GraphRAG and Amazon Neptune Analytics to store financial data. Analyze multi-hop relationships between entities and automatically identify related information across documents."],["B","Use Amazon Bedrock Knowledge Bases and an Amazon OpenSearch Service vector store to implement custom relationship identification logic that uses AWS Lambda to query multiple vector embeddings in sequence."],["C","Use Amazon OpenSearch Serverless vector search with k-nearest neighbor (k-NN). Implement manual relationship mapping in an application layer that runs on Amazon EC2 Auto Scaling."],["D","Use Amazon DynamoDB to store financial data in a custom indexing system. Use AWS Lambda to query relevant records. Use Amazon SageMaker to generate responses."]]},"ex":{"c":"Bedrock Knowledge Bases의 GraphRAG는 Neptune Analytics에 엔터티와 관계 그래프를 자동으로 만들고, 벡터 검색과 그래프 탐색을 결합해 다중 홉의 간접 관계까지 찾아냅니다. 완전 관리형이라 운영 오버헤드가 가장 적습니다.","w":{"B":"관계 식별 로직을 Lambda로 직접 구현해야 하고 순차 쿼리로 지연이 늘어납니다.","C":"수동 관계 매핑과 EC2 애플리케이션 계층은 운영 부담이 큽니다.","D":"DynamoDB 사용자 지정 인덱싱으로는 다중 홉 관계 분석이 어렵습니다."}}},{"n":98,"a":["B"],"orig":"","ko":{"q":"한 회사가 고객 서비스 애플리케이션을 지원하는 3개의 전문 NLP 모델을 개발하고 있습니다. 하나는 고객의 구체적인 문제를 분류하고, 하나는 고객 상호 작용에서 핵심 정보를 추출하며, 나머지 하나는 응답을 생성합니다. 애플리케이션은 모든 작업에서 최소 95% 정확도를 달성해야 하고, 매일 2시간의 피크 시간 동안 최대 500건의 동시 요청을 500ms 미만으로 처리해야 합니다. 또한 사용량 급증 사이의 저수요 기간에는 리소스 사용을 최적화해야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","세 모델을 모두 하나의 Amazon SageMaker AI 다중 모델 엔드포인트에 배포합니다. 엔드포인트에서 동적 확장을 활성화하고 컴퓨팅 최적화 인스턴스 유형을 사용하며, 호출 지표 기반 자동 확장 정책으로 피크 부하를 처리합니다."],["B","각 모델을 별도의 Amazon SageMaker Serverless Inference 엔드포인트에 배포합니다. 피크 부하를 처리하도록 프로비저닝된 동시성을 설정하고, 각 모델의 요구 사항에 맞게 최대 동시성 한도와 메모리 크기를 구성합니다."],["C","피크 부하를 처리하기 위해 프로비저닝된 처리량과 함께 Amazon Bedrock으로 모델을 배포합니다. 예상 토큰 처리량에 따라 모델 유닛(MU) 수를 구성하고, 모델별로 요청 배칭을 구현합니다."],["D","각 모델을 별도의 Amazon SageMaker AI 엔드포인트에 배포하고 비동기 추론 구성을 사용합니다. 모델 요청과 응답을 Amazon S3에 저장하고, 처리가 끝나면 Amazon SNS로 사용자에게 알림을 보냅니다."]]},"en":{"q":"A company is developing three specialized NLP models that support a customer service application. One model categorizes each customer's specific issue. Another model extracts key information from the customer interactions. The third model generates responses. The company must ensure that the application achieves at least 95% accuracy for all tasks. The application must handle up to 500 concurrent requests and respond in less than 500 ms during daily 2-hour peak usage periods. The company must ensure that the application optimizes resource usage during periods of low demand between usage spikes.\nWhich solution will meet these requirements?","o":[["A","Deploy all three models to a single Amazon SageMaker AI multi-model endpoint. Enable dynamic scaling on the endpoint. Use a compute-optimized instance type. Configure auto scaling policies that are based on invocation metrics to handle peak loads."],["B","Deploy each model to a separate Amazon SageMaker Serverless Inference endpoint. Set provisioned concurrency to handle peak loads. Configure maximum concurrency limits and memory sizing based on each model's specific requirements."],["C","Deploy the models by using Amazon Bedrock with provisioned throughput to handle peak loads. Configure the number of model units (MUs) based on expected token throughput needs. Implement request batching for each model."],["D","Deploy each model to a separate Amazon SageMaker AI endpoint. Use an asynchronous inference configuration. Store model requests and responses in Amazon S3. Use Amazon SNS to send alerts to users when the application finishes processing requests."]]},"ex":{"c":"모델마다 SageMaker 서버리스 추론 엔드포인트를 두면 수요가 낮을 때 비용이 거의 들지 않습니다. 피크 시간에는 프로비저닝된 동시성으로 콜드 스타트 없이 500ms 미만 응답을 보장하고, 모델별 요구에 맞춰 메모리와 최대 동시성을 설정합니다.","w":{"A":"다중 모델 엔드포인트는 모델 로딩 지연이 있고 저수요 시에도 인스턴스 비용이 듭니다.","C":"자체 개발 NLP 모델을 Bedrock 프로비저닝 처리량으로 운영하는 것은 비용이 크고 적합하지 않습니다.","D":"비동기 추론은 500ms 실시간 응답 요구에 맞지 않습니다."}}},{"n":99,"a":["B"],"orig":"","ko":{"q":"한 소프트웨어 회사가 Amazon Q Business로 직원이 자연어 프롬프트로 회사 정보와 개인 정보에 접근할 수 있는 AI 어시스턴트를 구축하고 있습니다. 정보는 Amazon S3 버킷에 저장되어 있으며, 부서마다 버킷 내 전용 접두사(prefix)가 있고 각 객체 이름에는 소속 부서의 S3 접두사가 포함됩니다. 각 부서는 AWS IAM Identity Center의 단일 그룹에만 속하고, 각 직원은 한 부서에만 속합니다. 회사는 Amazon Q Business가 S3 버킷의 데이터를 데이터 소스로 사용하도록 구성했습니다. 회사는 AI 어시스턴트가 사용자의 IAM Identity Center 그룹 멤버십에 따른 액세스 제어를 준수하도록 해야 합니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","각 부서 폴더에 acl.json이라는 JSON 파일을 만듭니다. 각 파일에 해당 부서 데이터에 접근해야 하는 IAM Identity Center 그룹을 지정하는 액세스 제어 항목을 만들고, 데이터 소스 설정의 Access Control 섹션에 JSON 파일 위치를 지정합니다."],["B","S3 버킷 최상위에 acl.json이라는 JSON 파일 하나를 만듭니다. 각 부서의 S3 접두사를 해당 IAM Identity Center 그룹에 매핑하는 액세스 제어 항목을 추가하고, 데이터 소스 설정의 Access Control 섹션에 JSON 파일 위치를 지정합니다."],["C","IAM Identity Center 그룹마다 S3 버킷의 모든 접두사에 대한 액세스를 거부하는 별도의 권한 세트를 만듭니다. 각 그룹의 권한 세트에 해당 부서를 지정하는 StringNotEquals 조건 키를 추가하고, 권한 세트를 Identity Center 그룹에 연결합니다."],["D","S3 버킷 최상위에 metadata.json이라는 메타데이터 파일을 만듭니다. 각 부서 접두사의 S3 경로를 지정하는 AccessControlList 객체를 파일에 추가하고, 각 접두사에 접근해야 하는 IAM Identity Center 그룹을 지정합니다. 데이터 소스 메타데이터 설정에서 파일 위치를 참조합니다."]]},"en":{"q":"A software company is using Amazon Q Business to build an AI assistant that allows employees to access company information and personal information by using natural language prompts. The company stores this information in an Amazon S3 bucket. Each department in the company has a dedicated prefix in the S3 bucket. Each object name includes the S3 prefix of the department that it belongs to. Each department can belong to only a single group in AWS IAM Identity Center. Each employee belongs to a single department. The company configures Amazon Q Business to access data stored in an S3 bucket as a data source. The company needs to ensure that the AI assistant respects access controls based on the user ' s IAM Identity Center group membership.\nWhich solution will meet this requirement with the LEAST operational overhead?","o":[["A","Create a JSON file named acl.json in each department folder. In each file, create access control entries that specify the IAM Identity Center group that should have access to that department ' s data. Indicate the location of the JSON file in the Access Control section of the data source settings."],["B","Create a single JSON file named acl.json at the top level of the S3 bucket. Add access control entries that map each department ' s S3 prefix to its corresponding IAM Identity Center group. Indicate the location of the JSON file in the Access Control section of the data source settings."],["C","For each IAM Identity Center group, create a separate permissions set that denies access to all prefixes in the S3 bucket. Add a StringNotEquals condition key to the permissions set for each group that specifies the department each group is associated with. Attach the permissions sets to the Identity Center groups."],["D","Create a metadata file named metadata.json at the top level of the S3 bucket. Add an AccessControlList object to the file that specifies the S3 path of each department ' s prefix. Specify the IAM Identity Center group that should have access to each department ' s prefix. Reference the file location in the data source metadata settings."]]},"ex":{"c":"Q Business S3 커넥터는 버킷 최상위의 단일 ACL 구성 파일(acl.json)로 S3 경로(접두사)별 접근 권한을 사용자·그룹에 매핑할 수 있습니다. 부서 접두사를 IAM Identity Center 그룹에 매핑한 파일 하나만 관리하면 되므로 오버헤드가 가장 적습니다.","w":{"A":"부서 폴더마다 ACL 파일을 두는 것은 관리 대상이 늘어나고, 커넥터는 파일 위치 하나만 지정합니다.","C":"IAM 권한 세트는 Q Business 문서 수준 접근 제어에 적용되지 않습니다.","D":"metadata.json은 문서별 메타데이터 파일이며 접두사 단위 ACL 정의 방식이 아닙니다."}}},{"n":100,"a":["C"],"orig":"","ko":{"q":"한 보험 회사가 Amazon Bedrock으로 보험금 청구 처리 애플리케이션을 구축하고 있습니다. 애플리케이션은 문서 분석, 데이터 추출, 권장 사항 생성의 단계를 순서대로 수행해야 합니다. 10,000달러를 초과하는 청구는 권장 사항을 제공하기 전에 사기 분석 단계를 추가로 거쳐야 합니다.\n운영 복잡성이 가장 적은 솔루션은 무엇입니까?","o":[["A","각 Amazon Bedrock 호출을 Task 상태로 처리하는 AWS Step Functions 워크플로를 구성합니다. Choice 상태로 청구 금액에 따라 청구를 라우팅합니다."],["B","Amazon Bedrock AgentCore로 각 단계를 처리하는 액션 그룹을 구현하고, 에이전트 추론으로 조건부 로직을 실행합니다."],["C","Amazon Bedrock Prompt Flows로 각 단계를 처리하는 프롬프트 노드를 구현하고, 조건(condition) 노드로 청구 금액에 따라 청구를 라우팅합니다."],["D","Amazon Bedrock을 호출해 각 단계를 순차 수행하는 AWS Lambda 함수를 구성하고, 함수 코드에 조건부 라우팅을 포함합니다."]]},"en":{"q":"An insurance company is using Amazon Bedrock to build a claims processing application. The application must perform the following steps in sequence: analyze documents, extract data, and generate recommendations. Claims over $10,000 require an additional fraud analysis step before the application provides a recommendation.\nWhich solution will meet these requirements with the LEAST operational complexity?","o":[["A","Configure an AWS Step Functions workflow that uses Task states to handle each Amazon Bedrock invocation. Configure a Choice state to route claims based on the claim amount."],["B","Use Amazon Bedrock AgentCore to implement action groups to handle each step. Use agent reasoning to run conditional logic."],["C","Use Amazon Bedrock Prompt Flows to implement prompt nodes to handle each step. Use a condition node to route claims based on the claim amount."],["D","Configure AWS Lambda functions to invoke Amazon Bedrock to perform each step sequentially.Include conditional routing in the function code."]]},"ex":{"c":"Bedrock Prompt Flows(Flows)는 프롬프트 노드로 문서 분석·데이터 추출·권고 생성을 순차 연결하고, 조건 노드로 청구 금액이 10,000달러를 넘는지에 따라 사기 분석 단계로 분기할 수 있습니다. Bedrock 안에서 시각적으로 구성되어 운영 복잡성이 가장 낮습니다.","w":{"A":"Step Functions도 가능하지만 Bedrock 호출과 데이터 전달을 직접 구성해야 해 복잡도가 더 높습니다.","B":"에이전트 추론에 조건 분기를 맡기면 결정론적으로 동작하지 않습니다.","D":"Lambda 코드로 직접 순서와 분기를 구현하면 유지 관리가 어렵습니다."}}},{"n":101,"a":["B"],"orig":"","ko":{"q":"한 의료 회사가 의료 질의를 처리하는 애플리케이션을 개발하고 있습니다. 애플리케이션은 의미 희석(semantic dilution)을 줄여 복잡한 질의에 높은 정확도로 답해야 하고, 의료 용어의 모호성을 줄이기 위해 의료 문서의 도메인 특화 용어를 참조해야 합니다. 분당 1,000건의 질의에 2초 미만으로 응답할 수 있어야 합니다.\n운영 오버헤드가 가장 적은 솔루션은 무엇입니까?","o":[["A","Amazon API Gateway로 들어오는 질의를 Amazon Bedrock 에이전트로 라우팅합니다. 에이전트가 Anthropic Claude 모델로 질의를 분해하고 Amazon Titan 모델로 질의를 확장하도록 구성합니다. 참조 의료 문서를 저장하는 Amazon Bedrock 지식 기반을 만듭니다."],["B","참조 의료 문서를 저장하는 Amazon Bedrock 지식 기반을 구성하고, 지식 기반에서 쿼리 분해(query decomposition)를 활성화합니다. FM과 지식 기반을 사용해 애플리케이션을 지원하는 Amazon Bedrock 플로를 구성합니다."],["C","Amazon SageMaker AI에 쿼리 분해와 쿼리 확장을 위한 사용자 지정 ML 모델을 호스팅합니다. 참조 의료 문서를 저장하는 Amazon Bedrock 지식 기반을 구성하고, 지식 기반의 문서를 암호화합니다."],["D","여러 AWS Lambda 함수를 오케스트레이션해 질의를 분해하는 Amazon Bedrock 에이전트를 만듭니다. 참조 의료 문서를 저장하는 Amazon Bedrock 지식 기반을 만들고 에이전트의 기본 지식 기반 기능을 사용합니다. 의료 용어의 모호성을 줄이기 위해 에이전트에 심층 리서치 및 추론 기능을 추가합니다."]]},"en":{"q":"A healthcare company is developing an application to process medical queries. The application must answer complex queries with high accuracy by reducing semantic dilution. The application must refer to domain- specific terminology in medical documents to reduce ambiguity in medical terminology. The application must be able to respond to 1,000 queries each minute with response times less than 2 seconds.\nWhich solution will meet these requirements with the LEAST operational overhead?","o":[["A","Use Amazon API Gateway to route incoming queries to an Amazon Bedrock agent. Configure the agent to use an Anthropic Claude model to decompose queries and an Amazon Titan model to expand queries. Create an Amazon Bedrock knowledge base to store the reference medical documents."],["B","Configure an Amazon Bedrock knowledge base to store the reference medical documents. Enable query decomposition in the knowledge base. Configure an Amazon Bedrock flow that uses a foundation model and the knowledge base to support the application."],["C","Use Amazon SageMaker AI to host custom ML models for both query decomposition and query expansion. Configure Amazon Bedrock knowledge bases to store the reference medical documents. Encrypt the documents in the knowledge base."],["D","Create an Amazon Bedrock agent to orchestrate multiple AWS Lambda functions to decompose queries. Create an Amazon Bedrock knowledge base to store the reference medical documents. Use the agent's built-in knowledge base capabilities. Add deep research and reasoning capabilities to the agent to reduce ambiguity in the medical terminology."]]},"ex":{"c":"Bedrock 지식 기반의 쿼리 분해(query decomposition)는 복잡한 질의를 하위 질의로 나눠 의미 희석을 줄이고 정확도를 높입니다. 의료 문서를 지식 기반에 넣어 용어를 참조하고, Bedrock Flows로 FM과 지식 기반을 연결하면 관리형 기능만으로 구성되어 오버헤드가 가장 적습니다.","w":{"A":"에이전트에 두 모델을 따로 구성하면 지연과 복잡성이 늘어납니다.","C":"SageMaker에 사용자 지정 모델을 호스팅하면 운영 부담이 큽니다.","D":"Lambda 오케스트레이션과 심층 리서치 기능은 2초 응답 요구를 맞추기 어렵습니다."}}},{"n":102,"a":["A"],"orig":"","ko":{"q":"한 도서 출판사가 AI 어시스턴트를 사용하는 도서 추천 시스템을 구축하려고 합니다. AI 어시스턴트는 ML로 회사 도서 카탈로그에서 추천 도서 목록을 생성하며, 고객과의 대화를 바탕으로 도서를 제안해야 합니다. 회사는 도서 본문, 고객 및 편집자 리뷰, 추출된 도서 메타데이터를 Amazon S3에 저장합니다. 시스템은 짧은 지연 시간으로 응답하고 10,000명 이상의 동시 사용자를 효율적으로 처리하도록 확장되어야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon Bedrock Knowledge Bases로 임베딩을 생성하고, Amazon OpenSearch Service에 벡터 스토어로 저장합니다. 지식 기반을 조회하는 AWS Lambda 함수를 만들고, 사용자 요청 처리 시 Amazon API Gateway가 Lambda 함수를 호출하도록 구성합니다."],["B","Amazon Bedrock Knowledge Bases로 임베딩을 생성하고, Amazon DynamoDB에 벡터 스토어로 저장합니다. 지식 기반을 조회하는 AWS Lambda 함수를 만들고, 사용자 요청 처리 시 Amazon API Gateway가 Lambda 함수를 호출하도록 구성합니다."],["C","Amazon SageMaker AI로 사전 학습된 모델을 배포해 개인화 도서 추천 엔진을 구축합니다. 모델을 SageMaker AI 엔드포인트로 배포하고, Amazon API Gateway로 모델 엔드포인트를 호출합니다."],["D","S3 커넥터로 Amazon S3의 도서 카탈로그 데이터를 인덱싱하는 Amazon Kendra GenAI Enterprise Edition 인덱스를 만듭니다. Kendra 인덱스에 기본 제공 FAQ를 구성하고, 사용자 대화를 바탕으로 Kendra 인덱스를 조회하는 AWS Lambda 함수를 개발합니다. Amazon API Gateway를 배포해 이 기능을 노출하고 Lambda 함수를 호출합니다."]]},"en":{"q":"A book publishing company wants to build a book recommendation system that uses an AI assistant. The AI assistant will use ML to generate a list of recommended books from the company ' s book catalog. The system must suggest books based on conversations with customers. The company stores the text of the books, customers ' and editors ' reviews of the books, and extracted book metadata in Amazon S3. The system must support low-latency responses and scale efficiently to handle more than 10,000 concurrent users.\nWhich solution will meet these requirements?","o":[["A","Use Amazon Bedrock Knowledge Bases to generate embeddings. Store the embeddings as a vector store in Amazon OpenSearch Service. Create an AWS Lambda function that queries the knowledge base. Configure Amazon API Gateway to invoke the Lambda function when handling user requests."],["B","Use Amazon Bedrock Knowledge Bases to generate embeddings. Store the embeddings as a vector store in Amazon DynamoDB. Create an AWS Lambda function that queries the knowledge base. Configure Amazon API Gateway to invoke the Lambda function when handling user requests."],["C","Use Amazon SageMaker AI to deploy a pre-trained model to build a personalized recommendation engine for books. Deploy the model as a SageMaker AI endpoint. Invoke the model endpoint by using Amazon API Gateway."],["D","Create an Amazon Kendra GenAI Enterprise Edition index that uses the S3 connector to index the book catalog data stored in Amazon S3. Configure built-in FAQ in the Kendra index. De velop an AWS Lambda function that queries the Kendra index based on user conversations. Deploy Amazon API Gateway to expose this functionality and invoke the Lambda function."]]},"ex":{"c":"Bedrock Knowledge Bases로 S3의 책 본문·리뷰·메타데이터를 임베딩해 OpenSearch 벡터 저장소에 저장하면 대화 맥락에 맞는 시맨틱 검색이 가능합니다. API Gateway와 Lambda는 1만 명 이상의 동시 사용자에 맞춰 자동 확장되고 지연 시간도 낮습니다.","w":{"B":"DynamoDB는 Knowledge Bases가 지원하는 벡터 저장소가 아닙니다.","C":"사전 학습된 추천 모델은 대화 기반 추천과 텍스트 데이터 활용에 맞지 않고 운영 부담이 큽니다.","D":"Kendra FAQ는 대화 기반 추천에 맞지 않습니다."}}},{"n":103,"a":["C"],"orig":"","ko":{"q":"한 의료 회사가 Amazon Bedrock으로 임상 문서 요약을 생성하는 애플리케이션을 배포했습니다. 응답 품질이 일정하지 않고 가끔 사실과 다른 환각이 발생하며, 월 비용이 예상보다 40% 높습니다. GenAI 개발자는 환각을 감지하고, 비정상적인 토큰 소비를 식별하며, 비용 이상에 대한 조기 경고를 제공하는 거의 실시간 모니터링 솔루션을 구현해야 합니다. 솔루션은 사용자 지정 개발과 유지보수 부담이 최소여야 합니다.\n이 요구 사항을 충족하는 솔루션은 무엇입니까?","o":[["A","Amazon CloudWatch 경보로 InputTokenCount와 OutputTokenCount 지표를 모니터링해 이상을 감지합니다. 모델 호출 로그를 Amazon S3 버킷에 저장하고, AWS Glue와 Amazon Athena로 잠재적 환각을 식별합니다."],["B","LLM 기반 판정을 사용하는 Amazon Bedrock 평가 작업으로 환각을 감지합니다. Amazon CloudWatch로 토큰 사용량을 추적하고, CloudWatch 지표를 처리해 사용 패턴 알림을 보내는 AWS Lambda 함수를 만듭니다."],["C","Amazon Bedrock이 모델 호출 로그를 Amazon S3 버킷에 저장하도록 구성하고 텍스트 출력 로깅을 활성화합니다. Amazon Bedrock Guardrails의 컨텍스트 근거성 검사를 활성화해 환각을 감지합니다. 토큰 사용 지표에 대해 Amazon CloudWatch 이상 탐지 경보를 만듭니다."],["D","AWS CloudTrail로 모든 Amazon Bedrock API 호출을 기록합니다. Amazon QuickSight에 사용자 지정 대시보드를 만들어 토큰 사용 패턴을 시각화하고, Amazon SageMaker Model Monitor로 생성된 요약의 품질 드리프트를 감지합니다."]]},"en":{"q":"A healthcare company uses Amazon Bedrock to deploy an application that generates summaries of clinical documents. The application experiences inconsistent response quality with occasional factual hallucinations. Monthly costs exceed the company's projections by 40%. A GenAI developer must implement a near real- time monitoring solution to detect hallucinations, identify abnormal token consumption, and provide early warnings of cost anomalies. The solution must require minimal custom development work and maintenance overhead.\nWhich solution will meet these requirements?","o":[["A","Configure Amazon CloudWatch alarms to monitor InputTokenCount and OutputTokenCount metrics to detect anomalies. Store model invocation logs in an Amazon S3 bucket. Use AWS Glue and Amazon Athena to identify potential hallucinations."],["B","Run Amazon Bedrock evaluation jobs that use LLM-based judgments to detect hallucinations. Configure Amazon CloudWatch to track token usage. Create an AWS Lambda function to process CloudWatch metrics. Configure the Lambda function to send usage pattern notifications."],["C","Configure Amazon Bedrock to store model invocation logs in an Amazon S3 bucket. Enable text output logging. Configure Amazon Bedrock guardrails to run contextual grounding checks to detect hallucinations. Create Amazon CloudWatch anomaly detection alarms for token usage metrics."],["D","Use AWS CloudTrail to log all Amazon Bedrock API calls. Create a custom dashboard in Amazon QuickSight to visualize token usage patterns. Use Amazon SageMaker Model Monitor to detect quality drift in generated summaries."]]},"ex":{"c":"59번과 같은 문제입니다. 모델 호출 로깅으로 출력을 기록하고, Guardrails 컨텍스트 근거성 검사로 환각을 거의 실시간에 탐지하며, 토큰 지표에 CloudWatch 이상 탐지 경보를 걸어 비용 이상을 조기에 경고합니다.","w":{"A":"Athena 쿼리로는 환각을 탐지할 수 없습니다.","B":"평가 작업은 배치라 실시간이 아니고 사용자 지정 Lambda가 필요합니다.","D":"CloudTrail에는 토큰 사용량이 없고 Model Monitor는 Bedrock 출력용이 아닙니다."}}},{"n":104,"a":["D"],"orig":"","ko":{"q":"GenAI 개발자가 Amazon Bedrock FM을 사용하는 RAG 기반 고객 지원 애플리케이션을 구축하고 있습니다. 애플리케이션은 Amazon S3 버킷에 JSON 파일로 저장된 50GB의 과거 고객 대화를 처리해 검색 말뭉치로 사용해야 합니다. 데이터 처리 워크플로는 고객 지원 문서에서 관련 데이터를 추출하고,
